schema: 1
sprint:
  id: obsolete_interfaces
  marathon: debt_payoff
  version: 0.1.5-dev
  branch: feature/debt_payoff/obsolete_interfaces
  status: active
  objective: >-
    Remove only interfaces and compatibility surfaces proven unowned and unused
    by maintained product, build, test, fixture, and embedder boundaries.

scope:
  owned:
    - maintained public and private interfaces with no surviving caller or owner
    - compatibility aliases, wrappers, forwarding layers, and fossil build wiring
    - exact negative caller and source censuses for every proposed removal
  excluded:
    - feature, protocol, performance, or behavior changes
    - package extraction, file splitting, or ownership redesign
    - removal inferred from naming, age, style, or local call count alone
    - QAgent or external embedder changes

invariants:
  - Every removed interface has no maintained product, build, proof, fixture, or accepted embedder consumer.
  - A private interface with a real owner remains even when current call count is small.
  - Public package surfaces require explicit package-root, example, and QAgent consumer review.
  - Removal does not change retained layout, capacity, allocation, scheduling, protocol, or error behavior.
  - No compatibility replacement or parallel interface is introduced.

slices:
  - id: interface_inventory
    status: accepted
    product_change: none
    output: exact owner, declaration, importer, caller, proof, fixture, and embedder census
    accepted_facts:
      - The finite discovery boundary contains twelve cohorts: eight retained owners and four obsolete cohorts covering five private declarations.
      - waitCanvasPlan and its solely owned waitRenderWakeBlocking wrapper form one atomic Renderer orphan cohort.
      - Screen advanceIdentity and lineCursorWraps have declaration-only ownership and no retained caller or transitive orphan.
      - grapheme_value_count duplicates generator-owned entry and complete-byte extents without participating in runtime offsets or validation.
      - Retained package roots, native/generated ABI boundaries, and standalone JSONL logger acceptance all have current product, build, proof, fixture, example, or QAgent ownership.
  - id: finite_removal_contract
    status: accepted
    product_change: none
    output: independently reviewable removal groups with negative censuses and rollback boundaries
    accepted_facts:
      - Four independently reviewable groups delete exactly five private declarations across Renderer, VT Screen, and VT Unicode.
      - The Renderer group atomically deletes waitCanvasPlan and its solely owned waitRenderWakeBlocking wrapper.
      - Each group pins pre/post symbol counts, transitive orphan closure, preserved owner invariants, all-mode gates, and isolated rollback.
      - Replacement helpers, aliases, adjacent cleanup, and retained inventory-cohort changes remain forbidden.
  - id: accepted_removals
    status: active
    output: only contract-approved interface and wiring deletion
    accepted_groups:
      - id: renderer_wait_canvas_orphan
        commit: e783ce1
        result: waitCanvasPlan and its solely owned waitRenderWakeBlocking wrapper removed with zero surviving occurrences or transitive orphan
      - id: vt_screen_advance_identity_orphan
        commit: c2bf258
        result: unused Screen-local advanceIdentity removed while the distinct Terminal helper and eleven calls remain unchanged

acceptance:
  - Every removed symbol or wiring edge is absent from all maintained consumers and generated boundaries.
  - Every retained candidate has a named current owner and reason.
  - Package and workspace checks/tests pass in every optimization mode.
  - Strict YAML, source audit, protocol validation, formatting, and git diff checks pass.
