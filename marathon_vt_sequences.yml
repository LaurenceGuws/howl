marathon:
  name: vt_sequences
  status: active
  basis: >-
    Frame, control, text, and the sole Wayland host now provide the accepted owners needed to prove terminal-local,
    transported, and host-visible facts without duplicating their mechanics in VT.

objective: >-
  Close each non-graphics protocol category through one shared terminal mechanism, exact pinned-reference evidence,
  deterministic owned proof, and an explicit disposition for every deliberate residual difference.

proof:
  vt: exact bytes produce exact state, reply, consequence, or rejection
  control: terminal truth survives bounded PTY ownership and immutable frame publication
  host: the operator-visible consequence is rendered or handled by the named current owner

selection:
  method:
    - group normalized active gaps by shared state-machine owner and effect rather than catalogue order
    - prefer categories retiring many obligations with one direct mechanism and dense adversarial proof
    - implement missing Howl semantics before changing catalogue disposition
    - mark incompatible reference policy excluded only after Howl's coherent behavior is implemented and proved
  baseline:
    total_records: 662
    full: 242
    active_partial_howl_vt: 293
    deferred: 29
    delegated: 47
    excluded: 51

categories:
  - id: save_reset_screen_lifecycle
    status: accepted
    owner: howl-vt
    mechanism: Terminal savepoints, mode snapshots, reset owners, and primary/alternate Screen banks
    records: 26
    why_first: >-
      The behavior is already cohesive and high-value, odd bank/reset/resize boundaries are deterministic, and most
      remaining obligations are explicit policy differences rather than missing machinery.
    gate: >-
      exact bank-local and mirrored state, repeated mutation truth, resize clamping, reset lifetime, alternate
      selection, and every reference residual classified as active work or deliberate exclusion
    result: >-
      one dense transcript proves the shared lifecycle and 26 incompatible reference residuals are explicitly
      excluded without adding production source; active partial howl-vt obligations fell from 293 to 267

  - id: cursor_origin_margins
    status: accepted
    owner: howl-vt
    mechanism: Screen cursor resolution, row geometry, DECOM, DECSTBM, and DECSLRM
    gate: exact per-command bounds with reference-specific margin and logical-row differences retained
    result: >-
      exact margin owners now reject invalid coordinates without cursor or pending-wrap mutation and report repeated
      commands truthfully; one dense fragmented transcript proves all cursor aliases, directional region entry,
      DECOM plus both margin axes, double-width logical columns, pending-wrap cancellation, and resize reset. Nine
      exact records became full and 30 conflicting pinned-reference policies became deliberate exclusions, reducing
      active partial howl-vt obligations from 267 to 228.

  - id: structural_edits_scrolling
    status: accepted
    owner: howl-vt
    mechanism: Screen row/column edits, scrolling, history, dirty bounds, protection, and line geometry
    gate: exact region, history, geometry, protection, overlap, and failure-atomic behavior
    result: >-
      ICH, DCH, IL, DL, SU, and SD now bypass the void Screen facade and publish exact cell, row-fact, history,
      damage, continuation, and pending-wrap mutation. Existing bounded region, logical-width, geometry, history,
      and column-edit proofs plus one adversarial blank-grid proof close 23 active records: four libvterm matches became
      full, 15 unrepresentable reference policies became deliberate exclusions, and four Kitty graphics consequences
      remain explicitly deferred. Active partial howl-vt obligations fell from 228 to 205.

  - id: rendition_color_protection_rectangles
    status: accepted
    owner: howl-vt
    mechanism: cell attributes, color transactions, protection provenance, and rectangle mutation
    gate: exact cell mutation and rollback with unsupported multicell residuals kept explicit
    result: >-
      SGR, DECFRA, DECCRA, DECCARA, DECRARA, and DECSACE now bypass void Screen facades and report exact retained,
      pending-wrap, cell, attribute, and minimum changed column spans per row. Dense fragmented proofs cover repetition, malformed color
      groups, protection provenance, clipping, overlap, and invalid rectangles. Forty-seven active obligations are
      now explicit: one unsupported DEC rendition is excluded, 34 conflicting reference policies are excluded, one
      Kitty graphics-color remainder stays deferred to howl-vt, and 11 completed VT color handoffs delegate
      presentation and damage to howl-window. Active partial howl-vt obligations fell from 205 to 158.

  - id: reports_replies
    status: accepted
    owner: howl-vt
    mechanism: bounded pending output, query serialization, mode facts, and host-supplied dimensions
    gate: exact bytes, rollback, identity policy, and delegated host facts
    result: >-
      One byte-fragmented mixed transcript now proves C0/C1 DA, DSR/CPR, DECRQM, DECRQSS, XTGETTCAP, XTVersion,
      terminal dimensions, and iTerm cell-size replies preserve exact order through the shared bounded serializer;
      a later query failure preserves the prior complete reply without appending a partial response. Kitty private DA
      no-reply is now full, 30 permanent identity/state-policy differences are deliberate exclusions, and two exact
      color-preference handoffs remain delegated to howl-window. Active partial howl-vt obligations fell from 158 to
      125.

  - id: input_modes
    status: accepted
    owner: howl-vt
    mechanism: typed keyboard, mouse, focus, and paste encoding plus saved mode state
    gate: exact bytes, bounds, modifier and coordinate policy, and screen/reset lifetime
    result: >-
      One fragmented cross-mode transcript proves application cursor and keypad bytes, focus gating, pixel mouse
      coordinates and modifiers, NUL-preserving bracketed paste, DECARM repeat suppression, Kitty press/release
      encoding, per-screen keyboard stacks, exact repeated-command mutation, and RIS defaults. Existing hostile proofs
      retain modifier, text, coordinate, allocation, depth, save/restore, alternate-screen, and pending-output bounds.
      Nine permanent host/input-policy conflicts are explicit exclusions and four completed VT handoffs delegate
      compositor focus, iTerm key-up delivery, Kitty paste exchange, and color-scheme observation to howl-window.
      Active partial howl-vt obligations fell from 125 to 112; no input-classified active gap remains.

  - id: mode_dispatch_lifecycle
    status: accepted
    owner: howl-vt
    records: 29
    mechanism: ANSI and DEC mode dispatch, mirrored or bank-local state, query/save/reset, reply framing, and resize
    membership: >-
      generic SM/RM/DECSET/DECRST; DECAWM, DECCOLM permission/preservation, DECSCNM, more-fix, cursor blink,
      synchronized update, resize notifications, and S7C1T/S8C1T
    gate: >-
      every compact mode table is mechanically preserved; repeated assignment, pending-wrap, bank scope, RIS,
      DECSTR, resize, save/restore, query, and host-pixel handoff are exact; conflicting dirty/default/timeout policy
      is excluded and completed presentation or resize handoffs are delegated only with current consumer proof
    why_next: >-
      This is the largest residual group and settles shared lifecycle vocabulary used by later cursor, geometry, and
      compatibility decisions.
    result: >-
      Existing dense mode proofs cover exact repeated assignment, pending-wrap cancellation, mirrored and bank-local
      state, parameterized and all-mode save/restore, RIS, DECSTR, alternate-screen and resize lifetime, DECRQM,
      S7C1T/S8C1T reply framing, synchronized-update control, and transactional resize reports. Two resize-notification
      records are now full because howl-window supplies admitted cell pixels through howl-control; two cursor-blink
      presentation obligations delegate to howl-window; 25 conflicting breadth, default, dirty, C1, column, and
      timeout policies are explicit exclusions. Active partial howl-vt obligations fell from 112 to 83, with no
      category member remaining active. Private DEC set/reset now applies every parser-bounded parameter through the
      existing Terminal.setDecMode owner; its prior first-parameter decoder chain was deleted.

  - id: charset_line_geometry
    status: accepted
    owner: howl-vt
    records: 19
    mechanism: ISO-2022 G0-G3 designation, UTF-8/Latin-1 transport mode, and DEC physical-row geometry
    membership: >-
      libvterm and iTerm2 SCS G0-G3; Kitty G0/G1 plus UTF-8/Latin-1 controls; DECSWL, DECDWL, and DECDHL top/bottom
    gate: >-
      exact accepted designation tables, GL/GR mapping boundaries, split transport, save/reset, logical row width,
      cursor clamping, scroll/copy, and resize-reset policy; unsupported charset tables and incompatible reference
      remapping or resize association are explicit exclusions rather than guessed mappings
    why_next: >-
      Row geometry and charset transport are prerequisites for truthful erase, repetition, and legacy cursor claims.
    result: >-
      Existing direct owners and dense transcripts already prove four-slot designation, GL/GR and single-shift
      invocation, exact A/B/0/U/V mappings, rejected-table immutability, split UTF-8/Latin-1 selection, savepoint and
      RIS lifetime, logical half-width cursor bounds, DECLRMM rejection, dirty publication, row scroll/history/edit
      association, and resize reset. Pinned-source review corrected stale libvterm repertoire wording: libvterm accepts
      only A/B/0 while Howl deliberately also accepts U/V. All 19 residuals are now explicit exclusions for conflicting
      charset breadth/scalar remapping, fixed-UTF-8 policy, physical cell expansion, cursor scaling, or resize
      association. Active partial howl-vt obligations fell from 83 to 64 with no production growth.

  - id: erase_repeat_alignment
    status: accepted
    owner: howl-vt
    records: 15
    mechanism: Screen erase owners, protected cells, retained glyph repetition, DECALN, scrollback, and row damage
    membership: >-
      ED, EL, DECSED, DECSEL, REP, DECALN, and iTerm ClearScrollback across the three pinned references
    gate: >-
      parameter defaults and rejection, pending-wrap mutation, protection provenance, logical-width rows, retained
      attributes, cursor/margin preservation, scrollback and logical-output lifetime, minimum changed spans, and
      allocation-free repetition are exact; Kitty graphics-plane consequences become deferred howl-vt residuals
      while conflicting multicell/selection/reference policy is settled separately
    why_next: >-
      It consumes the completed row-geometry contract and closes the remaining high-frequency grid mutations.
    result: >-
      Existing direct owners plus dense transcripts prove exact erase defaults/rejection, ISO/DEC protection,
      pending-wrap and continuation mutation, logical row widths, current erase attributes, minimum changed spans,
      history and logical-output lifetime, retained-glyph rendition and bounded allocation-free repetition, and DECALN
      cursor/margin/geometry preservation. Eleven conflicting reference cell, repetition, alignment, and product-state
      policies are explicit exclusions. Kitty's four erase records now defer only their precise graphics-plane
      remainder to howl-vt/graphics after complete cell-plane proof. Active partial howl-vt obligations fall from 64
      to 49 with no production growth.

  - id: cursor_compatibility_and_restore
    status: queued
    owner: howl-vt
    records: 13
    mechanism: legacy cursor movement, cursor presentation, savepoint restoration, and bounded tab-stop replacement
    membership: >-
      BS, DECBI, DECFI, HPB, VPB, CSI-s ambiguity, DECSCUSR, Kitty multiple cursor request, iTerm CursorShape, and
      DECRSPS DECCIR/DECTABSR
    gate: >-
      exact region entry, wrap and logical-row boundaries, VT-level-independent policy, cursor-shape defaults,
      strict transactional payload parsing, G0 restoration, tab replacement, resize bounds, and malformed rollback;
      multiple-cursor and permissive/unbounded reference behavior is explicitly excluded
    why_next: >-
      It reuses the settled mode and geometry facts, then closes the remaining cursor/save-state compatibility edge.

  - id: metadata_shell_integration
    status: queued
    owner: howl-vt
    records: 15
    mechanism: bounded latest metadata, hyperlink pool, shell marks, title/icon facts, and semantic publication
    membership: >-
      GNU Screen title; OSC 0/1/2/7/8/133 and iTerm OSC 1337 CurrentDir, RemoteHost, SetMark, and
      ShellIntegrationVersion; Kitty OSC 3008 metadata
    gate: >-
      BEL/ST fragmentation, exact replacement/no-op mutation, byte and pool bounds, allocation rollback, reset and
      screen lifetime, shell-mark generation, and publication are exact; trust, sanitization, structured session,
      scrollback UI, and presentation residuals are either permanent policy or delegated to an existing named owner
      only after the VT fact is proven consumable
    why_next: >-
      These commands share retained host-neutral facts and can be settled without mixing host execution into VT.

  - id: compatibility_string_controls
    status: queued
    owner: howl-vt
    records: 21
    mechanism: bounded DCS transport occurrences, known ignored OSC selectors, and APC-family diagnostic payloads
    membership: >-
      iTerm tmux/SSH DCS hooks; sixteen Kitty ignored OSC command families; Kitty unsupported PM and SOS payloads
    gate: >-
      fragmented framing, ESC unescaping policy, cancellation/restart, FIFO identity, aggregate and per-payload
      bounds, saturation rollback, acknowledgement, reset lifetime, and cross-family ordering are exact; recursive
      tmux/SSH execution, product logging, and diagnostic policy are explicitly excluded unless an existing owner has
      a concrete completed handoff
    why_next: >-
      This last category resolves compatibility transport and no-op policy after terminal state owners are settled.

residual_accounting:
  revision: 2a5635a
  normalized_query: protocol gaps filtered to disposition active and owner howl-vt
  total: 112
  categories:
    mode_dispatch_lifecycle: 29
    charset_line_geometry: 19
    erase_repeat_alignment: 15
    cursor_compatibility_and_restore: 13
    metadata_shell_integration: 15
    compatibility_string_controls: 21
  partition: exact; categories are disjoint and counts sum to 112
  graphics_boundary: >-
    No active record is wholly graphics-owned. Kitty erase records include a terminal graphics-plane residual; after
    their non-graphics policy is settled, that remainder is deferred to howl-vt's later graphics milestone.
  other_owner_boundary: >-
    Host pixels, cursor presentation, resize notifications, and metadata presentation move only to howl-window when
    the category proves both a complete VT handoff and a current host obligation; product-only behavior is excluded,
    not delegated.

completion:
  - every indexed non-graphics record is full or has an explicit maintained disposition
  - every full claim points at exact implementation and behavior proof
  - every active residual names concrete unfinished Howl behavior
  - no host-visible capability is inferred from VT-only state

next_family: graphics begins only after the non-graphics categories have no unclassified active preparation debt
