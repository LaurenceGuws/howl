marathon:
  name: vt_sequences
  status: active
  basis: >-
    Frame, control, text, and the sole Wayland host now provide the accepted owners needed to prove terminal-local,
    transported, and host-visible facts without duplicating their mechanics in VT.

objective: >-
  Close each non-graphics protocol category through one shared terminal mechanism, exact pinned-reference evidence,
  deterministic owned proof, and an explicit disposition for every deliberate residual difference.

proof:
  vt: exact bytes produce exact state, reply, consequence, or rejection
  control: terminal truth survives bounded PTY ownership and immutable frame publication
  host: the operator-visible consequence is rendered or handled by the named current owner

selection:
  method:
    - group normalized active gaps by shared state-machine owner and effect rather than catalogue order
    - prefer categories retiring many obligations with one direct mechanism and dense adversarial proof
    - implement missing Howl semantics before changing catalogue disposition
    - mark incompatible reference policy excluded only after Howl's coherent behavior is implemented and proved
  baseline:
    total_records: 662
    full: 242
    active_partial_howl_vt: 293
    deferred: 29
    delegated: 47
    excluded: 51

categories:
  - id: save_reset_screen_lifecycle
    status: accepted
    owner: howl-vt
    mechanism: Terminal savepoints, mode snapshots, reset owners, and primary/alternate Screen banks
    records: 26
    why_first: >-
      The behavior is already cohesive and high-value, odd bank/reset/resize boundaries are deterministic, and most
      remaining obligations are explicit policy differences rather than missing machinery.
    gate: >-
      exact bank-local and mirrored state, repeated mutation truth, resize clamping, reset lifetime, alternate
      selection, and every reference residual classified as active work or deliberate exclusion
    result: >-
      one dense transcript proves the shared lifecycle and 26 incompatible reference residuals are explicitly
      excluded without adding production source; active partial howl-vt obligations fell from 293 to 267

  - id: cursor_origin_margins
    status: accepted
    owner: howl-vt
    mechanism: Screen cursor resolution, row geometry, DECOM, DECSTBM, and DECSLRM
    gate: exact per-command bounds with reference-specific margin and logical-row differences retained
    result: >-
      exact margin owners now reject invalid coordinates without cursor or pending-wrap mutation and report repeated
      commands truthfully; one dense fragmented transcript proves all cursor aliases, directional region entry,
      DECOM plus both margin axes, double-width logical columns, pending-wrap cancellation, and resize reset. Nine
      exact records became full and 30 conflicting pinned-reference policies became deliberate exclusions, reducing
      active partial howl-vt obligations from 267 to 228.

  - id: structural_edits_scrolling
    status: accepted
    owner: howl-vt
    mechanism: Screen row/column edits, scrolling, history, dirty bounds, protection, and line geometry
    gate: exact region, history, geometry, protection, overlap, and failure-atomic behavior
    result: >-
      ICH, DCH, IL, DL, SU, and SD now bypass the void Screen facade and publish exact cell, row-fact, history,
      damage, continuation, and pending-wrap mutation. Existing bounded region, logical-width, geometry, history,
      and column-edit proofs plus one adversarial blank-grid proof close 23 active records: four libvterm matches became
      full, 15 unrepresentable reference policies became deliberate exclusions, and four Kitty graphics consequences
      remain explicitly deferred. Active partial howl-vt obligations fell from 228 to 205.

  - id: rendition_color_protection_rectangles
    status: accepted
    owner: howl-vt
    mechanism: cell attributes, color transactions, protection provenance, and rectangle mutation
    gate: exact cell mutation and rollback with unsupported multicell residuals kept explicit
    result: >-
      SGR, DECFRA, DECCRA, DECCARA, DECRARA, and DECSACE now bypass void Screen facades and report exact retained,
      pending-wrap, cell, attribute, and minimum changed column spans per row. Dense fragmented proofs cover repetition, malformed color
      groups, protection provenance, clipping, overlap, and invalid rectangles. Forty-seven active obligations are
      now explicit: one unsupported DEC rendition is excluded, 34 conflicting reference policies are excluded, one
      Kitty graphics-color remainder stays deferred to howl-vt, and 11 completed VT color handoffs delegate
      presentation and damage to howl-window. Active partial howl-vt obligations fell from 205 to 158.

  - id: reports_replies
    status: accepted
    owner: howl-vt
    mechanism: bounded pending output, query serialization, mode facts, and host-supplied dimensions
    gate: exact bytes, rollback, identity policy, and delegated host facts
    result: >-
      One byte-fragmented mixed transcript now proves C0/C1 DA, DSR/CPR, DECRQM, DECRQSS, XTGETTCAP, XTVersion,
      terminal dimensions, and iTerm cell-size replies preserve exact order through the shared bounded serializer;
      a later query failure preserves the prior complete reply without appending a partial response. Kitty private DA
      no-reply is now full, 30 permanent identity/state-policy differences are deliberate exclusions, and two exact
      color-preference handoffs remain delegated to howl-window. Active partial howl-vt obligations fell from 158 to
      125.

  - id: input_modes
    status: accepted
    owner: howl-vt
    mechanism: typed keyboard, mouse, focus, and paste encoding plus saved mode state
    gate: exact bytes, bounds, modifier and coordinate policy, and screen/reset lifetime
    result: >-
      One fragmented cross-mode transcript proves application cursor and keypad bytes, focus gating, pixel mouse
      coordinates and modifiers, NUL-preserving bracketed paste, DECARM repeat suppression, Kitty press/release
      encoding, per-screen keyboard stacks, exact repeated-command mutation, and RIS defaults. Existing hostile proofs
      retain modifier, text, coordinate, allocation, depth, save/restore, alternate-screen, and pending-output bounds.
      Nine permanent host/input-policy conflicts are explicit exclusions and four completed VT handoffs delegate
      compositor focus, iTerm key-up delivery, Kitty paste exchange, and color-scheme observation to howl-window.
      Active partial howl-vt obligations fell from 125 to 112; no input-classified active gap remains.

completion:
  - every indexed non-graphics record is full or has an explicit maintained disposition
  - every full claim points at exact implementation and behavior proof
  - every active residual names concrete unfinished Howl behavior
  - no host-visible capability is inferred from VT-only state

next_family: graphics begins only after the non-graphics categories have no unclassified active preparation debt
