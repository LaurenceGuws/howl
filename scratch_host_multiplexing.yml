scratch:
  marathon: host_multiplexing
  purpose: current rescue commands, findings, compiler output, corrections, and immediate progress
  status: active

baseline:
  findings:
    - howl-host/src_current and howl-host/src_latest are byte-identical at campaign start
    - howl-host/build.zig still addressed deleted howl-host/src paths
    - >-
      src_deleted may donate algorithms, state transitions, geometry, cleanup order, edge cases, failure lessons,
      and proof scenarios, but its signatures, nouns, aggregates, and ownership boundaries have no authority
    - marathon_capability_reset.yml is a record of the regression, not acceptance or a prerequisite gate
    - Zellij models exited-pane retention with hold_on_close and close_on_exit
    - resource admission is governed by concrete owner limits and pane/layout limits, not a speculative global budget
  changes:
    - howl-host defaults to source=current and accepts -Dsource=latest
    - root run:host uses current and run:host:latest selects latest
    - marathon uses this scratch directly without sprint ceremony
  evidence:
    - ../.zig/zig build check -Dsource=current passed
    - ../.zig/zig build test -Dsource=current passed
    - ../.zig/zig build check -Dsource=latest passed
    - ../.zig/zig build test -Dsource=latest passed
    - both test runs intentionally exercised rejected XKB input and emitted parser diagnostics
    - Zig format checks, YAML parsing, and git diff whitespace validation passed

current_work:
  checkpoint: screen_tab_tiled_model
  status: implemented_pending_review
  objective: bounded platform-independent Screen, Tab, and TiledPanes ownership
  reference_findings:
    - Zellij Screen owns ordered tabs and active tab identity
    - Zellij Tab owns tiled panes, tab-local focus, name, and geometry
    - Zellij TiledPanes owns concrete rectangles, split insertion, divider resize, hit focus, and directional focus
    - Zellij has no product Workspace owner
    - >-
      Zellij pane_resizer derives current boundary spans and every pane participating in each span; persistent split
      ancestry is neither required nor retained
    - >-
      The close lesson borrowed from Zellij TiledPaneGrid.fill_space_over_pane is edge-neighbor growth followed by
      validated boundary repair; Howl trimOverlap is its own bounded rectangle algorithm, not structural equivalence
    - >-
      src_deleted donated rectangle adjacency, spatial candidate ordering, cleanup lessons, and hostile-state proof
      cases; no old signature, aggregate owner, module boundary, split tree, or Workspace noun survived
  implementation:
    - file: howl-host/src_current/tiled_panes.zig
      owner: fixed concrete PaneId and Rect records, placement, focus, hit testing, grouped close, and boundary resize
    - file: howl-host/src_current/tab.zig
      owner: one allocated bounded name and one TiledPanes
    - file: howl-host/src_current/screen.zig
      owner: allocator, ordered Tabs, active TabId, global PaneId issuance, aggregate pane admission, and grid resize
    - file: howl-host/src_current/test.zig
      change: admits the three owner proof roots only for source=current
    - src_latest and src_deleted are unchanged
  bounds:
    tabs: 16
    visible_panes_per_tab: 16
    live_panes: 64
    tab_name_bytes: 128
    grid_cols: 512
    grid_rows: 256
    minimum_pane_cols: 2
    minimum_pane_rows: 1
    identities: stable nonzero u64-backed TabId and PaneId; failed mutations do not consume an identity
  transactions:
    - topology is current concrete rectangle state in fixed storage and commits validated candidate copies
    - tab construction and rename allocate replacement names before publication or release
    - >-
      tiled resize maps current coordinate boundaries under pane-minimum constraints without historical split
      ancestry; screen resize plans every tab in fixed candidate storage before committing any tab
    - >-
      close fills space through one deterministic complete neighboring edge group and trims only connected boundary
      overlaps; failure to retain valid rectangles rejects the fixed-storage candidate without mutation
    - >-
      Screen exposes GeometryLimit from close because bounded reachable-state evidence does not prove that every
      valid retained rectangle tiling admits Howl's local repair
    - close operations validate and collect deterministic retirement/fallback facts before mutation
  proof:
    focused:
      command: ../.zig/zig test src_current/screen.zig
      result: 18 tests passed
      covers:
        - exact split rectangles and placement
        - horizontal and vertical minimum geometry
        - pointer hit and directional focus
        - T-junction and multi-neighbor contiguous boundary resize
        - grouped deterministic close repair and focus fallback
        - >-
          exact non-slicing pinwheel center close geometry, byte-identical unrelated panes, deterministic focus, and
          hostile byte-exact rollback
        - >-
          bounded reachable layouts through split, divider resize, whole-grid resize, and prior close; every pane
          close proves valid full coverage and connected local mutation or byte-identical GeometryLimit rollback
        - non-slicing valid layout resize without ancestry
        - duplicate, zero, stale, overlapping, holed, overflowed, and exhausted identities
        - exact full-grid coverage and hostile rectangle arithmetic
        - tab create, close, rename, reorder, switch, and active fallback
        - every Screen public method body, including the resizeDivider forwarding boundary
        - 16-tab, 16-pane-per-tab, and 64-live-pane capacity
        - exact 128-byte name and 512-by-256 grid bounds
        - transactional whole-screen resize failure
        - exhaustive and direct allocation failure
    current_host:
      - ../.zig/zig build check -Dsource=current passed
      - ../.zig/zig build test -Dsource=current passed
    latest_host:
      - ../.zig/zig build check -Dsource=latest passed
      - ../.zig/zig build test -Dsource=latest passed
    workspace:
      - ./.zig/zig build test passed
      - git diff --check passed
      - marathon and scratch YAML parsing passed
      - current/latest test diagnostics include the existing intentional rejected-XKB parser messages
  source_accounting:
    implementation_lines: 1191
    colocated_test_lines: 507
    total_lines: 1698
    structs: 12
    tagged_unions: 0
    public_type_declarations: 17
    public_type_note: six Screen declarations are curated re-exports of TiledPanes geometry and identity types
    public_methods: 41
    correction_delta:
      implementation_lines: 103
      colocated_test_lines: 12
      structs: 3
      tagged_unions: -1
      public_methods: -1
      public_types: 0
      surface:
        - Rect.contains became private so arbitrary public Rect values cannot trigger unchecked containment arithmetic
        - TiledPanes.focusPane reports InvalidGeometry for hostile retained state
        - Screen uses explicit programmer-invariant panics for impossible generated-ID and trusted non-close boundaries
        - Screen no longer advertises InvalidPaneId, InvalidSize, or DuplicatePane from Screen-owned invariants
        - Screen.resizeDivider exposes only StaleTab and StalePane caller failures
        - Screen.closePane exposes GeometryLimit because bounded exploration is evidence, not a completeness proof
        - coordinateMap derives its initial zero boundary once from live rectangles
    close_and_surface_correction_delta:
      implementation_lines: 93
      colocated_test_lines: 76
      total_lines: 169
      structs: 0
      public_methods: 0
      public_types: 0
    proof_gap_correction_delta:
      implementation_lines: -2
      colocated_test_lines: 143
      total_lines: 141
      test_support_structs: 1
      production_structs: 0
      public_methods: 0
      public_types: 0
    new_sensitive_sites: 0
    unreachable_sites_in_model: 0
    allowlist_mutations: 0
  blockers:
    - >-
      ./.zig/zig build check fails protocol validation with 80 diagnostics because protocol_coverage.yml still names
      deleted howl-host/src paths; permanent-authority edits are outside this checkpoint
    - >-
      ./.zig/zig build check fails the source audit because tools/source_audit.allow names prior howl-host/src paths
      while the audit discovers src_current, src_latest, and src_deleted; the operator-owned allowlist was not mutated

