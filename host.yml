host:
  name: Howl
  version: 0.1.3-dev
  status: persistent_surface_chrome_review
  scope: bounded_wayland_vulkan_surface_and_chrome

intent:
  - Prove enduring Main, Window, Render, and shared-boundary ownership.
  - Preserve the successful three-slot Vulkan DMA-BUF presentation mechanism on a compositor-configured persistent surface.
  - Prove stable Renderer-owned tab/pane chrome facts without terminal composition.

owners:
  Main:
    owns:
      - std.Io root
      - shared boundary lifetime
      - Window and Render thread handles
      - joining and final process failure
    rules:
      - Join both owners before destroying the shared boundary.
  Window:
    owns:
      - Wayland connection, registry, surface, xdg-shell objects, and callbacks
      - DMA-BUF feedback and wl_buffer wrappers
      - DRM-syncobj Wayland timeline wrappers
      - frame callbacks and compositor-paced commits
      - configured pixel geometry and generation-tagged wrapper rings
    rules:
      - Commit at most one ready slot per frame opportunity.
      - Never acknowledge Render or gate GPU mutation.
      - Never call Vulkan or observe DRM release completion.
  Render:
    owns:
      - Vulkan instance, physical device selection, device, queue, commands, images, and memory
      - DRM render-node descriptor and syncobjs
      - per-slot release observation and exclusive/external ownership transitions
      - completed render revisions
      - bounded stable tab/pane identities and backend-neutral chrome projection inputs
      - replacement Vulkan storage while Window retires the prior generation
    rules:
      - Match the compositor DMA-BUF device through VkPhysicalDeviceDrmPropertiesEXT.
      - Query the exact format, modifier, plane, memory, and external-handle facts.
      - Destroy slots only after Window retires its wrappers.
  Boundary:
    owns:
      - copied feedback, slot offers, completion queue, stop, and retirement facts
      - newest bounded configure fact and ring generation identities
      - Render-to-Window and Window-to-Render eventfds
      - first runtime failure

ring:
  slots: 3
  completed_revisions: 3
  resize_bound:
    simultaneous_gpu_rings: 2
    simultaneous_slots: 6
    simultaneous_wayland_wrappers: 6
    simultaneous_wl_buffers: 6
    simultaneous_syncobj_timeline_wrappers: 12
    transferred_slot_descriptors: 18
    boundary_eventfds: 2
    renderer_drm_descriptor: 1
    gpu_memory_budget_bytes: 536870912
    preliminary_exported_image_bytes_per_pixel: 24
    shared_atlas_pixels: 4194304
    cpu_atlas_rebuild_pixels: 4194304
    maximum_label_workload: 24 labels × 96 UTF-8 bytes, up to 256 shaped glyphs per label
    atlas_pressure: one transactional rebuild buffer replaces stale residency before AtlasFull
    shared_vertex_capacity: 16384
    shared_index_capacity: 24576
    shared_draw_capacity: 1024
    accounting: every exported image, shared R8 atlas, and shared vertex/index/atlas-upload buffer is charged from its exact VkMemoryRequirements.size; construction rejects any aggregate above the budget
  reuse:
    - present slot 0
    - present slot 1
    - present slot 2
    - publish a replacement generation and present its newest slots
    - observe old-generation release points while wrappers remain live
    - request Window wrapper retirement, then destroy old Vulkan storage

synchronization:
  render_to_window:
    - completed slot revision
    - directional eventfd signal
  window_to_render:
    - DMA-BUF feedback
    - ring construction complete
    - Window retired
    - directional eventfd signal
  exclusions:
    - presentation acknowledgement
    - sleep polling
    - frame-callback gating of Render
    - shared Vulkan mutation

current_exclusions:
  - PTY and child lifecycle
  - VT and terminal semantic projection
  - terminal text, images, and terminal semantic projection
  - keyboard, pointer, clipboard, and terminal consequence policy
  - sessions, remote control, and multiplexing policy
  - Vulkan swapchains, EGL, GLES, and implicit synchronization

acceptance:
  - deterministic owner and boundary tests pass in every optimize mode
  - Debug and ReleaseSafe live rings reach persistent configured commits; deterministic owner proofs cover retirement and cleanup
  - root workspace and every surviving child check and test pass
  - source audit and protocol catalogue validation pass
  - tracked Vulkan and generated Wayland provenance is exact
  - deterministic geometry proves Vulkan viewport orientation and native glyph placement before the visible chrome fixture
  - no stale deleted-package or historical graphics ownership remains in current authorities
