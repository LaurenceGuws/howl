host:
  name: Howl
  version: 0.1.3-dev
  status: foundation_review
  scope: bounded_wayland_vulkan_color_ring

intent:
  - Prove enduring Main, Window, Render, and shared-boundary ownership.
  - Preserve the successful three-slot Vulkan DMA-BUF presentation mechanism.
  - Exclude terminal-product composition until the native lifetime foundation is accepted.

owners:
  Main:
    owns:
      - std.Io root
      - shared boundary lifetime
      - Window and Render thread handles
      - joining and final process failure
    rules:
      - Join both owners before destroying the shared boundary.
  Window:
    owns:
      - Wayland connection, registry, surface, xdg-shell objects, and callbacks
      - DMA-BUF feedback and wl_buffer wrappers
      - DRM-syncobj Wayland timeline wrappers
      - frame callbacks and compositor-paced commits
    rules:
      - Commit at most one ready slot per frame opportunity.
      - Never acknowledge Render or gate GPU mutation.
      - Never call Vulkan or observe DRM release completion.
  Render:
    owns:
      - Vulkan instance, physical device selection, device, queue, commands, images, and memory
      - DRM render-node descriptor and syncobjs
      - per-slot release observation and exclusive/external ownership transitions
      - completed render revisions
    rules:
      - Match the compositor DMA-BUF device through VkPhysicalDeviceDrmPropertiesEXT.
      - Query the exact format, modifier, plane, memory, and external-handle facts.
      - Destroy slots only after Window retires its wrappers.
  Boundary:
    owns:
      - copied feedback, slot offers, completion queue, stop, and retirement facts
      - Render-to-Window and Window-to-Render eventfds
      - first runtime failure

ring:
  slots: 3
  completed_revisions: 4
  reuse:
    - present slot 0
    - present slot 1
    - present slot 2
    - observe slot 0 release
    - acquire slot 0 from external ownership
    - render and present slot 0 again

synchronization:
  render_to_window:
    - completed slot revision
    - directional eventfd signal
  window_to_render:
    - DMA-BUF feedback
    - ring construction complete
    - Window retired
    - directional eventfd signal
  exclusions:
    - presentation acknowledgement
    - sleep polling
    - frame-callback gating of Render
    - shared Vulkan mutation

current_exclusions:
  - PTY and child lifecycle
  - VT and terminal semantic projection
  - text, images, and chrome rendering
  - keyboard, pointer, clipboard, and terminal consequence policy
  - tabs, panes, sessions, remote control, and multiplexing
  - Vulkan swapchains, EGL, GLES, and implicit synchronization

acceptance:
  - deterministic owner and boundary tests pass in every optimize mode
  - Debug and ReleaseSafe live rings complete and retire cleanly
  - root workspace and every surviving child check and test pass
  - source audit and protocol catalogue validation pass
  - tracked Vulkan and generated Wayland provenance is exact
  - no stale deleted-package or historical graphics ownership remains in current authorities
