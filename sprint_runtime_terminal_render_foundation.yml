schema: 1
sprint:
  id: terminal_render_foundation
  marathon: runtime_hot_paths
  version: 0.1.6-dev
  status: accepted
  active_slice: completed
  objective: >-
    Own PTY and VT in Terminal Runtime, transfer exact VT journals through one
    global FIFO, and let Renderer retain terminal fonts and final cell grids
    without fabricating Canvas, GPU, frame, or Window work.

ownership:
  process_root:
    - constructs one terminal_visual_fifo.Fifo
    - passes the FIFO independently to Terminal Runtime and Renderer
  terminal_runtime:
    path: howl-host/src/terminal.zig
    owns:
      - PTY and VT lifetimes
      - terminal input, replies, consequences, and child completion
      - exact admitted lifecycle grid consumption
      - one pending VT journal until FIFO enqueue commits
    excludes:
      - native fonts, metrics, raster, glyph, Canvas, GPU, and pane visual grids
  renderer:
    paths:
      - howl-host/src/renderer.zig
      - howl-host/src/terminal_fonts.zig
    owns:
      - bounded FontSet cache keyed by resolved point and DPI
      - exact lifecycle grid derivation
      - bounded pane table of howl-render terminal_cells.Grid
      - global FIFO drain and final-equality Render update decision
      - lifecycle revision to font epoch association
  handoff:
    path: howl-host/src/terminal_handoff.zig
    owns:
      - lifecycle admission and exact create or resize DerivedGrid copies
      - monotonic pane, source, and lifecycle identities
      - retirement and child-completion ordering
  visual_fifo:
    path: howl-host/src/terminal_visual_fifo.zig
    owns:
      - 256 globally ordered deep-copy slots
      - one borrowed head until exact completion
      - independent ready and capacity eventfds

ordering:
  - every PTY byte enters VT through feedRenderByte
  - a complete VT journal must enqueue before that terminal processes another byte
  - queue pressure preserves VT pending ownership and later-byte state
  - Renderer applies FIFO entries globally in sequence
  - FIFO completion occurs only after successful Grid application
  - same-grid font changes use an ordered lifecycle resize and VT replace resize barrier
  - older lifecycle entries use the old font epoch
  - the replacement transaction switches the pane to the new font epoch
  - final Grid equality decides whether Render work exists
  - no Canvas, GPU, frame, or Window work is fabricated in this slice

bounds:
  terminal_owners: 64
  font_cache_entries: 128
  visual_fifo_slots: 256
  maximum_rows_per_pane: 128
  maximum_cells_per_pane: 65536
  allocations_after_startup:
    fifo: bounded_dynamic_payload_only
    grid: create_candidate_only
    font: cache_miss_only

removed_surface:
  - render.terminal
  - terminal Content and VisualState
  - terminal_pool
  - terminal_font_owner
  - FontMap and font groups
  - terminal ligature, image, animation, blink scheduling, trail, selection, and hyperlink projection
  - completed Canvas update transport
  - compatibility aliases

proofs:
  - two panes preserve global FIFO sequence into Renderer grids
  - 5 to 4 to 5 applies both transactions and yields no final Render update
  - pressure preserves VT pending state before later byte mutation
  - same-grid resize emits a full VT replacement and switches font epoch only at that barrier
  - stale source and lifecycle entries complete without pane mutation
  - malformed Grid application is invariant-fatal after any partial mutation; no rollback is claimed
  - lifecycle admission carries exact Renderer-derived grids
  - one admitted create and resize each cross Runtime application, FIFO publication, and Renderer Grid drain with exact identity and dimensions
  - create allocations and candidate font ownership roll back before lifecycle commit
  - retirement validates exact pane and source ownership

validation:
  required:
    - Host check and test in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
    - still-possible workspace check and test in all four modes
    - strict duplicate-key YAML
    - source audit and protocol validation
    - formatting and git diff --check
  excluded:
    - GUI execution
    - physical terminal Vulkan rendering
