marathon:
  name: frame_host_replacement
  status: active

objective: >-
  Replace the experimental host with one Wayland window loop, one shared text/GLES renderer, and N PTY/VT terminal owners;
  preserve proven platform mechanics as a temporary copybook and delete the superseded implementation after parity.

topology:
  terminal_threads: N owners of one PTY, one VT, input, replies, resize, and immutable TerminalFrame publication
  render_thread: one owner of text, shared texture cache, pane composition, GLES, swap, and render completion
  window_thread: one owner of the Wayland event loop, xkb, input admission, layout, compositor callbacks, timers, and host policy

ownership:
  terminal_frame:
    owns:
      - complete cells and row geometry
      - cursor and terminal presentation
      - terminal geometry and generation
      - cumulative damage
    excludes:
      - pane and host layout
      - fonts and glyphs
      - textures and GPU values
      - Wayland values
  renderer:
    owns:
      - shaping and rasterization
      - one bounded texture cache shared by every terminal and frame
      - pane composition and terminal-to-host damage
      - one EGL context and GLES device
  window:
    owns:
      - Wayland and xkb
      - layout, focus, timers, and admission
      - compositor and host-consequence policy
    excludes:
      - terminal cell traversal
      - text and texture ownership
      - GLES work
  ordering:
    coalesced:
      - complete state publications
    exact:
      - commands
      - queries and replies
      - host consequences

source_intervention:
  - owner: howl-text
    treatment: >-
      apply one-file pressure as a temporary review technique, then retain only file boundaries that reduce ownership or
      maintenance ambiguity; do not collapse independent native-text and generated-glyph owners merely to minimize file count
  - owner: howl-frame
    treatment: >-
      begin as one file containing complete-frame, damage, bounded-slot, borrow, and acknowledgement vocabulary
  - owner: howl-host
    treatment: >-
      prefer large coherent owners over generic backend, event-framework, cache, scene, or compatibility abstractions

slices:
  - id: copybook_evidence
    outcome: >-
      retain deterministic facts for Wayland startup/configure, xkb input/repeat, EGL/GLES lifecycle, wakes,
      multi-terminal progress, resize, and shutdown without preserving accidental source boundaries

  - id: text_source_review
    outcome: >-
      inspect the complete text module without architectural blinders; preserve fallback, shaping, generated glyphs,
      raster bounds, native cleanup, and failures while removing only unearned aliases, imports, nouns, files, and characters

  - id: terminal_frame
    outcome: >-
      implement complete immutable frames, cumulative damage, bounded slots, exact borrow/acknowledgement,
      stale-generation rejection, and non-blocking producer saturation

  - id: control_publication
    outcome: >-
      publish TerminalFrame directly from the PTY/VT owner while preserving fragmented output, replies, input,
      resize, cancellation, remote control, and cleanup ordering

  - id: shared_renderer
    outcome: >-
      establish one render thread, FontSet, bounded shared glyph/texture cache, EGL context, GLES device,
      coalesced render mailbox, and exact completion wake

  - id: pane_composition
    status: accepted
    outcome: >-
      compose at least one split across two tabs with stable identities, focus, resize coalescing, and live hidden terminals
    reference: >-
      Zellij informs pane identity and layout semantics without donating its channel bus or instruction architecture

  - id: wayland_window
    outcome: >-
      poll Wayland, dynamic terminal wakes, renderer completion, repeat timer, and shutdown directly;
      simultaneous readiness loses no facts and operator input is not required for output progress

  - id: interaction_closure
    status: accepted
    outcome: >-
      prove damage mapping, expose without VT mutation, mode-aware keys, composed text, paste, mouse, resize storms,
      coherent generations, and FIFO consequence acknowledgement
    deferred:
      - >-
        clipboard paste requires a bounded Wayland data-device owner; the replacement host currently binds no
        data-device protocol and does not infer clipboard bytes
      - >-
        TERM requires copied child-environment ownership at the PTY launch boundary; the host does not mutate ambient
        process environment or claim Kitty compatibility
      - >-
        primary-screen wheel scrollback requires a bounded host viewport owner; alternate-screen applications already
        receive mode-aware wheel input, while shells that do not request mouse tracking leave wheel policy to the host

  - id: dogfood_delete
    outcome: >-
      pass bash, rain, btop, Neovim, split/tab, resize, terminal-exit, compositor-close, and idle-operator output probes;
      then make the replacement sole host and delete the copybook in one explicit checkpoint

completion_bars:
  foot:
    - direct owner loops and small vocabulary
    - no generic backend framework or compatibility host
    - fewer tracked characters and ownership hops
  tigerbeetle:
    - bounded queues, publication slots, and caches
    - exact generations, cumulative damage, and stale-work rejection
    - all available terminal resizes commit together or roll back before layout publication
    - unavailable panes retain their last admitted terminal geometry while host layout continues
    - explicit saturation outcomes
    - reverse cleanup and executable failure/shutdown proofs
  multiplexing:
    - one renderer and texture cache serve every terminal
    - no terminal owns fonts, atlas slots, textures, pane position, or GPU work
  responsiveness:
    - bursting PTYs cannot delay Wayland input
    - continuously updating TUIs progress without operator input
    - pacing discards only superseded state, never ordered effects
  deletion:
    - no fixed three-terminal vocabulary
    - no window cell traversal or per-terminal texture cache
    - no duplicate text, frame, or EGL/GLES owner
    - no stale source-map, design, build, test, or documentation claim

review:
  boundary: coherent ownership or behavior milestones rather than mechanical line counts
  compare:
    - accepted behavior and proof strength
    - tracked production characters and public symbols
    - error sets, bounds, ownership, and cleanup paths
  finish: delete this scratch when the replacement and copybook deletion land
