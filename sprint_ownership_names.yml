schema: 1
sprint:
  id: ownership_names
  marathon: debt_payoff
  version: 0.1.5-dev
  branch: feature/debt_payoff/ownership_names
  status: active
  objective: >-
    Replace dishonest umbrella ownership names with exact domain names while
    preserving cohesive files, behavior, storage, and package boundaries.

scope:
  owned:
    - maintained Zig filenames and private module aliases whose names conceal their actual owner
    - build imports, source-map entries, comments, and tests coupled to an accepted rename
    - howl-host/src/window_render_boundary.zig as the first explicit ownership question
  excluded:
    - file splitting, package extraction, and new interfaces
    - behavior, capacity, allocation, layout, scheduling, and protocol changes
    - cosmetic renames whose current name already identifies one coherent owner

invariants:
  - Every rename follows a complete symbol, import, build, test, documentation, and authority census.
  - A file remains cohesive unless a separate reviewed structural intervention proves otherwise.
  - Public vocabulary changes only when the old public name is dishonest and all consumers migrate atomically.
  - Renames preserve byte layout, errors, bounds, ownership transfer, cleanup, and runtime behavior.
  - No compatibility alias or parallel old/new vocabulary survives an accepted rename.

slices:
  - id: ownership_inventory
    status: accepted
    product_change: none
    output: complete classification of suspected umbrella names and exact consumer census
    evidence: .zig/work/debt-payoff/ownership-names/ownership_inventory.yml
    accepted_facts:
      - The explicit discovery rule scanned 115 maintained Zig files and 269 private import aliases.
      - Twenty-six candidates have complete classification, source, vocabulary, and migration reverse indexes.
      - window_render_boundary.zig is one cohesive Window/Render boundary with exact owner vocabulary.
      - chrome_state.zig retains no Chrome state and is one cohesive Session-to-Chrome adapter.
      - Conventional package roots, selected implementation aliases, and honest owner-local facts remain unchanged.
  - id: rename_contract
    status: accepted
    product_change: none
    output: finite accepted rename set with owner definitions and atomic migration order
    evidence: .zig/work/debt-payoff/ownership-names/rename_contract.yml
    accepted_facts:
      - window_render_boundary.zig is already the accepted boundary name without changing its 55-symbol public surface.
      - chrome_state.zig migrates separately to session_chrome_adapter.zig without changing its 19-symbol public surface.
      - Each rename has a complete source, build, test, comment, and authority path set plus scoped old-vocabulary rejection.
      - chrome_state_equivalence_test.zig remains the honest name of the legacy-state oracle.
  - id: accepted_renames
    status: active
    output: only contract-approved names migrated with no compatibility vocabulary
    accepted_groups: [window_render_boundary]
    active_group: session_chrome_adapter

acceptance:
  - Every maintained candidate is classified as honest, dishonest, or deferred with exact source evidence.
  - Accepted names identify one concrete owner and preserve cohesive source locality.
  - No old vocabulary, compatibility alias, or stale authority survives.
  - Affected package and workspace checks/tests pass in every optimization mode.
  - Strict YAML, source audit, protocol validation, formatting, and git diff checks pass.
