current_findings:
  - Terminal threads own PTY and VT and enqueue complete visual journals into one global ordered FIFO.
  - Renderer drains every currently available FIFO entry before preparing per-pane Grid candidates.
  - Grid.prepare lowers final differences and returns null when retained current state equals the accepted rendered baseline.
  - Host terminal GPU ownership aggregates changed panes into one staging and recording batch.
  - Renderer owns one combined terminal-before-generic render pass and one vkQueueSubmit call site.
  - presentation_state retains one latest-ready frame and signals Window only on empty-to-ready.
  - Window takes only the newest retained frame when Wayland pacing permits and commits that frame once.
  - Future runtime evidence is bounded to 142 aggregate records and 581632 complete JSONL bytes, not scheduling turns.
  - Render and Render-derived presentation totals are separated into startup, replacement/configure, generic-only, terminal-driven, and mixed terminal plus generic classes.
  - Window reports one global summary because ReadyFrame owns no frame classification.
  - External idle/background context is excluded from first-owner causal counting.
  - Existing source contains counters and revisions for several boundaries but no complete joined bytes-to-presentation receipt.

unknowns:
  - exact workload ratios between PTY bytes, VT operations, FIFO entries, folded pane mutations, and prepared Grid updates
  - exact staging bytes and copy-region counts per rendered opportunity under the accepted workload
  - how often final-equal terminal work stops before Store preparation in production
  - exact completed-frame to latest-ready replacement to Window-take ratios
  - which first owner contributes disproportionate work after quantities are joined

constraints:
  - no product edit
  - no optimization or correction proposal
  - no instrumentation
  - no GUI, runtime, or cast launch
  - no Git operation
  - no owner deletion or replacement
  - Neovim is only a later fixture, not the defect definition

