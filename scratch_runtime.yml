review_notes:
  - global FIFO drain completes before at most one Grid.prepare per live pane
  - checked aggregate admission precedes pane Store and physical resource construction
  - TerminalBatch borrows at most 64 descriptors and owns no copy-region arrays
  - distinct FontGpu candidates discard before Stores; Stores and Grids discard in reverse pane order
  - post-submit failure retains exact fatal candidates without completion, discard, retry, or publication
  - generic terminal cursor replay is removed after static cursor integration in the terminal shader path
  - physical execution counters are production-consumed by the one render path
  - blank-only first FontGpu candidates record one direct readable-layout transition and accept it only after GPU completion
  - pre-submit atlas rollback and missing-command fatal ownership retain undefined accepted layout
  - regular, bold, italic, and bold-italic raster tiles differ through bounded physical treatment when pixels permit
  - obsolete cursor publication storage, Renderer drains, and cursor configuration plumbing are deleted
  - terminal SPIR-V PushConstants and Zig use exact offsets 0, 8, 16, 24, 32, 48, 64, 80 with an 88-byte range
  - the pure two-by-two oracle fixes instance-to-row-map, pixel/NDC, atlas, and packed-instance expectations before any runtime gate
  - PaneResources retains exact descriptor-set, instance-buffer, row-buffer, range, sampler, view, and atlas identities after construction; bindings rejects every mismatch without descriptor rewrite
  - PaneResources grows from 64 to 128 bytes; 64 retained pane slots add exactly 4,096 bytes and pin PendingTopology at 66,056 bytes
  - terminal_gpu owns exact integer logical-edge to physical-attachment conversion; generic Canvas and Chrome remain logical
  - T018 proves only already-physical grid/scissor fit and no longer overstates fractional conversion
  - T021 carries a 100x80 logical, 160x128 physical surface and content origin 24 through Session placement, physical grid admission, Draw, NDC inputs, atlas metrics, and shared boundaries
  - PhysicalFrameExecution is consumed at the begin-pass, terminal, generic, and end-pass calls and rejects out-of-order recording
  - resource separation is static construction/call-graph closure; no runtime opaque-handle equality interface exists or is introduced

