implementation:
  render:
    - 11-byte alignment-one resolved Cell
    - one fixed current visual grid plus bounded first-old cell baselines
    - touched-row baselines and structured row work without full row-map scans
    - touched-identity cleanup rather than maximum-grid metadata clears
    - structured full-row rotation and final fill preservation
    - explicit init, resize, and alternate-grid replacement
    - static cursor lowering independent from cells
  Vulkan:
    - 16-byte persistent terminal Instance shadow
    - one accepted instance shadow plus bounded sparse candidate writes
    - caller-borrowed replacement cells rather than a second full candidate
    - exact borrowed mapped instance, u32 row-map, and glyph staging partitions
    - exact VkBufferCopy and VkBufferImageCopy candidate regions and command recording
    - stable 380-slot blank/ASCII bold/italic glyph identity
    - first-use glyph upload only with four-byte-aligned Vulkan copy offsets
    - row-map transfer with zero moved-cell payload
    - one terminal draw group per pane
    - complete command preflight before the first Vulkan command

retained_memory:
  receipt_configuration: 128 rows x 512 columns, 65,536 sparse and structured entries, 65,536 glyph bytes
  render_grid_bytes_per_pane: 7342232
  vulkan_store_bytes_per_pane: 7961712
  combined_cpu_bytes_per_pane: 15303944
  representable_cpu_bytes_if_64_future_callers_each_request_all_maxima: 979452416
  future_logical_gpu_payload_bytes_per_pane: 1097728
  future_logical_gpu_payload_bytes_under_same_arithmetic_multiplier: 70254592
  note: >-
    Host limits and steady memory are not selected or authorized. These are
    library stress equations, while physical GPU allocation and execution
    remain unimplemented and unclaimed.

