runtime_correction:
  first_failure: >-
    Reusing a logically superseded slot exported its unsignaled compositor
    release syncobj; the subsequent Vulkan queue wait prevented completion and
    the first observed failing operation was drmSyncobjWait on the exported
    render-completion sync file, reported as RenderTimeout.
  physical_protocol: >-
    Never-presented work transfers its exact completed Render acquire timeline
    point into the slot release timeline, waits that exact transferred point,
    and only then becomes Render reusable. No releaseFacts or compositor
    release is fabricated.
  startup_protocol: >-
    The three product-background initialization renders are physically reclaimed
    without publication. A fourth product-background render is performed in
    slot 0 and is the only startup latest ready frame. Replacement uses the
    same four-render physical protocol.
  scale_one_correction: >-
    After configure, exact wl_surface.enter membership at output scale one is
    accepted when a version-6 surface emits no redundant preferred-scale event.
    Higher deduced output scales still wait for exact preferred integer or
    fractional facts.
  scale_one_capacity: >-
    The reproduced 1910 by 1048 terminal content extent derives 477 by 104 or
    49,608 cells at four-by-ten six-point metrics. Terminal projection and
    Content admission retain the full configured surface under one explicit
    65,536-cell bound; fixture geometry never constrains product rendering.
  replacement_pending_correction: >-
    The fourth replacement render now builds and stages its own residency
    candidate before completion; it no longer calls ResidencyStore.complete
    after the initialization render already consumed the prior candidate.
  failure_ownership_correction: >-
    render() restores reusable only through vkQueueSubmit failure. Every later
    failure retains its acquire identity in submitted-render-fatal. Shared
    supersession and cancellation first represent the new shared state and the
    old superseded-reclaiming slot; physical reclaim failure retains the old
    identity in superseded-reclaim-fatal without fabricating compositor facts.
  injected_failure_proofs:
    pre_submit: every operation from staging through failed queue submission
    post_submit: every operation after successful queue submission through acquire-timeline completion
    superseded_reclaim: transfer, availability wait, and completion wait
    cancellation_reclaim: transfer, availability wait, and completion wait
    shutdown: every fatal ownership retains acquire and release identity and preserves the first failure
  evidence:
    - Debug natural startup with command true exited successfully
    - ReleaseFast accepted cast exited naturally without Render failure
    - real DRM syncobj timeline transfer and exact-point proof passed

review_focus:
  - exactly one latest ready frame
  - Window pacing remains independent from compositor release
  - Render cancellation and Window take return each identity at most once
  - stale presentation-state readiness cannot spin or lose a concurrent update
  - terminal ownership is unchanged; projection and Content capacity changed explicitly to 65,536 cells
