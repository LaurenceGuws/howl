[general]
live_config_reload = false
ipc_socket = false

[window]
decorations = "None"
padding = { x = 0, y = 0 }
dynamic_padding = false
opacity = 1.0
blur = false
dynamic_title = true

[scrolling]
history = 4096

[font]
size = 7.5
normal = { family = "Iosevka Nerd Font", style = "Regular" }
bold = { family = "Iosevka Nerd Font", style = "Bold" }
italic = { family = "Iosevka Nerd Font", style = "Italic" }
bold_italic = { family = "Iosevka Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 0 }
glyph_offset = { x = 0, y = 0 }

[cursor]
style = { shape = "Block", blinking = "Never" }
unfocused_hollow = false

[[keyboard.bindings]]
key = "F11"
action = "ToggleFullscreen"
