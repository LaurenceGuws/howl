live_config_reload = false
ipc_socket = false

[window]
decorations = "None"
padding = { x = 0, y = 0 }
dynamic_padding = false
opacity = 1.0
blur = false
dynamic_title = false

[scrolling]
history = 4096
multiplier = 1

[font]
size = 7.0
normal = { family = "IosevkaTerm Nerd Font", style = "Regular" }
bold = { family = "IosevkaTerm Nerd Font", style = "Bold" }
italic = { family = "IosevkaTerm Nerd Font", style = "Italic" }
bold_italic = { family = "IosevkaTerm Nerd Font", style = "Bold Italic" }
offset = { x = 0, y = 1 }
glyph_offset = { x = 0, y = 1 }

[cursor]
style = { shape = "Block", blinking = "Never" }
unfocused_hollow = false

[bell]
duration = 0

[debug]
render_timer = false
persistent_logging = false
highlight_damage = false
renderer = "None"
