marathon:
  name: window_multiplexing
  status: active

objective: >-
  Replace the fixed demonstration tabs and panes with a bounded native host workspace that feels familiar to terminal
  veterans, preserves Howl's current presentation, and establishes pane-local scrollback viewport ownership.

references:
  behavior: zellij interaction vocabulary and lifecycle evidence
  defaults: /home/home/personal/bash_engine/dots/kitty
  directness: /home/home/personal/projects/dev_references/terminals/foot
  defensiveness: /home/home/personal/projects/dev_references/zig_maturity/tigerbeetle

boundaries:
  - Howl owns its model; qtui contributes lessons, not a shared UI abstraction.
  - One current host session contains tabs; session CRUD and persistence remain later work.
  - Tabs own bounded pane layouts and one focused pane.
  - Panes own stable identity, one terminal, and independent viewport state.
  - Selection, copy, search, floating panes, layouts, detach/attach, and plugins remain outside this cut.
  - The label-cell surface owns bounded presentation and hit geometry, never tab or session policy.
  - VT owns retained history and logical rows; the window owns viewport offset, follow state, scrollbar geometry, and input.

categories:
  - id: workspace_model
    status: accepted
    goal: >-
      Establish stable session, tab, and pane identities; real resource bounds; transactional tab and pane CRUD;
      deterministic focus fallback; and geometry independent from Wayland, GLES, PTY, and rendering types.
    gate: >-
      Create, close, rename, reorder, switch, horizontal/vertical split, direct/directional focus, divider resize, and
      outer resize either commit one valid tree or preserve the prior workspace exactly under invalid input, capacity,
      and allocation failure. Close operations expose every retired pane identity before host adoption destroys owners.
    result: >-
      One platform, renderer, and terminal-independent fixed-tree owner now admits sixteen tabs, sixteen panes per tab,
      sixty-four panes per session, eight split ancestors, 128-byte names, and the current 512 by 256 grid domain.
      Names allocate before commit; topology is allocation-free. Split nodes retain integer first-child cell extents;
      divider movement saturates at recursive pane minima, and outer resize preserves those extents or transactionally
      clamps them for every tab. Dense proofs cover stable identities, exact pane retirement, tab CRUD/order, split and
      close fallback, direct and directional focus, nested divider movement, odd geometry, hostile topology rejection,
      depth/count/size rejection, and allocation rollback.

  - id: host_adoption
    status: accepted
    goal: >-
      Replace fixed terminals and layouts with the workspace model, create and retire terminal owners with panes,
      transactionally resize affected PTYs, and retain unavailable-pane isolation and clean shutdown.
    gate: >-
      Recognizable tab and pane commands work through real xkb input; release and repeat cannot leak into terminals;
      close fallback, failed terminal state, renderer reconciliation, and process cleanup are exact.
    result: >-
      The Wayland host now owns the bounded workspace directly and creates one PTY/VT terminal plus stable wake slot per
      pane. Sixty-four live pane identities remain u64 through renderer work and backing reconciliation; one visible tab
      admits sixteen panes. Ctrl+Shift+T/Enter/backslash/W/Q, Ctrl+Tab, Ctrl+Shift+Tab, Alt+arrows, and
      Ctrl+Shift+arrows provide captured non-repeating CRUD, focus, tab cycling, and divider movement. Candidate
      topology and PTY resize commit together; failed resize restores every earlier terminal. Close submits and waits
      for renderer retirement before process-group teardown, stale slot wakes are cleared, hidden terminals remain live,
      and unavailable panes retain their last backing without joining resize admission.

  - id: labels_and_defaults
    status: accepted
    goal: >-
      Add one small bounded label-cell surface for the top tab bar and apply deliberate Kitty-informed defaults without
      importing Kitty configuration machinery.
    gate: >-
      Labels truncate deterministically, active/focused/unavailable facts remain legible, hit regions match painted
      cells, narrow windows remain valid, and the existing Howl visual language is preserved.
    result: >-
      One platform-independent fixed row formats workspace names into bounded Unicode cells and exact tab hit ranges.
      Active tabs use the Gruvbox orange treatment, inactive tabs use the dark treatment, and '~'/'!' distinguish some
      or all stopped pane terminals. The Wayland loop reserves label pixels above every terminal pane, aggregates hidden
      and visible terminal state, switches tabs on left click, and captures Ctrl+Shift+comma/period tab reordering.
      Labels use the render thread's existing font, mask cache, GLES textures, and generation coalescing; no second text
      or platform owner exists. Narrow rows retain the active tab deterministically and terminal PTY resize remains one
      candidate workspace transaction over the reduced content grid.

  - id: viewport_scrollbar
    status: queued
    goal: >-
      Give every pane independent bounded history navigation, follow behavior, wheel and keyboard scrolling, and a
      proportional scrollbar over the terminal's retained logical history.
    gate: >-
      Live output, resize/reflow, alternate-screen entry and exit, tab switching, pane focus, history eviction, drag,
      wheel bursts, and terminal mouse-reporting mode have explicit deterministic behavior; viewport state never
      changes another pane and never addresses evicted rows.

completion:
  - all model mutation and geometry proofs run without Wayland or GLES
  - the native host demonstrates real tab and split CRUD with practical bounds
  - every visible pane has independent viewport and scrollbar state
  - the full root build, tests, simulation, fuzzing, benchmark, source audit, and protocol validation pass
  - visual behavior is reviewed with operator screenshots only when semantic proof cannot establish the claim
