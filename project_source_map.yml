accepted:
  protocol_coverage.yml: pinned protocol evidence and normalized ownership facts
  protocol_coverage.nu: catalogue normalization, validation, and query commands
  tools/audit_source.sh: maintained-source audit
  tools/source_audit.allow: reviewed sensitive-source sites
  howl-vt/build.zig: VT package build and proof commands
  howl-vt/build.zig.zon: VT package identity and source boundary
  howl-vt/src: terminal parser, semantics, state, input, replies, consequences, and dirty facts
  howl-vt/test: external VT behavior proofs
  howl-vt/test_unit.zig: package-owned VT unit proofs
  howl-vt/simulation: deterministic VT simulations
  howl-vt/simulation_main.zig: simulation entry point
  howl-vt/benchmark: VT benchmark evidence
  howl-vt/benchmark_m7_baseline.zig: benchmark comparison entry point
  howl-pty/build.zig: PTY package build and proofs
  howl-pty/build.zig.zon: PTY package identity and source boundary
  howl-pty/src/howl_pty.zig: Linux PTY transport and child-process lifecycle
  howl-control/build.zig: control package build and direct VT/PTY dependency graph
  howl-control/build.zig.zon: control package identity and source boundary
  howl-control/src/client.zig: identity, endpoint, codec, and bounded request ownership
  howl-control/src/howl_control.zig: optional ID-addressable PTY and VT composition
  howl-control/src/test.zig: control transport, lifecycle, and terminal-operation proofs
  howl-render/build.zig: independently selected text and generated-glyph capability graphs
  howl-render/build.zig.zon: render package identity, owned assets, and licenses
  howl-render/src/root*.zig: curated roots for selected render capabilities
  howl-render/src/native_text.zig: native font loading, shaping, metrics, and alpha rasterization
  howl-render/src/generated*.zig: generated terminal-glyph classification, geometry, and rasterization
  howl-render/src/*_test.zig: selected render capability proofs
  howl-render/testdata: deterministic render test fonts
  howl-render/LICENSES: render-owned asset and native-library provenance

quarantined:
  build.zig: workspace commands still name deleted packages and rejected runtime machinery
  build.zig.zon: workspace path list still names deleted packages
  howl-host: executable evidence only; its surviving noun, topology, API, and source have not been accepted
