accepted:
  .zigversion: exact Zig compiler pin
  build.zig: development-only core curator plus delegated pinned howl-text gates
  build.zig.zon: local core workspace source boundary plus exact howl-text package pin
  howl-vt: terminal semantics, state, protocol input/output, history, graphics, and conformance proofs
  howl-session: opaque canonical PTY/VT session owner and observer-independent lifecycle proofs
  howl-pty: Linux PTY and child-process lifecycle
  protocol_coverage.yml: pinned terminal-protocol census
  protocol_coverage.nu: protocol query and validation surface
  tools/audit_source.sh: maintained-source structural audit
  tools/source_audit.allow: reviewed sensitive Zig sites
  tools/json_logger.zig: reusable bounded JSONL evidence writer

external:
  howl-text: standalone pinned repository owning native font metrics, fallback, shaping, source-cluster identity, glyph lookup, and bounded natural alpha rasterization

experimental:
  howl-client: reusable UI-agnostic native session client engine: connection/framing, interaction state, canonical non-coordinate actions, one lossless rich text_v1 decoder, compact semantic snapshots, and an explicit-lifetime one-allocation coarse semantic view
  howl-cli: native human/agent session client under active proof; compact semantic observation plus canonical input/control, not shell execution or remote transport
  howl-render: backend-neutral rendering experiments consuming howl-text and howl-client.view; terminal Content emits complete Canvas ProducerUpdate state through private caller-bounded shape/atlas caches, and Composer-derived Canvas frames are the Android/iOS-pressure-proven semantic presentation seam; no stable mobile ABI is accepted
  howl-gtk: disposable GTK4/Cairo visual client pressure-testing howl-session and howl-text; not part of the core gate
  howl-flutter: disposable Flutter/Linux visual client pressure-testing the frozen howl-session text/input/geometry contract directly from Dart; not part of the core gate
  howl-vk: Vulkan experiments; not part of the core gate
  howl-wayland: Wayland experiments; not part of the core gate
