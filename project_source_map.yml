accepted:
  .zigversion: exact Zig compiler pin
  build.zig: development-only curator for local core checks and tests
  build.zig.zon: local core workspace source boundary including tracked howl-text
  howl-vt: terminal semantics, state, protocol input/output, history, graphics, and conformance proofs; zero-dependency public root supports advanced embedders that own their own byte/runtime lifecycle
  howl-instance: batteries-included Linux PTY/VT lifetime owner for one concrete terminal occurrence; mutation stays Instance-owned while embedders borrow VT-owned Terminal.Observation; publishes no listener, daemon, Session, or Server identity
  howl-pty: Linux PTY and child-process lifecycle
  howl-text: tracked module owning native font metrics, fallback, shaping, source-cluster identity, glyph lookup, and bounded natural alpha rasterization
  protocol_coverage.yml: pinned terminal-protocol census
  protocol_coverage.nu: protocol query and validation surface
  tools/audit_source.sh: maintained-source structural audit
  tools/source_audit.allow: reviewed sensitive Zig sites
  tools/json_logger.zig: reusable bounded JSONL evidence writer

experimental:
  server-runtime: >-
    foreground `server_runtime` module owning exactly one Server control listener,
    one Server model/control service and bounded cooperative scheduling. Dormant live
    PTYs share one aggregate listener+PTY poll; only control clients or Instance
    client/timer/write work receives direct rotating service turns. Fully quiescent
    exited Instances remain attachable but consume no scheduler work. Exact attach
    transfers the same fd downward
    into HWLS; no per-Instance listener/proxy exists. Runtime owns no terminal grid,
    geometry, pane/split layout, renderer, authentication, discovery, persistence or
    service-supervision policy
  server-client: >-
    native control client for one explicit Server stream. Depends only on
    server_protocol plus shared client-transport; owns status/tree decoding,
    typed Session/Instance CRUD and exact attach. Successful attach consumes the
    control connection and returns the same stream for ordinary HWLS; no proxy,
    listener, Server model, discovery, authentication or supervision ownership
  client-transport: >-
    protocol-neutral native Unix/numeric-IPv4 TCP ordered-stream module shared by
    the Instance client and Server control client. Owns cancellation, descriptor
    lifetime, bounded connect deadlines and transport diagnostics only; no protocol,
    Instance/Session/Server, discovery, authentication or route-selection policy
  server-service: >-
    experimental listener-free `server_service` module. It borrows one Server,
    owns only bounded adopted control streams and long-poll state, decodes
    server_protocol, performs CRUD through exact Server/Session/Instance identities,
    serializes read-only tree state and transfers attach streams directly into the
    selected Instance HWLS service. It owns no listener/address/process, does not
    turn Instances, and owns no routing/authentication/supervision policy
  server-protocol: >-
    experimental pure module `server_protocol` under server. It encodes bounded
    orchestration vocabulary that preserves Server -> Sessions -> Instances:
    Session create carries only logical name, Instance create carries launch policy
    under an exact Session id, and attach identifies exact Session+Instance ids.
    It owns no listener, address, process, authentication or supervision policy
  howl-instance-service: >-
    optional module `howl_instance_service` inside the howl-instance package. It
    borrows one existing Instance and owns only bounded adopted HWLS client streams,
    request decoding, publication scratch and client-local backpressure. It has no
    listener, executable, address, Instance lifetime, Session/Server identity,
    routing, authentication or supervision policy
  server: >-
    optional orchestration module above the Howl terminal family. The exact owner
    tree is Server -> Sessions -> Instances. Session creation never launches a
    terminal; shell/command/cwd/geometry belong only to explicit Instance creation.
    Instance identity is scoped by its owning Session and Session identity by Server.
    Exact Session+Instance routing may hand an already-connected stream into the
    Instance-owned HWLS service. The Server model owns no listener or geometry;
    optional server-runtime owns the single control listener/scheduler only
  howl-client: >-
    reusable UI-agnostic client engine for one explicit Howl Instance interaction
    stream. Owns Unix/numeric-IPv4 TCP carriage, cancellation, bounded framed I/O,
    snapshots/state/actions/search/selection/images/consequences and owned semantic
    views. It owns no PTY, VT, Instance, Session, Server, SSH subprocess, discovery,
    routing, authentication or supervision policy
  howl-cli: >-
    machine-friendly native CLI with two explicit lanes: direct HWLS Instance
    interaction under `howl instance ...`, and Server orchestration under
    `howl server ...` through server-client. Session create carries no launch policy;
    Instance create owns shell/command/cwd/geometry inputs. The CLI owns no PTY, VT,
    Instance, Session, Server, listener, discovery, authentication or supervision
  howl-render: >-
    one shared Terminal Canvas consuming canonical VT Observation directly,
    a validated borrowed howl-client.rich observation, or the owned
    howl-client.view semantic snapshot through one presentation implementation
    plus howl-text; it owns terminal
    pixel geometry, colors/decorations/cursor presentation,
    exact terminal-image resource projection, backend residency reconciliation,
    and final backend-neutral terminal frames; private terminal_glyph_cache owns
    bounded shape/alpha-atlas reuse using howl-text only; there is no generic
    multi-source Canvas compositor or stable mobile ABI
  howl-flutter: >-
    maintained native graphical client canary with a deliberately small app shell.
    The shell may start route-less, persists only explicit labelled Server endpoints
    plus the selected saved Server, and exposes them through a button-opened drawer
    whose edge-drag gesture is disabled. Direct HWLS remains available; Server mode
    performs one validated native tree query, presents Session labels + Instance
    lineage, and on running-Instance selection attaches exact Session+Instance
    identity then transitions the same fd into ordinary HWLS with no proxy. Dart
    keeps no authoritative Server mirror; terminal presentation/input/viewport/
    history/selection/native-size UX remains Instance-only after handoff. Flutter
    owns no PTY, VT, Instance, Session, Server, grid, discovery or supervision;
    outside the core gate
  howl-host: >-
    native Linux Vulkan performance canary with two terminal routes: one in-process
    howl-instance selected by --local, or explicit externally owned Instance streams
    consumed through howl-client; host-owned terminal process creation was removed;
    explicit attached multi-Instance presentation may still pressure layout/rendering,
    but Server/Session orchestration is not implemented here; local/direct paths share
    canonical VT/text/Canvas/Vulkan semantics; outside the core gate
  howl-vk: Vulkan experiments; not part of the core gate
  howl-wayland: Wayland experiments; not part of the core gate
  howl-web: >-
    maintained WebAssembly wire/text/render/browser canary for explicit Howl Instance
    interaction streams; owns browser presentation/input/history/selection and the
    protocol-blind WebSocket carrier gateway, never PTY/VT/Instance/Session/Server
    lifetime. The gateway's current live upstream still expects a caller-supplied
    direct HWLS Instance TCP port; because server-runtime publishes no per-Instance
    listener, integrated live Web is unqualified until the gateway learns exact Server
    attach. Chromium remains the primary fast lane and Safari/Home-Screen the WebKit/PWA
    canary; outside the core gate
  howl-odin: >-
    experimental Odin/SDL3 graphical Instance client with tabs/splits, profiles,
    settings/actions, history/selection and bounded asynchronous workers. Attach
    profiles consume explicit Instance streams. Launch profiles retain shell/command/cwd
    configuration for a future direct local Instance embed but currently fail explicitly;
    the rejected sibling-daemon/socket path is deleted. Outside the core gate
