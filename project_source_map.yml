accepted:
  .zigversion: exact Zig compiler pin
  VERSION: current workspace release marker; Howl project audit requires every current package/client version to match it while versioned embedding examples remain frozen
  build.zig: composes every maintained Zig package check/test graph and forwards exact public child modules and artifacts
  build.zig.zon: complete workspace dependency and distribution source boundary
  .zig-audit.json: required zig-audit schema-2/ruleset-3 scope for the accepted core source and root-check proofs; intentional sharp constructs are acknowledged beside source
  howl-vt: terminal semantics, state, protocol input/output, history, graphics, and conformance proofs; zero-dependency public root supports advanced embedders that own their own byte/runtime lifecycle
  howl-instance: batteries-included platform process-terminal/VT lifetime owner for one concrete terminal occurrence; Linux uses PTY and Windows uses ConPTY; mutation stays Instance-owned while embedders borrow VT-owned Terminal.Observation; publishes no listener, daemon, Session, or Server identity
  howl-pty: platform process-terminal and child-process lifecycle; target-selects Linux PTY or Windows ConPTY
  howl-text: tracked module owning native font metrics, fallback, shaping, source-cluster identity, glyph lookup, bounded natural alpha rasterization, and canonical redistributed font fixture bytes/provenance
  protocol_coverage.yml: pinned terminal-protocol census
  protocol_coverage.nu: protocol query and validation surface
  tools/audit_project.sh: Howl-specific structural, FFI, asset-mirror, and workspace-version audit; generic Zig sharp-edge detection belongs only to zig-audit
  tools/json_logger.zig: reusable bounded JSONL evidence writer

experimental:
  server-runtime: >-
    foreground `server_runtime` module owning exactly one Server control listener,
    one Server model/control service and bounded cooperative scheduling. The Server
    listener, exact control-socket readiness masks and dormant live PTYs share one
    aggregate poll; only Instance-internal client/timer/write work receives direct
    rotating service turns. Fully quiescent
    exited Instances remain attachable but consume no scheduler work. Exact attach
    transfers the same fd downward
    into HWLS; no per-Instance listener/proxy exists. Runtime owns no terminal grid,
    geometry, pane/split layout, renderer, authentication, discovery, persistence or
    service-supervision policy
  server-client: >-
    native control client for one explicit Server stream. Depends only on
    server_protocol plus shared client-transport; owns status/tree decoding,
    typed Session/Instance CRUD and exact attach. Successful attach consumes the
    control connection and returns the same stream for ordinary HWLS; no proxy,
    listener, Server model, discovery, authentication or supervision ownership
  client-transport: >-
    protocol-neutral native Unix/numeric-IPv4 TCP ordered-stream module shared by
    the Instance client and Server control client. Owns cancellation, descriptor
    lifetime, bounded connect deadlines and transport diagnostics only; no protocol,
    Instance/Session/Server, discovery, authentication or route-selection policy.
    Its package check includes its complete ruleset-3 zig-audit source gate
  server-service: >-
    experimental listener-free `server_service` module. It borrows one Server,
    owns only bounded adopted control streams and long-poll state, decodes
    server_protocol, performs CRUD through exact Server/Session/Instance identities,
    serializes read-only tree state and transfers attach streams directly into the
    selected Instance HWLS service. It owns no listener/address/process, does not
    turn Instances, and owns no routing/authentication/supervision policy
  server-protocol: >-
    experimental pure module `server_protocol` under server. It encodes bounded
    orchestration vocabulary that preserves Server -> Sessions -> Instances:
    Session create carries only logical name, Instance create carries launch policy
    under an exact Session id, and attach identifies exact Session+Instance ids.
    It owns no listener, address, process, authentication or supervision policy
  howl-instance-service: >-
    optional module `howl_instance_service` inside the howl-instance package. It
    borrows one existing Instance and owns only bounded adopted HWLS client streams,
    request decoding, publication scratch and client-local backpressure. It has no
    listener, executable, address, Instance lifetime, Session/Server identity,
    routing, authentication or supervision policy
  server: >-
    optional orchestration module above the Howl terminal family. The exact owner
    tree is Server -> Sessions -> Instances. Session creation never launches a
    terminal; shell/command/cwd/geometry belong only to explicit Instance creation.
    Instance identity is scoped by its owning Session and Session identity by Server.
    Exact Session+Instance routing may hand an already-connected stream into the
    Instance-owned HWLS service. The Server model owns no listener or geometry;
    optional server-runtime owns the single control listener/scheduler only
  howl-client: >-
    reusable UI-agnostic client engine for one explicit Howl Instance interaction
    stream. The ordinary howl_client module owns Unix/numeric-IPv4 TCP carriage,
    cancellation, bounded framed I/O, snapshots/state/actions/search/selection/images/
    consequences and owned semantic views while owning no PTY, VT, Instance, Session,
    Server, SSH subprocess, discovery, routing, authentication or supervision policy.
    The separate optional howl_local module owns one listener-free desktop Local
    Instance backed by Linux PTY or Windows ConPTY and admits ordinary HWLS streams;
    importing howl_client never opts a consumer into that process lifetime. Its
    package check includes its complete ruleset-3 zig-audit source gate
  howl-cli: >-
    machine-friendly native CLI with two explicit semantic lanes: Instance interaction
    under `howl instance ...`, and Server orchestration under `howl server ...`.
    Instance interaction accepts either a direct HWLS endpoint or an explicit
    `--server SERVER_ENDPOINT SERVER_ID SESSION_ID INSTANCE_ID` route that consumes exact attach
    before continuing as ordinary HWLS. Session create carries no launch policy;
    Instance create owns shell/command/cwd/geometry inputs. The CLI owns no PTY, VT,
    Instance, Session, Server, listener, discovery, authentication or supervision
  howl-render: >-
    backend-independent terminal-frame projection backed by howl-text. Thin source
    adapters accept canonical VT Observation, validated borrowed howl-client.rich,
    or owned howl-client.view storage while the source-neutral renderer itself
    knows no VT owner, client transport, window system, or graphics backend. The
    default package facade includes both VT and transported-client adapters;
    client_sources=false selects the direct VT facade without constructing
    howl-client, while preserving the same renderer/text type identities. The
    repository distribution root forwards this direct-VT configuration; consumers
    that explicitly need transported-client adapters opt into the child package's
    default facade instead. The
    package separately exposes dependency-free `howl_render_limits` for wire-only
    consumers; its full root re-exports the exact howl-text module instance so
    caller-owned FontSet values preserve Zig type identity. It owns
    terminal pixel geometry, colors/decorations/cursor projection, caller-supplied
    regular/italic/bold/bold-italic face selection with deterministic fallback,
    bounded shape/alpha-atlas caching, exact terminal-image resource projection,
    backend residency reconciliation, and final terminal frames of resource
    uploads/removals plus solid, alpha-mask, and RGBA commands. There is no font
    discovery, generic multi-source compositor, or stable mobile ABI.
  howl-flutter: >-
    maintained native graphical client canary with a deliberately small app shell.
    The shell may start route-less, persists only explicit labelled Server endpoints
    plus the selected saved Server, and exposes them through a button-opened drawer
    whose edge-drag gesture is disabled. Direct HWLS remains available; Server mode
    performs one validated native tree query, presents Session labels + Instance
    lineage, and on running-Instance selection attaches exact Session+Instance
    identity then transitions the same fd into ordinary HWLS with no proxy. Dart
    keeps no authoritative Server mirror; terminal presentation/input/viewport/
    history/selection/native-size UX remains Instance-only after handoff. On Linux
    and Windows the Local route owns one in-process Instance through howl-client's
    listener-free howl_local owner; Android and iOS remain client-only. Flutter owns
    no VT semantics, Session, Server, grid, discovery or supervision; outside the core gate
  howl-host: >-
    native Linux direct-embed performance canary. It owns one in-process howl-instance,
    services its PTY/VT lifetime directly, borrows canonical Terminal.Observation for
    synchronous projection, and renders through howl-text/howl-render/Vulkan/Wayland.
    Its howl-render dependency disables transported client sources. Host has no
    howl-client, client transport, HWLS, server-client, Server, Session, endpoint or
    remote-target route; outside the core gate
  howl-vk: Vulkan experiments; not part of the core gate
  howl-wayland: Wayland experiments; not part of the core gate
  howl-web: >-
    maintained WebAssembly wire/text/render/browser canary. Browser presentation/input/
    history/selection stays client-owned; the loopback WebSocket gateway performs exact
    Server Session+Instance attach through server-client and becomes protocol-blind once
    the same fd enters ordinary HWLS. It owns no PTY/VT/Instance/Session/Server lifetime
    and requires no per-Instance listener. The low-level Node `live` step remains a
    direct-HWLS wire pressure seam only. Chromium is the primary fast lane and
    Safari/Home-Screen the WebKit/PWA canary; outside the core gate
  howl-odin: >-
    experimental Odin/SDL3 graphical Instance client with tabs/splits, profiles,
    settings/actions and history/selection. Direct Attach profiles consume explicit HWLS
    Instance streams; transient `--server` startup uses server-client exact
    Session+Instance attach and then the same transported observer/control/render/
    consequence workers. Local launch profiles instead create one fully presented
    in-process Instance (Linux PTY or Windows ConPTY) claimed by one terminal worker.
    That worker owns PTY/VT service, semantic input, resize, history, search, selection,
    hyperlink/consequence handling and Render production; SDL consumes immutable Render
    publications through NativeCanvas on the graphical thread. Local has no HWLS,
    howl-client observer/control/render workers, listener or service worker. Target
    identity includes route+endpoint+Session+Instance so distinct Server-owned Instances
    never share consequence authority accidentally. Direct Attach and Server-selected
    routes remain non-owning ordinary HWLS attachments. Its desktop font owner resolves
    regular/italic/bold/bold-italic files plus fallbacks and supplies independent
    howl-text FontSets to the shared Render face-family contract. No sibling
    daemon/socket path exists. Outside the core gate

  howl-app: >-
    experimental direct Zig/SDL3 daily-shell replacement beside Odin. Currently
    owns each Local canonical Instance on an exclusive terminal worker, bounded
    typed input/control admission, independent PTY service, synchronized-output
    release and history anchors. SDL consumes immutable Instance Render leases,
    exact resources and commands with no internal C ABI, shared bridge library,
    handle catalogue or serialized Local route. Graphical code cannot obtain the
    live Instance. Application allocations use the Zig SMP allocator; SDL and
    other C dependencies retain their own allocation policy. Bounded tabs/nested
    panes, layout controls and the shared mapping registry/command palette are
    connected, including live pane fonts and display-scale transactions. Original-owner
    mouse gestures, negotiated wheel routing and UI-local IME preedit/caret areas
    use copied terminal facts and accepted immutable frame geometry. A bounded owned
    schema-1..4 saved config supplies startup/profile selection, saved launch recipes,
    mappings and exact font paths. Owned tab/pane recipes survive configuration
    replacement; unavailable attachments and construction failures retain their
    exact route without Local fallback. Eight bounded settings pages share the
    owned config and mapping registry, with search, physical shortcut recording,
    profile/environment/Server editing, themes and atomic live-font transactions.
    Failed saves restore presentation against the unchanged canonical grid/history;
    accepted saves allow the next layout resize. Completed font resets fence
    previous unread publications while preserving accepted leases. The bounded
    installed terminal-family chooser keeps exact face recipes, substring/fuzzy
    search, a sample font, live preview and original-font cancellation through
    the same transaction. Selection/search/scrollbar, desktop input/consequence policy and explicit attachments remain
    to be carried over before daily supersession. Its package check includes
    its complete ruleset-3 source audit.
