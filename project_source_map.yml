accepted:
  protocol_coverage.yml: pinned protocol evidence and normalized ownership facts
  protocol_coverage.nu: catalogue normalization, validation, and query commands
  tools/audit_source.sh: maintained-source audit
  tools/source_audit.allow: reviewed sensitive-source sites
  build.zig: development-only aliases that invoke surviving child build graphs
  build.zig.zon: workspace identity and surviving child source paths
  howl-vt/build.zig: VT package build and proof commands
  howl-vt/build.zig.zon: VT package identity and source boundary
  howl-vt/src: terminal parser, semantics, state, input, replies, consequences, and dirty facts
  howl-vt/src/graphics.zig: bounded terminal image plane, animation frames, placements, deletion, and lifetime
  howl-vt/src/sixel.zig: bounded Sixel measurement and RGBA decoding into the common terminal image plane
  howl-vt/test: external VT behavior proofs
  howl-vt/test_unit.zig: package-owned VT unit proofs
  howl-vt/simulation: deterministic VT simulations
  howl-vt/simulation_main.zig: simulation entry point
  howl-vt/benchmark: VT benchmark evidence
  howl-vt/benchmark_m7_baseline.zig: benchmark comparison entry point
  howl-pty/build.zig: PTY package build and proofs
  howl-pty/build.zig.zon: PTY package identity and source boundary
  howl-pty/src/howl_pty.zig: Linux PTY transport, foreground termios signals, and child-process lifecycle
  howl-control/build.zig: control package build and direct VT/PTY dependency graph
  howl-control/build.zig.zon: control package identity and source boundary
  howl-control/src/client.zig: identity, endpoint, codec, and bounded request ownership
  howl-control/src/howl_control.zig: optional ID-addressable PTY and VT composition with transactional input, signal, and consequence replies
  howl-control/src/test.zig: control transport, lifecycle, and terminal-operation proofs
  howl-render/build.zig: independently selected text and generated-glyph capability graphs
  howl-render/build.zig.zon: render package identity, owned assets, and licenses
  howl-render/src/root*.zig: curated roots for selected render capabilities
  howl-render/src/native_text.zig: native font loading, shaping, metrics, and alpha rasterization
  howl-render/src/generated*.zig: generated terminal-glyph classification, geometry, and rasterization
  howl-render/src/terminal.zig: stateless VT cell and selected-image-frame semantic projection into caller buffers
  howl-render/src/terminal_test.zig: terminal projection bounds, sparse damage, cursor, and rollback proofs
  howl-render/src/terminal_text*.zig: one-run text preparation, raster identity, and native decoration metrics
  howl-render/src/terminal_text_test.zig: selected native and generated run preparation proofs
  howl-render/src/*_test.zig: selected render capability proofs
  howl-render/testdata: deterministic render test fonts
  howl-render/LICENSES: render-owned asset and native-library provenance
  howl-host/build.zig: first-party executable build, install, run, and proof ownership
  howl-host/build.zig.zon: host package identity and direct standalone dependencies
  howl-host/manual-fixtures: bounded compositor-visible development receipts, not installed runtime assets
  howl-host/assets/howl_window_icon.png: exact provenance-tracked logo used by the static graphics manual receipt
  howl-host/src/main.zig: operator shell selection, window entry, serve, and primitive control inspection
  howl-host/src/window.zig: one Wayland window, one Control terminal, input, retained visuals, ordered consequence policy, and lifecycle
  howl-host/src/renderer.zig: one render thread and concrete EGL/GLES cell, image texture, DEC geometry, baseline, and decoration owner
  howl-host/src/viewport.zig: host scroll intent and exact scrollbar paint/hit geometry
  howl-host/src/clipboard.zig: bounded UTF-8 clipboard transfers plus Kitty paste-event parsing and framing
  howl-host/src/drop.zig: bounded Kitty OSC 72 application intent and opaque Wayland MIME identity
  howl-host/src/pointer_shape.zig: bounded primary and alternate OSC 22 stack and query policy
  howl-host/vendor/cursor-shape: generated optional Wayland cursor-shape protocol bindings
  howl-host/vendor/xdg-system-bell: generated optional Wayland system-bell protocol bindings
  howl-host/LICENSES: host native-library and generated-protocol provenance
