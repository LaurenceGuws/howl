accepted:
  .zigversion: exact Zig compiler pin
  build.zig: development-only core curator
  build.zig.zon: core workspace source boundary
  howl-vt: terminal semantics, state, protocol input/output, history, graphics, and conformance proofs
  howl-session: opaque canonical PTY/VT session owner and observer-independent lifecycle proofs
  howl-pty: Linux PTY and child-process lifecycle
  protocol_coverage.yml: pinned terminal-protocol census
  protocol_coverage.nu: protocol query and validation surface
  tools/audit_source.sh: maintained-source structural audit
  tools/source_audit.allow: reviewed sensitive Zig sites
  tools/json_logger.zig: reusable bounded JSONL evidence writer

experimental:
  howl-render: rendering experiments; not part of the core gate
  howl-vk: Vulkan experiments; not part of the core gate
  howl-wayland: Wayland experiments; not part of the core gate
