accepted:
  .zigversion: exact Zig compiler pin
  build.zig: development-only curator for local core checks and tests
  build.zig.zon: local core workspace source boundary including tracked howl-text
  howl-vt: terminal semantics, state, protocol input/output, history, graphics, and conformance proofs
  howl-session: opaque canonical PTY/VT lifetime owner; mutation stays Session-owned while embedders may borrow the canonical VT read-only instead of consuming a mirrored observation facade
  howl-pty: Linux PTY and child-process lifecycle
  howl-text: tracked module owning native font metrics, fallback, shaping, source-cluster identity, glyph lookup, and bounded natural alpha rasterization
  protocol_coverage.yml: pinned terminal-protocol census
  protocol_coverage.nu: protocol query and validation surface
  tools/audit_source.sh: maintained-source structural audit
  tools/source_audit.allow: reviewed sensitive Zig sites
  tools/json_logger.zig: reusable bounded JSONL evidence writer

experimental:
  howl-client: >-
    reusable UI-agnostic native session client engine: portable local
    connection/framing, interaction state, canonical semantic actions including
    mouse, one lossless rich text_v1 / revision-relative text_delta_v2
    decoder, compact semantic snapshots, and an explicit-lifetime
    one-allocation coarse semantic view which resolves cell-style, cursor-shape,
    DEC-line-geometry, and image-placeholder wire encodings for consumers that
    need owned semantic lifetime; synchronous renderers may instead borrow the
    already-validated lossless rich observation directly
  howl-cli: >-
    native human/agent terminal CLI plus first node-local multi-terminal server
    canary; one foreground howl server process can own multiple independent
    PTY+VT terminal endpoints while existing clients attach through the current
    protocol; dynamic registry/control and a single multiplexed attach route are
    intentionally deferred
  howl-render: >-
    one shared Terminal Canvas consuming either a validated borrowed
    howl-client.rich observation or the owned howl-client.view semantic snapshot,
    through one presentation implementation plus howl-text; it owns terminal
    pixel geometry, colors/decorations/cursor presentation,
    exact terminal-image resource projection, backend residency reconciliation,
    and final backend-neutral terminal frames; private terminal_glyph_cache owns
    bounded shape/alpha-atlas reuse using howl-text only; there is no generic
    multi-source Canvas compositor or stable mobile ABI
  howl-flutter: >-
    maintained native visual canary for the Howl client: platform
    input/viewport/history/selection/native-size UX plus an app-private
    version-locked native observer/control binding, exact external-image
    refill/residency, out-of-band observer cancellation, and batched
    final-Canvas backend; its native TCP/client path deliberately coexists with
    the WebSocket/Wasm browser canary so both pressure the same canonical
    session semantics and consume Session-owned animation; Android physical
    path accepted, Linux bundled host proven, iOS native-host semantics
    pressure-proven; iOS owns no PTY/userland; not part of the core gate
  howl-host: >-
    native Linux Vulkan performance canary: attach-only process root over
    externally owned terminal endpoints, concrete Wayland window and
    explicit-sync DMA-BUF presentation, plus a deliberately small host-local
    bounded tab/split topology that prevents single-terminal architecture from
    becoming implicit product policy; canonical Session revisions now stream
    through current client/text/Canvas/Vulkan boundaries with bounded explicit-sync
    ring reuse; its generic fallback borrows the validated rich observation
    directly instead of allocating a second semantic snapshot, while cancellable
    observation and exact terminal-image refill flow into
    transactional Vulkan residency; physical xkb keyboard facts cross a dedicated
    bounded Input owner, while Wayland pointer facts cross Render-owned pane/cell
    projection into the existing semantic mouse action with causal ordered
    button/wheel and coalesced motion; the canonical one-pane path also owns
    mode-aware wheel policy for local retained-history scrollback and DECSET 1007
    alternate-scroll, with history observations isolated from the live long-poll;
    split/tab scrollback remains separate; not part of the core gate
  howl-vk: Vulkan experiments; not part of the core gate
  howl-wayland: Wayland experiments; not part of the core gate
  howl-web: >-
    maintained WebAssembly visual canary alongside Flutter; zero-import bounded
    wire state with semantic text/paste/key/focus/resize/mouse control, native
    presentation-size UX, client-local anchored history and desktop selection
    backed by canonical text extraction, target-built real text/shared terminal
    rendering, exact external-image refill/residency, Session-owned animation
    consumption with no browser frame clock, a loopback-only protocol-blind Zig
    WebSocket gateway with fail-closed admission, an offline-capable PWA shell,
    and an Access-protected Home tunnel edge; Chromium is the primary fast
    acceptance lane while Safari/Home-Screen is the WebKit/PWA platform canary;
    outside the root core gate
  howl-odin: >-
    experimental desktop application in Odin over SDL3 and SDL3_ttf; owns
    native window chrome, tabs/splits, profiles, settings/actions, history and
    selection UI, plus bounded asynchronous client workers. Terminal pixels
    come from shared howl-client views, howl-text and Canvas; local owned
    Sessions and explicit Unix/TCP/SSH attachments retain canonical Session/VT
    ownership. Daily desktop canary; outside the root core gate
