sources:
  build.zig: public package graph and root command surface
  build.zig.zon: published package identity and source boundary
  build/dev.zig: root-only checks, proofs, benchmarks, simulations, and native hosts
  howl-vt/src: current terminal model implementation preserved through source-shape simplification
  protocol_coverage.yml: >-
    root-owned pinned libvterm, iTerm2, and Kitty evidence with normalized support, disposition, owner, and proof facts
  protocol_coverage.nu: >-
    root-owned catalogue normalization, validation, structured queries, and compact human views
  howl-text/src: current text loading, shaping, and rasterization implementation
  howl-frame/src/howl_frame.zig: >-
    complete immutable terminal-local visual frames, bounded publication slots, cumulative cell damage, and exact renderer acknowledgement
  howl-pty/src/howl_pty.zig: >-
    Linux PTY creation, copied launch values, process-group lifecycle, bounded transfer outcomes, resize,
    concurrent cancellation, exact native errors, and cleanup
  howl-control/src/howl_control.zig: >-
    curated PTY and terminal-model lifecycle, optional local endpoint server, shared mutation admission,
    primitive operations, and exact shutdown ownership
  howl-control/src/client.zig: >-
    terminal identity, endpoint facts, private protocol codec, Linux socket mechanics, and one-shot client
  howl-control/src/test.zig: live PTY and semantic control proofs
  howl-host/src: temporary Wayland, xkb, EGL/GLES, layout, and lifecycle copybook pending proven replacement
  howl-host/vendor/xdg-shell: generated Wayland shell protocol source consumed by the native host
  tools/audit_source.sh: maintained non-vendor Zig source policy and reviewed construct uses
