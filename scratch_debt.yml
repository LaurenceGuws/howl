schema: 1
sprint:
  id: error_and_authority_hygiene
  branch: feature/debt_payoff/error_and_authority_hygiene
  status: active
  active_slice: error_owner_review
  active_cohort: howl-host

objective: >-
  Resolve the accepted mechanical syntax records into exact Host owner,
  mutation, retry, cleanup, and proof semantics without changing product code.

questions:
  - id: population
    status: answered
    question: Which exact maintained production symbols propagate, classify, retry, panic on, or deliberately discard errors?
    answer: The accepted AST census records 2887 unique syntax identities; the active semantic cohort is howl-host only.
  - id: silent_disposal
    status: open
    question: Which syntactic non-propagating sites lack an exact expected-error contract or accidentally hide fatal failure?
  - id: owner_boundary
    status: open
    question: At which owner must each retained disposition remain observable, retryable, transactional, or infallible?

active_scope:
  evidence: .zig/work/debt-payoff/error-and-authority-hygiene/owner_review_host.yml
  product_change: forbidden
  population:
    - accepted syntax records from howl-host/src and howl-host/build.zig
    - exact source-local proof owners for those records
  excluded:
    - non-Host package, root-build, and tool records
    - source-audit, comment, and authority corrections until their later slices
    - Git operations

progress:
  state: host_cohort_not_started
  accepted_syntax_inventory:
    files: 62
    records: 2887
    catch: 883
    errdefer: 224
    transparent_try: 1711
    direct_panic: 69
  cohort_order: [howl-host, howl-pty, howl-render, howl-vk, howl-vt, howl-wayland, build_and_tools]
