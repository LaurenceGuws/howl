schema: 1
sprint:
  id: ownership_names
  branch: feature/debt_payoff/ownership_names
  status: active
  active_slice: ownership_inventory

objective: >-
  Inventory names that may conceal ownership before authorizing any rename,
  beginning with howl-host/src/shared.zig and expanding only through exact
  maintained source and build references.

questions:
  - id: shared_owner
    status: open
    question: Which exact retained facts, transitions, descriptors, and consumers does howl-host/src/shared.zig own?
  - id: candidate_census
    status: open
    question: Which other maintained filenames or module aliases are genuine umbrella names rather than concise cohesive owners?
  - id: migration_surface
    status: open
    question: What complete import, build, test, comment, and authority surface would each justified rename require?

active_scope:
  evidence: .zig/work/debt-payoff/ownership-names/ownership_inventory.yml
  product_change: forbidden
  excluded:
    - source renames
    - file splitting
    - package extraction
    - behavior or API changes

progress:
  state: not_started
