objective: >-
  Resolve the eighty-four Logical, transfer, queue, and poll-owner syntax
  records into exact owner, mutation, cleanup, and proof semantics without
  changing product code.

questions:
  - id: population
    status: answered
    question: Which exact maintained production symbols propagate, classify, retry, panic on, or deliberately discard errors?
    answer: The accepted AST census records 2887 unique syntax identities; the active semantic cohort is howl-host only.
  - id: silent_disposal
    status: open
    question: Which syntactic non-propagating sites lack an exact expected-error contract or accidentally hide fatal failure?
  - id: owner_boundary
    status: open
    question: At which owner must each retained disposition remain observable, retryable, transactional, or infallible?

active_scope:
  evidence: .zig/work/debt-payoff/error-and-authority-hygiene/owner_review_host_terminal_logical_and_poll.yml
  product_change: forbidden
  population:
    - records r00444 through r00527 from howl-host/src/terminal.zig
    - PooledTransfer, PoolReservation, WriteQueue, Logical, and poll-owner symbols
    - exact source-local proof owners for those records
  excluded:
    - records r00528 through r00690 until their Runtime and proof-helper subcohorts
    - terminal_handoff.zig and terminal_pool.zig until their file-owned subcohorts
    - non-Host package, root-build, and tool records
    - source-audit, comment, and authority corrections until their later slices
    - Git operations

