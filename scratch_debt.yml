schema: 1
sprint:
  id: stdlib_boundary
  branch: feature/debt_payoff/stdlib_boundary
  status: active
  active_slice: build_boundary_removal

objective: >-
  Remove the now-unneeded host_c Translate-C boundary, generated header
  ownership, and final imports without changing product behavior.

questions:
  - id: eventfd
    status: resolved
    answer: std.os.linux.eventfd with EFD.CLOEXEC | EFD.NONBLOCK and std.os.linux.errno
  - id: descriptor_io
    status: resolved
    answer: typed std.posix.read plus std.posix.system.write and close with owner-controlled errno handling
  - id: poll
    status: resolved
    answer: deadline owners use raw poll while owner-equivalent waits use typed poll
  - id: mapping
    status: resolved
    answer: typed std.posix.mmap and munmap with packed PROT READ and MAP TYPE PRIVATE facts
  - id: build
    status: active
    question: Which host_c imports and Translate-C wiring become unreachable after migration?

