objective: >-
  Define four independently reviewable deletion groups for the five proven
  obsolete declarations, with exact negative censuses, transitive orphan
  closure, validation, and rollback boundaries before product edits begin.

questions:
  - id: population
    status: answered
    question: Which maintained declarations, aliases, wrappers, and build edges appear to have no surviving owner or consumer?
    answer: Four obsolete cohorts cover five private declarations; eight reviewed package, ABI, and build cohorts remain owned.
  - id: consumer_closure
    status: answered
    question: Which product, test, fixture, example, generated, and QAgent boundaries consume each candidate directly or indirectly?
    answer: The accepted interface inventory records every surviving consumer category and exact no-consumer closure for the four obsolete cohorts.
  - id: removal_groups
    status: answered
    question: What is the smallest independently reviewable set of proven removals without replacement machinery?
    answer: One two-declaration Renderer group plus three one-declaration VT groups; no compatibility or replacement surface is required.

active_scope:
  evidence: .zig/work/debt-payoff/obsolete-interfaces/finite_removal_contract.yml
  product_change: evidence_only
  population:
    - howl-host/src/renderer.zig waitCanvasPlan and waitRenderWakeBlocking
    - howl-vt/src/screen.zig advanceIdentity and lineCursorWraps
    - howl-vt/src/unicode_17.zig grapheme_value_count
    - exact post-deletion negative and transitive-orphan censuses
  excluded:
    - product, build, comment, or authority changes during contract construction
    - all eight retained inventory cohorts
    - replacement helpers, aliases, or unrelated cleanup
    - Git operations by the worker

