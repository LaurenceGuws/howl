schema: 1
sprint:
  id: error_and_authority_hygiene
  branch: feature/debt_payoff/error_and_authority_hygiene
  status: active
  active_slice: accepted_corrections
  active_cohort: runtime_corrections
  active_subcohort: visible_cursor_binding_invariant

objective: >-
  Keep accepted-composition identity mismatch observable and prevent partial
  cursor-binding refresh from becoming accepted.

questions:
  - id: population
    status: answered
    question: Which exact maintained production symbols propagate, classify, retry, panic on, or deliberately discard errors?
    answer: >-
      The accepted AST census records 2887 unique syntax identities. Records
      r00001 through r01379 have completed owner review; the remaining census
      stays mechanically complete while manual review narrows to semantic
      disposition and owner-transaction boundaries.
  - id: silent_disposal
    status: answered
    question: Which syntactic non-propagating sites lack an exact expected-error contract or accidentally hide fatal failure?
    answer: >-
      The finite contract selects five source-verified runtime defects: replay
      allocation rollback, configure disposition, cursor replay disposition,
      visible cursor binding invariant suppression, and deadline narrowing.
  - id: owner_boundary
    status: answered
    question: At which owner must each retained disposition remain observable, retryable, transactional, or infallible?
    answer: Each selected correction names its exact product owner and required disposition.

active_scope:
  evidence: .zig/work/debt-payoff/error-and-authority-hygiene/finite_hygiene_contract.yml
  product_change: authorized_narrow_scope
  population:
    - howl-render/src/canvas.zig refreshVisibleCursorBindings
    - accepted composition source identity and cursor frame revision
    - apply, applyCandidate, and setComposition transactional behavior
  excluded:
    - physical deadline correction until its ordered slice
    - Host, VT, Window, Vulkan, and rendering behavior beyond Composer binding refresh
    - source-audit, comment, and unrelated authority corrections
    - Git operations

