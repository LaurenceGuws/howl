schema: 1
sprint:
  id: mixed_ownership_audit
  branch: feature/debt_payoff/mixed_ownership_audit
  status: active
  active_slice: large_file_ownership_census

objective: >-
  Build a queryable evidence index for every maintained production Zig file at
  or above the accepted 1500-physical-line population boundary.

questions:
  - id: owner_graph
    status: open
    question: Which retained states, mutation paths, lifetimes, errors, and consumers define each file's actual owner graph?
  - id: cohesion
    status: open
    question: Which apparent subdomains are source-local mechanics of one owner rather than independent ownership?
  - id: intervention
    status: open
    question: Does any file prove a useful structural boundary strongly enough to justify a later finite contract?

active_scope:
  evidence: .zig/work/debt-payoff/mixed-ownership-audit/large_file_ownership_census.yml
  product_change: forbidden
  population_rule: production Zig files under howl-*/src with physical_lines >= 1500
  expected_files: 16
  excluded:
    - tracked edits beyond accepted sprint authority
    - file splitting or movement
    - package extraction
    - behavior or API changes

progress:
  state: not_started
