schema: 1
sprint:
  id: stdlib_boundary
  branch: feature/debt_payoff/stdlib_boundary
  status: active
  active_slice: poll_and_errno

objective: >-
  Replace translated-C polling while preserving each owner's exact timeout,
  interruption, readiness, and progress semantics.

questions:
  - id: eventfd
    status: resolved
    answer: std.os.linux.eventfd with EFD.CLOEXEC | EFD.NONBLOCK and std.os.linux.errno
  - id: descriptor_io
    status: resolved
    answer: typed std.posix.read plus std.posix.system.write and close with owner-controlled errno handling
  - id: poll
    status: resolved
    answer: deadline owners use std.posix.system.poll and recompute monotonic remaining time after EINTR; indefinite and fixed non-deadline waits may use std.posix.poll
  - id: mapping
    status: deferred
    question: Which std.posix mmap/munmap signatures preserve pointer, flags, failure, and cleanup semantics?
  - id: build
    status: deferred
    question: Which host_c imports and Translate-C wiring become unreachable after migration?

