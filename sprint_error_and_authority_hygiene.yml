schema: 1
sprint:
  id: error_and_authority_hygiene
  marathon: debt_payoff
  version: 0.1.5-dev
  branch: feature/debt_payoff/error_and_authority_hygiene
  status: review_ready
  objective: >-
    Make every maintained error disposition and sensitive-source admission
    explicit, and remove stale comments or tracked authority without changing
    product capability or inventing structural work.

scope:
  owned:
    - production error propagation, expected rejection, retry, cleanup, panic, and deliberate discard
    - every tools/source_audit.allow admission and its exact surviving source construct
    - file and public-symbol comments whose ownership or behavior claims disagree with maintained source
    - tracked authority entries that describe removed, renamed, completed, or unowned work
  excluded:
    - terminal features, protocol expansion, performance policy, and GUI behavior
    - package extraction, broad file splitting, or ownership redesign
    - error-policy changes inferred from style alone
    - compatibility aliases or speculative documentation

invariants:
  - Every discarded error has one named owner, exact expected condition, and deterministic disposition.
  - Unexpected runtime, invariant, capacity, identity, and cleanup failures are not silently converted into progress.
  - Source-audit admissions survive only while the exact justified construct exists at the recorded owner.
  - Comments and tracked authority describe current accepted source, not intended or historical behavior.
  - Evidence distinguishes stale vocabulary from a real ownership or behavior defect.
  - Corrections are finite, behavior-preserving unless an exact error contract proves otherwise, and independently reviewable.

slices:
  - id: error_disposition_inventory
    status: accepted
    product_change: none
    output: complete mechanical census of maintained error-handling syntax excluding explicit test declarations; proof-only helper reachability is resolved by owner review
    accepted_facts:
      - Pinned std.zig.Ast extraction records 2887 unique token identities across 62 maintained source, build, and tool files.
      - The census contains 883 catch, 224 errdefer, 1711 transparent try, and 69 direct panic records.
      - Explicit test declarations, historical examples, test/proof files, generated sources, optional orelse, and catch-owned panic tokens are excluded.
      - JSONL and YAML reproduce byte-for-byte through the retained ignored Zig extractor and Nushell summarizer.
  - id: error_owner_review
    status: accepted
    product_change: none
    output: >-
      Complete mechanical identity coverage plus exact owner-group review of
      discarded, translated, retried, substituted, panic, cleanup, partial-
      mutation, and post-acceptance semantics. Unchanged transparent
      propagation remains indexed without duplicated per-site prose.
  - id: source_audit_admission_review
    status: accepted
    product_change: none
    output: every allow-list admission matched to one current construct, owner, and justification
    accepted_facts:
      - All 73 allow rows match exact maintained source occurrences; 72 source texts are unique because one cursor-refresh admission intentionally covers two distinct owner sites.
      - The retained population is 52 anyopaque ABI/context sites, 19 deliberate discards, and 2 compile-time anytype generics.
      - The three cursor-refresh discards retain the refreshed target after committed resize and unconditionally dirty the owner; only the change-reporting boolean is discarded.
      - Wayland callbacks, Vulkan push constants, and allocator callbacks preserve exact foreign or standard-library ABI context types.
      - VT test-root imports deliberately trigger sixteen test cohorts, while the ligature classifier and JSONL writer use compile-time generic values without runtime type erasure.
      - No allow row is stale, redundant, widened, or removable without changing its maintained owner boundary.
  - id: comment_and_authority_review
    status: accepted
    product_change: none
    output: exact stale comment and tracked-authority findings, including the deferred Renderer module-comment mismatch
    accepted_facts:
      - Ten stale vocabulary claims were corrected across the Renderer file contract and three tracked authorities; no conflicting retained owner or behavior defect was found.
      - Renderer documentation now names its Host input, session, terminal, Composer, replay, deadline, Vulkan, and DRM orchestration boundary.
      - Local bounded tabs and panes are described as a multi-pane runtime; detached, remote, or cooperative multiplexer sessions remain deferred.
      - Cursor replay and trail presentation are accepted capability rather than active redesign work.
      - Completed stdlib, ownership-name, mixed-ownership, generated-C, build-wiring, error-disposition, and source-audit work no longer appears as current active scope.
  - id: finite_hygiene_contract
    status: accepted
    product_change: none
    output: accepted no-change findings plus bounded correction groups for proven debt
  - id: accepted_corrections
    status: accepted
    output: only contract-approved error, admission, comment, or authority corrections
    accepted_facts:
      - ReplayState partial allocation failure unwinds every acquired cohort resource in reverse order.
      - Consumed configure replacement survives retryable lifecycle pressure without duplicate font publication.
      - Cursor replay distinguishes rejectable overlay facts from fatal accepted-base, capacity, backend, and post-submit failures.
      - Visible cursor binding refresh rejects accepted composition identity mismatch before mutation.
      - Physical deadline addition and narrowing map overflow to error.Clock without changing representable values.

acceptance:
  - Every maintained semantic error disposition is classified with exact owner and behavior evidence; unchanged transparent propagation remains mechanically indexed.
  - Every source-audit admission is retained, narrowed, or removed with exact source proof.
  - Stale comments and authorities are corrected without donating new architecture.
  - Expected errors remain transactional and fatal errors remain observable at their owner boundary.
  - Affected package and workspace checks/tests pass in every optimization mode.
  - Strict YAML, source audit, protocol validation, formatting, and git diff checks pass.
