rules:
  - Every retained character buys capability, correctness, clarity, or deterministic evidence.
  - Prefer one direct code lane; abstractions must reduce total complexity rather than relocate it.
  - Terminal protocol behavior follows primary evidence and exact owned state.
  - Inputs, retained state, queues, payloads, grids, and consequences have explicit bounds.
  - Construction failure and deinitialization release completed resources in reverse ownership order.
  - usize is for indexes, lengths, capacities, byte counts, and standard-library boundaries; domain quantities use sized types.
  - VT owns terminal semantics, history, images, input encoding, replies, and protocol consequences; it owns no observer or renderer publication queue.
  - VT owns retained terminal image/frame/animation semantics. Instance supplies caller-monotonic service time and the next wake deadline for Instance-owned terminals; a direct VT embedder supplies that scheduling itself. Renderers own no independent terminal-animation clock.
  - VT exposes canonical semantic observation, graphics identity, geometry, and exact resource generations; Terminal owners keep the direct mutable engine while Instance may lend only VT-owned opaque Terminal.Observation and must not mirror that observation API. Renderer/Canvas/backend residency remains presentation state outside VT and Instance.
  - VT projected history and the visible screen are the sole cell authority for future reflow; rows older than history_row_base never return, while bounded logical-output evidence remains independent.
  - Instance owns one canonical PTY and VT, ordered process I/O, explicit geometry, signals, child lifetime, and deterministic headless consequence policy.
  - Instance exposes no mutable PTY or VT escape hatch; its public handle is opaque and terminal(instance) returns only *const Terminal.Observation for synchronous observation.
  - Instance is the batteries-included Linux PTY+VT owner, not a mandatory wrapper around howl-vt and not a Session or Server. An advanced embedder may own its byte transport, process/runtime lifetime, scheduling, and mutable Terminal directly while preserving VT's semantic and bounded-state contracts.
  - An observer may disconnect, stall, or disappear without blocking canonical Instance progress.
  - PTY owns Linux descriptors, child process groups, native resize, signals, and cleanup.
  - Attaching an observer never resizes the PTY; geometry changes are explicit serialized Instance mutations.
  - Rendering, UI, platform lifecycle, networking, authentication, and Session/Server orchestration remain outside VT, PTY, and Instance.
  - Terminal Canvas may synchronously consume VT-owned Terminal.Observation, a validated howl-client rich observation, or the owned client.view form for consumers that need independent lifetime; no borrowed source may outlive the update call. All storage forms share one presentation implementation and must prove final-frame equivalence.
  - Each core package owns its direct build identity, dependencies, native interfaces, and proofs.
  - Every concrete core artifact uses the tracked Zig compiler with self-hosted code generation and linking.
  - Tests prove behavior, failure, cleanup, bounds, and ownership rather than rejected architecture.
  - Sensitive Zig constructs appear only at exact reviewed sites recorded by the source audit.
  - Session and Server are optional orchestration nouns above the terminal family. The required hierarchy is Server -> Sessions -> Instances; an Instance is never a Session.
  - A local VT, PTY, or Instance embedder must not import or know about Session/Server machinery.
  - Server owns orchestration and one control-listener runtime when hosted; it owns no terminal grid, rows/columns, cell-pixel lattice, pane/split layout, renderer state, or surface composition.
  - Session is lifecycle identity/labeling above Instances; it owns no PTY, VT, HWLS service, geometry, renderer, pane, or surface state.
  - Each Instance owns one singular canonical PTY/VT geometry. A client may compose multiple Instances on one surface, but any shared app layout remains presentation state and only results in explicit per-Instance geometry mutations.
