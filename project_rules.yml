rules:
  - Every retained character buys capability, correctness, clarity, or deterministic evidence.
  - Prefer one direct code lane; abstractions must reduce total complexity rather than relocate it.
  - Terminal protocol behavior follows primary evidence and exact owned state.
  - Inputs, retained state, queues, payloads, grids, and consequences have explicit bounds.
  - Construction failure and deinitialization release completed resources in reverse ownership order.
  - usize is for indexes, lengths, capacities, byte counts, and standard-library boundaries; domain quantities use sized types.
  - VT owns terminal semantics, history, images, input encoding, replies, and protocol consequences; it owns no observer or renderer publication queue.
  - VT owns retained terminal image/frame/animation semantics. Its direct embedder supplies caller-monotonic service time and the next wake deadline. Presentation has no independent terminal-animation clock.
  - VT exposes canonical semantic observation, graphics identity, geometry, and exact resource generations. Terminal owners keep the direct mutable engine; backend residency remains presentation state, never VT semantics.
  - VT projected history and the visible screen are the sole cell authority for future reflow; rows older than history_row_base never return, while bounded logical-output evidence remains independent.
  - The local host owns ordered process I/O, explicit geometry, signals, child lifetime, and bounded retained or discard consequence policy above PTY and VT.
  - The local host owns its one mutable VT Terminal directly; no shared wrapper may mirror canonical state or make output dependent on observers.
  - An advanced embedder may own its byte transport, process/runtime lifetime, scheduling, and mutable Terminal directly while preserving VT's semantic and bounded-state contracts.
  - An observer may disconnect, stall, or disappear without blocking canonical VT progress.
  - The platform process-terminal owner owns native descriptors or handles, child process/control lifetime, resize, signals, and cleanup.
  - Attaching an observer never resizes the platform process-terminal transport; geometry changes are explicit serialized host mutations.
  - Optional VT-owned direct output borrows Text support and exposes immutable frames to the host GPU backend. UI, GPU backend, window/platform lifecycle, networking, authentication, and Session/Server orchestration remain outside VT, PTY, and Text.
  - Presentation may consume VT-owned Terminal.Observation synchronously, but borrowed state never outlives its update and no Server wire or client ownership enters the local graph.
  - Each core package owns its direct build identity, dependencies, native interfaces, and proofs.
  - Every concrete core artifact uses the tracked Zig compiler with self-hosted code generation and linking.
  - Tests prove behavior, failure, cleanup, bounds, and ownership rather than rejected architecture.
  - Sensitive Zig constructs appear only at exact reviewed sites recorded by the source audit.
  - A local VT, PTY, or Text embedder must not import or know about Session/Server machinery.
  - VT exports only the pure OSC 52 clipboard grammar to downstream observation codecs. Payload serialization, cache and transport are owned outside this repository; local VT, PTY, Text and App paths never import them.
  - Each local terminal occurrence has singular canonical process-terminal/VT geometry. A host may compose multiple occurrences on one surface; layout remains host presentation state and induces explicit per-terminal geometry mutations.
