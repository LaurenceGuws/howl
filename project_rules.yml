rules:
  - Every retained character buys capability, correctness, clarity, or deterministic evidence.
  - Terminal protocol behavior follows primary evidence and exact owned facts.
  - Implemented support, residual disposition, and concrete owner remain orthogonal protocol-catalogue facts.
  - Every module allocation uses an explicit caller-provided allocator.
  - Inputs, retained state, queues, payloads, grids, and platform consequences have explicit bounds.
  - Construction failure and deinitialization release completed resources in reverse ownership order.
  - usize represents indexes, lengths, capacities, byte counts, and standard-library boundaries.
  - Domain quantities use types sized for their meaning.
  - VT owns terminal semantics, state, dirty facts, input encoding, replies, and terminal consequences.
  - PTY owns Linux transport, descriptors, child processes, cancellation, and cleanup.
  - Control optionally composes PTY and VT through bounded operations and has no rendering relation.
  - Render owns backend-neutral terminal visual knowledge and plain values without runtime policy.
  - Howl-host owns its concrete Wayland, EGL/GLES, input, retained-visual, render-thread, and presentation lifecycle.
  - Each surviving library package exposes a curated Zig module and owns its direct build and native dependencies.
  - The root workspace reconstructs no child module, dependency, native fact, proof, executable, or artifact.
  - Tests prove behavior, failure, cleanup, bounds, and deterministic semantics rather than rejected architecture.
  - Sensitive Zig constructs appear only at exact reviewed sites recorded by the source audit.
