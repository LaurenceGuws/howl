schema: 1
sprint:
  id: presentation_state
  marathon: runtime_hot_paths
  version: 0.1.6-dev
  status: accepted_commit_pending
  objective: >-
    Retain exactly one latest ready frame in shared presentation state and let
    Window select it only at the Window-owned Wayland pacing boundary.

implemented_shape:
  shared_owner:
    module: howl-host/src/presentation_state.zig
    type: presentation_state.State
    owns:
      - copied input, configuration, feedback, offer, retirement, release, stop, stopped, and first-failure state
      - exactly one latest ready frame
      - one nonresetting monotonic ready-frame revision high-water
      - presentation-state readiness from Render to Window
      - the preserved Window-to-Render directional descriptor
    operations:
      - State.updateLatestReadyFrame
      - State.takeLatestReadyFrame
      - State.cancelLatestReadyFrame
      - State.hasLatestReadyFrame
      - State.frameReadyFd
      - State.drainFrameReady
  render_thread:
    entry: howl-host/src/renderer.zig renderer.run
    owns:
      - Composer and Canvas composition
      - Vulkan and DRM execution
      - three active rendered-image slots
      - three staged replacement-generation rendered-image slots
      - Render slot ownership
      - exact superseded-frame reclamation
    slot_ownership:
      - Render reusable
      - Render rendering
      - submitted-render-fatal
      - latest ready frame
      - Window-taken
      - compositor-owned
      - unpublished-reclaiming
      - unpublished-reclaim-fatal
      - superseded-reclaiming
      - superseded-reclaim-fatal
      - submitted-unpublished-fatal
    producers:
      - startup initialization
      - replacement-ring initialization
      - ordinary redraw
      - cursor replay
    rules:
      - all producers use one latest-ready-frame protocol
      - startup initializes and physically reclaims all three slots then exposes only the accepted fourth product render
      - replacement physically reclaims all three initialization slots then exposes only a fourth product-background render
      - initialization renders use product background only; no diagnostic clear survives startup rendering
      - six-point lifecycle geometry consumes the full configured surface within the explicit 65,536-cell terminal bound
      - a returned superseded frame requires a Render-owned acquire-to-release timeline transfer but no compositor release
      - a Window-taken frame requires its exact compositor release point
      - post-submit shared-publication failure is fatal and never ordinary immediate reuse
      - render failures through queue submission restore reusable; every failure after successful submission retains exact identity in submitted-render-fatal
      - shared supersession and cancellation install superseded-reclaiming before fallible physical reclaim; failure enters superseded-reclaim-fatal
  window_thread:
    entry: howl-host/src/window.zig window.run
    owns:
      - Wayland dispatch and input callbacks
      - frame-callback pacing
      - latest-frame selection
      - DMA-BUF attachment
      - wl_surface_commit
      - presentation recording
    pacing:
      - Wayland pacing ready
      - Window presenting
      - Window done presenting
    rules:
      - wl_surface_commit enters and retains Window presenting
      - frameDone establishes Window done presenting
      - compositor release is independent from Window pacing
      - a taken frame cannot be superseded
  terminal_runtime:
    ownership_status: superseded by active terminal_render_foundation sprint
    capacity_status: retained terminal cell bound is 65,536

window_blocking_loop:
  - condition: newer render state and Wayland pacing ready
    action: take and present the latest ready frame
  - condition: newer render state and Wayland pacing blocked
    action: block on Wayland only
  - condition: no newer render state
    action:
      - check shared latest state
      - drain stale presentation-state readiness when empty
      - recheck shared latest state
      - block on Wayland plus presentation-state readiness only when still empty

finite_bounds:
  rendered_image_slots: 3
  retained_latest_ready_frames: 1
  retained_window_catchup_frames: 0
  post_startup_allocations: 0
  State_size: 19232
  State_alignment: 8
  latest_ready_storage: 48
  monotonic_revision_storage: 8
  render_slot_ownership_storage: 3
  staged_and_active_slot_ownership_storage: 6
  window_pacing_storage: 1
  migration_peak_shared_plus_control_state: 38535

proof_ownership:
  shared_state:
    path: howl-host/test/test.zig
    cases: [P001, P002, P003, P004, P010, P014, P017, P018, P019]
  Window:
    path: howl-host/src/window.zig
    cases: [P007, P012, P013, P017, P018, P019]
  Render:
    path: howl-host/src/renderer.zig
    cases: [P003, P005, P006, P007, P008, P015, P016, P020, P021, physical_DRM_timeline_reclaim, accepted_startup_and_cast_runtime]
  cross_owner:
    cases: [P004, P007, P009, P011]
  contract: .zig/work/runtime-hot-path/presentation-state/finite_contract.yml
  layout_source: .zig/work/runtime-hot-path/presentation-state/layout_receipt.zig
  layout_output: .zig/work/runtime-hot-path/presentation-state/layout_receipt.txt

preserved_contracts:
  - Window remains the sole Wayland owner.
  - Render remains the sole Vulkan, DRM, Composer, Canvas-composition, and rendered-image-slot owner.
  - Three rendered-image slots and existing GPU memory bounds remain unchanged.
  - Input, configure, feedback, ring offer, retirement, release, stop, and first-failure ownership remain unchanged.
  - Presentation-state acceptance did not itself change Terminal handoff, VT, Canvas, or Composer behavior; later terminal_render_foundation work owns the terminal redesign.
  - Ready-frame revisions remain nonzero, monotonic, generation-qualified, and stale-safe.
  - No timeout, synthetic delay, or post-startup allocation was introduced.
  - Six-point terminal geometry consumes the full configured surface within the explicit 65,536-cell bound.

source_gate:
  required:
    - exactly one presentation_state.State
    - exactly one retained latest ready frame
    - no compatibility module
    - no retained Window catch-up presentation
    - one protocol for startup, replacement, ordinary redraw, and cursor replay
  forbidden:
    - an ordered Render-to-Window presentation collection
    - multiple retained latest ready frames
    - Window ownership of Vulkan or rendered-image-slot reuse
    - Render ownership of Wayland pacing or surface commit

validation_gate:
  required:
    - Host check and test in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
    - workspace check and test in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
    - strict duplicate-key YAML validation
    - source audit and protocol validation
    - formatting and git diff --check
  excluded_from_worker_validation:
    - launching Howl; operator runtime acceptance is recorded separately
    - changing the accepted cast or measurement receipts

exclusions:
  - no terminal-thread or terminal-handoff redesign within the closed presentation_state sprint
  - no VT, projection, Content, Canvas, or Composer behavior change
  - no GPU batching, damage-region, atlas, glyph-cache, or scroll optimization
  - no timer-based polling or synthetic render delay
  - no public product configuration
