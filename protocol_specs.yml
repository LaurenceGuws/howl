    - id: mc
      section: 8.3.82
      level: defined
      wire: CSI Ps i
      rule: MEDIA COPY (MC); ECMA-48 standardized control function, CSI form (source page 50).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-2852648ca5
        source_line: 1041
        wire: CSI Ps i
      source_specific_parameters:
      - selectors:
        - 0
        - 4
        - 5
        ecma48: Ps=0 initiates transfer to a primary auxiliary device; Ps=4 stops and Ps=5 starts relaying received data to that device.
        xterm: Ps=0 prints the screen; Ps=4 disables and Ps=5 enables printer-controller mode.
        classification: same Media Copy family with xterm printer-oriented auxiliary-device realization
        catalogue: xterm_ctlseqs
        entry_id: csi-2852648ca5
        source_line: 1041
      - selectors:
        - 1
        - 2
        - 3
        - 6
        - 7
        ecma48: 'Respectively: initiate transfer from primary; transfer to/from secondary; stop/start relay to secondary auxiliary device.'
        xterm: Not documented in the pinned xterm MC entry; omission is not evidence of a particular no-op effect.
        classification: ECMA-48 parameter coverage retained without inventing xterm behavior
        catalogue: xterm_ctlseqs
        entry_id: csi-2852648ca5
        source_line: 1041
      - selectors:
        - 10
        - 11
        ecma48: Not defined in ECMA-48 fifth-edition MC.
        xterm: Ps=10 outputs an HTML screen dump; Ps=11 outputs an SVG screen dump.
        classification: xterm-origin output-format extensions in MC, not distinct command identities
        catalogue: xterm_ctlseqs
        entry_id: csi-2852648ca5
        source_line: 1041
      private_variants:
      - clause: dec_vt240.media-copy-dec-private
        wire: CSI ? Ps i
        description: DEC-private media-copy parameter family; not the unprefixed ECMA-48 wire form.
      xterm_selector_lines:
        '0': 1042
        '4': 1043
        '5': 1044
        '10': 1045
        '11': 1046
