  dec_vt520:
    title: VT520/VT525 Video Terminal Programmer Information
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: July 1994; EK-VT520-RM. A01
    url: https://vt100.net/dec/ek-vt520-rm.pdf
    snapshot_sha256: 1df930cc62e87775555abd67046c53e378445ae91acb9292496b4188a899199b
    scope: Selected original VT500 controls and color hardware profiles, not a complete repertoire.
    clauses:
    - id: cursor-style
      section: 5-127 DECSCUSR
      level: defined
      wire: CSI Ps SP q
      rule: Original selectors 0/1/omitted blinking block,2 steady block,3 blinking underline,4 steady underline. Applies
        only when cursor is enabled; DECTCEM controls visibility.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-8c99edd0c8
        source_line: 1539
        wire: CSI Ps SP q
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4945-4990
      parameter_extensions:
      - source: xterm ctlseqs lines 1546-1547; pinned charproc.c:4975-4982
        selectors:
          '5': blinking bar
          '6': steady bar
        note: xterm-authored additions, not original DEC values.
      test_locations:
      - file: howl-vt/test/unit/terminal_cursor_test.zig
        test: 'terminal cursor: DECSCUSR restores the canonical default and rejects unsupported values'
        relation: wire-family
        legacy_records:
        - libvterm.csi.decscusr
        - iterm2.csi.decscusr
      - file: howl-vt/test/unit/terminal_cursor_test.zig
        test: 'terminal cursor: pinned Kitty DECSCUSR rejects excess operands before changing appearance'
        relation: wire-family
        legacy_records:
        - kitty.csi.decscusr
    - id: no-clear-column-change
      section: 5-74 DECNCSM
      level: defined
      wire: CSI ? 95 h / CSI ? 95 l
      rule: SET suppresses clearing screen on column-mode change (DECCOLM or SET-UP); RESET enables clearing. Does not alter
        DECSCPP semantics.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-95-h-line-963
        source_line: 963
        wire: CSI ? 95 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-95-l-line-1110
        source_line: 1110
        wire: CSI ? 95 l
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:7795-7799,7553-7574
      related_commands:
      - dec_vt420.column-mode
      - dec_vt420.columns-per-page
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DEC column modes own permission preservation query save and reset lifetime
        relation: wire-family
        legacy_records:
        - iterm2.mode.decncsm
    - id: tab-every-eight-columns
      section: 5-149 DECST8C
      level: defined
      wire: CSI ? 5 W
      rule: Clear all existing tab stops then install stops every eight columns starting at one-based column 9. Distinct from
        TBC clear and HTS current-position set.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5883-5896
      source_note: Pinned xterm accepts selector 5 and also <=0, installs stops only through visible maximum column; original
        printed command explicitly selects 5.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: tab stops remain bank local and Kitty DECST8C resets only the active bank'
        relation: wire-family
        legacy_records:
        - kitty.csi.reset_tabs
    - id: assign-color
      section: 5-16 DECAC
      level: defined
      wire: CSI Ps1 ; Ps2 ; Ps3 , |
      rule: Select normal-text or frame colors in ANSI SGR color mode. Ps1=1 normal text,2 window frame; foreground/background
        indices each 0..15. Normal colors are default foreground/background; frame foreground also applies to session icons
        and keyboard indicator line. Item selectable in status-string report.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-32051dd066
        source_line: 1945
        wire: CSI Ps ; Pf ; Pb , |
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5929-5961
      source_note: Pinned xterm gates terminal_id>=525, implements item 1 via ANSI palette and default fg/bg, explicitly leaves
        item 2 unimplemented.
    - id: alternate-text-color
      section: 5-22 DECATC
      level: defined
      wire: CSI Ps1 ; Ps2 ; Ps3 , }
      rule: Assign foreground/background indices 0..15 to one of sixteen attribute combinations. Selector is enumeration,
        not the numeric SGR mask. DECRQSS may select that combination for reporting.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-31ba47f36d
        source_line: 1956
        wire: CSI Ps ; Pf ; Pb , }
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5963-5979
      selectors:
        '0': normal
        '1': bold
        '2': reverse
        '3': underline
        '4': blink
        '5': bold reverse
        '6': bold underline
        '7': bold blink
        '8': reverse underline
        '9': reverse blink
        '10': underline blink
        '11': bold reverse underline
        '12': bold reverse blink
        '13': bold underline blink
        '14': reverse underline blink
        '15': bold reverse underline blink
      related_command: dec_vt520.color-lookup-table
      source_note: Pinned xterm accepts and stores indexed pair for terminal_id>=525; actual display mapping is not established
        by storage alone.
    - id: color-lookup-table
      section: 5-151 DECSTGLT
      level: defined
      wire: CSI Ps ) {
      rule: 'Select color mapping: 0 mono/gray,1 alternate colors from text attributes,2 alternate color (second profile;
        table leaves description blank),3 ANSI SGR colors (default). Not an RGB setter.'
      source_note: Original color lookup table gates relationship to DECATC; full distinction between modes 1 and 2 needs
        SET-UP chapter review before implementation assessment.
    - id: warning-bell-volume
      section: 5-154 DECSWBV (PDF page 308, visually checked)
      level: defined
      wire: CSI Ps SP t
      rule: 'Select warning bell volume for errors and Control-G. Original table: 1 off; 2,3,4 low; 5,5,7,8,0 or omitted high
        (default). Duplicate 5 and missing 6 are present in the published table, not an extraction error. No inferred rule for
        6.'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6421-6446
      accepted_reconciliations:
      - decswbv-zero-volume-polarity
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-a6bef4a803
        wire: CSI Ps SP t
        source_line: 1711
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decswbv-zero-volume-polarity
          reason: VT520/525 July 1994 p.5-154 gives 0/omitted high; table prints 5 twice and omits 6. Pinned xterm zero/default
            falls through to off and 5..8 high.
    - id: margin-bell-volume
      section: 5-138 DECSMBV (PDF page 292, visually checked)
      level: defined
      wire: CSI Ps SP u
      rule: 'Select margin bell volume near right margin. Original table: 0/1/omitted off (default); 2..4 low; 5..8 high. Separate
        from warning bell.'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6448-6475
      accepted_reconciliations:
      - decsmbv-zero-volume-polarity
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f8ef357623
        wire: CSI Ps SP u
        source_line: 1730
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decsmbv-zero-volume-polarity
          reason: VT520/525 July 1994 p.5-138 gives 0/omitted off. Pinned xterm zero/default falls into high branch.
  dec_locator:
    title: Locator Input Model for ANSI Terminals (sixth revision)
    author: Peter Sichel, Digital Equipment Corporation Video Architecture
    authority: protocol-author-memorandum
    revision: 23 June 1989; sixth revision, author-circulated memorandum reproduced in HTML; formal publication not established
    url: https://www.vt100.net/shuford/terminal/dec_vt_mouse.html
    snapshot_sha256: 51676133c3e471e0de9fe27f0a02dbd7ee911d56fd131f33a0b21ea2988891f1
    scope: Original author locator input model; text locator controls and reports only. Distinguish proposed hardware model
      from later implemented profiles.
    clauses:
    - id: enable-locator-reporting
      section: Enabling Locator Reporting (DECELR)
      level: defined
      wire: CSI Ps ; Pu ' z
      rule: Ps 0/default disables,1 enables,2 one shot (disable after next report). Pu omitted/0 or 2 character cells,1 device
        physical pixels. Enable tracks independent input cursor; DECELR cancels prior filter rectangle. Pointer events are host
        input, not text cursor movement.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-fa2af1e6b1
        source_line: 1833
        wire: CSI Ps ; Pu ' z
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5531-5553; button.c:785-808
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator requests reply unavailable, then current position, then disable one-shot
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pointer reporting interest includes DEC locator and leaves one-shot consumption canonical
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator query distinguishes active undefined and inactive without consuming a filter
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator undefined query preserves one-shot and filter under reply pressure
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator simultaneous report rollback retains exact prior prefix
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
    - id: select-locator-events
      section: Selecting Locator Events (DECSLE)
      level: defined
      wire: CSI Pm ' {
      rule: 'Apply one or more selectors: 0 default explicit requests only and cancel filter;1/2 enable/disable button down;3/4
        enable/disable button up. Multiple selectors select transitions, not a mouse encoding.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-091043d69e
        source_line: 1850
        wire: CSI Pm ' {
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5555-5579
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator button and filter events append DECLRP
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator event selection admits only the originating single intermediate
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator undefined query preserves one-shot and filter under reply pressure
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
    - id: locator-report
      section: Locator Position Reporting (DECLRP)
      level: defined
      wire: CSI Pe ; Pb ; Pr ; Pc [ ; Pp ] & w
      rule: Report event and simultaneous button state with decimal page coordinates. Pe=0 unavailable,1 explicit request,2/3
        left down/up,4/5 middle,6/7 right,8/9 fourth,10 outside filter. Pb mask 1 right,2 middle,4 left,8 fourth; 0 none. Undefined
        row/column are omitted; page may be omitted for page 1. Original input events are queued with keystrokes in arrival
        order, one report per event; simultaneous events sorted by increasing Pe; original input silo minimum 9 positions and
        locks input when full. Inactive sessions do not receive active-session pointer state.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: button.c:785-808,811-1016
      source_note: Physical pixel vs cell units are chosen by DECELR. Pinned xterm reports without page and has explicit unavailable
        event-only response; this is not a proof of original focus, origin, ordering or queue behavior.
      accepted_reconciliations:
      - locator-query-undefined-position-and-filter-lifetime
      test_locations:
      - file: howl-vt/src/locator.zig
        test: locator emits exact cell and pixel reports
        relation: protocol-family
      - file: howl-vt/src/locator.zig
        test: locator one-based pixel reports preserve the full u32 coordinate domain
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator query distinguishes active undefined and inactive without consuming a filter
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator undefined query preserves one-shot and filter under reply pressure
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator event selection admits only the originating single intermediate
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator filters trigger immediately or on selected coordinate movement
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator filter and button reports are ordered within a sample
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator filter undefined entry and immediate report rollback
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator simultaneous report rollback retains exact prior prefix
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
    - id: enable-filter-rectangle
      section: Filter Rectangles (DECEFR)
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ' w
      rule: Inclusive rectangle in current DECELR units, upper-left origin 1:1. Missing bounds default to current locator position;
        all omitted means report any movement. Leaving rectangle generates event 10 and disables filter (one shot); replacing
        rectangle reactivates and immediate outside report if pointer already outside. DECELR and DECSLE 0 cancel. Explicit
        bounds with undefined position trigger immediately with omitted coordinates; omitted bounds while undefined trigger
        on entry into defined space. Inactive session has corresponding undefined-position behavior.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d3c7ca5037
        source_line: 1767
        wire: CSI Pt ; Pl ; Pb ; Pr ' w
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5511-5529; button.c:1019-1140
      source_note: Pinned xterm InitLocatorFilter uses current coordinates for omitted bounds, clamps/sorts rectangle and sends
        event 0 on some unavailable cases. Original inclusive geometry and undefined-coordinate semantics are retained, not
        inferred from that code.
      test_locations:
      - file: howl-vt/src/locator.zig
        test: locator filter resolves omitted edges and preserves its valid latch
        relation: protocol-family
      - file: howl-vt/src/locator.zig
        test: locator one-shot and filter latches commit only after reply append
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator query distinguishes active undefined and inactive without consuming a filter
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator undefined query preserves one-shot and filter under reply pressure
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator filters trigger immediately or on selected coordinate movement
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator filter and button reports are ordered within a sample
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator filter undefined entry and immediate report rollback
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator simultaneous report rollback retains exact prior prefix
        relation: protocol-family
        note: Narrow regression evidence at 54e3fb3; not whole-clause qualification.
    - id: request-locator-position
      section: Requesting A Locator Position Report (DECRQLP)
      level: defined
      wire: CSI Ps ' |
      rule: Ps 0/omitted or 1 requests one immediate DECLRP; other selectors ignored. Enabled active session returns event 1,
        with omitted coordinates if outside defined range. Disabled or inactive session returns event 0. Do not expose another
        session pointer state.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5581-5588; button.c:953-1016
      related_report: dec_locator.locator-report
      accepted_reconciliations:
      - locator-query-undefined-position-and-filter-lifetime
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d792d66921
        wire: CSI Ps ' |
        source_line: 1898
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: locator-query-undefined-position-and-filter-lifetime
          reason: Original DEC memo distinguishes active but undefined position (event 1 with omitted coordinates) from disabled/inactive
            (event 0); query is a position request, not a documented filter-cancel command. Pinned xterm returns event 0 for
            out-of-range pointer and explicitly disables locator and clears filter/events on request while filter active, emulating
            observed DECterm behavior.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator requests reply unavailable, then current position, then disable one-shot
        relation: protocol-family
      - file: howl-vt/src/locator.zig
        test: locator one-shot and filter latches commit only after reply append
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: locator query distinguishes active undefined and inactive without consuming a filter
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
      - file: howl-vt/src/locator.zig
        test: locator undefined query preserves one-shot and filter under reply pressure
        relation: protocol-family
        note: Narrow regression evidence at 686b8d9; not whole-clause qualification.
  ecma35:
    title: 'ECMA-35: Character Code Structure and Extension Techniques'
    author: Ecma International
    authority: standard
    revision: 6th edition, December 1994; identical to ISO/IEC 2022:1994
    url: https://ecma-international.org/wp-content/uploads/ECMA-35_6th_edition_december_1994.pdf
    snapshot_sha256: cd812a506f93bf44e0e6058fe423144c4dea8a64fbc96589cf99bcbe32fc1bf4
    scope: Selected single-byte graphic set designations, code structure announcements and return from other coding systems.
      Not all ECMA-35 functions or registered sets.
    clauses:
    - id: designate-g0-94
      section: 14.1,14.3.1-14.3.2 Table 6, printed pp.33-35; 6.3.1
      level: defined
      wire: ESC ( [ I ... ] F
      rule: Designate identified single-byte 94-character graphic set as G0, superseding prior designation. Set identity is
        the registered final byte with any associated intermediates, not always one final character. If the code element is
        already invoked, new set becomes active immediately; otherwise it is invoked by corresponding shift. A 96-character
        set cannot be designated G0. A 94-set excludes the outer SPACE/DELETE positions; a 96-set uses the full six columns.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f7c699f296
        source_line: 312
        wire: ESC ( C
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:3806-3809,4853-4878; xterm ctlseqs:312
      source_scope: ECMA-35 designation function, not a blanket obligation to implement every registered set, multibyte designation,
        DRCS, or an old DEC character mapping.
      dec_profile: dec_vt420.character-set-designation-profile
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: four charset slots share locking single-shift save and reset ownership'
        relation: protocol-family
        legacy_records:
