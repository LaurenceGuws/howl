        or below firstrow and strictly above lastrow (top row=1). On release, equal endpoints report CSI t CxCy; otherwise CSI
        T followed by six coordinates startx,starty,endx,endy,mousex,mousey. Mouse-up position need not lie over a character.
        Legacy coordinates use value+32; SGR mode modifies highlight responses.
