    - id: copy-rect
      section: Rectangular Area Operations / Copy Rectangular Area, p161
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ; Pp ; Pt ; Pl ; Pp $ v
      rule: DECCRA copies a rectangular region between pages with origin and destination coordinates.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-78d54c142e
        source_line: 1746
        wire: CSI Pt ; Pl ; Pb ; Pr ; Pp ; Pt ; Pl ; Pp $ v
      original_parameters:
        source: VT420 Programmer Reference Manual (Feb 1992), pages 161-162
        fields: Source top/left/bottom/right/page and destination top/left/page; omitted page numbers default to 1.
        limits: Coordinates are affected by DECOM and bounded to the page; inaccessible page indexes clamp to the last available page; off-page
          destination is clipped.
        effect: Copies characters and visual attributes, taking destination line attributes; does not move cursor.
        source_note: The printed notes have an inconsistent reversed-border inequality relative to the parameter constraints. Preserve the
          literal source; resolve before implementation-target FULL proof.
    - id: fill-rect
      section: Rectangular Area Operations / Fill Rectangular Area, p162
      level: defined
      wire: CSI Pc ; Pt ; Pl ; Pb ; Pr $ x
      rule: DECFRA fills a rectangular region with the supplied character.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f5310073dd
        source_line: 1809
        wire: CSI Pc ; Pt ; Pl ; Pb ; Pr $ x
      original_constraints:
        source: VT420 Programmer Reference Manual, pages 162-163
        behavior: Use the current SGR attributes for the fill character; page-bounded coordinates respect DECOM, not the margins; cursor
          unchanged.
        status: Source-specified constraints for eventual implementation and test mapping; not evidence of existing Howl conformance.
    - id: erase-rect
      section: Rectangular Area Operations / Erase Rectangular Area, p164
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr $ z
      rule: DECERA erases all characters in the selected rectangle.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-48e8cc62da
        source_line: 1846
        wire: CSI Pt ; Pl ; Pb ; Pr $ z
      original_constraints:
        source: VT420 Programmer Reference Manual, page 164
        behavior: Erase characters and visual attributes within the requested rectangle, constrained to the active page; cursor unchanged.
        status: Source-specified constraints for eventual implementation and test mapping; not evidence of existing Howl conformance.
    - id: selective-erase-rect
      section: Rectangular Area Operations / Selective Erase Rectangular Area, p165
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr $ {
      rule: DECSERA erases unprotected characters in the selected rectangle.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-57e171e687
        source_line: 1882
        wire: CSI Pt ; Pl ; Pb ; Pr $ {
      original_constraints:
        source: VT420 Programmer Reference Manual, page 165
        behavior: Erase only characters allowed by DECSCA, retaining protected characters and current rendition/protection state; cursor
          unchanged.
        status: Source-specified constraints for eventual implementation and test mapping; not evidence of existing Howl conformance.
    - id: attr-change-extent
      section: Rectangular Area Operations / Select Attribute Change Extent, p166
      level: defined
      wire: CSI Ps * x
      rule: DECSACE selects whether attribute operations act on stream or rectangular extents.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-a9140b3a2a
        source_line: 1791
        wire: CSI Ps * x
      original_parameters:
        source: VT420 Programmer Reference Manual, pages 166-167; xterm ctlseqs lines 1791-1795
        selectors: 0 (default) or 1 selects stream extent; 2 selects exact rectangle extent for DECCARA/DECRARA.
    - id: attr-change-rect
      section: Rectangular Area Operations / Change Attributes in Rectangular Area, p167
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ; Ps $ r
      rule: DECCARA changes attributes in the selected rectangle.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-8f7c941588
        source_line: 1574
        wire: CSI Pt ; Pl ; Pb ; Pr ; Pm $ r
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 9, printed pages 167-169
        original_notation: CSI Pt ; Pl ; Pb ; Pr ; Ps1 ; ... ; Psn $ r
        xterm_notation: CSI Pt ; Pl ; Pb ; Pr ; Pm $ r; Pm means an ordered list of SGR attributes.
        attribute_cardinality: If explicit attribute selectors are present, apply them cumulatively in order; when omitted the original default
          selector is 0.
        region_defaults: Top=1, left=1, bottom=last active-page line, right=last active-page column.
        region_bounds: Coordinates depend on DECOM and clamp to page dimensions; page margins do not affect the rectangular operation.
        side_effects: Modifies cell visual attributes, never character values, cursor position or the current SGR rendition; DECSACE controls
          stream-versus-rectangle extent.
        original_selectors:
          '0': reset visual attributes
          '1': bold on
          '4': underline on
          '5': blink on
          '7': reverse image on
          '22': bold off
          '24': underline off
          '25': blink off
          '27': reverse image off
        xterm_extension:
          '8': invisible / conceal on
          '28': invisible / conceal off
          scope: xterm-specific addition, not in the original DEC VT420 selector table
        selector_default: '0: reset visual attributes'
    - id: attr-reverse-rect
      section: Rectangular Area Operations / Reverse Attributes in Rectangular Area, p169
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ; Ps $ t
      rule: DECRARA reverses selected attributes in a rectangle.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-5bddb81eac
        source_line: 1717
        wire: CSI Pt ; Pl ; Pb ; Pr ; Pm $ t
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 9, printed pages 169-171
        original_notation: CSI Pt ; Pl ; Pb ; Pr ; Ps1 ; ... ; Psn $ t
        xterm_notation: CSI Pt ; Pl ; Pb ; Pr ; Pm $ t; Pm means an ordered list of SGR attributes.
        attribute_cardinality: If explicit attribute selectors are present, apply them cumulatively in order; when omitted the original default
          selector is 0.
        region_defaults: Top=1, left=1, bottom=last active-page line, right=last active-page column.
        region_bounds: Coordinates depend on DECOM and clamp to page dimensions; page margins do not affect the rectangular operation.
        side_effects: Modifies cell visual attributes, never character values, cursor position or the current SGR rendition; DECSACE controls
          stream-versus-rectangle extent.
        original_selectors:
          '0': reverse all original visual attributes
          '1': toggle bold
          '4': toggle underline
          '5': toggle blink
          '7': toggle reverse image
        xterm_extension:
          '8': toggle conceal / invisible
          scope: xterm-specific addition, not in the original DEC VT420 selector table
        source_note: The printed DECRARA description labels the left-column default as Pr=1 instead of Pl=1; preserve the literal source
          typo and compare the DECCARA description before any FULL claim.
        selector_default: '0: reverse all visual attributes'
    - id: cursor-visible
      section: Cursor Movement / Text Cursor Enable Mode, p176
      level: defined
      wire: CSI ? 25 h/l
      rule: DECTCEM sets or clears presentation of the text cursor.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-25-h-line-933
        source_line: 933
        wire: CSI ? 25 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-25-l-line-1082
        source_line: 1082
        wire: CSI ? 25 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 176; xterm ctlseqs set/reset lines 933/1082
        selector: 25
        name: DECTCEM
        set_wire: CSI ? 25 h
        reset_wire: CSI ? 25 l
        original_default: cursor visible
        set_effect: Make the text cursor visible.
        reset_effect: Make the text cursor invisible.
        source_specific_constraints: Cursor presentation state, not grid text mutation; renderer/host presentation conformance is separate.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: back-index
      section: Cursor Movement / Back Index, p177
      level: defined
      wire: ESC 6
      rule: DECBI shifts the active line to the right at its left margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-92abac61a2
        source_line: 393
        wire: ESC 6
    - id: forward-index
      section: Cursor Movement / Forward Index, p177
      level: defined
      wire: ESC 9
      rule: DECFI shifts the active line to the left at its right margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f863048dbd
        source_line: 399
        wire: ESC 9
    - id: backarrow-mode
      section: Keyboard / Backarrow Key Mode, p188
      level: defined
      wire: CSI ? 67 h/l
      rule: DECBKM selects Backspace versus Delete input encoding for the backarrow key.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-67-h-line-957
        source_line: 957
        wire: CSI ? 67 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-67-l-line-1103
        source_line: 1103
        wire: CSI ? 67 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 188-189; xterm ctlseqs set/reset lines 957/1103
        selector: 67
        name: DECBKM
        set_wire: CSI ? 67 h
        reset_wire: CSI ? 67 l
        original_default: backarrow sends DEL (0x7F)
        set_effect: Backarrow key sends BS (0x08).
        reset_effect: Backarrow key sends DEL (0x7F).
        source_specific_constraints: Original DEC recommends reset for software compatibility. Key events and input encoding are owned by
          the host input boundary; PTY only transports bytes. Neither is proven by this source inventory.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: autowrap
      section: Keyboard / Autowrap Mode, p191
      level: defined
      wire: CSI ? 7 h/l
      rule: DECAWM controls automatic continuation to the next line at the right margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-h-line-920
        source_line: 920
        wire: CSI ? 7 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-l-line-1070
        source_line: 1070
        wire: CSI ? 7 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 191; xterm ctlseqs set/reset lines 920/1070
        selector: 7
        name: DECAWM
        set_wire: CSI ? 7 h
        reset_wire: CSI ? 7 l
        original_default: no autowrap in the original VT420 reference
        set_effect: At the right page border, subsequent graphic characters wrap to the next line, scrolling the region when appropriate.
        reset_effect: At the right page border, subsequent graphics replace the border cell rather than wrapping.
        source_specific_constraints: The DEC VT420 source explicitly says default no autowrap; do not silently substitute an independently
          configured modern emulator startup default. This is source history, not Howl runtime conformance.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
      reaffirms: dec_vt240.autowrap
    - id: cursor-key-mode
      section: Keyboard / Cursor Keys Mode, p192
      level: defined
      wire: CSI ? 1 h/l
      rule: DECCKM chooses application versus normal cursor-key input encoding.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1-h-line-913
        source_line: 913
        wire: CSI ? 1 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1-l-line-1064
        source_line: 1064
        wire: CSI ? 1 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 192; xterm ctlseqs set/reset lines 913/1064
        selector: 1
        name: DECCKM
        set_wire: CSI ? 1 h
        reset_wire: CSI ? 1 l
        original_default: normal cursor-key sequences
        set_effect: Arrow keys send application cursor sequences.
        reset_effect: Arrow keys send normal ANSI cursor sequences.
        source_specific_constraints: Input-encoding behavior; not a cursor-movement command and not proof of Host input mapping.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: app-keypad
      section: Keyboard / Keypad Application and Numeric Modes, p192
      level: defined
      wire: ESC = / ESC >
      rule: DECKPAM and DECKPNM select application or numeric keypad behavior.
      related_dec_private_mode: dec_vt420.numeric-keypad-mode
      wire_relation: ESC = and ESC > directly select application/numeric keypad state; CSI ? 66 h/l selects the same state using a DEC-private
        mode that supports DECRQM/DECRPM. They are distinct valid commands.
    - id: save-cursor
