        test: xterm OSC 104 ignores whitespace-only reset where pinned Kitty resets all
        relation: wire-family
        legacy_records:
        - kitty.osc.palette_reset
    - id: dynamic-colors
      section: Operating System Commands, lines 2067-2115
      level: defined
      wire: OSC Ps ; spec [ ; spec ... ] (BEL | ST)
      rule: For Ps=10..19, set or query the dynamic color at Ps and successive colors in the ordered list. At least one Pt parameter
        is expected; each successive spec selects the next color, rather than another explicit index/spec pair. Names or RGB
        specifications follow XParseColor; ? queries the corresponding color and may yield separate replies. These are distinct
        from the ANSI palette; dynamic text foreground/background are used by SGR 39/49. Tektronix colors start from VT100 colors
        but can change independently. Author documents allowColorOps gating.
      also_documented:
