      section: Appendix D, pp.D-2/D-3
      level: defined
      wire: CSI ? Pm h / CSI ? Pm l
      rule: Original setup private selectors have AT&T-specific meanings. Preserve relevant collisions rather than assume xterm
        semantics are universal.
      selectors:
        '10':
          set: Blank screen
          reset: Unblank screen
        '11':
          set: Underscore cursor
          reset: Block cursor
        '13':
          set: Labels off
          reset: Labels on
        '14':
          set: Cartridge in use
          reset: Cartridge idle
        '15':
          set: Check parity yes
          reset: Check parity no
        '16':
          set: Keyclick on
          reset: Keyclick off
      source_note: Mode 10 is a third original profile beside rxvt menu/xterm toolbar. Modes 13/14 are AT&T setup state, not
        xterm read-only blink preferences. Index as distinct hardware profile; no compatibility target selected.
