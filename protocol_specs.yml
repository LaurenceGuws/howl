      section: EL-00070-05 pp.5-175–5-176
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ; Ps1 ; ... ; Psn $ t
      rule: Changes only specified video attributes, never character values, cursor position or current graphic rendition. Bounds depend
