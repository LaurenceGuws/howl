  dec_vt100:
    title: DEC VT100 User Guide
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: EK-VT100-UG; Digital original guide, PDF transcription by Edwin Rhodes (2004)
    url: https://geoffg.net/Downloads/Terminal/VT100_User_Guide.pdf
    snapshot_sha256: 91f271c2eb0b0bf6f643de42422c8a2fb3efc910b086714414833940ce3de8ef
    scope: Selected DEC VT100 Chapter 3 controls, ANSI/VT52 transition, line-size, keypad, VT52 emulation, serial parameter
      and LED semantics; not complete.
    clauses:
    - id: tbc
      section: Chapter 3 / Valid ANSI Mode Control Sequences / TBC (PDF page 50)
      level: defined
      wire: CSI Ps g
      rule: Ps=0 clears the horizontal tab stop at the active position; Ps=3 clears all horizontal tab stops; all other parameter values
        are ignored.
      equivalent_to: xterm_controls.tbc-vt100-subset
      competes_with: ecma48.tbc
      decision: ecma48-tbc-vs-xterm-subset
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: bank-local stops differ from pinned libvterm and iTerm2 global stop owners'
        relation: wire-family
        legacy_records:
        - libvterm.csi.tbc
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: accepted DEC/xterm TBC 5 preserves a custom stop'
        relation: wire-family
        legacy_records:
        - iterm2.csi.tbc
        note: Retired TBC test name replaced by current accepted-semantics regression test.
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: accepted TBC subset rejects excess operands and ignores mode five'
        relation: wire-family
        legacy_records:
        - kitty.csi.tbc
        note: Retired TBC test name replaced by current accepted-semantics regression test.
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: accepted DEC/xterm TBC unsupported selectors preserve state and tabs'
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: tab controls share exact stored-stop and clamping behavior'
        relation: accepted-decision-location
    - id: ansi-vt52-mode
      section: Chapter 3 / Valid ANSI Mode Control Sequences / DECANM (original VT100 User Guide, transcribed PDF page 41)
      level: defined
      wire: CSI ? 2 h / CSI ? 2 l
      rule: DECANM sets or resets the ANSI/VT52 control-code interpretation regime. Set selects ANSI-compatible sequences; reset
        enters VT52 compatibility mode. In VT52 mode CSI controls cannot normally be used, so the separate ESC < exits back
        to ANSI.
      original_mode_semantics:
        name: DECANM
        selector: 2
        source: Original DEC VT100 User Guide, Chapter 3, DECANM / ANSI-VT52 Mode; reaffirmed by DEC VT330/VT340 Text Programming
          (May 1988) Appendix A and DEC VT420 Programmer Reference (Feb 1992) Appendix A
        default: ANSI mode under normal VT100 operation; reset is the explicit transition into VT52 mode.
        set_wire: CSI ? 2 h
        set_effect: Use ANSI-compatible escape and control sequences rather than VT52-only commands.
        reset_wire: CSI ? 2 l
        reset_effect: Enter VT52 compatibility mode, where ANSI private controls, C1 controls, Latin-1 supplemental and NRC
          sets are unavailable; G0 defaults to ASCII.
        mode_boundaries: In VT52 mode, the terminal uses VT52-specific escape sequences; an ordinary ANSI CSI ? 2 h cannot be
          assumed usable to leave VT52 mode. ESC < is the author-defined exit.
        related_vt52_exit: dec_vt100.vt52-return-to-ansi
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-2-h-line-914
        source_line: 914
        wire: CSI ? 2 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-2-l-line-1065
        source_line: 1065
        wire: CSI ? 2 l
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:7507-7551, xterm ctlseqs lines 914-915 and 1065
        behavior: xterm executes CSI ? 2 l by saving a subset of modes/charsets and entering VT52 parser mode. CSI ? 2 h is
          a no-op when already in ANSI, since it cannot be reached from VT52. The xterm textual line claiming USASCII G0-G3
          designation should not be promoted over the concrete code without an explicit test.
        limits: Xterm mode transition may resize to 80 columns if enabled by host policy; its own comment says some DEC STD-070
          VT52 transition mode restorations are undefined. Not proof of whole-hardware VT52 emulation.
      implementation_note: Original protocol identity only; neither complete VT52 parsing nor Host migration is automatically
        selected or FULL.
      accepted_reconciliations:
      - vt52-exit-restored-conformance-level
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: ignored and unknown DEC modes preserve pending wrap and grid state
        relation: wire-family
        legacy_records:
        - iterm2.mode.ansi_vt52
    - id: vt52-return-to-ansi
      section: Chapter 3 / Valid VT52 Mode Control Sequences / Enter ANSI Mode (original VT100 User Guide, transcribed PDF page
        54)
      level: defined
      wire: ESC <
      rule: While in VT52 mode, ESC < leaves VT52 compatibility mode and resumes ANSI interpretation of subsequent control sequences.
        This is a distinct command from CSI ? 2 h/l.
      original_source_variants:
        VT100: Enter ANSI mode; subsequent escape/control sequences are interpreted according to ANSI X3.64-1977 and X3.41-1974.
        VT330_VT340: 'May 1988 Text Programming, Appendix A printed pages 257-258: returns to the mode active before entry to
          VT52.'
        VT420: 'February 1992 Programmer Reference, Appendix A printed pages 327-328: returns to the mode active before entry
          to VT52, which may be VT400 rather than merely VT100.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-457e1dc272
        source_line: 3388
        wire: ESC <
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5039-5059; xterm ctlseqs line 3388
        behavior: Exits VT52 and selects ANSI parser, explicitly invokes set_vtXX_level(screen,1), then restores selected saved
          flags and charsets. The xterm prose calls this Enter VT100 mode.
        material_limit: The later DEC VT300/VT420 author text says return to prior mode, not necessarily VT100 level 1. Reconcile
          this restoration-level difference before implementing a full VT420-compatible VT52 cycle.
      accepted_reconciliations:
      - vt52-exit-restored-conformance-level
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: VT52 exit escape is an exact fragmented no-op'
        relation: protocol-family
        legacy_records:
        - libvterm.esc.vt52_exit
        - iterm2.esc.strict_ansi
    - id: double-height-line
      section: Chapter 3 / DECDHL (transcribed PDF page 42)
      level: defined
      wire: 'ESC # 3 / ESC # 4'
      rule: Select the top or bottom half of a double-height, double-width line containing the active position. Use paired adjacent lines
        and send identical character output to both to form full-height characters. Double width halves characters per line. On conversion
        from single width and height, characters right of the screen center are lost. The cursor retains its character position unless
        beyond the right margin, where it moves to that margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-44ab86aa54
        source_line: 298
        wire: 'ESC # 3'
      - catalogue: xterm_ctlseqs
        entry_id: esc-9225af7f15
        source_line: 300
        wire: 'ESC # 4'
      related_mode: dec_vt420.vertical-split-screen-mode
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: DEC line geometry owns width movement scroll resize reset and visual observation'
        relation: protocol-family
        legacy_records:
        - libvterm.esc.decdhl_top
        - libvterm.esc.decdhl_bottom
        - iterm2.esc.decdhl_top
        - iterm2.esc.decdhl_bottom
    - id: double-width-line
      section: Chapter 3 / DECDWL (transcribed PDF page 42)
      level: defined
      wire: 'ESC # 6'
      rule: Select double width and single height for the active line, halving characters per line. Retain cursor character position unless
        beyond the right margin, where it moves to that margin. On conversion from single width and height the original transcription
        states characters to the right of the screen are lost; the exact wording is retained rather than silently correcting it to center.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-127380e396
        source_line: 304
        wire: 'ESC # 6'
      related_mode: dec_vt420.vertical-split-screen-mode
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: DEC line geometry owns width movement scroll resize reset and visual observation'
        relation: wire-family
        legacy_records:
        - libvterm.esc.decdwl
        - iterm2.esc.decdwl
    - id: single-width-line
      section: Chapter 3 / DECSWL (transcribed PDF page 46)
      level: defined
      wire: 'ESC # 5'
      rule: Select single width and single height for the active line, retaining the same cursor character position. This is the default
        for every new screen line.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f22011512d
        source_line: 302
        wire: 'ESC # 5'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c CASE_DECDHL/DECSWL/DECDWL at lines 3782-3800; doublechr.c repaint_line and xterm_DECDHL/DECSWL/DECDWL at lines 48-145
        behavior: Distinct line attributes for top, bottom, single and double width, gated by OPT_DEC_CHRSET and left-right margin mode.
        limits: Common repaint path changes line attributes and clamps cursor; original character-loss and exact right-margin effects are
          not established by this inspection. Command identity only, not source-complete conformance.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: pinned libvterm DECSWL requires a line-info callback unlike Howl'
        relation: wire-family
        legacy_records:
        - libvterm.esc.decswl
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: DEC line geometry owns width movement scroll resize reset and visual observation'
        relation: wire-family
        legacy_records:
        - iterm2.esc.decswl
    - id: index
      section: Chapter 3 / IND (transcribed PDF p.48)
      level: defined
      wire: ESC D
      rule: Move the active position downward one line without changing column. At bottom margin, scroll up. Independent of
        LNM (line feed/new line mode). ANSI-mode format effector documented by DEC VT100; ECMA-48 fifth edition removed INDEX.
        In VT52 mode ESC D instead moves left.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-514c28b6ff
        source_line: 161
        wire: ESC D
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5423-5427; VTPrsTbl.c:9653-9657
      source_note: Original VT100 document prints ESC D, while pinned xterm identifies it as the 7-bit equivalent of C1 IND.
        Raw C1 admission in this hardware profile is not inferred from xterm.
      historical_c1_equivalent: 0x84 (pinned xterm C1 table; not an asserted raw-input capability of VT100)
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: pinned iTerm2 LF VT FF and IND gate bottom scrolling outside horizontal margins'
        relation: wire-family
        legacy_records:
        - iterm2.esc.ind
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: 7-bit and C1 index controls preserve scroll-region effects'
        relation: wire-family
        legacy_records:
        - kitty.esc.ind
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: IND ignores ANSI newline mode while LF and NEL retain their own column rules'
        relation: protocol-family
        legacy_records:
        - libvterm.c1.ind
    - id: vt52-cursor-up
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC A
      rule: Move up one position, same column; clamp at top margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-1a52090ba5
        source_line: 3394
        wire: ESC A
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3913-3917
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-down
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC B
      rule: Move down one position, same column; clamp at bottom margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-b0bb2d201b
        source_line: 3396
        wire: ESC B
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3919-3923
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-right
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC C
      rule: Move right one position; clamp at right margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-76873eeca9
        source_line: 3398
        wire: ESC C
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3925-3929
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-left
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC D
      rule: Move left one position; clamp at left margin. In ANSI mode this wire is historical IND, not cursor-left.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3931-3935
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-graphics-enter
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC F
      rule: Use the special graphics character set. DEC notes VT100 special graphics differ from actual VT52 graphics. Not ANSI
        HP lower-left extension.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3775-3779
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-graphics-exit
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC G
      rule: Use standard ASCII character set.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-3290703b9a
        source_line: 3404
        wire: ESC G
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3768-3774
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-home
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC H
      rule: Move cursor to home position.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3937-3944
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-reverse-line-feed
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC I
      rule: Move up one position, same column; at top margin scroll down.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-6d8ca0843a
        source_line: 3408
        wire: ESC I
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:5468-5472
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-erase-display-end
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC J
      rule: Erase from active position to end of screen, inclusive; cursor unchanged.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-10f130db3f
        source_line: 3410
        wire: ESC J
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3986-3991
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-erase-line-end
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC K
      rule: Erase from active position to end of current line, inclusive; cursor unchanged.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-fb8c0ef87a
        source_line: 3412
        wire: ESC K
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3993-3997
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-direct-cursor-address
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC Y row-byte column-byte
      rule: Move to row and column. Each coordinate uses one ASCII byte, 1-based number plus octal 037 (decimal 31), equivalent
        to zero-based value plus 32; byte 0x20 denotes first row or column. Do not parse decimal CSI parameters.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-13153bf1ce
        source_line: 3414
        wire: ESC Y Ps Ps
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9678-9682; charproc.c:3171-3179,3720-3724
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-identify
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC Z
      rule: Respond ESC / Z for VT100 emulating VT52. Distinct from ANSI DECID and ECMA SCI. Actual VT52 identification is a
        distinct hardware profile; do not infer its identifier from this VT100 guide.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9678-9682; charproc.c:4062-4089
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: request-terminal-parameters
      section: Chapter 3 / DECREQTPARM and DECREPTPARM, transcribed PDF pp.44-45
      level: defined
      wire: CSI Ps x
      rule: Ps=0 or omitted requests terminal parameters and permits unsolicited reports on leaving SET-UP. Ps=1 requests parameters
        and permits reports only on request. At power-up/reset unsolicited reports inhibited. Report first parameter 2 (ordinary)
        or 3 (request-only). Original serial settings are not inferred from a modern PTY.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-1e399e435a
        source_line: 1779
        wire: CSI Ps x
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4788-4807
      reply: CSI Psol ; Ppar ; Pnbits ; Pxspeed ; Prspeed ; Pclkmul ; Pflags x
      original_report_fields:
        sol:
        - 2
        - 3
        parity:
          '1': none
          '4': odd
          '5': even
        bits:
          '1': 8
          '2': 7
        speed_code_to_baud:
          '0': 50
          '8': 75
          '16': 110
          '24': 134.5
          '32': 150
          '40': 200
          '48': 300
          '56': 600
          '64': 1200
          '72': 1800
          '80': 2000
          '88': 2400
          '96': 3600
          '104': 4800
          '112': 9600
          '120': 19200
        clock_multiplier: 1 denotes bit-rate multiplier 16
        flags: 0..15 encode four STP-option SET-UP B block 5 switches
      source_note: Pinned xterm reports fixed CSI (Ps+2);1;1;128;128;1;0 x only if terminal_id<200; 128 represents 38.4k in
        this implementation, outside original VT100 speed table. No evidence that it implements unsolicited report state.
    - id: load-leds
      section: Chapter 3 / DECLL, transcribed PDF p.43
      level: defined
      wire: CSI Pm q
      rule: Default 0 clears all four programmable keyboard LEDs L1..L4; selectors 1..4 illuminate corresponding LED. Parameter
        list allowed. Physical hardware LEDs, not a generic cursor-style command.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-7973ed5976
        source_line: 1530
        wire: CSI Ps q
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5001-5027
      source_note: Pinned xterm documents and implements a different LED profile (1 NumLock,2 CapsLock,3 ScrollLock,21..23 extinguish);
        does not implement original L4. Preserve these as implementation-specific observations, not replacement of original
        selector meanings.
  itu_t416:
    title: 'ITU-T Recommendation T.416 / ISO/IEC 8613-6: Character content architectures'
    author: International Telecommunication Union (ITU-T) / ISO-IEC
    authority: standard
    revision: ITU-T T.416 (03/1993); published as identical ISO/IEC 8613-6:1994 text
    url: https://www.itu.int/rec/dologin_pub.asp?id=T-REC-T.416-199303-I%21%21PDF-E&lang=e&type=items
    snapshot_sha256: 3337680cb61970a39d753237738aa824325101ee57ee9eca972729d11fe7d97a
    scope: SGR foreground/background colour selectors 38 and 48 as formalized for ODA in section 13.1.8, not all ODA document semantics.
    clauses:
    - id: sgr-colour-subparameters
      section: 13.1.8 / Table 4 and printed page 41
      level: defined
      wire: SGR 38 or 48 followed by a colour parameter substring (Pe:Pe...)
      rule: SGR 38 selects foreground and SGR 48 background colour. Colon-separated parameter elements select 0 (implementation-defined foreground
        only), 1 (transparent), 2 (direct RGB), 3 (direct CMY), 4 (direct CMYK), or 5 (indexed palette colour). Direct colours include a
        colour-space identifier and components; optional tolerance and tolerance-space elements may follow.
      extends: ecma48.sgr
      original_ecma48: ECMA-48 fifth edition (1991) reserved selectors 38 and 48 for future standardization with those intended colour purposes.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: pinned libvterm extended color wraps while Howl clamps overrange channels'
        relation: protocol-family
        legacy_records:
        - libvterm.sgr.fg_extended
        - libvterm.sgr.bg_extended
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: pinned iTerm2 dual-mode colors are explicit unsupported SGR submodes'
        relation: protocol-family
        legacy_records:
        - iterm2.sgr.fg_extended
        - iterm2.sgr.bg_extended
        - iterm2.sgr.underline_color
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: SGR color mutation is exact fragmented and malformed-transactional'
        relation: protocol-family
        legacy_records:
        - kitty.sgr.fg_extended
        - kitty.sgr.bg_extended
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: SGR retains exact rendition and colon color state'
        relation: protocol-family
        legacy_records:
        - kitty.sgr.underline_color
  dec_vt3xx_text:
    title: 'DEC VT330/VT340 Programmer Reference Manual, Volume 1: Text Programming'
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: Second edition, May 1988 (EK-VT3XX-TP-002)
    url: https://mirrors.meulie.net/bitsavers.org/pdf/dec/terminal/vt340/EK-VT3XX-TP-002_VT330_VT340_Text_Programming_198805.pdf
    snapshot_sha256: 518676ad1188d4f75d0780e25f0a8fda2bb4a1a591902c6d62e1b9fde8042978
    scope: Selected DEC-private DSR and graphics-printer mode numbers in Chapter 12, printed pages 201-205 and 220-221; full Volume 2 graphics
      printing semantics are not yet indexed.
    clauses:
    - id: dsr-dec-private
      section: Chapter 12 / Device Status Reports (DSR), printed pages 201-205
      level: defined
      wire: CSI ? Ps n
      rule: Requests DEC-private device status, with parameter selecting the report. The private CSI ? form is distinct from standard ECMA-48
        CSI Ps n; each request has a specified reply format and report values.
      related_standard: ecma48.dsr
      parameters:
      - selector: 6
        name: DECXCPR
        effect: Request extended cursor position including current page number.
        response: CSI Prow ; Pcol ; Ppage R (DEC source has no private ? prefix).
        competing_reply_format: xterm_controls.decxcpr-xterm-reply
        decision: dec-private-dsr-decxcpr-reply-shape
      - selector: 15
        name: Printer status
        effect: Query printer-port status.
        responses:
          '10': Printer ready.
          '11': Printer not ready.
          '13': No printer detected since power-up/reset.
          '18': Printer busy in other session.
          '19': Printer assigned to other session.
        response_wire: CSI ? Pstatus n
      - selector: 25
        name: UDK status
        effect: Query whether user-defined keys are locked.
        responses:
          '20': Unlocked.
          '21': Locked.
        response_wire: CSI ? Pstatus n
      - selector: 26
        name: Keyboard dialect/status
        effect: Query the keyboard dialect and readiness.
        response: CSI ? 27 ; Pdialect [ ; Pstatus ] n; status is present in VT300 operating mode; Pstatus is 0 ready, 3 absent, or 8 busy.
      - selector: 55
        name: Locator status
        effect: Query whether an attached locator is available.
        responses:
          '50': Locator ready.
          '53': No locator detected.
          '58': Locator busy in other session.
        response_wire: CSI ? Pstatus n
      - selector: 56
        name: Locator device ID
        effect: Query the type of attached locator.
        responses:
          '0': Unknown.
          '1': DEC mouse.
          '2': DEC tablet.
        response_wire: CSI ? 57 ; Ptype n
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      later_dec_documentation: dec_vt420.device-status-reports-extended
      source_note: Source defines CSI ? 6 n request but no private prefix in its DECXCPR response; this is not silently normalized to xterm.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: device and status queries retain exact scalar transcripts and origin coordinates
        relation: wire-family
        legacy_records:
        - libvterm.csi.decdsr
        - iterm2.csi.decdsr
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: Kitty color-preference queries retain ordered intent and transactional replies
        relation: wire-family
        legacy_records:
        - kitty.csi.decdsr
