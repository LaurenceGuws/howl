          original_1988: dec_vt3xx_graphics.sixel-display-mode
          original_1989: dec_vt382_thai.sixel-display-mode
          modern_xterm: Current pinned xterm implementation uses SET=non-scrolling, RESET=scrolling, matching later DEC VT382
            and contradicting original DEC VT330/VT340.
          disposition: Keep both xterm discovery records until the target mode polarity and hardware-profile scope are explicitly
