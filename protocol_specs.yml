reconciliation:
- choice: one-command-family-with-parameter-extensions
  approved_by: Captain
  scope: ECMA-48 ED (CSI Ps J) and DECSED (CSI ? Ps J) with xterm Ps=3 extension
  principle: Parameter extensions stay within the originating command family; xterm source and meaning remain attached to the specific parameter.
    CSI Ps J and CSI ? Ps J remain different wire identities.
  implementation_policy: targeted
  same_wire_conflict_winner: none
  id: ed-ps3-extension
  implementation_assessment:
    as_of: '2026-11-23'
    scope: CSI Ps J / CSI ? Ps J, Ps=3; erase retained scrollback, not visible cells
    intent: target
    priority: not-yet-triaged
    status: PARTIAL
    owners:
    - howl-vt/src/terminal.zig:decodeCsi
    - howl-vt/src/terminal.zig:decodePrivateCsi
    - howl-vt/src/screen.zig:eraseDisplay
    tests:
    - file: howl-vt/test/unit/terminal_end_to_end_test.zig
      test: 'terminal: libvterm ED3 callback gate differs from native scrollback clearing'
    - file: howl-vt/src/screen/history_test.zig
      test: 'screen history: ED 3 clears scrollback history'
    verified_subset: Ordinary and DEC-private Ps=3 dispatch to the same VT-owned history-clearing action. Existing end-to-end tests assert
      visible text survives and no-repeat is inert.
    not_full_because: Original xterm/DEC parameter and bank/graphics/history lifecycle requirements have not been exhaustively enumerated
      and proven against all relevant boundaries.
    boundary: Current canonical VT only; app/render/backend conformance and broad discovery inventory have not been assessed.
- id: xtqmodkeys-vs-declaser-ppl2-sgr
  wire: CSI ? 4 m
  status: resolved-by-scope
  approved_by: Captain
  accepted_specification: xterm_controls.xtqmodkeys
  accepted_effect: Query modifyOtherKeys setting and reply using XTMODKEYS.
  other_specification:
    document: DEClaser 1100 Printer Operator’s Guide
    author: Digital Equipment Corporation
    revision: Revised June 1991
    order_number: EK-DCL11-OP-002
    url: https://www.zx.net.nz/mirror/deathrow.vistech.net/_cvisors/DEC94MDS/dcl11op2.pdf
    section: Appendix A, SGR (Select Graphic Rendition), page A–16
    wire: CSI ? 4 m
    effect: Superscript on; subscript off (printer page-formatting attribute).
  scope_decision: DEClaser printer formatting is outside Howl video-terminal semantics for this collision. Preserve the competing source,
    without adding a printer rendition profile.
  compatibility_mode: none
  scope_limit: Only this verified printer-versus-keyboard same-wire collision. Other DEC terminal controls require independent source review.
  implementation_assessment:
    as_of: '2026-11-23'
    scope: CSI ? 4 m sends xterm modifyOtherKeys resource-4 reply, not DEClaser superscript
    intent: target
    priority: not-yet-triaged
    status: PARTIAL
    owners:
    - howl-vt/src/terminal.zig:modeReport
    - howl-vt/src/terminal.zig:appendModifyOtherKeysReport
    tests:
    - file: howl-vt/test/unit/terminal_modes_test.zig
      test: xterm XTQMODKEYS wins the DEC printer CSI question-mark 4 m collision
    - file: howl-vt/test/unit/terminal_modes_test.zig
      test: libvterm private DECSGR baseline collides with native modifyOtherKeys query
    - file: howl-vt/test/unit/terminal_modes_test.zig
      test: modifyOtherKeys set query disable and encoding
    verified_subset: Query correctly replies for tested keyboard mode settings, fragmented and 8-bit framing; the single-resource query no
      longer accepts unsourced trailing operands; printer baseline is not mutated.
    not_full_because: Full source-parameter/state coverage for every relevant query result, invalid selector form, and bounded reply failure
      has not been proved as one complete trace.
    boundary: Current canonical VT only; app/render/backend conformance and broad discovery inventory have not been assessed.
- id: sgr21-ecma48-vs-linux-console
  wire: CSI 21 m
  status: resolved-by-explicit-choice
  approved_by: Captain
  accepted_interpretation:
    clause: ecma48.sgr
    source: https://ecma-international.org/wp-content/uploads/ECMA-48_5th_edition_june_1991.pdf
    section: 8.3.117 / SGR parameter 21
    effect: Double underline (also documented by xterm).
  unsupported_competing_interpretation:
    clause: linux_console.sgr21
    source: https://kernel.googlesource.com/pub/scm/docs/man-pages/man-pages/+/637b0aa571b61d98c717e7ab7490df8a3d9e4841/man/man4/console_codes.4
    section: console_codes(4) / SGR parameter 21
    effect: Single underline on Linux 4.17 and newer; formerly normal intensity.
  reason: Identical complete input sequence has incompatible text rendition meanings. Howl deliberately adopts the ECMA-48/xterm interpretation
    and does not support the competing Linux-console interpretation.
  scope_limit: Only SGR 21 on the Linux virtual console; no blanket rejection of other Linux-console sequences.
  implementation_mapping: The protocol decision did not itself establish implementation conformance. See the separately scoped, evidence-qualified
    implementation_assessment below.
  implementation_assessment:
    as_of: '2026-11-23'
    scope: CSI 21 m selects ECMA-48 double underline rather than Linux console single underline
    intent: target
    priority: not-yet-triaged
    status: PARTIAL
    owners:
    - howl-vt/src/screen.zig:applySgr
    tests:
    - file: howl-vt/test/unit/terminal_end_to_end_test.zig
      test: 'terminal: SGR 21 means double underline rather than Linux console single underline'
    verified_subset: Direct VT cell-attribute proof distinguishes SGR 4 single, SGR 21 double, and SGR 24 disabled, with idempotent reset.
    not_full_because: Full source-to-renderer and all combined SGR attribute/reset interaction proof, including hosted presentation/negative
      variants, is not yet complete.
    boundary: Current canonical VT only; app/render/backend conformance and broad discovery inventory have not been assessed.
- id: ecma48-simd-vs-xterm-sd-caret
  wire: CSI Ps ^
  status: resolved-by-explicit-choice
  approved_by: Captain
  accepted_interpretation:
    clause: xterm_controls.sd-caret-alias
    source: https://invisible-island.net/xterm/ctlseqs/ctlseqs.html
    section: Functions using CSI / SD (source line 751)
    effect: Scroll down Ps lines (default 1); legacy alias for the uncontested CSI Ps T Scroll Down command.
  unsupported_competing_interpretation:
    clause: ecma48.simd
    source: https://ecma-international.org/wp-content/uploads/ECMA-48_5th_edition_june_1991.pdf
    section: 8.3.120 / Select Implicit Movement Direction
    effect: Select implicit movement direction instead of scrolling.
  reason: The same complete CSI Ps ^ bytes cannot both change implicit movement direction and scroll down. Captain chose xterm’s longstanding
    SD alias after reviewing pinned terminal implementations. ECMA-48 SIMD stays indexed as an explicitly unsupported competing interpretation.
  uncontested_command:
    clause: ecma48.sd
    wire: CSI Pn T
  implementation_mapping: The protocol decision did not itself establish implementation conformance. See the separately scoped, evidence-qualified
    implementation_assessment below.
  implementation_assessment:
    as_of: '2026-11-23'
    scope: CSI Ps ^ is the xterm SD alias for CSI Ps T (not ECMA SIMD)
    intent: target
    priority: not-yet-triaged
    status: PARTIAL
    owners:
    - howl-vt/src/terminal.zig:decodeCsi
    - howl-vt/src/terminal.zig:scrollCount
    - howl-vt/src/screen.zig:scrollDownRegion
    tests:
    - file: howl-vt/test/unit/terminal_end_to_end_test.zig
      test: 'terminal: CSI caret is an SD alias for CSI T within accepted count and region bounds'
    verified_subset: Fragmented 7-/8-bit input, omitted and positive counts, scroll-region effects, cursor and cell state match CSI T; explicit
      zero and extra operands are rejected exactly as the existing SD path.
    not_full_because: The original xterm exact Ps=0 semantics and all source-defined count bounds/interactions have not been independently
      qualified; using existing CSI T semantics is not by itself FULL.
    boundary: Current canonical VT only; app/render/backend conformance and broad discovery inventory have not been assessed.
- id: ecma48-tbc-vs-xterm-subset
  wire: CSI Ps g
  status: resolved-by-explicit-reference-consensus
  approved_by: Captain
  accepted_interpretation:
    clause: xterm_controls.tbc-vt100-subset
    historical_source: dec_vt100.tbc
    effect: Ps=0 clears the current horizontal tab stop; Ps=3 clears all horizontal tab stops; Ps=1,2,4,5 have no effect.
  unsupported_competing_interpretation:
    clause: ecma48.tbc
    section: 8.3.154 / printed page 73
    selectors:
    - selector: 1
      effect: Clear the line tab stop at the active line.
    - selector: 2
      effect: Clear all character tab stops in the active line, subject to TSM.
    - selector: 4
      effect: Clear all line tab stops.
    - selector: 5
      effect: Clear all character and line tab stops.
  independent_implementation_evidence:
  - implementation: libvterm
    revision: 934bc2fbf21800ac3458a499df8820ca5fb45fd3
    source: https://github.com/neovim/libvterm/blob/934bc2fbf21800ac3458a499df8820ca5fb45fd3/src/state.c
    location: src/state.c, CSI 0x67 switch
    behavior: Ps=0 clears current character stop; Ps=3 and Ps=5 clear all character stops; Ps=1,2,4 have no effect. No line-tab-stop model
      is implemented for those selectors.
  - implementation: Foot
    revision: cb2771788998f6a6288e2de8273c55a8214551e0
    location: csi.c, case g
    behavior: Ps=0 and Ps=3 only; all other values unhandled.
  - implementation: Kitty
    revision: a79f376b85fd95e3dfd0589877123996bacd4184
    location: kitty/screen.c, screen_clear_tab_stop
    behavior: Ps=0 and Ps=3 mutate tab stops; Ps=2 explicitly no-op; other values unsupported.
  - implementation: Ghostty
    revision: 5813c9461d5af78b6307a1254d00b1bc190eaccd
    location: src/terminal/csi.zig, TabClear; src/terminal/stream.zig, CSI g dispatch
    behavior: Only Ps=0 current and Ps=3 all have effects.
  - implementation: WezTerm
    revision: cab25161054c50fd6c705db4ceefef0f1e5a9575
    location: term/src/terminalstate/mod.rs, TabStops::clear
    behavior: Only Ps=0 current and Ps=3 all have effects; other ECMA tab-clear selectors unhandled.
  reason: 'Captain explicitly selected the DEC VT100/xterm behavior because it is the broadly implemented convention among the examined terminal
    references: Foot, Kitty, Ghostty and WezTerm agree that only Ps=0 and Ps=3 perform tab-stop changes. libvterm independently implements
    Ps=5 as clear-all, and ECMA-48 defines broader operations for Ps=1,2,4,5. These disagreements were considered rather than suppressed;
    this is an explicit compatibility choice, not an automatic two-source tie-break or a claim of complete ECMA-48 conformance.'
  policy: Explicit case decision after multi-reference review; conditional ECMA/xterm two-way tie-breaker was not applicable.
  previous_provisional_decision:
    commit: 8b967715a1579eb932b2c6ff83d35e7b8e9f973d
    choice: xterm/DEC VT100 subset
    status: reopened because the Captain’s two-way-only condition was not met; no active winner
  scope_limit: Only the TBC Ps=1,2,4,5 interpretation. Ps=0 and Ps=3 agree across the relevant specifications.
  implementation_mapping: The protocol decision did not itself establish implementation conformance. See the separately scoped, evidence-qualified
    implementation_assessment below.
