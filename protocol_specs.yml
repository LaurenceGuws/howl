        relation: wire-family
        legacy_records:
        - kitty.c0.lf
    - id: c0-ht
      section: 8.3.60
      level: defined
      wire: HT
      rule: Moves the active position to the next horizontal tabulation stop.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
