    clauses:
    - id: utf8-with-standard-return
      section: Registration 196, 1996-04-22, single registry page
      level: defined
      wire: ESC % G
      rule: Designate and invoke UCS transformation format UTF-8 with standard return. Registry escape suffix 02/05 04/07, full
        7-bit wire 0x1b 0x25 0x47. Implementation level unspecified. By ECMA-35 DOCS standard-return semantics, ESC % @ returns
        to previous coding state; not an inherent switch to Latin-1.
