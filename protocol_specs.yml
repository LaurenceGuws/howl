        note: Narrow regression evidence at c3b3ad3; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: mode 41 tab admits history before scrolling and retries once'
        relation: protocol-family
        note: Narrow regression evidence at c3b3ad3; not whole-clause qualification.
    - id: c1-csi
      section: 8.3.16
      level: defined
      wire: CSI
      rule: Introduces a control sequence; seven-bit and eight-bit representations follow the standard coding rules.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-10d308deeb
        source_line: 196
        wire: ESC [
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.16
        eight_bit: '0x9B'
        seven_bit: ESC [
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
      test_locations:
      - file: howl-vt/test/unit/parser/main_test.zig
        test: 'parser: split input - partial CSI then final byte'
        relation: protocol-family
        legacy_records:
        - kitty.esc.csi
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: every byte split preserves mixed control framing'
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: over-capacity CSI headers cannot execute a truncated mutation
        relation: protocol-family
        note: Bounded parser admission and recovery regression at 2b392f3; not an ECMA-48 syntax capacity requirement or full
          grammar qualification.
    - id: c1-osc
      section: 8.3.89
      level: defined
      wire: OSC ... ST
      rule: Introduces an operating-system control string; its contents are not defined by this standard.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-8527fe776c
        source_line: 202
        wire: ESC ]
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.89
        eight_bit: '0x9D'
        seven_bit: ESC ]
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
      test_locations:
      - file: howl-vt/test/unit/parser/string_control_test.zig
        test: 'parser string controls: OSC with ST terminator'
        relation: protocol-family
        legacy_records:
        - kitty.esc.osc
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: every byte split preserves mixed control framing'
        relation: protocol-family
    - id: c1-dcs
      section: 8.3.27
      level: defined
      wire: DCS ... ST
      rule: Introduces a device control string; private payload protocols require their own source.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-40aa4b63e9
        source_line: 181
