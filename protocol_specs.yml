        test: 'screen history: ED 3 clears scrollback history'
        relation: accepted-decision-location
    - id: decaln
      section: Adjustments (DECALN), page 47
      level: defined
      wire: 'ESC # 8'
      rule: Displays the screen-alignment pattern for checking video cell geometry.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-d654f4f54c
        source_line: 306
        wire: 'ESC # 8'
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: DECALN owns exact retained grid and mutation truth'
        relation: wire-family
        legacy_records:
        - libvterm.esc.decaln
        - iterm2.esc.decaln
        - kitty.esc.decaln
    - id: media-copy-dec-private
      section: Printing / Auto print, Print cursor line and ReGIS hardcopy routing, printed pages 38-39
      level: defined
      wire: CSI ? Ps i
      rule: DEC-private Media Copy controls printer autoprint, a cursor-line print request, ReGIS graphics hardcopy routing and printer-to-host
        transfer. These are private-parameter meanings distinct from unprefixed ECMA-48 Media Copy.
      related_standard: ecma48.mc
      parameters:
      - selector: 0
        also_default: true
        effect: Select the printer port for subsequent ReGIS graphics hardcopy, effective even when no printer is connected.
      - selector: 1
        effect: Print the display line containing the cursor, without moving the cursor.
      - selector: 2
        effect: Direct subsequent ReGIS graphics hardcopy to host port.
      - selector: 4
        effect: Disable autoprint mode.
      - selector: 5
        effect: 'Enable autoprint: print the display line when the cursor leaves it through LF, FF, VT or wrapping.'
      - selector: 8
        effect: Stop communication from printer port to host port.
      - selector: 9
        effect: Start communication from printer port to host port.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6dd886d3cc
        source_line: 1048
        wire: CSI ? Ps i
      xterm_parameter_scope: The pinned xterm reference confirms 1,4,5 from the original DEC family and 10,11 from later DEC documentation.
        It does not list 0,2,8,9; absence is not proof of a no-op.
      later_dec_documentation: dec_vt420.media-copy-dec-private-extended
      xterm_documented_overlap:
      - 1
      - 4
      - 5
      xterm_selector_lines:
        '1': 1050
        '4': 1051
        '5': 1052
    - id: tektronix-mode
      section: 4010/4014, printed p.64 (PDF zero-based page 67, visually verified)
      level: defined
      wire: CSI ? 38 h / CSI ? 38 l
      rule: SET enters 4010/4014 graphics emulation in alpha mode. RESET exits graphics emulation to VT200 with 7-bit controls.
        Both SET-UP and these escape sequences select the mode. Original physical terminal profile, not standard Tektronix hardware
        commands.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-38-h-line-936
        source_line: 936
        wire: CSI ? 38 h
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:7657-7666; Tekproc.c:446-452,1315-1325
      source_note: Pinned xterm SET enters its Tek parser if not inhibited; its return command is ESC ETX, not the documented
        DEC RESET. Entry identity reconciled; exit profile remains distinct.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Captain accepted retention of historical profiles without partial Tektronix emulation.
  dec_sixel:
    title: Digital VT330/VT340 Programmer Pocket Guide, sixel graphics
