      wire: DCS @kitty-cmd JSON ST
      rule: JSON cmd, version array, optional no_response, kitty_window_id, payload. Higher client major/minor version rejected; patch
        ignored. Host permissions separate.
    - id: encrypted-envelope
      section: lines 50-84
      level: defined
