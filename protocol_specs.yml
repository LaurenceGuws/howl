      rule: 'Pi=1 color-register count,2 sixel geometry,3 ReGIS geometry, in pixels for geometry. Pa=1 read,2 reset,3 set,4
        read maximum. Pv is integer for color count or width;height for geometry when setting. Reply CSI ? Pi ; Ps [ ; Pv ...
        ] S: 0 success,1 item error,2 action error,3 failure. Author explicitly distinguishes graphics geometry from window
        size and says geometry mutation unsupported. Runtime unavailable graphics report failure; configured implementations
        without maximum geometry should report zeros rather than fail.'
