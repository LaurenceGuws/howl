discovery_catalogues:
  xterm_ctlseqs:
    title: XTerm Control Sequences (discovery only)
    publisher: Thomas E. Dickey / xterm
    role: secondary-reference-not-protocol-authority
    url: https://invisible-island.net/xterm/ctlseqs/ctlseqs.html
    local_snapshot: ~/personal/official_docs/xterm/ctlseqs.html.md
    snapshot_sha256: 8c62d6c9f72af9f53c4744526132fee39630f465fd8d431766929faf1454e47f
    warning: These are documented XTerm control inputs and responses, including older ECMA, DEC and ISO controls. This list is for finding
      protocol branches, not evidence of who originated a control, what Howl implements, or what is mandatory.
    sequences:
    - id: esc-93bf6694ea
      wire: ESC % @
      section: Controls beginning with ESC
      source_line: 308
      review:
        classification: source-confirmed-material-semantic-difference
        decision: docs-return-vs-xterm-default-charset
        reason: ECMA-35 restores prior coding-system announcement, designation and invocation state. Xterm describes selecting
          default ISO 8859-1 and its pinned parser switches PTY UTF-8 mode off conditionally; restoration of prior state is
          not established.
    - id: csi-a6bef4a803
      wire: CSI Ps SP t
      section: Functions using CSI , ordered by the final character(s)
      source_line: 1711
      symbol: DECSWBV
      review:
        classification: source-confirmed-material-semantic-difference
        decision: decswbv-zero-volume-polarity
        reason: VT520/525 July 1994 p.5-154 gives 0/omitted high; table prints 5 twice and omits 6. Pinned xterm zero/default
          falls through to off and 5..8 high.
    - id: csi-f8ef357623
      wire: CSI Ps SP u
      section: Functions using CSI , ordered by the final character(s)
      source_line: 1730
      symbol: DECSMBV
      review:
        classification: source-confirmed-material-semantic-difference
        decision: decsmbv-zero-volume-polarity
        reason: VT520/525 July 1994 p.5-138 gives 0/omitted off. Pinned xterm zero/default falls into high branch.
    - id: csi-eb0e648cf6
      wire: 'CSI Ps # y'
      section: Functions using CSI , ordered by the final character(s)
      source_line: 1814
      symbol: XTCHECKSUM
      review:
        classification: source-confirmed-material-semantic-difference
        decision: xtchecksum-bit3-and-unicode
        reason: Published xterm table says bit 3 omits uninitialized cells and bit 4 retains combining characters. Pinned csDRAWN
          includes uninitialized cells; combining addition occurs when csBYTE is clear and can be lost by trimmed total.
    - id: csi-d792d66921
      wire: CSI Ps ' |
      section: Functions using CSI , ordered by the final character(s)
      source_line: 1898
      symbol: DECRQLP
      review:
        classification: source-confirmed-material-semantic-difference
        decision: locator-query-undefined-position-and-filter-lifetime
        reason: Original DEC memo distinguishes active but undefined position (event 1 with omitted coordinates) from disabled/inactive
          (event 0); query is a position request, not a documented filter-cancel command. Pinned xterm returns event 0 for out-of-range
          pointer and explicitly disables locator and clears filter/events on request while filter active, emulating observed
          DECterm behavior.
    - id: osc-selector-3
      wire: OSC 3 ; Pt (BEL | ST)
      section: Operating System Commands
      source_line: 2028
      review:
        classification: source-confirmed-material-semantic-difference
        decision: osc3-cde-directory-vs-xterm-xproperty
        reason: CDE dtterm sets directory for a restarted session. Pinned xterm changes or deletes a top-level X property under
          ewSetXprop permission.
        previous_review:
          classification: source-origin-or-semantic-review-required
          reason: Xterm documents top-level X property set/delete, while the same publication says dtterm code 3 sets working
            directory for next session. Obtain originating dtterm source before scope resolution.
          source: Pinned xterm ctlseqs lines 2009-2030,2117-2120,2143; misc.c:4140-4179,4288-4290,4343-4348
    - id: private-mode-10-h-line-924
