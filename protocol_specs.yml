        - '> Pm m (XTQMODKEYS)'
        - '> Pm t (XTSMTITLE)'
        source_note: The xterm selector set differs from original DEC Table 12-4. Merge the request-family identity, not the sets of valid
          descriptors or guaranteed responses.
    - id: reply-status-string
      section: Reports / Report Selection or Setting
      level: defined
      wire: DCS Ps $ r Pt ST
      rule: DECRPSS replies to a selection/setting query with a validity indicator and content.
    - id: request-mode
      section: Mode Reporting / Request Mode
      level: defined
      wire: CSI ? Pm $ p
      rule: DECRQM queries the state of a DEC private mode.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4d9e66b18d
        source_line: 1507
        wire: CSI ? Ps $ p
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual (Feb 1992), Chapter 12, printed page 258
        original_notation: CSI ? Pd $ p; Pd is the one DEC-private mode number to query.
        xterm_notation: CSI ? Ps $ p; Ps likewise selects one DEC-private mode number.
        reply: CSI ? Pd ; Ps $ y with Ps=0 unrecognized, 1 set, 2 reset, 3 permanently set, 4 permanently reset.
        source_limit: Exactly one queried mode, including when multiple modes have been set by DECSET/DECRST. No bulk query or change of
          terminal mode.
    - id: report-mode
      section: Mode Reporting / Report Mode
      level: defined
      wire: CSI ? Pm ; Ps $ y
      rule: DECRPM reports a private mode and its recognized set/reset/permanence state.
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 12, printed page 262
        original_notation: CSI ? Pd ; Ps $ y; Pd is the private mode, Ps its status.
        values:
          '0': not recognized
          '1': set
          '2': reset
          '3': permanently set
          '4': permanently reset
        response_cardinality: Exactly one mode state per report, independent of any other queried mode.
    - id: media-copy-dec-private-extended
      section: Chapter 11 / Keyboard, Printing, and Display Commands / Printing Functions, printed pages 212-214
      level: defined
      wire: CSI ? Ps i
      rule: Documents additional DEC-private Media Copy selectors 10,11,18,19 in the VT420, while retaining the overlapping autoprint, cursor-line
        and printer-to-host functions 1,4,5,8,9 from earlier DEC terminals.
      extends: dec_vt240.media-copy-dec-private
      parameters:
      - selector: 10
        effect: Print the composed main display, including content from both sessions if composed; not affected by printer extent mode DECPEX.
      - selector: 11
        effect: Print all pages in the current session page memory; printer form-feed mode DECPFF may append FF after each page.
      - selector: 18
        effect: Assign the printer to the active host session; terminal accepts printer commands only from that session.
      - selector: 19
        effect: Release the printer; terminal accepts printer commands from both sessions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6dd886d3cc
        source_line: 1048
        wire: CSI ? Ps i
      scope_note: These are additional documented DEC selectors, not a competing xterm definition; the pinned xterm reference does not document
        DEC 18/19.
      xterm_documented_overlap:
      - 10
      - 11
    - id: device-status-reports-extended
      section: Chapter 12 / Device Status Reports, printed pages 236-242
      level: defined
      wire: CSI ? Ps [ ; Pid ] n
      rule: VT420 extends the DEC private DSR family with macro memory, data integrity and multiple-session queries, while preserving older
        printer and keyboard status requests. Reply fields and values are source-defined.
      extends: dec_vt3xx_text.dsr-dec-private
      parameters:
      - selector: 62
        name: DECMSR
        effect: Request available macro-definition storage, reported as available bytes divided by 16 and rounded down.
        response: CSI Pn * {, where Pn = floor(available macro-definition bytes / 16).
      - selector: 63
        name: DECCKSR
        request: CSI ? 63 ; Pid n
        effect: Request checksum of current text macro definitions; optional request label Pid is echoed.
        response: DCS Pid ! ~ xxxx ST (four hexadecimal checksum digits).
      - selector: 75
        name: Data integrity
        effect: Query and reset integrity flag since the preceding report.
        responses:
          '70': No communication errors since last report.
          '71': Communication error since last report.
          '73': Not reported since power-up or hard reset.
        response_wire: CSI ? Pstatus n
      - selector: 85
        name: Multi-session configuration
        effect: Query configuration and state of multiple host sessions.
        responses:
          80;Ps2: SSU multiple sessions enabled (Ps2 max sessions).
          81;Ps2: SSU sessions configured but pending (Ps2 max sessions).
          '83': Not configured for multiple sessions.
          '87': Separate physical line for each session.
        response_wire: CSI ? Pstatus [ ; Ps2 ] n
      reaffirmed_requests:
      - 6
      - 15
      - 25
      - 26
      response_extension:
        selector: 26
        response: CSI ? 27 ; Pdialect ; Pstatus ; Pkeyboard_type n in VT400 mode; Pkeyboard_type identifies the keyboard model.
        source: VT420 Chapter 12, printed page 238
      original_decxcpr: VT420 printed pages 236-237 independently repeat the DECXCPR response CSI Prow ; Pcol ; Ppage R without a private
        ? prefix.
      competing_reply_format: xterm_controls.decxcpr-xterm-reply
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      scope_note: The DEC printer and keyboard response sets include states omitted from xterm examples. Omission alone is not conflicting
        semantics.
      decision: dec-private-dsr-decxcpr-reply-shape
    - id: request-ansi-mode
      section: Chapter 12 / Request Mode (DECRQM), ANSI branch, printed page 257
      level: defined
      wire: CSI Pa $ p
      rule: Requests the state of exactly one ANSI mode Pa. Distinct from CSI ? Pd $ p for a DEC-private mode; the report is CSI Pa ; Ps
        $ y.
      source_parameters:
        request_count: Exactly one numeric ANSI mode per DECRQM request; no list.
        table: VT420 Table 12-2, printed page 259
        reply: dec_vt420.report-ansi-mode
