  dec_vt3xx_graphics:
    title: 'DEC VT330/VT340 Programmer Reference Manual, Volume 2: Graphics Programming'
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: Second edition, May 1988 (EK-VT3XX-GP-002)
    url: https://mirrors.meulie.net/bitsavers.org/pdf/dec/terminal/vt340/EK-VT3XX-GP-002_VT330_VT340_Graphics_Programming_198805.pdf
    snapshot_sha256: e4b2a69d1425db5e216d372cd080c3cff6dd216dc8acbb47f58b699fa2338669
    scope: Original sixel graphics display mode in Chapter 14 (printed pages 237-238), and graphics printing controls and printer-level output
      in Chapter 16 (printed pages 255-261); not all Volume 2 graphics semantics.
    clauses:
    - id: graphics-print-modes
      section: Chapter 16 / Selecting a Format for Printing, printed pages 255-257
      level: defined
      wire: CSI ? Pd h / CSI ? Pd l (Pd=43..47)
      rule: On DEC VT300, these selectors control graphics printing, not xterm margin bell, reverse-wraparound, logging or alternate-screen
        behavior. The terminal ignores these print-formatting functions when no printer is connected.
      reaffirms: dec_vt3xx_text.graphics-print-dec-private-modes
      parameters:
      - selector: 43
        symbol: DECGEPM
        set: Expanded image, approximately 300 x 200 mm (12 x 8 in), for 13-inch paper.
        reset: Compressed image, approximately 150 x 75 mm (6 x 3 in), for A4 or 8.5-inch paper.
        default: reset / compressed
      - selector: 44
        symbol: DECGPCM
        set: Color output (VT340 only).
        reset: Black-and-white output.
        default: reset / black and white
      - selector: 45
        symbol: DECGPCS
        set: RGB color coordinate system.
        reset: HLS color coordinate system.
        default: reset / HLS
        gate: Select only with VT340 color-print mode DECGPCM.
      - selector: 46
        symbol: DECGPBM
        set: Include the graphics background in printing.
        reset: Exclude the graphics background.
        default: reset / no background
        gate: Operates only when DECGPCM color-print mode is set.
      - selector: 47
        symbol: DECGRPM
        set: 90-degree rotated image, approximately 200 x 300 mm (8 x 12 in).
        reset: Compressed image, approximately 150 x 75 mm (6 x 3 in).
        default: reset / compressed
      size_note: Printed dimensions are approximate physical paper output sizes, never VT cell counts or exact image pixel quotas.
        Sixel output encoding depends on selected printer level; see graphics-printer-sixel-output.
      collisions:
      - dec-vt3xx-graphics-print-vs-xterm-mode-44
      - dec-vt3xx-graphics-print-vs-xterm-mode-45
      - dec-vt3xx-graphics-print-vs-xterm-mode-46
      - dec-vt3xx-graphics-print-vs-xterm-mode-47
      implementation_status: unassessed source semantics, not a selected Howl implementation requirement or proof of printer
        I/O
      accepted_reconciliations:
      - dec-vt3xx-graphics-print-vs-xterm-mode-45
      - dec-vt3xx-graphics-print-vs-xterm-mode-47
      - dec-vt3xx-graphics-print-vs-xterm-mode-44
      - dec-vt3xx-graphics-print-vs-xterm-mode-46
    - id: graphics-printer-sixel-output
      section: Chapter 16 / Sending Graphics and Sixel Graphics Levels, printed pages 258-261
      level: defined
      wire: CSI ? Ps i (hardcopy route) followed by printer-level sixel DCS
      rule: MC CSI ? 2 i routes subsequent ReGIS hardcopy to the host. CSI ? i or CSI ? 0 i routes it to printer. For a Media Copy request
        the terminal emits only sixel DCS (no preceding CR); pressing Local Print sends a preceding CR.
      printer_levels:
      - level: level-1
        format: 7-bit ESC P 1 q sixel-data ESC backslash
        device_aspect_ratio: 2 horizontal pixels to 1 vertical
        constraints: No set-raster-attributes, background-select, horizontal-grid-size or macro-parameter commands. Level-1 uses fixed print
          format and macro 1.
      - level: level-2
        format: 7-bit sixel DCS with macro, background, grid-size and raster-attribute parameters
        macro_parameter: '0'
        background_select: 1 = disabled, 2 = enabled
        grid_size_default: 6 for compressed, 9 for expanded or rotated
        pixel_aspect_ratio_default: numerator=1, denominator=1
        raster_extents: Pn6 and Pn7 are horizontal and vertical image pixel extents, not printed paper measurements.
      - level: LA210
        format: 'Special printer profile: macro 9 for expanded/rotated 1:1 aspect; level-1 form for compressed output'
        grid_size: 338 x 0.025 mm (13.5 x 0.001 in) for expanded/rotated
        compatibility: LA75 needs level-1 format for expanded or rotated output due to firmware differences.
      source_limit: Original printer-level grammar and physical sizing are documentary evidence. No target implementation or equivalence
        to VT text geometry is implied.
      related_original_media_copy: dec_vt240.media-copy-dec-private
    - id: sixel-display-mode
      section: Chapter 14 / Sixel Scrolling Mode / Sixel Display Mode Control Function, printed pages 237-238
      level: defined
      wire: CSI ? 80 h / CSI ? 80 l
      rule: On DEC VT330/VT340 graphics terminals, SET enables sixel scrolling and RESET disables sixel scrolling. This polarity
        is explicit in the original May 1988 edition, and is the opposite of the later DEC VT382 Thai control table and xterm/Foot/WezTerm.
      original_mode_semantics:
        source: DEC VT330/VT340 Graphics Programming, second edition May 1988, Chapter 14 pages 237-238
        name: DECSDM
        selector: 80
        set_wire: CSI ? 80 h
        set_effect: Enable sixel scrolling. Sixel cursor starts at the upper-left of the ANSI text cursor location; when the
          sixel active position reaches the graphics-page bottom margin, scrolling occurs; on exiting sixel mode, text cursor
          moves to current sixel cursor position.
        reset_wire: CSI ? 80 l
        reset_effect: Disable sixel scrolling. Sixel active position starts at upper-left of active graphics page, attempts
          to advance below bottom margin are ignored; exiting sixel mode does not move text cursor.
        default: The read Chapter 14 excerpts do not explicitly establish the initial DECSDM bit state for all VT300 models;
          do not infer one.
        page_semantics: Graphics-page bounds and sixel positioning, not text scrollback history, physical printer size or TUI-owned
          scroll state.
      competes_with: dec_vt382_thai.sixel-display-mode
      accepted_reconciliations:
      - decsdm-polarity-vt300-vt382
    - id: sixel-envelope-profile
      section: Chapter 14 / Sixel Data Format, printed pp.232-235
      level: defined
      wire: DCS P1 ; P2 ; P3 q sixels ST
      rule: Original VT300 sixel envelope, same command identity as pocket guide. P1 macro aspect vertical:horizontal omitted/0/1=2:1,2=5:1,3/4=3:1,5/6=2:1,7/8/9=1:1;
        raster attributes override. P2=0/2 paint unset bits current background;1 preserves existing pixel colors. P3 horizontal
        grid ignored on VT300 (fixed 0.0195 cm). Six-dot character 0x3f..0x7e, least significant bit top. Raster Pan/Pad integer
        aspect, rounded nearest integer on VT300; Ph/Pv pixels specify extent/background, never clip sixel data.
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: graphics_sixel.c:407-456
      related_command: dec_sixel.envelope
      source_note: Pinned xterm uses different macro table [200,200,450,300,250,183,150,130,112,100] vs horizontal 100; P2 non-1
        background register 0. Do not replace source macro values or reinterpret raster extents as clipping limits.
      pinned_xterm_rendered_aspect_observation:
        implementation: xterm_snapshots
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: graphics_sixel.c:409-456,214-272,298-306
        observation: The macro table is an intermediate representation only. update_sixel_aspect unconditionally overrides final
          pixw and pixh to 1 at lines 268-272 (#if 1 FIXME). The checked renderer therefore does not implement the documented
          non-square aspect ratios.
      accepted_reconciliations:
      - sixel-original-macro-aspect-vs-xterm
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: fragmented Sixel retains exact image placement and cursor lifetime'
        relation: wire-family
        legacy_records:
        - iterm2.dcs.sixel
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Sixel image rows scroll primary history while preserving cursor column'
        relation: protocol-family
      - file: howl-vt/src/sixel.zig
        test: Sixel decoder measures paints repeats colors and rolls back bounds
        relation: protocol-family
      - file: howl-vt/src/sixel.zig
        test: Sixel decoder releases every allocation failure boundary
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Sixel discard without cell geometry releases decoded pixels'
        relation: protocol-family
        note: Narrow regression evidence at 5cca2e7; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Sixel discard at full plane releases decoded pixels'
        relation: protocol-family
        note: Narrow regression evidence at 5cca2e7; not whole-clause qualification.
    - id: regis-envelope
      section: Chapter 1 / Entering and Exiting ReGIS, printed pp.13-14
      level: defined
      wire: DCS Pm p ReGIS-data ST
      rule: 'Enter ReGIS from VT100/VT300 mode. Pm omitted/0 resumes at last exit without command display;1 starts at command
        level without display;2 resumes with command display;3 starts new command with display. ST exits. Command display is
        bottom line: LF erases line and graphic previously drawn there; each character interpreted, normal intensity/nonblinking,
        at most 80 characters before line cleared on next character, excludes control/8-bit characters. This is envelope and
        mode behavior, not full ReGIS grammar.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-73e92f91aa
        source_line: 3254
        wire: DCS Pm p Pr..Pr ST
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: misc.c:5349-5359; graphics_regis.c:7651-7695
      source_note: Pinned xterm enters parser with persistent state; Pmode 1/3 or first image initializes it. Full command-display
        and persistence semantics not proved.
  dec_vt382_thai:
    title: VT382 Thai Display Terminal Installing and Using Manual
