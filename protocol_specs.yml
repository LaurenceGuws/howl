    - id: announce-ecma43-level-1
      section: 15.2.2 Table 7 (facility 12/13/14), printed pp.37-39; 10.3.1
      level: defined
      wire: ESC SP L
      rule: 'Announce ECMA-43 level 1 for subsequent information interchange (facility 12). Elementary 8-bit structure: C0,
        G0 in GL, SPACE/DELETE, G1 in GR and optional C1; initial designation only. This announces code structure, not DEC
        terminal operating level or a generic reset.'
      also_documented:
