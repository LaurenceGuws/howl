    snapshot_sha256: 82cd72ac56c8bbd798e9a4bf47c946dc3b7fddf98a8dac3f614b95fd51071a75
    scope: Selected Setup State private mode 12, with other profile-specific selectors recorded as context, not a complete
      AT&T emulation contract.
    clauses:
    - id: cursor-blink-mode
      section: Appendix D, pp.D-2/D-3; Setup State Set/Reset Private Mode
      level: defined
      wire: CSI ? 12 h / CSI ? 12 l
      rule: SET selects blinking cursor; RESET selects steady cursor. Cursor type (block/underscore) is separate mode 11;
        visibility is mode 25. Private 12 is not the unprefixed setup mode 12 local echo. Other private modes can appear in
        a semicolon list in the original table.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-12-h-line-925
        source_line: 925
        wire: CSI ? 12 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-12-l-line-1074
        source_line: 1074
        wire: CSI ? 12 l
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:7621-7626; misc.c:5512-5514
      source_note: Xterm only changes the blink escape preference when SettableCursorBlink permits it. Original source establishes
        mode identity and polarity, not host timer/visibility policy.
    - id: setup-private-profile-context
      section: Appendix D, pp.D-2/D-3
      level: defined
      wire: CSI ? Pm h / CSI ? Pm l
      rule: Original setup private selectors have AT&T-specific meanings. Preserve relevant collisions rather than assume
        xterm semantics are universal.
      selectors:
        '10':
          set: Blank screen
          reset: Unblank screen
        '11':
          set: Underscore cursor
          reset: Block cursor
        '13':
          set: Labels off
          reset: Labels on
        '14':
          set: Cartridge in use
          reset: Cartridge idle
        '15':
          set: Check parity yes
          reset: Check parity no
        '16':
          set: Keyclick on
          reset: Keyclick off
      source_note: Mode 10 is a third original profile beside rxvt menu/xterm toolbar. Modes 13/14 are AT&T setup state, not
        xterm read-only blink preferences. Index as distinct hardware profile; no compatibility target selected.
