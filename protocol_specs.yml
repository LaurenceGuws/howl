        - kitty.csi.kitty_set
    - id: associated-text
      section: Report associated text
      level: defined
      wire: flag 16
      rule: Includes Unicode text code points with encoded key events when the applicable enhancement is active.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard stack has exact flags depth mutation and replies
        relation: protocol-family
        legacy_records:
        - iterm2.csi.kitty_set
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty keyboard CSI rejects signed i32 overflow without losing subsequent commands
        relation: protocol-family
        legacy_records:
        - kitty.csi.kitty_set
      - file: howl-vt/src/input.zig
        test: alternate-key and associated-text flags do not enable reporting by themselves
        relation: protocol-family
    - id: legacy
      section: Legacy key event encoding
      level: defined
      wire: legacy text / CSI / SS3
      rule: Default compatibility mode emits traditional key sequences or UTF-8 text without enabling advanced event reporting.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: application keypad modes affect keypad encoding and DECRQM
        relation: protocol-family
        legacy_records:
        - libvterm.esc.deckpam
        - libvterm.esc.deckpnm
        - iterm2.esc.deckpam
        - iterm2.esc.deckpnm
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm DECCKM keeps global key mode and exact phantom across both banks
        relation: protocol-family
        legacy_records:
        - libvterm.mode.decckm
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: application cursor mode changes arrow key encoding
        relation: protocol-family
        legacy_records:
        - iterm2.mode.decckm
        - kitty.mode.decckm
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty ESC keypad handlers are GUI-owned while Howl changes VT mode
        relation: protocol-family
        legacy_records:
        - kitty.esc.deckpnm
        - kitty.esc.deckpam
      - file: howl-vt/src/input.zig
        test: named key classes retain exact legacy encodings
        relation: protocol-family
      - file: howl-vt/src/input.zig
        test: legacy control encoding ignores num lock
        relation: protocol-family
      - file: howl-vt/src/input.zig
        test: legacy shift identity ignores num lock
        relation: protocol-family
    - id: event-envelope
      section: docs/keyboard-protocol.rst:125-146
      level: defined
      wire: CSI unicode-key[:alternate-keys] [ ; modifiers[:event-type] [ ; text-codepoints ] ] u
      rule: Decimal fields semicolon separated, subfields colon separated; only primary key mandatory. Text vs encoded event depends on
        progressive flags.
    - id: modifier-mask
      section: docs/keyboard-protocol.rst:186-219
      level: defined
      wire: modifier-field = 1 + bitmask
      rule: Shift1 Alt2 Ctrl4 Super8 Hyper16 Meta32 CapsLock64 NumLock128; omitted defaults1. Actual modifier state includes current press/release
        and other side still pressed.
    - id: feature-detection
      section: docs/keyboard-protocol.rst:441-458
      level: defined
      wire: CSI ? u followed by CSI c
      rule: DA1 after enhancement query for detection; set desired flags then query current flags for supported subset. Source strongly
        encourages complete enhancements.
  kitty_graphics:
    title: Kitty terminal graphics protocol
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/graphics-protocol.rst
    scope: Selected documented transport, image, placement, indexed color, animation and lifetime clauses
    clauses:
    - id: envelope
      section: The graphics escape code
      level: defined
      wire: APC G control ; payload ST
      rule: Graphics commands use APC G with comma-delimited control fields and an optional data payload.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: fragmented Kitty static graphics retains display and query is probe only'
        relation: protocol-family
        legacy_records:
        - kitty.apc.graphics
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Yazi-style anonymous Kitty preview is quiet stationary and deletable'
        relation: protocol-family
        legacy_records:
        - kitty.graphics.transmit_default
    - id: rgb-rgba
      section: Transferring pixel data / RGB and RGBA data
      level: defined
      wire: a=t/T f=24|32 s=width v=height
      rule: Direct RGB/RGBA data uses exactly three or four sRGB bytes per pixel with explicit dimensions.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Yazi-style anonymous Kitty preview is quiet stationary and deletable'
        relation: protocol-family
        legacy_records:
        - kitty.graphics.transmit
        - kitty.graphics.transmit_display
    - id: indexed-8
      section: Indexed color data
      level: defined
      wire: f=8
      rule: Each pixel retains one opaque 256-color palette index; image colors follow the current terminal palette.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: indexed Kitty pixels follow canonical palette mutations without losing alpha or image identity'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.format_indexed8
    - id: indexed-16
      section: Indexed color data
      level: defined
      wire: f=16
      rule: Each pixel retains its palette index and an independent alpha byte; palette changes update RGB without changing alpha.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: indexed Kitty zlib, query, stack restore and forbidden animation preserve owned bytes'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.format_indexed16
    - id: indexed-special
      section: Indexed color data
      level: defined
      wire: palette indices 248..255
      rule: Special indexed values select default, selection, cursor, URL-hover and fallback foreground/background colors as documented.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: indexed Kitty pixels follow canonical palette mutations without losing alpha or image identity'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.format_indexed8
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: indexed Kitty zlib, query, stack restore and forbidden animation preserve owned bytes'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.format_indexed16
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Kitty indexed image special palette slots are live with foreground and background fallbacks'
        relation: protocol-family
    - id: png
      section: PNG data
      level: defined
      wire: f=100
      rule: Accepts a PNG encoded image with dimensions determined from PNG data.
    - id: compressed
      section: Compression
      level: defined
      wire: o=z
      rule: Allows zlib-compressed transmitted image data subject to the declared uncompressed size.
      test_locations:
      - file: howl-vt/src/graphics.zig
        test: Kitty zlib checksum failures preserve images and frames before valid recovery
        relation: protocol-family
    - id: mediums
      section: The transmission medium
      level: defined
      wire: t=d|f|t|s
      rule: Specifies direct and local-file/shared-memory transmission media with the applicable local/remote rules.
    - id: query
      section: Querying support and available transmission mediums
      level: defined
      wire: a=q / query payload
      rule: A capability query does not itself display or retain the image and returns a protocol reply.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Yazi-style anonymous Kitty preview is quiet stationary and deletable'
        relation: protocol-family
        legacy_records:
        - kitty.graphics.query
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Kitty frame animation and composition feature queries are action typed'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.feature_query
    - id: put
      section: Display images on screen
      level: defined
      wire: a=p / a=T
      rule: Placements refer to previously transmitted image data with their own identity and geometry.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Yazi-style anonymous Kitty preview is quiet stationary and deletable'
        relation: protocol-family
        legacy_records:
        - kitty.graphics.transmit_display
      - file: howl-vt/src/terminal.zig
        test: virtual parent resolves from Unicode placeholder cells and follows text without mutating image data
        relation: protocol-family
        legacy_records:
        - kitty.graphics.put
    - id: unicode
      section: Unicode placeholders
      level: defined
      wire: U=1 plus U+10EEEE cells
      rule: A virtual placement follows matching Unicode placeholder cell positions and moves with text.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: virtual parent resolves from Unicode placeholder cells and follows text without mutating image data
        relation: protocol-family
        legacy_records:
        - kitty.graphics.put
      - file: howl-vt/src/terminal.zig
        test: virtual parent's physical child obeys all six canonical geometry selectors
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete_point
    - id: relative
      section: Relative placements
      level: defined
      wire: P=parent-image Q=placement H/V=offsets
      rule: A placement may attach to a parent physical or Unicode placement with a bounded, cycle-free ancestry and lifetime.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: virtual parent resolves from Unicode placeholder cells and follows text without mutating image data
        relation: protocol-family
        legacy_records:
        - kitty.graphics.put
      - file: howl-vt/src/terminal.zig
        test: virtual parent's physical child obeys all six canonical geometry selectors
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete_point
        - kitty.graphics.delete_point3d
    - id: delete
      section: Deleting images
      level: defined
      wire: a=d d=selector
      rule: Lowercase selectors retire placements; uppercase variants additionally reclaim unreferenced decoded image data.
      test_locations:
      - file: howl-vt/src/graphics.zig
        test: static delete selectors preserve placement and image ownership distinctions
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete
        - kitty.graphics.delete_all
        - kitty.graphics.delete_id
        - kitty.graphics.delete_number
        - kitty.graphics.delete_default
      - file: howl-vt/src/graphics.zig
        test: Kitty uppercase range deletion cannot reclaim unplaced data from another bank
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete_range
      - file: howl-vt/src/terminal.zig
        test: virtual parent's physical child obeys all six canonical geometry selectors
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete_point
        - kitty.graphics.delete_point3d
        - kitty.graphics.delete_x
        - kitty.graphics.delete_y
        - kitty.graphics.delete_z
        - kitty.graphics.delete_cursor
      - file: howl-vt/src/graphics.zig
        test: Kitty animation control compose and frame deletion retain Howl shared-plane bank policy
        relation: protocol-family
        legacy_records:
        - kitty.graphics.delete_frame
    - id: replies
      section: Suppressing responses from the terminal
      level: defined
      wire: q=0|1|2
      rule: Selects normal responses or suppresses response categories as documented.
    - id: frame-load
      section: Animation / Transferring animation frame data
      level: defined
      wire: a=f
      rule: Transmits numbered animation-frame data subject to base/edit and timing rules.
      test_locations:
      - file: howl-vt/src/graphics.zig
        test: Kitty frame loading preserves edits background bases and action-specific composition
        relation: protocol-family
        legacy_records:
        - kitty.graphics.frame
    - id: animation
      section: Animation / Controlling animations
      level: defined
      wire: a=a
      rule: Controls animation state, loop count, current frame and frame durations.
      test_locations:
      - file: howl-vt/src/graphics.zig
        test: Kitty animation control compose and frame deletion retain Howl shared-plane bank policy
        relation: protocol-family
        legacy_records:
        - kitty.graphics.animate
    - id: composition
      section: Animation / Composing animation frames
      level: defined
      wire: a=c
      rule: Composes bounded regions from one animation frame to another.
      test_locations:
      - file: howl-vt/src/graphics.zig
        test: Kitty animation control compose and frame deletion retain Howl shared-plane bank policy
        relation: protocol-family
        legacy_records:
        - kitty.graphics.compose
    - id: no-indexed-animation
      section: Indexed color data
      level: defined
      wire: f=8|16 with a=f|a=c
      rule: Indexed images do not support animation-frame loading or frame composition.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: indexed Kitty zlib, query, stack restore and forbidden animation preserve owned bytes'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.format_indexed16
    - id: quota
      section: Image persistence and storage quotas
      level: defined
      wire: retained image resources
      rule: Terminals may bound image retention and prefer reclaiming unplaced image data under storage pressure.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Yazi-style anonymous Kitty preview is quiet stationary and deletable'
        relation: protocol-family
        legacy_records:
        - kitty.graphics.query
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Kitty frame animation and composition feature queries are action typed'
        relation: protocol-family
        legacy_records:
        - kitty_delta.graphics.feature_query
    - id: direct-chunks
      section: docs/graphics-protocol.rst:470-495
      level: defined
      wire: APC G ... ,m=1 ; base64 ST / APC G m=0 ; base64 ST
      rule: Encoded chunks <=4096 bytes; nonfinal multiple of four; subsequent chunks only m and optional q, plus a=f for animation frames.
        Finish before other graphics commands; final-chunk cursor used, no display before validation.
    - id: feature-query
      section: docs/graphics-protocol.rst:548-609
      level: defined
      wire: APC G a=q,i=id,e=action[,keys] ST / APC G i=id[,e=action,supported-keys] ; OK ST
      rule: No data or state effect, including active transfer. Echo supported nondefault action-specific values; absent e means action
        unsupported. Exclude a,i,I,m,q from feature field list (i response identity). e only in query; i required. DA1 ordering.
    - id: image-number
      section: docs/graphics-protocol.rst:967-996
      level: defined
      wire: APC G a=t|T,I=number ; data ST / APC G i=id,I=number ; OK ST
      rule: Nonunique image number requests unique terminal-assigned id; later I selects newest matching image. Both i and I in request
        EINVAL unless silenced.
    - id: placement-identity
      section: docs/graphics-protocol.rst:635-660
      level: defined
      wire: APC G a=p,i=id,p=placement ST
      rule: Nonzero image/placement pair identifies replacement; p=0 or omitted allows multiple placements; p ignored for id=0. Retransmitting
        explicit image id deletes old data and all placements.
    - id: placement-layout
      section: docs/graphics-protocol.rst:667-688
      level: defined
      wire: APC G a=p,x=...,y=...,w=...,h=...,X=...,Y=...,c=...,r=... ST
      rule: Source crop intersection; X/Y offsets smaller than cell. c/r destination cell counts, one missing preserves aspect ratio,
        both letterbox/pillarbox. Offsets not added to counts.
    - id: placement-z-order
      section: docs/graphics-protocol.rst:690-698
      level: defined
      wire: APC G a=p,z=signed-index ST
      rule: Negative z below text; below -1073741824 below nondefault backgrounds. Equal z lower image id below higher; same z and id
        undefined.
    - id: placement-cursor-policy
      section: docs/graphics-protocol.rst:700-710
      level: defined
      wire: APC G a=p|T,C=1 ... ST
      rule: Default cursor moves right placement columns and down rows; out-of-screen/region implementation-defined. C=1 suppresses movement.
    - id: delete-selectors
      section: docs/graphics-protocol.rst:907-952
      level: defined
      wire: APC G a=d[,d=a|A|i|I|n|N|c|C|f|F|p|P|q|Q|r|R|x|X|y|Y|z|Z] ST
      rule: Selectors distinguish visible placements, image id/latest number and optional placement, cursor, animation frame, cell, cell+z,
        inclusive id range, column,row,z. Cells one-based; uppercase permits reclamation if unreferenced; any delete aborts unfinished
        upload.
    - id: file-read-privacy
      section: docs/graphics-protocol.rst:388-443
      level: defined
      wire: APC G t=f|t|s[,S=size,O=offset] ; base64-name ST
      rule: Regular files only; bounded symlink resolution; pre-open reject special files. Temporary deletion restricted to known directory
        and protocol filename. POSIX SHM names passed unchanged incl no leading slash, read/unlink/close; Windows close. File-read failures
        indistinguishable to client.
    - id: usage-hints
      section: docs/graphics-protocol.rst:1001-1017
      level: defined
      wire: APC G a=t|T|f,N=bitmask ... ST
      rule: N bit1 transient hint, may ignore; caching/eviction, propagates through frame composition, no placement effect.
    - id: terminal-interaction
      section: docs/graphics-protocol.rst:1320-1337
      level: defined
      wire: RIS / ED 2 / DECSET 1049 / scrolling
      rule: Reset clears visible images; 1049 entry clears alternate images. ED2 should clear images; other text erases must not. Scroll
        images with text; margin index scroll only images wholly inside region, clipping boundary.
  kitty_clipboard:
    title: Kitty clipboard protocol (OSC 5522)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/clipboard.rst
    scope: Read/write, MIME, permission, paste events, detection and multiplexing
    clauses:
    - id: envelope
      section: Copying all data types to the clipboard
      level: defined
      wire: OSC 5522 ; metadata ; base64 ST
      rule: Transports clipboard requests and replies with MIME-aware metadata and standard base64 data.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: Kitty OSC 5522 shares ordered clipboard admission without caller policy
        relation: protocol-family
        legacy_records:
        - kitty.osc.clipboard_5522
    - id: read
      section: Reading data from the system clipboard
      level: defined
      wire: type=read
      rule: Requests selected MIME types or the available MIME list, with the terminal allowed to require user permission.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: Kitty OSC 5522 shares ordered clipboard admission without caller policy
        relation: protocol-family
        legacy_records:
        - kitty.osc.clipboard_5522
    - id: write
      section: Writing data to the system clipboard
      level: defined
      wire: type=write
      rule: Transfers MIME-labeled clipboard data through status and chunked content rules.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: Kitty OSC 5522 shares ordered clipboard admission without caller policy
        relation: protocol-family
        legacy_records:
        - kitty.osc.clipboard_5522
    - id: password
      section: Avoiding repeated permission prompts
      level: defined
      wire: pw=... name=...
      rule: A named permission token can avoid repeated prompts when the user has authorized its scope.
    - id: paste-events
      section: Allowing terminal applications to respond to paste events
      level: defined
      wire: CSI ? 5522 h/l
      rule: When enabled, the host reports paste-triggered MIME availability for application-directed retrieval.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: low priority private modes and media copy retain caller-neutral state
        relation: wire-family
        legacy_records:
        - kitty.mode.paste_events
    - id: detection
      section: Detecting support for this protocol
      level: defined
      wire: CSI ? 5522 $ p
      rule: Uses standard mode-query reporting to discover whether paste event mode is supported.
    - id: mux-id
      section: Support for terminal multiplexers
      level: defined
      wire: id=...
      rule: Response metadata preserves the sanitized request id so a multiplexer can route responses.
    - id: mime-alias
      section: docs/clipboard.rst:162-173
      level: defined
      wire: OSC 5522 ; type=walias:mime=base64-target ; base64-alias-list ST
      rule: Space-separated MIME aliases share already transmitted target data; between initial write and end-of-data.
    - id: base64-admission
      section: docs/clipboard.rst:23-45
      level: defined
      wire: OSC 5522 Base64 payload / mime / name / pw
      rule: Standard padded Base64; no silent discard invalid characters. Invalid write EINVAL abort, invalid read ignored. wdata padding
        applies to concatenation for one MIME.
    - id: read-response
      section: docs/clipboard.rst:47-102
      level: defined
      wire: OSC 5522 ; type=read:status=OK|DATA|DONE[:mime=base64] [ ; base64 ] ST
      rule: loc=primary optional; Base64 period queries MIME list. OK then sequential MIME DATA chunks <=4096 decoded bytes each padded
        as needed; DONE. Errors ENOSYS/EPERM/EBUSY instead of OK. Listing should not prompt.
    - id: write-data
      section: docs/clipboard.rst:105-160
      level: defined
      wire: OSC 5522 ; type=wdata:mime=base64 ; base64 ST / OSC 5522 ; type=wdata ST
      rule: Sequential chunks per MIME after type=write; <=4096 decoded bytes; no MIME/data ends, DONE reply. EIO/EINVAL/ENOSYS/EPERM/EBUSY/EFBIG
        abort and discard, ignore until next write. Source minimum acceptance64MB.
    - id: paste-password
      section: docs/clipboard.rst:200-221,264-266
      level: defined
      wire: DECSET 5522 unsolicited paste-event MIME list
      rule: One-time Base64 pw recommended with name Paste event; unsolicited event no mux id. Exact event wire requires linked ancillary
        specification.
  kitty_color:
    title: Kitty color control and color stack
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/color-stack.rst
    scope: Original OSC color stack and OSC 21 named color controls
    clauses:
    - id: push
      section: Saving and restoring colors
      level: defined
      wire: OSC 30001 ST
      rule: Saves the current terminal dynamic colors and 256-entry ANSI palette to a bounded stack.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: kitty indexed color stack exposes default-filled slot and reset extent differences
        relation: wire-family
        legacy_records:
        - kitty.osc.color_push
    - id: pop
      section: Saving and restoring colors
      level: defined
      wire: OSC 30101 ST
      rule: Restores a previously saved color state and its palette without confusing it with host defaults.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: kitty indexed color stack exposes default-filled slot and reset extent differences
        relation: wire-family
        legacy_records:
        - kitty.osc.color_pop
    - id: set
      section: Setting and querying colors
      level: defined
      wire: OSC 21 ; name=color ST
      rule: Sets named terminal colors using the published key/value and color encoding rules.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: kitty OSC 21 groups ordered queries with eight bit RGB and one reply
        relation: wire-family
        legacy_records:
        - kitty.osc.kitty_color
    - id: query
      section: Querying current color values
      level: defined
      wire: OSC 21 ; name=? ST
      rule: Reports currently resolved values for requested named colors, including unset-color semantics.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: kitty OSC 21 groups ordered queries with eight bit RGB and one reply
        relation: wire-family
        legacy_records:
        - kitty.osc.kitty_color
    - id: named-slots
      section: docs/color-stack.rst:58-82
      level: defined
      wire: OSC 21 ; key=value ST
      rule: Palette0..255, foreground/background, selection_background/foreground,cursor/cursor_text,visual_bell,transparent_background_color1..7.
        Palette cannot be dynamic; other dynamic meanings advisory.
    - id: reset-dynamic
      section: docs/color-stack.rst:124-147
      level: defined
      wire: OSC 21 ; key / key= / key=value / key=? (BEL | ST)
      rule: Bare key restores configured default; key= dynamic/unset; explicit value sets; ordered set/query may coexist.
    - id: unknown-query-field
      section: docs/color-stack.rst:106-121
      level: defined
      wire: OSC 21 ; unknown=unpadded-base64(field-name) ST
      rule: One encoded unknown-name field per unknown requested field, in request order; no verbatim echo or padding.
    - id: color-encoding
      section: docs/color-stack.rst:152-180
      level: defined
      wire: 'rgb:R/G/B / #RGB... / rgbi:r/g/b'
      rule: rgb components1..4 hex digits scaled by precision; hash forms3/6/9/12 digits specify MSBs of 16-bit components, not replication.
        rgbi floats with optional sign/exponent clipped [0,1].
    - id: alpha
      section: docs/color-stack.rst:72-76,182-191
      level: defined
      wire: color@alpha
      rule: Default1; clip to [0,1], negative context-specific meaning (transparent-background slot uses configured opacity). Source example
        rgb:ff0000@0.1 differs from slash grammar; preserve ambiguity.
  kitty_notification:
    title: Kitty desktop notifications (OSC 99)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/desktop-notifications.rst
    scope: Notification commands and application callbacks; visual desktop policy is host-owned
    clauses:
    - id: envelope
      section: Desktop notifications
      level: defined
      wire: OSC 99 ; metadata ; payload ST
      rule: Transmits notification fields and optional payload chunks with an explicit metadata separator.
      test_locations:
      - file: howl-app/src/consequences.zig
        test: terminal consequences only request attention for focus and attention notifications
        relation: protocol-family
        legacy_records:
        - kitty.osc.notify_99
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC notifications retain ordered bounded caller-neutral occurrences
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC notification bounds preserve the FIFO and wrap without reuse
        relation: protocol-family
    - id: chunks
      section: Desktop notifications
      level: defined
      wire: i=notification-id d=0|1
      rule: i identifies pending notification; d=0 holds,1/default completes. Concatenate title/body chunks; raw payload <=2048 bytes
        before encoding or <=4096 encoded bytes. Encoding before/after chunking supported with stated padding rules.
      source_locator: docs/desktop-notifications.rst:52-69,513-523
    - id: title-body
      section: Desktop notifications
      level: defined
      wire: p=title|body
      rule: Title/body payloads are plain safe UTF-8 or marked base64; markup is not assumed.
    - id: activation
      section: Being informed when user activates the notification
      level: defined
      wire: OSC 99 ; a=report[,focus] ; payload ST / OSC 99 ; i=id ; ST
      rule: Default focus action; report requests client activation feedback; negative action disables it (a=-focus). Reply id0 when omitted.
        Ignore unknown metadata keys; unknown values best effort or discard notification.
      source_locator: docs/desktop-notifications.rst:102-130
    - id: close
      section: Updating or closing an existing notification
      level: defined
      wire: OSC 99 ; i=id ; notification-payload ST / OSC 99 ; i=id:p=close ; ST
      rule: Same id updates still displayed notification or creates new if gone. Absent i always distinct; closing nonexistent id or without
        i is no-op.
      source_locator: docs/desktop-notifications.rst:175-198
    - id: query
      section: Querying for support
      level: defined
      wire: OSC 99 ; i=id:p=? ; ST / OSC 99 ; i=id:p=? ; capabilities ST
      rule: Echo query i; supported a,c,o,p,s,u,w keys; omit unsupported actions/urgency, default o=always, p includes title; c=1 close
        support, w=1 expiry support. DA1 ordering.
      source_locator: docs/desktop-notifications.rst:367-424
    - id: filtering
      section: docs/desktop-notifications.rst:71-94,449-485
      level: defined
      wire: OSC 99 ; f=app:t=type[:t=type] ST
      rule: Base64 UTF-8 app name and repeatable type/category for filtering; payload framing per envelope.
    - id: close-report
      section: docs/desktop-notifications.rst:133-160
      level: defined
      wire: OSC 99 ; i=id:c=1 ; payload ST / OSC 99 ; i=id:p=close ; [untracked] ST
      rule: Close feedback; id0 if absent; untracked if platform cannot know closure; activation+close both when requested; update renews
        close request.
    - id: alive-query
      section: docs/desktop-notifications.rst:161-172
      level: defined
      wire: OSC 99 ; i=id:p=alive ; ST / OSC 99 ; i=id:p=alive ; comma-separated-ids ST
      rule: Poll live notifications with echoed correlation id.
    - id: expiry
      section: docs/desktop-notifications.rst:201-214
      level: defined
      wire: OSC 99 ; w=milliseconds ; payload ST
      rule: -1 default OS policy; 0 best-effort never expire; positive ms guarantees closed by deadline, possibly earlier.
    - id: icon-name
      section: docs/desktop-notifications.rst:217-260
      level: defined
      wire: OSC 99 ; n=base64-name[:n=base64-name] ; payload ST
      rule: Try names in order; standard symbol names required; app name fallback when icon absent.
    - id: icon-data-cache
      section: docs/desktop-notifications.rst:262-299
      level: defined
      wire: OSC 99 ; p=icon:e=1:g=id ; base64-image ST
      rule: PNG/JPEG/GIF, recommended256x256; named icon precedence. g cache id independent of notification id, process lifetime bounded
        eviction; mux recaches on reattach.
    - id: buttons
      section: docs/desktop-notifications.rst:303-324
      level: defined
      wire: OSC 99 ; p=buttons ; labels ST / OSC 99 ; i=id ; button-number ST
      rule: Labels UTF-8 separated U+2028 or Base64; a=report returns one-based button, empty ordinary activation; no reply absent report
        request.
    - id: sound
      section: docs/desktop-notifications.rst:336-364
      level: defined
      wire: OSC 99 ; s=base64-name ; payload ST
      rule: Default system; silent suppresses sound; standard names system,silent,error,warn/warning,info,question; support query.
    - id: occasion-urgency
      section: docs/desktop-notifications.rst:465-491
      level: defined
      wire: OSC 99 ; o=always|unfocused|invisible:u=0|1|2 ; payload ST
      rule: Default always; unfocused lacks keyboard focus; invisible also not shown. Urgency low/normal/critical, normal default.
    - id: safe-values
      section: docs/desktop-notifications.rst:513-554
      level: defined
      wire: OSC 99 metadata and payload encodings
      rule: Safe UTF-8 excludes U+0000..001F, DEL,U+0080..009F; identifier ASCII letters/digits/_/-/+/.; reject or strip invalid chars
        before echo; Base64 padding depends on chunking stage.
  kitty_text_size:
    title: Kitty text sizing protocol (OSC 66)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/text-sizing-protocol.rst
    scope: Sizing syntax, geometry, fractional scaling and editing interactions
    clauses:
    - id: envelope
      section: The escape code
      level: defined
      wire: OSC 66 ; metadata ; text (BEL | ST)
      rule: Colon-separated metadata and escape-safe UTF-8 text <=4096 bytes per command, longer strings split. BEL or ESC backslash terminator.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: OSC 66 fixed cluster is fragmented, bounded, and overwritten atomically
        relation: protocol-family
        legacy_records:
        - kitty.osc.text_size
      - file: howl-vt/src/terminal.zig
        test: OSC 66 malformed and overlong cell text preserve terminal state
        relation: protocol-family
      source_locator: docs/text-sizing-protocol.rst:49-82
    - id: scale
      section: How it works
      level: defined
      wire: s=1..7 w=0..7
      rule: s=1..7 default1; w=0..7 default0. Nonzero w reserves s*w columns by s rows for whole command text; zero uses normal text segmentation
        and scales cells.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: OSC 66 fixed cluster is fragmented, bounded, and overwritten atomically
        relation: protocol-family
        legacy_records:
        - kitty.osc.text_size
      - file: howl-vt/src/terminal.zig
        test: OSC 66 malformed and overlong cell text preserve terminal state
        relation: protocol-family
      source_locator: docs/text-sizing-protocol.rst:69-74,85-145
    - id: fraction
      section: Fractional scaling
      level: defined
      wire: n numerator d denominator
      rule: n,d=0..15 defaults0; nonzero d>n. Fraction changes rendering not cell occupancy. v=0 top,1 bottom,2 center; h=0 left,1 right,2
        center; only with n<d.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: OSC 66 fixed cluster is fragmented, bounded, and overwritten atomically
        relation: protocol-family
        legacy_records:
        - kitty.osc.text_size
      source_locator: docs/text-sizing-protocol.rst:76-82,147-176
    - id: editing
      section: Wrapping and overwriting behavior
      level: defined
      wire: sized text cells
      rule: Writing, wrapping and erase/edit operations preserve the logical multi-cell text association.
      test_locations:
      - file: howl-vt/src/terminal.zig
        test: OSC 66 fixed cluster is fragmented, bounded, and overwritten atomically
        relation: protocol-family
        legacy_records:
        - kitty.osc.text_size
      - file: howl-vt/src/terminal.zig
        test: OSC 66 malformed and overlong cell text preserve terminal state
        relation: protocol-family
      - file: howl-vt/src/terminal.zig
        test: OSC 66 cluster survives whole-grid scroll and erase repairs every member
        relation: protocol-family
      - file: howl-vt/src/terminal.zig
        test: OSC 66 character insertion removes the whole intersecting cluster
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: rectangle rendition preserves complete wide and sized character ownership'
        relation: protocol-family
        note: Narrow regression evidence at a89ed30; not whole-clause qualification.
    - id: detection
      section: Detecting if the terminal supports this protocol
      level: defined
      wire: CR ; CSI 6 n ; OSC 66 ; w=2 ; space BEL ; CSI 6 n ; OSC 66 ; s=2 ; space BEL ; CSI 6 n
      rule: CPR before and after w=2 space and s=2 space; unchanged unsupported, respective +2 advance indicates width and scale support.
      source_locator: docs/text-sizing-protocol.rst:257-271
    - id: cursor-interaction
      section: docs/text-sizing-protocol.rst:282-296
      level: defined
      wire: ordinary cursor controls / OSC 66
      rule: Single-cell cursor motion includes multicell interior; creation advances s*w on same row. Cursor presentation covering complete
        block recommended.
    - id: horizontal-edits
      section: docs/text-sizing-protocol.rst:307-325
      level: defined
      wire: CSI Pn @ / CSI Pn P / CSI Pn X with multicell text
      rule: ICH/DCH erase multiline clusters intersecting affected row suffix and single-row clusters split at edit boundaries; ECH erases
        whole intersecting clusters.
    - id: display-line-edits
      section: docs/text-sizing-protocol.rst:327-348
      level: defined
      wire: CSI Ps J / CSI Ps K / CSI Pn L / CSI Pn M with multicell text
      rule: ED/EL erase intersecting clusters; ED22 first archives screen including clusters. IL removes clusters split at insertion or
        bottom edge; DL removes clusters intersecting deleted rows.
    - id: wrap-size
      section: docs/text-sizing-protocol.rst:219-232
      level: defined
      wire: OSC 66 / DECAWM / resize
      rule: Discard multicell block larger than screen in either dimension, including after resize. With wrap enabled move to next line
        if width does not fit; without wrap move cursor back enough to fit before drawing.
    - id: overwrite-order
      section: docs/text-sizing-protocol.rst:234-253
      level: defined
      wire: text / OSC 66 intersecting multicell block
      rule: 'Priority: combining attaches to existing block; top-left overwrite erases entire block; other top-row overwrite replaces
        entire block by spaces; later-row overwrite skips past occupied cells before writing independently of DECAWM.'
    - id: segmentation
      section: docs/text-sizing-protocol.rst:353-425
      level: defined
      wire: UTF-8 stream to cell clusters
      rule: 'Unicode17-based evolving algorithm: replace each maximal ill-formed UTF-8 subpart with U+FFFD, handle ASCII controls first,
        discard NUL and invalid Cc/Cs/noncharacters; previous cell includes prior wrapped line if no line break. UAX29 boundary determines
        append/new cell; zero-width attaches to previous even at boundary, discarded without previous. Nonzero SpacingMark U+0E33/U+0EB3
        can widen prior single unscaled implicit-width cell. Exact algorithm dependency remains to qualify.'
    - id: scalar-width
      section: docs/text-sizing-protocol.rst:426-461
      level: defined
      wire: Unicode scalar width calculation
      rule: 'Priority: regional indicators width2; EAW W/F and specified CJK ranges unless A width2; Basic_Emoji excluding FE0F-required
        sequences and leading modifier/tag/flag codepoints width2; M/Cf and emoji modifiers width0; other width1. Exact ranges and pinned
        Unicode data dependency still require enumeration.'
    - id: variation-selectors
      section: docs/text-sizing-protocol.rst:465-496
      level: defined
      wire: U+FE0E / U+FE0F
      rule: Implicit-width emoji shrink2->1 for VS15 under Basic_Emoji rule; VS16 grows eligible single unscaled cell1->2. Explicit w
        never resized by selectors or spacing marks. Wrapped wide emoji narrowed by VS15 does not move back to previous line.
  kitty_pointer:
    title: Kitty mouse pointer shape control
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/pointer-shapes.rst
    scope: Set, push/pop, query and bounded stack rules for OSC 22 pointer shapes
    clauses:
    - id: set
      section: Setting the pointer shape
      level: defined
      wire: OSC 22 ; [=]shape ST
      rule: Requests the documented mouse pointer shape by name.
      exact_source_semantics: Optional = or no leader followed by one portable shape name; empty payload resets to terminal-selected default.
        The original xterm shape names may be provided as aliases, not required by Kitty.
      pinned_source_observation:
        revision: a79f376b85fd95e3dfd0589877123996bacd4184
        location: kitty/window.py:3120-3135; kitty/screen.c:2441-2548
        behavior: Set replaces top or initializes it, empty selects INVALID_POINTER at top; unknown names raise KeyError and are ignored;
          code also iterates comma-separated set items, beyond singular prose.
      accepted_reconciliations:
      - osc22-pointer-reset-invalid-profile
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 retains ordered bounded caller-neutral requests
        relation: protocol-family
        legacy_records:
        - iterm2.osc.pointer
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 query reply is one direct transactional operation
        relation: protocol-family
        legacy_records:
        - kitty.osc.pointer
    - id: stack
      section: Pushing and popping shapes onto the stack
      level: defined
      wire: OSC 22 ; >names / < ST
      rule: Push all listed names in order, last is top/current; evict bottom when full, capacity >=16. Pop one, ignore name list; empty
        pop no-op, empty stack leaves host free to choose shape.
      exact_source_semantics: Push comma-separated names in order, last is current; evict bottom when full, minimum supported depth 16.
        Pop exactly one, ignore suffix names; empty pops inert. Main and alternate stacks independent; terminal reset clears both. Mouse
        reporting independent; host may override for selection/hyperlink hover.
      pinned_source_observation:
        revision: a79f376b85fd95e3dfd0589877123996bacd4184
        location: kitty/screen.h:228-230; kitty/screen.c:226-227,2381-2384,2441-2548; kitty/window.py:3120-3135
        behavior: Actual 16-entry arrays per bank; set/push/pop handler distinct. No implementation claim for Howl.
      accepted_reconciliations:
      - osc22-pointer-reset-invalid-profile
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 retains ordered bounded caller-neutral requests
        relation: protocol-family
        legacy_records:
        - iterm2.osc.pointer
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 query reply is one direct transactional operation
        relation: protocol-family
        legacy_records:
        - kitty.osc.pointer
      source_locator: docs/pointer-shapes.rst:46-65
    - id: query
      section: Querying support
      level: defined
      wire: OSC 22 ; ?name[,name] ST / OSC 22 ; result[,result] ST
      rule: Return 1/0 per requested ordinary name. __current__ returns current name or 0 if empty; __default__ returns default name;
        __grabbed__ returns shape used when grabbed.
      exact_source_semantics: OSC 22 reply, same order as comma-separated names. Supported 1, unsupported 0; __current__ reports selected
        name or 0, __default__ and __grabbed__ report configured shapes. Names consist of a-z, 0-9, underscore and hyphen. Original required
        portable names in source table.
      required_names:
      - alias
      - cell
      - copy
      - crosshair
      - default
      - e-resize
      - ew-resize
      - grab
      - grabbing
      - help
      - move
      - n-resize
      - ne-resize
      - nesw-resize
      - no-drop
      - not-allowed
      - ns-resize
      - nw-resize
      - nwse-resize
      - pointer
      - progress
      - s-resize
      - se-resize
      - sw-resize
      - text
      - vertical-text
      - w-resize
      - wait
      - zoom-in
      - zoom-out
      pinned_source_observation:
        revision: a79f376b85fd95e3dfd0589877123996bacd4184
        location: kitty/window.py:3136-3151; kitty/screen.c:2381-2433
        behavior: Each query token gets one response; implementation maps default/grabbed/current and validates CSS names.
      accepted_reconciliations:
      - osc22-pointer-reset-invalid-profile
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 retains ordered bounded caller-neutral requests
        relation: protocol-family
        legacy_records:
        - iterm2.osc.pointer
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 22 query reply is one direct transactional operation
        relation: protocol-family
        legacy_records:
        - kitty.osc.pointer
      source_locator: docs/pointer-shapes.rst:69-104
    - id: shape-roster
      section: docs/pointer-shapes.rst:128-173
      level: defined
      wire: OSC 22 ; shape ST
      rule: 'Required CSS-based names: alias,cell,copy,crosshair,default,e-resize,ew-resize,grab,grabbing,help,move,n-resize,ne-resize,nesw-resize,no-drop,not-allowed,ns-resize,nw-resize,nwse-resize,pointer,progress,s-resize,se-resize,sw-resize,text,vertical-text,w-resize,wait,zoom-in,zoom-out.
        Valid characters a-z0-9_-. Optional legacy X11 aliases.'
    - id: state-interaction
      section: docs/pointer-shapes.rst:107-124
      level: defined
      wire: OSC 22 / screen switch / reset / mouse reporting
      rule: Separate stacks main and alternate; reset empties both. Independent of mouse reporting. Selection dragging and hyperlink hovering
        may override shape.
  kitty_multi_cursor:
    title: Kitty multiple cursors protocol
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/multiple-cursors-protocol.rst
    scope: One protocol, not a list of the reference terminal cursor-renderer internals
    clauses:
    - id: syntax
      section: Quickstart
      level: defined
      wire: 'CSI > SHAPE ; TYPE : COORDINATES [ ; TYPE : COORDINATES ... ] SP q'
      rule: Shape0 none,1 block,2 beam,3 underline,29 follow main; group0 main position,2 y:x pairs one-based,4 inclusive top:left:bottom:right
        rectangles, no coords full screen. Repeat groups.
      test_locations:
      - file: howl-vt/test/unit/terminal_cursor_test.zig
        test: 'terminal cursor: Kitty multiple-cursor forms are exact unsupported no-ops'
        relation: wire-family
        legacy_records:
        - kitty.csi.multi_cursor
      source_locator: docs/multiple-cursors-protocol.rst:29-82
    - id: clipping
      section: Quickstart
      level: must
      wire: out-of-range points and rectangles
      rule: Ignore out-of-screen cells and trailing incomplete coordinate groups, without moving other extra cursors.
    - id: detection
      section: Querying for support
      level: defined
      wire: CSI > SP q / CSI > supported-operations SP q
      rule: Reply supported subset of 1,2,3,29,30,40,100,101; empty list unsupported. FIFO DA1 ordering.
      source_locator: docs/multiple-cursors-protocol.rst:84-106
    - id: clear
      section: Clearing previously set multi-cursors
      level: defined
      wire: CSI > 0 ; 4 SP q
      rule: Shape0 clears selected cells; type4 with no coordinates clears all.
      source_locator: docs/multiple-cursors-protocol.rst:108-119
    - id: color
      section: Changing the color of extra cursors
      level: defined
      wire: CSI > 30|40 ; colorspace[:parameters] SP q
      rule: Shared pair:30 text,40 cursor; space0 main cursor,1 special reverse,2 RGB triplet,5 indexed. Special cursor color overrides
        text; special text alone uses cell background.
      source_locator: docs/multiple-cursors-protocol.rst:123-164
    - id: query-cursors
      section: docs/multiple-cursors-protocol.rst:166-186
      level: defined
      wire: CSI > 100 SP q / CSI > 100 [ ; shape:type:coordinates ... ] SP q
      rule: One response with all active shapes/positions; empty no blocks. FIFO.
    - id: query-colors
      section: docs/multiple-cursors-protocol.rst:188-202
      level: defined
      wire: CSI > 101 SP q / CSI > 101 ; 30:colorspace:params ; 40:colorspace:params SP q
      rule: One response with both color specs; parameter count determined by color space.
    - id: lifetime
      section: docs/multiple-cursors-protocol.rst:205-235
      level: defined
      wire: ED 2/3/22 / RIS / alternate switch / IND / RI
      rule: Clear extra cursors on specified ED/reset/bank switch; scroll leaves screen positions fixed. Main visibility not controlling
        extras; opacity/blink follow main, color controls separately defined.
  kitty_unscroll:
    title: Kitty unscroll extension to SD
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/unscroll.rst
    scope: One source-authored modifier of ECMA-48 SD, not a new SD standard
    clauses:
    - id: unscroll
      section: Unscrolling the screen
      level: defined
      wire: CSI Pn + T
      rule: Scrolls down and fills newly exposed lines from retained scrollback where available instead of inserting blank lines.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Kitty CSI plus T moves graphics after retained history runs out'
        relation: wire-family
        legacy_records:
        - kitty.csi.scrollback_fill
      - file: howl-vt/test/unit/terminal_test.zig
        test: terminal Kitty unscroll consumes primary history in row order
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_test.zig
        test: terminal Kitty unscroll fragments and preserves alternate history
        relation: protocol-family
    - id: fallback
      section: Unscrolling the screen
      level: defined
      wire: empty history / alternate screen
      rule: With no usable history, uses ordinary blank-line SD behavior; the unscroll capacity is at least one screen.
      test_locations:
      - file: howl-vt/test/unit/terminal_test.zig
        test: terminal Kitty unscroll consumes primary history in row order
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_test.zig
        test: terminal Kitty unscroll fragments and preserves alternate history
        relation: protocol-family
  dec_vt240:
    title: Digital VT240 Series Programmer Pocket Guide
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: 2nd edition, September 1984 (EK-VT240-HR-002)
    url: https://vt100.net/dec/ek-vt240-hr-002.pdf
    snapshot_sha256: 365a3195c3de2e4ceb323f0bf500321317ae4a94db2c1c251057a4933476a72b
    scope: Selected originating DEC private controls, not duplicate ECMA-48 functions
    clauses:
    - id: origin
      section: Terminal Modes / Origin Mode
      level: defined
      wire: CSI ? 6 h/l
      rule: Selects cursor addressing relative to the defined scrolling region or the display page.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-h-line-919
        source_line: 919
        wire: CSI ? 6 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-l-line-1069
        source_line: 1069
        wire: CSI ? 6 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 135; xterm ctlseqs set/reset lines 919/1069
        selector: 6
        name: DECOM
        set_wire: CSI ? 6 h
        reset_wire: CSI ? 6 l
        original_default: origin addressing relative to the whole page, not margins
        set_effect: Origin-relative cursor addressing is restricted to the scrolling margins.
        reset_effect: Addressing uses page origin, independent of scrolling margins.
        source_specific_constraints: The original defines home relative to margins when set and page when reset. Do not conflate the page
          coordinate system with VT scrollback.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm global DEC modes retain bank-local differences in Howl
        relation: wire-family
        legacy_records:
        - libvterm.mode.decom
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DEC screen origin and autowrap modes own exact repeated command effects
        relation: wire-family
        legacy_records:
        - iterm2.mode.decom
        - kitty.mode.decom
    - id: autowrap
      section: Terminal Modes / Auto Wrap
      level: defined
      wire: CSI ? 7 h/l
      rule: Controls automatic line wrapping at the right display margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-h-line-920
        source_line: 920
        wire: CSI ? 7 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-l-line-1070
        source_line: 1070
        wire: CSI ? 7 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 191; xterm ctlseqs set/reset lines 920/1070
        selector: 7
        name: DECAWM
        set_wire: CSI ? 7 h
        reset_wire: CSI ? 7 l
        original_default: no autowrap in the original VT420 reference
        set_effect: At the right page border, subsequent graphic characters wrap to the next line, scrolling the region when appropriate.
        reset_effect: At the right page border, subsequent graphics replace the border cell rather than wrapping.
        source_specific_constraints: The DEC VT420 source explicitly says default no autowrap; do not silently substitute an independently
          configured modern emulator startup default. This is source history, not Howl runtime conformance.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm global DEC modes retain bank-local differences in Howl
        relation: wire-family
        legacy_records:
