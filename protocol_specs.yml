  osc8:
    title: Hyperlinks in Terminal Emulators (OSC 8)
    author: Egmont Koblinger, VTE/iTerm2 collaboration
    authority: protocol-author
    revision: 2017 proposal, maintained clarification 2025-03-24
    url: https://gist.github.com/egmontkob/eb114294efbcd5adb1944c9f3cb5feda
    scope: OSC 8 grammar, cell association and URI policy; no implementation-specific length limits
    clauses:
    - id: open
      section: The escape sequence
      level: defined
      wire: OSC 8 ; params ; URI ST
      rule: Subsequently painted cells receive the declared hyperlink URI until the link is closed or replaced.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 retains explicit identity separately from URI and exact active mutation
        relation: wire-family
        legacy_records:
        - iterm2.osc.hyperlink
        - kitty.osc.hyperlink
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 hyperlink remains active through SGR reset until explicit close
        relation: protocol-family
    - id: close
      section: The escape sequence
      level: defined
      wire: OSC 8 ; ; ST
      rule: An empty URI closes the current hyperlink association.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 retains explicit identity separately from URI and exact active mutation
        relation: wire-family
        legacy_records:
        - iterm2.osc.hyperlink
        - kitty.osc.hyperlink
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 hyperlink remains active through SGR reset until explicit close
        relation: protocol-family
    - id: id
      section: The escape sequence
      level: defined
      wire: id=value
      rule: The optional id parameter distinguishes semantic hyperlink runs; unrecognized parameters are available for future extension.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 retains explicit identity separately from URI and exact active mutation
        relation: protocol-family
        legacy_records:
        - iterm2.osc.hyperlink
        - kitty.osc.hyperlink
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 hyperlink remains active through SGR reset until explicit close
        relation: protocol-family
    - id: uri
      section: The escape sequence
      level: defined
      wire: URI
      rule: The hyperlink target is URI-encoded; permitted schemes and launch action are host policy, not a protocol guarantee.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 retains explicit identity separately from URI and exact active mutation
        relation: protocol-family
        legacy_records:
        - iterm2.osc.hyperlink
        - kitty.osc.hyperlink
    - id: file-host
      section: file:// URIs
      level: defined
      wire: file://host/path
      rule: File links carry a hostname; a receiver must not silently treat a foreign-host file URI as a local file.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 8 retains explicit identity separately from URI and exact active mutation
        relation: protocol-family
        legacy_records:
        - iterm2.osc.hyperlink
        - kitty.osc.hyperlink
  rex_status:
    title: Rex Program Status Protocol (OSC 7501)
    author: Mitchell Hashimoto / Rex
    authority: protocol-author
    revision: 0.4, 2026-10-10
    url: https://www.superlogical.com/rex/docs/build/program-status
    scope: Complete numbered OSC 7501 protocol sections; host UI is intentionally unspecified
    clauses:
    - id: syntax
      section: Syntax
      level: defined
      wire: OSC 7501 ; key=value[:key=value...] ST
      rule: A report is colon-delimited lowercase key=value pairs using the specified value alphabet.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: unknown-keys
      section: Syntax
      level: must
      wire: unknown=...
      rule: Ignore unknown keys so later revisions remain extensible; repeated known keys use their last value.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: invalid-report
      section: Syntax
      level: must
      wire: invalid/base64/control-text
      rule: Discard a whole report if bounds, base64 decoding or decoded text control-character restrictions are violated.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/program_status_test.zig
        test: OSC 7501 source field and UTF-8 bounds reject hostile reports atomically
        relation: protocol-family
    - id: record-update
      section: Records and ids
      level: defined
      wire: id=segment[/segment...]
      rule: One record per id, absent id addresses the root, and each accepted report replaces rather than merges that record.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: id-rejection
      section: Records and ids
      level: defined
      wire: malformed id
      rule: Reject a report with an invalid id instead of falling back to the root record.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/program_status_test.zig
        test: OSC 7501 source field and UTF-8 bounds reject hostile reports atomically
        relation: protocol-family
    - id: tree-clear
      section: Records and ids / States
      level: must
      wire: state=clear[:id=...]
      rule: Clear the addressed record and its descendants; clearing with no id removes all records.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: states
      section: States
      level: defined
      wire: state=idle|working|done|blocked|error
      rule: The five states have distinct meanings; unknown or absent states invalidate the entire report.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: lifecycle
      section: States
      level: must
      wire: process-exited / OSC 133 A
      rule: Drop working and blocked records on process exit or new shell prompt; preserve done and error records.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 host consumer observes reset generation without claiming a UI
        relation: protocol-family
    - id: no-heartbeat
      section: States
      level: must
      wire: (no sequence)
      rule: Do not require periodic re-reporting just to keep existing records alive.
    - id: kind
      section: Keys
      level: defined
      wire: kind=permission|question|auth
      rule: Blocked records may describe which kind of user interaction is required; other states ignore kind.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: progress
      section: Keys
      level: defined
      wire: progress=0..100
      rule: Working and blocked records may carry bounded percentage; absence means indeterminate progress.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: inherited-app
      section: Keys
      level: must
      wire: app=name
      rule: Use the nearest ancestor app identity when a child record has no app of its own.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: text
      section: Keys
      level: must
      wire: title=base64 / msg=base64
      rule: Validate decoded UTF-8 text and refuse embedded control characters; treat it as text rather than markup.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/program_status_test.zig
        test: OSC 7501 source field and UTF-8 bounds reject hostile reports atomically
        relation: protocol-family
    - id: query
      section: Feature detection
      level: must
      wire: OSC 7501 ; ? ST
      rule: A supporting terminal replies with ? and may enumerate accepted states/kinds, without exposing stored records.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_query
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 feature query reply quota rolls back without changing pending statuses
        relation: protocol-family
    - id: bounded-sequence
      section: Limits
      level: defined
      wire: complete OSC through ST
      rule: Maximum wire sequence is 4096 bytes; this is a ceiling, and lower bounds for individual report fields are specified.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/program_status_test.zig
        test: OSC 7501 source field and UTF-8 bounds reject hostile reports atomically
        relation: protocol-family
    - id: record-capacity
      section: Limits
      level: must
      wire: status records
      rule: Support at least 64 and at most 256 records per terminal; when full evict the least recently updated record to admit a new one.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
    - id: record-security
      section: Security
      level: must
      wire: OSC 7501 status values
      rule: Never interpret title or message as markup and never return any stored id, title or message in protocol replies.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 bounded status FIFO preserves exact head under pressure
        relation: protocol-family
        legacy_records:
        - ghostty.osc7501.status_report
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer
        relation: protocol-family
        legacy_records:
        - kitty_delta.osc.program_status
      - file: howl-vt/test/unit/program_status_test.zig
        test: OSC 7501 source field and UTF-8 bounds reject hostile reports atomically
        relation: protocol-family
    - id: presentation
      section: Motivation / In Rex
      level: defined
      wire: (host rendering)
      rule: The protocol reports facts; graphical presentation, notification style and tab adornments are not defined by the wire protocol.
  conemu_progress:
    title: ConEmu-specific OSC 9;4 progress report
    author: ConEmu
    authority: protocol-author
    revision: ConEmu published ANSI escape code table, observed 2026-11-23
    url: https://conemu.github.io/en/AnsiEscapeCodes.html#ConEmu_specific_OSC
    scope: Only originating ConEmu OSC 9;4, not every OSC 9 command or Windows Terminal UI
    clauses:
    - id: format
      section: ConEmu specific OSC
      level: defined
      wire: OSC 9 ; 4 ; state ; progress ST
      rule: Reports task progress state and an optional percentage to the terminal.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: Windows Terminal OSC 9 progress clamps while Howl retains a strict percentage
        relation: protocol-family
        legacy_records:
        - windows_terminal.osc9.task_progress
      - file: howl-vt/src/terminal.zig
        test: task progress survives fragments without notification or text mutation
        relation: protocol-family
    - id: states
      section: ConEmu specific OSC
      level: defined
      wire: state 0..4
      rule: 0 clears, 1 sets a 0..100 percentage, 2 marks error, 3 indeterminate, 4 paused; error and paused permit omitted percentage.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: Windows Terminal OSC 9 progress clamps while Howl retains a strict percentage
        relation: protocol-family
        legacy_records:
        - windows_terminal.osc9.task_progress
      - file: howl-vt/src/terminal.zig
        test: ordinary OSC9 notifications remain distinct from bounded retained progress
        relation: protocol-family
  iterm2_osc1337:
    title: iTerm2 proprietary OSC 1337 commands
    author: iTerm2
    authority: protocol-author
    revision: iTerm2 documentation 3.6, observed 2026-11-23
    url: https://iterm2.com/3.6/documentation-escape-codes.html
    scope: Selected documented product-host commands, not a universal VT specification
    clauses:
    - id: set-user-var
      section: iTerm2 Extensions / SetUserVar
      level: defined
      wire: OSC 1337 ; SetUserVar=name=base64 ST
      rule: Defines a named host-session variable with a base64-encoded value for host substitution.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 1337 absent host actions have no native consequences
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.user_var
    - id: set-mark
      section: Set Mark
      level: defined
      wire: OSC 1337 ; SetMark ST
      rule: Records a host-side location mark for later navigation.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 1337 absent host actions have no native consequences
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.set_mark
    - id: remote-host
      section: iTerm2 Extensions / RemoteHost
      level: defined
      wire: OSC 1337 ; RemoteHost=user@host ST
      rule: Reports the shell user and remote hostname to the host.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: iTerm RemoteHost retains bounded metadata across terminal screen lifetime
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.remote_host
    - id: current-dir
      section: iTerm2 Extensions / CurrentDir
      level: defined
      wire: OSC 1337 ; CurrentDir=path ST
      rule: Reports the current shell working directory to the host.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: OSC 7 and iTerm CurrentDir retain bounded directory state with exact mutation
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.current_dir
    - id: clear-scrollback
      section: Clear Scrollback History
      level: defined
      wire: OSC 1337 ; ClearScrollback ST
      rule: Requests host-side scrollback history clearing.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: iTerm ClearScrollback clears only active screen state with exact repetition
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.clear_scrollback
    - id: set-profile
      section: Change profile
      level: defined
      wire: OSC 1337 ; SetProfile=name ST
      rule: Requests a host-owned named profile change; this does not define a generic terminal color operation.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 1337 absent host actions have no native consequences
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.set_profile
    - id: notification
      section: Post a notification
      level: defined
      wire: OSC 9 ; message ST
      rule: Requests a simple host notification from the iTerm2-specific OSC 9 family; OSC 9;4 is separately indexed under its ConEmu origin.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 9 notification retains a bounded host-neutral consequence
        relation: protocol-family
        legacy_records:
        - iterm2.osc.user_notification
      - file: howl-app/src/consequences.zig
        test: terminal consequences only request attention for focus and attention notifications
        relation: protocol-family
        legacy_records:
        - kitty.osc.notify_9
    - id: cursor-guide
      section: Cursor Guide
      level: defined
      wire: OSC 1337 ; CursorGuide=... ST
      rule: Changes presentation of the host cursor guide.
    - id: steal-focus
      section: Steal Focus
      level: defined
      wire: OSC 1337 ; StealFocus ST
      rule: Requests that the host bring its window to the foreground.
      test_locations:
      - file: howl-app/src/consequences.zig
        test: terminal consequences only request attention for focus and attention notifications
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.steal_focus
    - id: copy-to-clipboard
      section: Copy to clipboard
      level: defined
      wire: OSC 1337 ; CopyToClipboard=name ST
      rule: Starts host-side clipboard capture under the declared destination.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 1337 absent host actions have no native consequences
        relation: protocol-family
        legacy_records:
        - iterm2.osc1337.copy_to_clipboard
    - id: end-copy
      section: Copy to clipboard
      level: defined
      wire: OSC 1337 ; EndCopy ST
      rule: Stops clipboard capture and commits the copied content.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: pinned iTerm2 OSC 1337 absent host actions have no native consequences
        relation: protocol-family
        legacy_records:
