    - id: sgr
      section: 8.3.117
      level: defined
      wire: CSI Pm m
      rule: Selects the graphic rendition attributes applied to subsequently presented text.
      parameter_interpretations:
      - selector: 21
        exact_wire: CSI 21 m
        section: 8.3.117 / parameter 21
        effect: Doubly underlined text.
        competes_with: linux_console.sgr21
        decision: sgr21-ecma48-vs-linux-console
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1183
        wire: CSI Pm m
      source_specific_parameters:
      - selectors:
        - 38
        - 48
        original_ecma48: Reserved in ECMA-48 fifth edition (1991) for intended foreground/background colour standardization.
        originating_specification: itu_t416.sgr-colour-subparameters
        xterm: Supports ISO/IEC 8613-6 colon-separated indexed colour (:5:index) and direct RGB (:2:colourspace:R:G:B); also supports semicolon-separated
          legacy forms such as ;2;R;G;B for KDE Konsole compatibility.
        classification: formal colour selector standard plus separately documented legacy syntax; xterm is not the originating ISO authority
        catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1273
      - selectors:
        - 90..97
        - 100..107
        origin_attribution: aixterm (credited by xterm; original aixterm source not independently pinned)
        xterm: When 16-colour support is compiled, 90..97 select bright foreground and 100..107 select bright background palette entries.
        conditional_alternative: If built without 16-colour support, xterm documents rxvt-style SGR 100 as reset of foreground and background
          to defaults, not bright-black background.
        classification: attributed bright-colour extension with explicit build-dependent legacy alternative; not ECMA-48 fifth-edition selectors
        catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1245
