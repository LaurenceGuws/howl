  kitty_dnd:
    title: Kitty drag and drop protocol (OSC 72)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/dnd-protocol.rst
    snapshot_sha256: 62e79ac9ef3e47cca624765182ce4dd57bc8b78b6e6f8b59167d104f9e8d9596
    scope: Original bidirectional drag/drop and remote file transfer. DND_CODE=72 from kitty/control-codes.h:239, docs/conf.py:132. No
      host permission implied. Source-discovery candidate; not an implementation disposition or completeness claim.
    clauses:
    - id: envelope
      section: lines 9-35,490-533
      level: defined
      wire: OSC 72 ; metadata ; payload ST / payloadless operations as individually defined
      rule: Colon-separated metadata; decimal signed/unsigned 32-bit integers. At most 4096 encoded payload bytes, standard Base64 with
        optional final padding. m=1 continues, m=0 ends. First chunk metadata governs, later chunks may omit all except m/i. No unrelated
        messages in chunked transfer except query; source mentions q|Q here but defines q only.
    - id: drop-enable
      section: lines 38-55
      level: defined
      wire: OSC 72 ; t=a [ ; MIME-list ] ST / OSC 72 ; t=A ST
      rule: Register/unregister ability to receive drops; optional space-separated MIME types.
    - id: drop-motion
      section: lines 57-77
      level: defined
      wire: OSC 72 ; t=m:x=x:y=y:X=X:Y=Y:o=O [ ; MIME-list ] ST
      rule: Terminal motion reports zero-based cell/pixel positions, 1 copy,2 move,3 either. MIME list initially and on changes. Leave
        x=y=-1 with empty list; no further movement until re-entry.
    - id: drop-accept
      section: lines 79-93
      level: defined
      wire: OSC 72 ; t=m:o=O [ ; MIME-list ] ST
      rule: Client chooses 1 copy,2 move,0 reject; optional preference-ordered MIME list, omission retains previous list.
    - id: drop-event
      section: lines 95-115
      level: defined
      wire: OSC 72 ; t=M:x=x:y=y:X=X:Y=Y:o=O ; MIME-list ST
      rule: Actual drop with complete MIME list. Requests before drop fail EPERM; leaving without dropping retires resources and invalidates
        requests.
    - id: drop-data
      section: lines 117-135
      level: defined
      wire: OSC 72 ; t=r:x=idx ST / OSC 72 ; t=r:x=idx[:m=0|1] ; base64 ST / OSC 72 ; t=R:x=idx ; error[:description] ST
      rule: One-based MIME index. Chunked data, empty payload with m=0 completes. Symbolic POSIX error or EUNKNOWN, optional safe UTF-8
        description; normally terminates drop.
    - id: drop-finish
      section: lines 137-154
      level: defined
      wire: OSC 72 ; t=r:o=operation ST
      rule: Finish and notify OS, discard queued requests; operation0 cancellation. Temporary host file lifetime may end with drop.
    - id: remote-drop-machine
      section: lines 159-171,536-573
      level: defined
      wire: OSC 72 ; t=a:x=1 ; machine-id ST
      rule: Versioned HMAC-SHA256-derived hexadecimal machine identity. Unknown version treated as remote; remote URI-list response X=1.
    - id: remote-drop-entry
      section: lines 173-216
      level: defined
      wire: OSC 72 ; t=r:x=idx:y=subidx ST / OSC 72 ; t=r:x=idx:y=subidx ; base64 ST / OSC 72 ; t=R:x=idx:y=subidx ; error ST
      rule: One-based URI-list entry, only after URI list retrieval. Regular files, symlinks, directories only. Same-window source forbidden.
        Errors ENOENT,EINVAL,EUNKNOWN,EPERM,EIO,EMFILE. Correlate x,y,Y; FIFO recommended, interleaving allowed. x identifies the one-based
        URI-list MIME type; y identifies the entry in that list. Source wording calls the URI entries an array of MIME types; exact intent
        follows URI-list context, not an additional MIME index.
    - id: remote-drop-directory
      section: lines 219-260
      level: defined
      wire: OSC 72 ; t=r:x=idx:y=subidx:X=handle ; base64 ST / OSC 72 ; t=r:Y=handle:x=num ST
      rule: NUL-separated directory entries; X=0 regular,1 symlink, other directory handle. One-based child lookup; response identifies
        parent/child; t=r:Y=handle releases handle. Invalid EINVAL; resource exhaustion ENOMEM.
    - id: drag-offer-enable
      section: lines 264-303
      level: defined
      wire: OSC 72 ; t=o:x=1 [ ; machine-id ] ST / OSC 72 ; t=o:x=2 ST / OSC 72 ; t=o:x=x:y=y:X=X:Y=Y ST
      rule: Register/unregister drag source. Terminal initiates negotiation from platform gesture; client responds t=o:o=flags with offered
        MIME types and copy/move capability, before starting drag.
    - id: drag-presend
      section: lines 304-323
      level: defined
      wire: OSC 72 ; t=p:x=idx[:m=0|1] ; base64 ST
      rule: Zero-based MIME index, chunked pre-send with empty final packet. Source requires acceptance of at least 64MB pre-sent data;
        oversize EFBIG aborts.
    - id: drag-images
      section: lines 318-349
      level: defined
      wire: OSC 72 ; t=p:x=negative-index:y=format:X=width:Y=height[:o=opacity] ; base64 ST / OSC 72 ; t=P:x=idx ST
      rule: Images consecutive negative x starting -1; formats24 RGB,32 RGBA,100 PNG,0 UTF-8 text; dimensions required, text X/Y scales
        font and o/1024 opacity. Invalid EINVAL, excessive EFBIG. Zero-based image selection; out of range removes image. RGB/A samples
        use sRGB.
    - id: drag-start
      section: lines 351-364
      level: defined
      wire: OSC 72 ; t=P:x=-1 ST / OSC 72 ; t=E ; OK|error ST
      rule: Start actual drag after data/images; terminal replies OK or error; cancellation or disallowance EPERM.
    - id: drag-events
      section: lines 366-401
      level: defined
      wire: OSC 72 ; t=e:x=event[:y=idx][:o=O] ST / OSC 72 ; t=e:y=idx:m=0|1 ; base64 ST / OSC 72 ; t=E:y=idx ; error ST
      rule: Events x:1 accepted MIME,2 operation change,3 dropped,4 finish with y=0/1 cancellation,5 request MIME. MIME indices zero-based.
        Chunked response with empty final. E:y=-1 cancels drag; premature data/error EINVAL abort.
    - id: remote-drag-data
      section: lines 402-456
      level: defined
      wire: OSC 72 ; t=k:x=idx ST / OSC 72 ; t=k:x=idx[:X=kind][:Y=parent:y=num]:m=0|1 ; base64 ST
      rule: Remote drag requires pre-sent URI list and directory slash; one-based URI entry, regular file/symlink/directory. Stream descendants
        recursively without child requests; parent Y and entry y correlate. Errors t=E abort.
    - id: feature-query
      section: lines 459-479
      level: defined
      wire: OSC 72 ; t=q[:i=id] ST / OSC 72 ; t=q[:i=id] ; capabilities ST
      rule: Echo optional id and colon-separated capability keys (currently empty). DA1 after query detects support.
    - id: multiplexer
      section: lines 481-488
      level: defined
      wire: OSC 72 ; t=a|o:i=id / response i=id
      rule: Echo registration id on each terminal response for corresponding session.
