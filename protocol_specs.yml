        source_line: 1475
        wire: CSI Pl ; Pc " p
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decscl-hard-vs-soft-reset
          reason: Original VT420 specifies hard reset; pinned xterm implements soft reset. Keep source versions and target scope
            separate.
