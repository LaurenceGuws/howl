    - id: select-conformance-level
      section: Chapter 4 / Selecting an Operating Level (DECSCL), printed p.87
      level: defined
      wire: CSI Pl [ ; Pc ] " p
      rule: VT420 selects level 1 with Pl=61; Pl=62,63,64 select VT400-compatible levels (level 4 includes 2 and 3). For higher levels
        omitted Pc or 0/2 selects 8-bit transmission, 1 selects 7-bit; factory default is level 4 with 7-bit controls. Original manual
        explicitly requires hard reset (RIS) when changing operating level.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5081-5126,14314-14321
      source_note: Pinned xterm explicitly invokes ReallyReset(xw,False,False), a soft reset retaining saved lines. Its source comment
        cites VT220/DEC STD-070 soft reset versus VT300/420/520 hard reset; only the pinned VT420 manual and actual xterm branch were
        independently verified here. Pl=65 is a later profile, not a VT420 selector.
      accepted_reconciliations:
      - decscl-hard-vs-soft-reset
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-724bc8b026
        source_line: 1475
        wire: CSI Pl ; Pc " p
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decscl-hard-vs-soft-reset
          reason: Original VT420 specifies hard reset; pinned xterm implements soft reset. Keep source versions and target scope separate.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRQSS reports conformance and page length across framing modes
        relation: protocol-family
    - id: soft-terminal-reset
      section: Chapter 13 / DECSTR, printed pp.285-286, Table 13-1
      level: defined
      wire: CSI ! p
      rule: VT400-mode soft reset changes only the functions listed in Table 13-1 to the stated defaults. Do not conflate with RIS hard
        reset or silently reset unrelated modes. SET-UP Reset differs by not resetting DECNRCM.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-1ddd518ae0
        source_line: 1473
        wire: CSI ! p
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6147-6150,14314-14372
      original_reset_states:
        DECTCEM: cursor enabled
        IRM: replace
        DECOM: absolute
        DECAWM: no autowrap
        DECNRCM: multinational
        KAM: unlocked
        DECNKM: numeric
        DECCKM: normal
        DECSTBM: top 1, bottom page length
        G0_G1_G2_G3_GL_GR: VT420 defaults
        SGR: normal rendition
        DECSCA: normal erasable
        DECSC: home with VT420 defaults
        DECAUPSS: SET-UP selected set
        DECSASD: main display (first 24 lines)
        DECKPM: send character codes
        DECSMKR: modifier keys default functions
      source_note: Pinned xterm invokes its soft reset path; it additionally calls ResetAnsiColorRequest and uses configured defaults
        for cursor/keypad. The original exact reset scope remains preserved, not claimed equivalent.
      test_locations:
      - file: howl-vt/test/unit/terminal_test.zig
        test: terminal save reset and alternate lifecycle stays coherent across resize and bank changes
        relation: wire-family
