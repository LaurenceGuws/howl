        - iterm2.csi.decstr
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECSTR clears both Kitty stacks without erasing moving or switching banks
        relation: wire-family
        legacy_records:
        - kitty.csi.decstr
    - id: columns-per-page
      section: Chapter 6 / DECSCPP, printed pp.130-131
      level: defined
      wire: CSI Ps $ |
      rule: Omitted/0/80 selects 80 columns per page; 132 selects 132. Default 80. Sets every page width and matching font without clearing
        page memory or resetting scrolling regions (unlike DECCOLM). Cursor remains unless beyond new right edge, then clamps. Columns
        lost when shrinking 132 to 80 are destructive. Page geometry is not a host-pixel size.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-5bce18dca3
        source_line: 1892
        wire: CSI Ps $ |
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5712-5738
      source_note: Pinned xterm uses a resize request and cursor clamp. Multi-page memory and font consequences are not established.
      test_locations:
      - file: howl-app/src/consequences.zig
        test: terminal consequences decline container geometry and window mutation without changing VT
        relation: wire-family
        legacy_records:
        - iterm2.csi.decscpp
    - id: lines-per-screen
      section: Chapter 11 / DECSNLS, printed p.218
      level: defined
      wire: CSI Pn * |
      rule: Pn=1..255 requests maximum display lines. Original VT420 supports 24,39,49 screen lines plus status line via three font heights;
        choose next higher supported value or highest if above maximum. Active session space and current page size further limit displayed
        lines; e.g. page 36 with display 39 leaves 3 blank lines. Do not reinterpret these as pixel dimensions or arbitrary page-resize
        quotas.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-43f1b260e7
        source_line: 1938
        wire: CSI Ps * |
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5740-5749
      source_note: Pinned xterm directly requests host resize for 1..255 under window policy; not original discrete font/viewport behavior.
      test_locations:
      - file: howl-app/src/consequences.zig
        test: terminal consequences decline container geometry and window mutation without changing VT
        relation: wire-family
        legacy_records:
        - iterm2.csi.decsnls
    - id: request-displayed-extent
      section: Chapter 12 / DECRQDE and DECRPDE, printed pp.271-272
      level: defined
      wire: CSI " v
      rule: 'Requests how much of the current page is displayed in the active session window, excluding status line. Reply fields: displayed
        line count, displayed column count, leftmost page column, top page line, page number. Session windows may display only part of
        a page.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-dd97c5f289
        source_line: 1736
        wire: CSI " v
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5751-5766
      reply: CSI Ph ; Pw ; Pml ; Pmt ; Pmp " w
      source_note: Pinned xterm reports MaxRows,MaxCols,1,1,1; single-page subset, not a multipage display contract.
    - id: request-rectangle-checksum
      section: Chapter 12 / DECRQCRA and DECCKSR, printed pp.243-244
      level: defined
      wire: CSI Pid ; Pp ; Pt ; Pl ; Pb ; Pr * y
      rule: VT400-mode request labels checksum by Pid. Page Pp=0 or omitted means all pages and ignores rectangle operands; above available
        page count means last page. For a specified page, rectangle coordinates obey DECOM, top<=bottom and left<=right; defaults printed
        top=1,bottom=page length,right=page width (left default not explicitly listed in the checked text). Omitted rectangle reports
        whole selected page. Response exactly four uppercase hexadecimal digits; this section does not specify the complete checksum arithmetic.
      also_documented:
