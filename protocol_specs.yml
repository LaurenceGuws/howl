schema: 1
kind: terminal-protocol-specifications
as_of: '2026-11-24'
scope: howl-vt-implementation-specification-under-reconciliation
policy:
  purpose: This file is the single evolving specification of the VT protocols Howl intends to implement. Broad original-source indexing,
    semantic deduplication, explicit behavior choices and implementation prioritization are stages of producing that specification, not a
    separate historical catalogue followed by another specification. Only explicitly accepted and targeted canonical behavior becomes an
    implementation requirement; the specification is not yet complete.
  authority: originating standard or protocol author's published specification
  conformance: A control defined by an originating standard is a candidate, not automatically mandatory for Howl. ECMA-48 permits a declared
    selection (clauses 2.1-2.3). The adopted Howl behavior and its scope must be selected explicitly in this file. MUST/SHOULD/MAY reflect
    their original source and do not silently become Howl implementation mandates.
  measurement: Track original-source functions and discovery sequences separately during reconciliation. Inventory and dedup counts are not
    an implementation completion score or a claim of current runtime conformance.
  mapping: Accepted, prioritized canonical behavior in this file forms Howl VT's implementation contract. Already-decided behaviors may receive
    a narrowly scoped, source-and-test-backed implementation assessment in this same file, without converting raw discovery entries into
    implementation mandates or treating tested behavior as full implementation coverage. Untriaged entries remain candidates, not implied
    obligations or exclusions; a broader implementation audit is separate.
  prioritization: 'Use stable canonical identifiers and explicit per-behavior disposition and priority after source reconciliation: target
    for planned implementation, deferred for a still-intended later capability, excluded for deliberately unsupported behavior, or source-only
    for documented alternative/provenance. Record a reason and meaningful dependencies or interoperability evidence; do not assign invented
    priorities in bulk. Absence of these fields means not yet triaged, not excluded or implemented. Defer affects sequence of work, not the
    existence of the accepted protocol obligation.'
  interoperability: Secondary discovery entries are evidence and work items, never automatically normative requirements. Verify their originating
    protocol and exact semantics, then merge equivalent commands with provenance, retain genuine extensions as distinct canonical behavior,
    or document intentional exclusion. A reviewed and targeted behavior becomes part of the same implementation specification.
  collisions: Merge only source-confirmed equivalent semantics, preserving original definitions and discovery provenance. For incompatible
    complete wire sequences or parameter meanings, retain all sourced interpretations and their exact differences; resolve only under the
    approved evidence rules below or an explicit Captain choice. Otherwise leave the case pending.
  revision: change a document pin deliberately; do not silently follow live references
  ecma48_xterm_tiebreaker: In an isolated, source-verified two-way conflict between an older ECMA-48 definition and xterm, prefer the xterm
    interpretation. Preserve the competing original definition and the reason for selecting xterm. When further relevant terminal references
    establish wider evidence, apply reference_consensus instead; this is not a blanket xterm priority in multi-way disputes.
  reference_consensus: When a clear majority of relevant independently maintained terminal references agree on the observable behavior of
    the same complete wire sequence and parameter values, adopt that behavior without asking Captain to resolve routine differences. Use
    pinned, source-verified references; consider reference relevance and independence, not merely raw counts or shared parser ancestry. Keep
    all originating specification meanings and material minority behavior indexed with provenance and rationale. A small isolated minority
    difference does not by itself block consensus. Escalate when an important reference has a substantial semantic divergence, or when evidence
    is too mixed or incomplete to establish consensus. These decisions select intended protocol semantics only, never claim current Howl
    implementation conformance.
  implementation_status: Statuses are per accepted behavior and always substantiated by exact originating-source semantics plus source/negative
    tests. MISSING means the accepted behavior is absent; PARTIAL means behavior is demonstrable but source-complete conformance is unproved
    or an accepted subcase differs; FULL requires original source authority, precise encoding/decoding and every relevant parameter default,
    size limit, state interaction, reply frame, split input, invalid-input non-mutation and failure/cleanup condition mechanically qualified.
    Never infer FULL from a parser branch, one passing assertion, general build success, or another terminal's behavior. Source-specific
    sizing and ordering are verbatim requirements; do not reinterpret to fit current code. Unassessed capabilities carry no status and are
    not silently counted or excluded.
specifications:
  ecma48:
    title: 'ECMA-48: Control Functions for Coded Character Sets'
    author: Ecma International
    authority: standard
    revision: 5th edition, June 1991
    url: https://ecma-international.org/wp-content/uploads/ECMA-48_5th_edition_june_1991.pdf
    scope: Selected common control functions, not all 162 functions in clause 8.3
    clauses:
    - id: selection
      section: 2.1-2.3
      level: defined
      wire: identified selection
      rule: Conformance identifies which functions a device originates or receives, including implicit and explicit default parameters; it
        does not require every defined function.
    - id: csi-syntax
      section: '5.4'
      level: defined
      wire: CSI parameters intermediates final
      rule: Control sequences use a parameter/intermediate/final coded representation; private-use bytes do not redefine standard functions.
    - id: csi-parameters
      section: 5.4.1-5.4.3
      level: defined
      wire: CSI Pm ; Pm final
      rule: Numeric parameter strings, omitted parameter substrings and defaults obey the specified control function and mode.
    - id: c0-bel
      section: 8.3.3
      level: defined
      wire: BEL
      rule: The bell control is a defined independent C0 control function.
    - id: c0-bs
      section: 8.3.5
      level: defined
      wire: BS
      rule: Moves the active position back by one character position along the active line.
    - id: c0-cr
      section: 8.3.15
      level: defined
      wire: CR
      rule: Returns the active position to the corresponding line home or line limit according to the movement direction.
    - id: c0-lf
      section: 8.3.74
      level: defined
      wire: LF
      rule: Moves the active position to the corresponding position on the next line.
    - id: c0-ht
      section: 8.3.60
      level: defined
      wire: HT
      rule: Moves the active position to the next horizontal tabulation stop.
    - id: c1-csi
      section: 8.3.16
      level: defined
      wire: CSI
      rule: Introduces a control sequence; seven-bit and eight-bit representations follow the standard coding rules.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-10d308deeb
        source_line: 196
        wire: ESC [
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.16
        eight_bit: '0x9B'
        seven_bit: ESC [
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
    - id: c1-osc
      section: 8.3.89
      level: defined
      wire: OSC ... ST
      rule: Introduces an operating-system control string; its contents are not defined by this standard.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-8527fe776c
        source_line: 202
        wire: ESC ]
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.89
        eight_bit: '0x9D'
        seven_bit: ESC ]
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
    - id: c1-dcs
      section: 8.3.27
      level: defined
      wire: DCS ... ST
      rule: Introduces a device control string; private payload protocols require their own source.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-40aa4b63e9
        source_line: 181
        wire: ESC P
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.27
        eight_bit: '0x90'
        seven_bit: ESC P
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
    - id: c1-st
      section: 8.3.143
      level: defined
      wire: ST
      rule: Terminates an applicable control string.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-5f0dd1b590
        source_line: 199
        wire: ESC \
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.143
        eight_bit: '0x9C'
        seven_bit: ESC \
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
    - id: cup
      section: 8.3.21
      level: defined
      wire: CSI Pn ; Pn H
      rule: Sets active position to the specified line and character position.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-fbf3db4964
        source_line: 603
        wire: CSI Ps ; Ps H
    - id: cuu
      section: 8.3.22
      level: defined
      wire: CSI Pn A
      rule: Moves the active position upward by the specified number of lines.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d6b19ba45b
        source_line: 586
        wire: CSI Ps A
    - id: cud
      section: 8.3.19
      level: defined
      wire: CSI Pn B
      rule: Moves the active position downward by the specified number of lines.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-201e2ef40b
        source_line: 591
        wire: CSI Ps B
    - id: cuf
      section: 8.3.20
      level: defined
      wire: CSI Pn C
      rule: Moves the active position forward by the specified number of character positions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-b4a3ca935f
        source_line: 593
        wire: CSI Ps C
    - id: cub
      section: 8.3.18
      level: defined
      wire: CSI Pn D
      rule: Moves the active position backward by the specified number of character positions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-94007e4272
        source_line: 595
        wire: CSI Ps D
    - id: cha
      section: 8.3.9
      level: defined
      wire: CSI Pn G
      rule: Sets the active character position within its line.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-656a665464
        source_line: 601
        wire: CSI Ps G
    - id: vpa
      section: 8.3.158
      level: defined
      wire: CSI Pn d
      rule: Sets the active line position.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-99318f2215
        source_line: 835
        wire: CSI Ps d
    - id: ed
      section: 8.3.39
      level: defined
      wire: CSI Ps J
      rule: Erases a selected part of the active page according to the parameter.
      parameter_extensions:
      - selector: Ps=3
        effect: Erase saved lines (scrollback) with Ps=3
        origin: xterm
        source: https://invisible-island.net/xterm/ctlseqs/ctlseqs.html
        source_line: 611
        discovery_entry: csi-d004c0f19d
        source_wire: CSI Ps J
        scope: Extension to the same wire command family, not an ECMA/DEC standard parameter
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d004c0f19d
        source_line: 608
        wire: CSI Ps J
    - id: el
      section: 8.3.41
      level: defined
      wire: CSI Ps K
      rule: Erases a selected part of the active line according to the parameter.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-eefbb0a47d
        source_line: 621
        wire: CSI Ps K
    - id: ech
      section: 8.3.38
      level: defined
      wire: CSI Pn X
      rule: Erases a specified number of character positions from the active position.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-50cd35976d
        source_line: 747
        wire: CSI Ps X
    - id: ich
      section: 8.3.64
      level: defined
      wire: CSI Pn @
      rule: Inserts the specified number of character positions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d144620701
        source_line: 581
        wire: CSI Ps @
    - id: dch
      section: 8.3.26
      level: defined
      wire: CSI Pn P
      rule: Deletes the specified number of character positions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-5c6a7c2170
        source_line: 636
        wire: CSI Ps P
    - id: il
      section: 8.3.67
      level: defined
      wire: CSI Pn L
      rule: Inserts lines in the active page.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d0058a2bc2
        source_line: 632
        wire: CSI Ps L
    - id: dl
      section: 8.3.32
      level: defined
      wire: CSI Pn M
      rule: Deletes lines in the active page.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-e665b6e9f4
        source_line: 634
        wire: CSI Ps M
    - id: su
      section: 8.3.147
      level: defined
      wire: CSI Pn S
      rule: Scrolls the active page upward by the specified number of lines.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-532a461d36
        source_line: 656
        wire: CSI Ps S
    - id: sd
      section: 8.3.113
      level: defined
      wire: CSI Pn T
      rule: Scrolls the active page downward by the specified number of lines.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4d195f9861
        source_line: 720
        wire: CSI Ps T
      alternative_encodings:
      - clause: xterm_controls.sd-caret-alias
        wire: CSI Ps ^
        decision: ecma48-simd-vs-xterm-sd-caret
    - id: sgr
      section: 8.3.117
      level: defined
      wire: CSI Pm m
      rule: Selects the graphic rendition attributes applied to subsequently presented text.
      parameter_interpretations:
      - selector: 21
        exact_wire: CSI 21 m
        section: 8.3.117 / parameter 21
        effect: Doubly underlined text.
        competes_with: linux_console.sgr21
        decision: sgr21-ecma48-vs-linux-console
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1183
        wire: CSI Pm m
      source_specific_parameters:
      - selectors:
        - 38
        - 48
        original_ecma48: Reserved in ECMA-48 fifth edition (1991) for intended foreground/background colour standardization.
        originating_specification: itu_t416.sgr-colour-subparameters
        xterm: Supports ISO/IEC 8613-6 colon-separated indexed colour (:5:index) and direct RGB (:2:colourspace:R:G:B); also supports semicolon-separated
          legacy forms such as ;2;R;G;B for KDE Konsole compatibility.
        classification: formal colour selector standard plus separately documented legacy syntax; xterm is not the originating ISO authority
        catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1273
      - selectors:
        - 90..97
        - 100..107
        origin_attribution: aixterm (credited by xterm; original aixterm source not independently pinned)
        xterm: When 16-colour support is compiled, 90..97 select bright foreground and 100..107 select bright background palette entries.
        conditional_alternative: If built without 16-colour support, xterm documents rxvt-style SGR 100 as reset of foreground and background
          to defaults, not bright-black background.
        classification: attributed bright-colour extension with explicit build-dependent legacy alternative; not ECMA-48 fifth-edition selectors
        catalogue: xterm_ctlseqs
        entry_id: csi-754afe63c9
        source_line: 1245
    - id: sm
      section: 8.3.125
      level: defined
      wire: CSI Pm h
      rule: Sets the specified standard modes.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6912179284
        source_line: 905
        wire: CSI Pm h
      source_specific_parameters:
      - selector: 20
        wire: CSI 20 h
        original_ecma48: Selector 20 shall not be used (ECMA-48, section 8.3.125).
        xterm: Selector 20 means Automatic Newline (LNM).
        catalogue: xterm_ctlseqs
        entry_id: csi-6912179284
        source_line: 905
        classification: xterm/DEC mode extension into ECMA-48 unassigned selector, not a second CSI command
    - id: rm
      section: 8.3.106
      level: defined
      wire: CSI Pm l
      rule: Resets the specified standard modes.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-5df72d65f1
        source_line: 1056
        wire: CSI Pm l
      source_specific_parameters:
      - selector: 20
        wire: CSI 20 l
        original_ecma48: Selector 20 shall not be used (ECMA-48, section 8.3.106).
        xterm: Selector 20 means Normal Linefeed (LNM).
        catalogue: xterm_ctlseqs
        entry_id: csi-5df72d65f1
        source_line: 1056
        classification: xterm/DEC mode extension into ECMA-48 unassigned selector, not a second CSI command
    - id: dsr
      section: 8.3.35
      level: defined
      wire: CSI Ps n
      rule: Requests or reports device status as selected by the parameter.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-e85c0202bf
        source_line: 1377
        wire: CSI Ps n
      private_variants:
      - clause: dec_vt3xx_text.dsr-dec-private
        wire: CSI ? Ps n
        description: DEC-specific requests and responses; the ? prefix is not part of the standard DSR request.
    - id: cpr
      section: 8.3.14
      level: defined
      wire: CSI Pn ; Pn R
      rule: Reports the active position in a coded control sequence.
    - id: rep
      section: 8.3.103
      level: defined
      wire: CSI Pn b
      rule: Repeats the preceding graphic character according to the count parameter.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-74aff5c25d
        source_line: 761
        wire: CSI Ps b
    - id: ris
      section: 8.3.105
      level: defined
      wire: ESC c
      rule: Resets a receiving device to its initial state.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-4b7f14d66e
        source_line: 408
        wire: ESC c
    - id: hts
      section: 8.3.62
      level: defined
      wire: HTS
      rule: Sets a tabulation stop at the active position.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-353d33e4a2
        source_line: 167
        wire: ESC H
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.62
        eight_bit: '0x88'
        seven_bit: ESC H
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
    - id: tbc
      section: 8.3.154
      level: defined
      wire: CSI Ps g
      rule: Clears tabulation stops according to the parameter.
      competing_parameter_behaviors:
      - clause: xterm_controls.tbc-vt100-subset
        agrees_with: dec_vt100.tbc
        wire: CSI Ps g
        selectors:
        - 1
        - 2
        - 4
        - 5
        effect: DEC VT100 and xterm ignore these selectors; ECMA-48 defines tab-stop clearing actions for them.
        decision: ecma48-tbc-vs-xterm-subset
    - id: ack
      section: 8.3.1
      level: defined
      wire: '0x06'
      rule: ACKNOWLEDGE (ACK); ECMA-48 standardized control function, C0 form (source page 33).
    - id: apc
      section: 8.3.2
      level: defined
      wire: 0x9F | ESC _
      rule: APPLICATION PROGRAM COMMAND (APC); ECMA-48 standardized control function, C1 form (source page 33).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-6d43c2b77b
        source_line: 208
        wire: ESC _
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.2
        eight_bit: '0x9F'
        seven_bit: ESC _
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
      original_string_semantics: Opening delimiter for application program use; command bytes 0x08..0x0d or 0x20..0x7e, closed
        by ST. Interpretation depends on application/privacy discipline.
      xterm_string_profile:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5281-5358,2323-2325; ctlseqs line 428
        behavior: Accepted string payload ignored, not a universal assertion that the protocol has no defined extension. Parser
          admission depends on ParseSOS; other implementations may define payloads.
    - id: bph
      section: 8.3.4
      level: defined
      wire: 0x82 | ESC B
      rule: BREAK PERMITTED HERE (BPH); ECMA-48 standardized control function, C1 form (source page 33).
    - id: can
      section: 8.3.6
      level: defined
      wire: '0x18'
      rule: CANCEL (CAN); ECMA-48 standardized control function, C0 form (source page 34).
    - id: cbt
      section: 8.3.7
      level: defined
      wire: CSI Pn Z
      rule: CURSOR BACKWARD TABULATION (CBT); ECMA-48 standardized control function, CSI form (source page 34).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-1a83ad912b
        source_line: 749
        wire: CSI Ps Z
    - id: cch
      section: 8.3.8
      level: defined
      wire: 0x94 | ESC T
      rule: CANCEL CHARACTER (CCH); ECMA-48 standardized control function, C1 form (source page 34).
    - id: cht
      section: 8.3.10
      level: defined
      wire: CSI Pn I
      rule: CURSOR FORWARD TABULATION (CHT); ECMA-48 standardized control function, CSI form (source page 34).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-10f9ddce08
        source_line: 606
        wire: CSI Ps I
    - id: cmd
      section: 8.3.11
      level: defined
      wire: ESC d
      rule: CODING METHOD DELIMITER (CMD); ECMA-48 standardized control function, ESC form (source page 34).
    - id: cnl
      section: 8.3.12
      level: defined
      wire: CSI Pn E
      rule: CURSOR NEXT LINE (CNL); ECMA-48 standardized control function, CSI form (source page 35).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-e068e475ad
        source_line: 597
        wire: CSI Ps E
    - id: cpl
      section: 8.3.13
      level: defined
      wire: CSI Pn F
      rule: CURSOR PRECEDING LINE (CPL); ECMA-48 standardized control function, CSI form (source page 35).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-07ed9438c5
        source_line: 599
        wire: CSI Ps F
    - id: ctc
      section: 8.3.17
      level: defined
      wire: CSI Ps... W
      rule: CURSOR TABULATION CONTROL (CTC); ECMA-48 standardized control function, CSI form (source page 36).
    - id: cvt
      section: 8.3.23
      level: defined
      wire: CSI Pn Y
      rule: CURSOR LINE TABULATION (CVT); ECMA-48 standardized control function, CSI form (source page 37).
    - id: da
      section: 8.3.24
      level: defined
      wire: CSI Ps c
      rule: DEVICE ATTRIBUTES (DA); ECMA-48 standardized control function, CSI form (source page 37).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-118f929579
        source_line: 763
        wire: CSI Ps c
      source_specific_responses:
      - request: CSI 0 c (or CSI c)
        ecma48: Request identifying DA at Ps=0; nonzero Ps is a device-type identification code from the envisaged standard register.
        xterm: Uses DEC-style CSI ? ... c primary DA responses, with terminal-type and optional capability parameters.
        examples:
        - CSI ? 1 ; 2 c
        - CSI ? 6 2 ; Ps c
        catalogue: xterm_ctlseqs
        entry_id: csi-118f929579
        source_line: 763
        classification: same standard DA request family; distinct DEC response profile retained, not asserted wire-equivalent
    - id: daq
      section: 8.3.25
      level: defined
      wire: CSI Ps... o
      rule: DEFINE AREA QUALIFICATION (DAQ); ECMA-48 standardized control function, CSI form (source page 37).
    - id: dc1
      section: 8.3.28
      level: defined
      wire: '0x11'
      rule: DEVICE CONTROL ONE (DC1); ECMA-48 standardized control function, C0 form (source page 38).
    - id: dc2
      section: 8.3.29
      level: defined
      wire: '0x12'
      rule: DEVICE CONTROL TWO (DC2); ECMA-48 standardized control function, C0 form (source page 38).
    - id: dc3
      section: 8.3.30
      level: defined
      wire: '0x13'
      rule: DEVICE CONTROL THREE (DC3); ECMA-48 standardized control function, C0 form (source page 39).
    - id: dc4
      section: 8.3.31
      level: defined
      wire: '0x14'
      rule: DEVICE CONTROL FOUR (DC4); ECMA-48 standardized control function, C0 form (source page 39).
    - id: dle
      section: 8.3.33
      level: defined
      wire: '0x10'
      rule: DATA LINK ESCAPE (DLE); ECMA-48 standardized control function, C0 form (source page 39).
    - id: dmi
      section: 8.3.34
      level: defined
      wire: ESC `
      rule: DISABLE MANUAL INPUT (DMI); ECMA-48 standardized control function, ESC form (source page 39).
    - id: dta
      section: 8.3.36
      level: defined
      wire: CSI Pn1;Pn2 SP T
      rule: DIMENSION TEXT AREA (DTA); ECMA-48 standardized control function, CSI form (source page 40).
    - id: ea
      section: 8.3.37
      level: defined
      wire: CSI Ps O
