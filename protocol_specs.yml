- id: kitty-deccara-shared-sgr-rendition
  status: resolved-by-explicit-captain-choice
  decision_rule: explicit-captain-choice
  approved_by: Captain
  approved_on: '2026-11-24'
  accepted_interpretation:
    deccara: Apply the full currently admitted ordinary SGR vocabulary, in parameter order, to existing selected cell rendition. Include
      foreground/background/underline colors and styles, existing ordinary font/baseline/conceal, and originating Kitty 221/222 independent
      bold/faint resets.
    reset: Omitted selector remains admitted as reset. Explicit zero and omission now reset all SGR-owned rendition fields to ordinary
      SGR defaults, preserving per-cell protection and OSC 8 hyperlink identity.
    grammar: Retain SGR colon adjacency for the suffix after four coordinate operands. Coordinate operands are not SGR groups. Use the
      same ordinary SGR color and style interpretation, rather than flattening color payload into separate rendition selectors.
    ownership: Preserve text, scalar/cluster geometry, current write rendition, cursor and pending wrap. Apply selected extent; no new
      cell provenance, storage, allocation or renderer dependence.
    decrara: Separate reverse-selector operation; prior omitted-no-default and explicit-zero four-original-attributes decision retained.
      No adoption of all-SGR reversal.
  supersedes:
  - decision: deccara-omitted-selector-default
    scope: Only original-four reset domain. Keep omission admission and original source record; complete SGR reset now selected.
  scope_limit: Adopt originating extended DECCARA for Howl shared SGR repertoire, not byte-for-byte Kitty parser equivalence. Kitty
    coordinate-only no-op differs from our deliberately retained omission-reset behavior. Complete invalid-only fallback, trailing omissions,
    exact source numeric/color clamping, all malformed SGR admission, DECOM/page/margins/double-width geometry, display integration
    and unsupported ordinary SGR extensions remain separate. No full implementation-status assessment or general DECRARA expansion.
  reason: Captain accepted full Kitty extended DECCARA after verified production consumers and the proposal to reuse ordinary SGR. Originating
    Kitty documentation explicitly defines the extension; its diff application sends real foreground/background color updates. Prior
    nine-reference comparison preserved in earlier records; unsupported reference commands are not votes against this originating extension.
  reference_evidence:
  - implementation: kitty
    revision: a79f376b85fd95e3dfd0589877123996bacd4184
    source: docs/deccara.rst; docs/misc-protocol.rst:25-30; kitty/cursor.c:89-224; kitty/vt-parser.c:1022-1069,1074-1136,1430-1444;
      kitty/screen.c:1897-1950; kitty_tests/parser.py:1198-1241
