- id: dec-private-dsr-decxcpr-reply-shape
  request: CSI ? 6 n
  status: resolved-by-explicit-reference-consensus
  approved_by: Captain
  accepted_interpretation:
    profile: single DEC display page
    reply: CSI ? Prow ; Pcol ; 1 R
    effect: Reply with the current cursor row and column followed by DEC display-page number 1.
    originating_family: dec_vt3xx_text.dsr-dec-private
    reference_implementations:
    - xterm (VT420-level DECXCPR)
    - Ghostty
    - GNOME VTE
    - Contour
  published_source_differences:
  - clause: dec_vt3xx_text.dsr-dec-private
    response: CSI Prow ; Pcol ; Ppage R
    source: VT330/VT340 Text Programming (May 1988), Chapter 12, page 202
  - clause: dec_vt420.device-status-reports-extended
    response: CSI Prow ; Pcol ; Ppage R
    source: VT420 Programmer Reference Manual (Feb 1992), Chapter 12, pages 236-237
  - clause: xterm_controls.decxcpr-xterm-reply
    response: CSI ? Prow ; Pcol [ ; Ppage ] R
    source: Xterm ctlseqs line 1420 plus pinned xterm charproc.c; page field depends on emulated VT level
  alternate_implementation_responses:
  - name: Kitty
    reply: CSI ? Prow ; Pcol R
    distinction: private prefix but no page field
  - name: libvterm
    reply: CSI ? Prow ; Pcol R
    distinction: private prefix but no page field
  - name: xterm older emulation levels
    reply: CSI ? Prow ; Pcol R
    distinction: page field omitted below relevant DEC VT level
  reason: Captain selected the private-prefixed three-parameter reply after source and current-usage review. The private prefix disambiguates
    the response from ordinary cursor-position replies and modified function-key sequences; the complete page field is supported by major
    independently maintained terminal references. Published DEC VT330/VT340 and VT420 programmer manuals print the same extended report without
    the private prefix; their historical bytes remain indexed as written, while the chosen interoperable response includes ?. Modern applications
    use CSI ? 6 n and some accept both two- and three-parameter responses.
  page_semantics: The trailing 1 is DEC display-page number 1. DEC page memory is distinct from VT-owned scrollback history and from a TUI
    application’s own scroll position. A single-page terminal can truthfully report page 1 without implementing multipage memory.
  scope_limit: Only the reply to DECXCPR CSI ? 6 n in a single-page profile. This does not select a multipage protocol, a scrollback page,
    or any other DEC-private DSR meanings.
  implementation_mapping: The protocol decision did not itself establish implementation conformance. See the separately scoped, evidence-qualified
    implementation_assessment below.
  implementation_assessment:
    as_of: '2026-11-23'
    scope: CSI ? 6 n replies CSI ? row ; col ; 1 R (one DEC display page, unrelated to scrollback)
    intent: target
    priority: not-yet-triaged
    status: PARTIAL
    owners:
    - howl-vt/src/terminal.zig:report
    - howl-vt/src/fixed_report.zig:appendDecCursorPosition
    tests:
    - file: howl-vt/test/unit/terminal_modes_test.zig
      test: DECXCPR appends DEC cursor position report
    - file: howl-vt/test/unit/terminal_modes_test.zig
      test: fragmented mixed report families preserve order and per-query rollback
    - file: howl-vt/src/fixed_report.zig
      test: cursor reports clamp restored origins and preserve full u16 extent
    verified_subset: Exact single-page reply, 7- and 8-bit CSI, mixed report order, origin mode and full u16 coordinate encoding pass; ordinary
      non-private CPR is still distinct.
    not_full_because: Complete DECXCPR source/VT-level variant matrix, reply-queue failure boundaries and all cursor save/restore/margin
      interactions are not proven source-exhaustively.
    boundary: Current canonical VT only; app/render/backend conformance and broad discovery inventory have not been assessed.
