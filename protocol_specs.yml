    author: Contour project
    authority: protocol-author
    revision: git 829ff29e1d19053e83952fa6ffd48679abd53e4a
    url: https://github.com/contour-terminal/contour/blob/829ff29e1d19053e83952fa6ffd48679abd53e4a/docs/vt-extensions/semantic-block-query.md
