        entry_id: csi-8f7c941588
        source_line: 1574
        wire: CSI Pt ; Pl ; Pb ; Pr ; Pm $ r
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 9, printed pages 167-169
        original_notation: CSI Pt ; Pl ; Pb ; Pr ; Ps1 ; ... ; Psn $ r
        xterm_notation: CSI Pt ; Pl ; Pb ; Pr ; Pm $ r; Pm means an ordered list of SGR attributes.
        attribute_cardinality: If explicit attribute selectors are present, apply them cumulatively in order; when omitted the
          original default selector is 0.
        region_defaults: Top=1, left=1, bottom=last active-page line, right=last active-page column.
        region_bounds: Coordinates depend on DECOM and clamp to page dimensions; page margins do not affect the rectangular operation.
        side_effects: Modifies cell visual attributes, never character values, cursor position or the current SGR rendition; DECSACE
          controls stream-versus-rectangle extent.
        original_selectors:
          '0': reset visual attributes
          '1': bold on
          '4': underline on
          '5': blink on
          '7': reverse image on
          '22': bold off
          '24': underline off
          '25': blink off
          '27': reverse image off
        xterm_extension:
          '8': invisible / conceal on
          '28': invisible / conceal off
          scope: xterm-specific addition, not in the original DEC VT420 selector table
