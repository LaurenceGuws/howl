      source_note: Pinned xterm sets ansi_level only when vtXX_level>=3. Full ECMA-43 conformance and DEC-specific designation
        side effects are not established by that assignment.
    - id: announce-ecma43-level-3
      section: 15.2.2 Table 7 (facility 12/13/14), printed pp.37-39; 10.3.1
      level: defined
      wire: ESC SP N
      rule: Announce ECMA-43 level 3 for subsequent information interchange (facility 14). Level 2 plus one or more locking
        shifts. This announces code structure, not DEC terminal operating level or a generic reset.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-ecb85e0fd8
        source_line: 296
        wire: ESC SP N
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5063-5079,1310-1320
      dec_profile: 'DEC VT420 printed pp.101-102: levels 1/2 designate ASCII G0 and ISO Latin-1 G1 and invoke into GL/GR;
        level 3 designates/invokes ASCII G0 into GL; VT400 only, announcer must be re-sent after reset/power/off/DECSCL.'
      source_note: Pinned xterm sets ansi_level only when vtXX_level>=3. Full ECMA-43 conformance and DEC-specific designation
        side effects are not established by that assignment.
    - id: return-from-other-coding-system
      section: 15.4.1-15.4.2, printed pp.41-42
      level: defined
      wire: ESC % @
      rule: DOCS with final 04/00 and no extra intermediate returns from another registered coding system to ECMA-35 and restores
        the prior announced, designated and invoked coding state. Restoration of active position or other terminal state is
        outside this standard. This does not inherently mean ISO Latin-1.
