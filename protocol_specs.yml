    - id: app-keypad
      section: Chapter 11 / Keypad Application and Numeric Modes, printed pp.192-193; DEC VT100 Tables 3-7/3-8, transcribed PDF pp.121-122
      level: defined
      wire: ESC = / ESC >
      rule: DECKPAM selects application sequences, DECKPNM selects numeric keypad characters; VT420 resets/powers up in numeric mode.
        PF1..PF4 send application sequences in either mode. Original VT100 ANSI and VT52 keypad tables define distinct prefix encodings,
        not a claim that a modern PC keypad has the same mapping.
      related_dec_private_mode: dec_vt420.numeric-keypad-mode
      wire_relation: ESC = and ESC > directly select application/numeric keypad state; CSI ? 66 h/l selects the same state using a DEC-private
        mode that supports DECRQM/DECRPM. They are distinct valid commands.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-5948c81512
        source_line: 401
        wire: ESC =
      - catalogue: xterm_ctlseqs
        entry_id: esc-c378320387
        source_line: 403
        wire: ESC >
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4922-4935; VTPrsTbl.c:9643-9647; xterm ctlseqs 401,403,3390,3392
      original_vt100_key_table:
        source: DEC VT100 Tables 3-7/3-8, transcribed PDF pp.121-122
        numeric_mode: Digits 0..9, minus, comma, period are ASCII; Enter acts as RETURN. PF1..PF4 always application sequences.
        ansi_application:
          prefix: ESC O
          digits_0_through_9: p q r s t u v w x y
          minus: m
          comma: l
          period: n
          enter: M
          PF1_through_PF4: P Q R S
        vt52_application:
          prefix: ESC ?
          digits_0_through_9: p q r s t u v w x y
          minus: m
          comma: l
          period: n
          enter: M
          PF1_through_PF4: ESC P / ESC Q / ESC R / ESC S
      source_note: Pinned xterm keypad state is selected by both ESC controls and mode 66; xterm PC-style mapping and NumLock overrides
        are separately documented. Original key tables are not silently replaced with the modern mapping.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: application keypad modes affect keypad encoding and DECRQM
        relation: protocol-family
        legacy_records:
        - libvterm.esc.deckpam
        - libvterm.esc.deckpnm
        - iterm2.esc.deckpam
        - iterm2.esc.deckpnm
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: input mode category preserves encoding gates screen stacks and reset lifetime
        relation: protocol-family
        legacy_records:
        - iterm2.mode.deckpam
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty ESC keypad handlers are GUI-owned while Howl changes VT mode
        relation: protocol-family
