      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty keyboard CSI rejects signed i32 overflow without losing subsequent commands
        relation: wire-family
        legacy_records:
        - kitty.csi.kitty_pop
        - kitty.csi.kitty_push
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty keyboard CSI u rejects excess operands and pop zero
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard flags stay separate across alternate screen
        relation: protocol-family
      source_locator: docs/keyboard-protocol.rst:321-340
    - id: disambiguate
      section: Disambiguate escape codes
      level: defined
      wire: flag 1
      rule: Distinguishes ambiguous legacy key sequences such as Escape from the start of a CSI sequence.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard stack has exact flags depth mutation and replies
        relation: protocol-family
