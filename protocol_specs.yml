  rio_glyphs:
    title: Rio Glyph Protocol
    author: Raphael Amorim / Rio
    authority: protocol-author
    revision: git e1946a7b98a5a5a4074f384437f0256abf1df75b
    url: https://github.com/raphamorim/rio/blob/e1946a7b98a5a5a4074f384437f0256abf1df75b/specs/glyph-protocol.md
    snapshot_sha256: 2b3a9f5661d9a8d450e5ddb80c411d5fc87e2d55def255f3c6a3e0895535509e
    scope: Raphael Amorim published glyph protocol, dated 2026-05-03 in pinned source. Font/raster/host boundaries untriaged. Source-discovery
      candidate; not an implementation disposition or completeness claim.
    clauses:
    - id: envelope
      section: section 3
      level: defined
      wire: APC 25a1 ; verb [ ; keys ] [ ; payload ] ST
      rule: Verbs s,q,r,c. Structured key/value metadata and Base64 payload where specified.
    - id: support
      section: section 3
      level: defined
      wire: APC 25a1 ; s ST / APC 25a1 ; s ; fmt=... ST
      rule: Discover supported formats glyf,colrv0,colrv1; unknown names ignored.
    - id: query
      section: sections 5.1-5.2
      level: defined
      wire: APC 25a1 ; q ; cp=hex ST / APC 25a1 ; q ; cp=hex ; status=list ST
      rule: Any valid scalar including non-PUA. Echo cp. Coverage set empty,system,glossary,system+glossary (comma-separated). Glossary
        overrides system on rendering. Non-PUA cannot have glossary coverage. Ignore unknown names.
    - id: register
      section: section 6.1
      level: defined
      wire: APC 25a1 ; r ; cp=...;fmt=...;... ; base64 ST
      rule: Register PUA glyph in session glossary; replace same codepoint. fmt defaults glyf; upm default1000, aw/lh default upm; width1|2
        default1 controls layout. Size modes height(default),advance,contain,cover,stretch; default align center,center and pad0. Further
        exact key grammar and bounds need qualification.
    - id: replies
      section: section 6.2
      level: defined
      wire: APC 25a1 ; r ; cp=hex ; status=0 ST / APC 25a1 ; r ; cp=hex ; status=nonzero ; reason=code ST
      rule: Registration reply policy0 silent,1 all(default),2 errors. Status0 success; errors include out_of_namespace,composite_unsupported,hinting_unsupported,malformed_payload,payload_too_large.
        Unknown reply values default1; cp echoed.
    - id: clear
      section: sections 7.1-7.3
      level: defined
      wire: APC 25a1 ; c [ ; cp=hex ] ST / APC 25a1 ; c ; status=0 ST / APC 25a1 ; c ; status=1 ; reason=out_of_namespace ST
      rule: Clear one PUA glyph or all when omitted; absent slot succeeds. Reject non-PUA. Invalidate cached rasters on clear, overwrite
        and eviction.
    - id: bounds-lifetime
      section: sections 4,6.2-6.4
      level: defined
      wire: APC 25a1 registrations
      rule: Only PUA E000..F8FF,F0000..FFFFD,100000..10FFFD. Limit1024 per session, FIFO eviction; decoded payload <=64KiB. No cross-session/persistent
        registration. RIS may clear.
    - id: glyf
      section: sections 8.1-8.5
      level: defined
      wire: fmt=glyf
      rule: OpenType simple glyph contours, no composite glyph or hinting; current foreground color.
    - id: colrv0
      section: section 8.6
      level: defined
      wire: fmt=colrv0
      rule: Container with simple glyph records, COLR v0 and CPAL tables; source defines binary lengths and counts. Dynamic foreground
        sentinel; full binary format qualification outstanding.
    - id: colrv1
      section: section 8.7
      level: defined
      wire: fmt=colrv1
      rule: Same container with COLR v1 paint graph, optional CPAL; supported paint subset optional. Dynamic foreground requires appropriate
        raster invalidation.
    - id: text-ownership
      section: section 9
      level: defined
      wire: glyph render versus cell text
      rule: Registered visual glyph does not replace original cell codepoint in copying, selection or searching. No filesystem access
        through protocol. Source rationale is not a blanket security guarantee.
