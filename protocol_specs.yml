    snapshot_sha256: aaa13fcbc149fe0f3f391f933279580f74a96fd312d6ed06b8ff03c2d46672e8
    scope: Selected urxvt decimal mouse encoding and corroboration of inherited rxvt modes from doc/rxvt.7.pod and src/command.C.
    clauses:
    - id: decimal-mouse-encoding
      section: doc/rxvt.7.pod:2028-2035, Mode 1015; src/command.C:1330-1371,3743
      level: defined
      wire: CSI ? 1015 h / CSI ? 1015 l
      rule: Enable/disable urxvt decimal mouse encoding. Reports CSI b;x;y M where b retains legacy +32 offset (release code
        3 plus modifiers then +32), x/y are one-based decimal cell coordinates without +32. Shift-left press at column80,row1
        -> CSI 36;80;1M. Encoding does not enable tracking by itself.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1015-h-line-983
        source_line: 983
        wire: CSI ? 1015 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1015-l-line-1129
        source_line: 1129
        wire: CSI ? 1015 l
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:7825-7842; button.c:219-292,5428-5434,5610-5625
      reply: CSI Pb ; Px ; Py M
      source_note: Pinned xterm treats encoding modes as mutually exclusive and RESET affects matching active mode only; decimal
        positions do not have the legacy byte ceiling. urxvt source gives SGR precedence over 1015 when both bits present,
        then UTF8; exact mixed-mode state and reset differences require separate qualification.
  iso_ir196:
    title: 'ISO-IR 196: UCS Transformation Format (UTF-8) with standard return'
    author: ISO/IEC JTC1/SC2; ECMA sponsor
    authority: registered-standard
    revision: 22 April 1996, registration 196
    url: https://itscj.ipsj.or.jp/ir/196.pdf
    snapshot_sha256: cec9ddc085315b2825349ef1bef189e4f6d3752b53a5e7be4953fa1b91fe8a86
    scope: Exact registered DOCS UTF-8 selection and standard return relationship. Registration does not identify an implementation
      level. Original scanned registry page visually verified.
    clauses:
    - id: utf8-with-standard-return
      section: Registration 196, 1996-04-22, single registry page
      level: defined
      wire: ESC % G
      rule: Designate and invoke UCS transformation format UTF-8 with standard return. Registry escape suffix 02/05 04/07,
        full 7-bit wire 0x1b 0x25 0x47. Implementation level unspecified. By ECMA-35 DOCS standard-return semantics, ESC %
        @ returns to previous coding state; not an inherent switch to Latin-1.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-e2136b9e51
        source_line: 310
        wire: ESC % G
      related_return: ecma35.return-from-other-coding-system
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:6218-6249
      source_note: Xterm changes wide/UTF-8 mode subject to resource policy. Selection identity reconciled, standard-return
        state semantics remain pending. Registration 190/191/192 are different without-standard-return wires; not aliases.
  att_610:
    title: 610 Business Communications Terminal User Guide
    author: AT&T
    authority: protocol-author
