        location: charproc.c:5153-5277; graphics.c:628-665; graphics.h:50
      source_note: Pinned request requires exactly 3 parameters; four-operand geometry set cannot enter handler. Success color
        reply 3 params, geometry reply 4; failure reply only item/status. Register set 2..1024 inclusive; reset sets resource
        override 0, then derives default. Runtime availability is checked after register set/reset. Sixel read min(text-pixel
