  dec_std070:
    title: DEC STD 070 Video Systems Reference Manual (selected Character Cell Display clauses)
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: A-MN-ELSM070-00-0000 Rev H, 03 December 1991; EL-00070-05 Character Cell Display pages dated 29 June 1990, for review
    url: https://bitsavers.trailing-edge.com/pdf/dec/standards/EL-SM070-00_DEC_STD_070_Video_Systems_Reference_Manual_Dec91.pdf
    snapshot_sha256: d30c2ace1cebdd5a28454177d4d9610d9661110bbeb4b97773259313042962f2
    scope: Selected original internal standard clauses from published archival scan; chapter-specific review/date markings preserved.
      Text extraction read; no new visual page verification or claim of whole standard coverage.
    clauses:
    - id: request-status-string
      section: EL-00070-05 p.5-196
      level: defined
      wire: DCS $ q Pt ST
      rule: Requests the state of one setting not encoded as SM/RM; Pt consists of its identifying intermediates and final byte. Reports
        DECRPSS. Only one setting per request.
      related_command: dec_vt420.request-status-string
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRQSS replies for owned state and invalid requests
        relation: wire-family
        legacy_records:
        - libvterm.dcs.decrqss_sgr
        - libvterm.dcs.decrqss_decscusr
        - kitty.dcs.decrqss
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm DECRQSS status reports retain different invalid margins and bank protection
        relation: wire-family
        legacy_records:
        - libvterm.dcs.decrqss_decstbm
        - libvterm.dcs.decrqss_decsca
        - libvterm.dcs.decrqss_unsupported
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm hidden DECSLRM lifetime differs from Howl active-only margin retention
        relation: wire-family
        legacy_records:
        - libvterm.dcs.decrqss_decslrm
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRQSS reports conformance and page length across framing modes
        relation: wire-family
        legacy_records:
        - iterm2.dcs.decrqss
    - id: reply-status-string
      section: EL-00070-05 p.5-197, PDF zero-based page 451
      level: defined
      wire: DCS Ps $ r Pt ST
      rule: Ps 1 means successful request, with complete setting control excluding CSI introducer and no omitted parameters; Ps 0 means
        unknown or unsuccessful, with empty payload. Returned setting is sufficient to overwrite current selection, including when there
        is no default. Example blinking and reversed rendition returns 0;5;7m as payload.
      accepted_reconciliations:
      - decrpss-validity-polarity
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRQSS reports conformance and page length across framing modes
        relation: protocol-family
        legacy_records:
        - iterm2.dcs.decrqss
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRQSS replies for owned state and invalid requests
        relation: protocol-family
        legacy_records:
        - kitty.dcs.decrqss
    - id: request-rectangle-checksum
      section: EL-00070-05 pp.5-179,5-181
      level: defined
      wire: CSI Pid ; Pp ; Pt ; Pl ; Pb ; Pr * y
      rule: Level 4. Pid identifies reply. Pp zero or omitted checks all page memory and ignores subsequent rectangle operands; above
        highest page selects highest. Rectangle relative to DECOM; unordered bounds ignored. Defaults top=1,left=1,bottom=last page line,right=last
        page column. Reply DCS Pid ! ~ HHHH ST (four uppercase hex digits). Complete checksum arithmetic not defined here.
      related_command: dec_vt420.request-rectangle-checksum
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum extension affects rectangular checksum reply
        relation: protocol-family
      - file: howl-vt/src/fixed_report.zig
        test: extent parameters title stack and checksum serialize exact payloads
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum flags distinguish undrawn space admission and combining totals
        relation: protocol-family
        note: Narrow regression evidence at f066679; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum combining overflow storage and wide tails are counted only once
        relation: protocol-family
        note: Narrow regression evidence at f066679; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum arithmetic uses source video weights and modular negation
        relation: protocol-family
        note: Narrow regression evidence at f066679; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum resolves nonzero page selectors and zero rectangle defaults
        relation: protocol-family
        note: Narrow regression evidence at 81a286f; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum mode resets to its default on RIS and DECSTR
        relation: protocol-family
        note: Narrow regression evidence at 81a286f; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: checksum page zero and omitted page preserve requested rectangle
        relation: protocol-family
        note: Narrow page-selection regression; not full arithmetic or legacy provenance qualification.
      accepted_reconciliations:
      - decrqcra-page-zero-profile
    - id: attr-change-rect
      section: EL-00070-05 pp.5-173–5-174
      level: defined
      wire: CSI Pt ; Pl ; Pb ; Pr ; Ps1 ; ... ; Psn $ r
      rule: Changes only specified video attributes, never character values, cursor position or current graphic rendition. Bounds
        depend on DECOM, not otherwise page margins; DECSACE selects extent. Top/left defaults1, bottom/right last page position,
        exceeding dimensions clamp; inverted bounds ignored. Ordered selectors are cumulative. Original selectors 0 reset four
        video attributes, 1/4/5/7 set bold/underline/blink/reverse, 22/24/25/27 clear; other values ignored except defined extensions.
        If no valid subsequent selector received, default 0 clears video attributes. Double-width row columns refer to character
        positions.
      related_command: dec_vt420.attr-change-rect
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: rectangle rendition preserves complete wide and sized character ownership'
        relation: protocol-family
        note: Narrow regression evidence at a89ed30; not whole-clause qualification.
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: rectangle attribute defaults distinguish change from reverse'
        relation: protocol-family
        note: 'Originating Kitty corrected expectation: coordinate-only no-op, bare and explicit-zero reset. Historical RED repaired;
          VT Debug 1129/1129. Narrow proof, not whole-family conformance.'
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: extended DECCARA applies complete shared rendition to existing cells'
        relation: protocol-family
        note: Selected shared-SGR regression evidence; not full wire/geometry/renderer qualification.
