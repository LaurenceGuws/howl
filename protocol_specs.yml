    - id: request-status-string
      section: Reports / Request Selection or Setting
      level: defined
      wire: DCS $ q Pt ST
      rule: DECRQSS queries selected rendition or margin state by control-function descriptor.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-2bfa63903e
        source_line: 474
        wire: DCS $ q Pt ST
      source_specific_descriptors:
        source: VT420 Programmer Reference Manual, Table 12-4 and pages 266-268; xterm ctlseqs lines 474-497
        original_gate: One control-function descriptor per request; intermediate and final bytes only, including for controls with additional
          numeric parameters.
        original_dec_descriptors:
        - +q
        - '*}'
        - $}
        - '*x'
        - m
        - +r
        - '"q'
        - $|
        - '"p'
        - s
        - t
        - '*|'
        - $~
        - r
        xterm_additional_examples:
        - SP q (DECSCUSR)
        - ) { (DECSTGLT)
        - ', | (DECAC)'
