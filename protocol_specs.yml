  kitty_file_transfer:
    title: Kitty file transfer over the TTY (OSC 5113)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/file-transfer-protocol.rst
    scope: Complete published transfer action families, not a filesystem permission grant
    clauses:
    - id: envelope
      section: Encoding of transfer commands as escape codes
      level: defined
      wire: OSC 5113 ; key=value [ ; key=value ... ] ST
      rule: Encodes transfer commands and metadata with action and session identity.
      test_locations:
      - file: howl-vt/test/unit/terminal_osc_test.zig
        test: iTerm and Kitty file transfers retain one opaque ordered stream
        relation: protocol-family
        legacy_records:
        - kitty.osc.file_transfer
    - id: send
      section: Sending files to the computer running the terminal emulator
      level: defined
      wire: OSC 5113 ; ac=send ; id=session ST
      rule: Requests authorization to send files to the terminal-host computer.
    - id: receive
      section: Receiving files from the computer running terminal emulator
      level: defined
      wire: OSC 5113 ; ac=receive ; id=session ST
      rule: Requests authorization to receive files from the terminal-host computer.
    - id: file
      section: File metadata
      level: defined
      wire: OSC 5113 ; ac=file ; fid=... ST
      rule: Describes a file including type, path, timestamps and permission metadata.
    - id: data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=data ; d=base64 ST
      rule: Transmits encoded data chunks for a declared file within a session.
    - id: end-data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=end_data ; fid=... ST
      rule: Marks the end of transferred data for a file.
    - id: status
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=status ; st=base64 ST
      rule: Reports transfer status or errors for a session.
    - id: finish
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=finish ST
      rule: Finishes the authorized transfer session.
    - id: cancel
      section: Canceling a session
      level: defined
      wire: OSC 5113 ; ac=cancel ST
      rule: Cancels a transfer session and retires its in-flight state.
    - id: compression
      section: Compression
      level: defined
      wire: OSC 5113 ; zip=zlib ST
      rule: Allows compressed transfer content under the documented bounds.
    - id: links
      section: Symbolic and hard links
      level: defined
      wire: OSC 5113 ; ft=symlink|link ST
      rule: Describes symbolic or hard link metadata instead of raw file contents.
    - id: delta
      section: Transmitting binary deltas
      level: defined
      wire: OSC 5113 ; tt=rsync ST
      rule: Uses signatures and deltas for content updates.
    - id: authorization
      section: Bypassing explicit user authorization
      level: defined
      wire: OSC 5113 ; pw=hash ST
      rule: Supports an explicitly configured pre-shared authorization method.
    - id: quiet
      section: docs/file-transfer-protocol.rst:212-227,573
      level: defined
      wire: OSC 5113 ; ac=send|receive ; id=... ; q=0|1|2 ST
      rule: q0 verbose,1 errors only,2 suppress errors; actual data retained. Suppressing permission ack not permission bypass.
    - id: metadata-grammar
      section: docs/file-transfer-protocol.rst:545-608
      level: defined
      wire: OSC 5113 ; key=value ... ST
      rule: Unknown keys ignored. ASCII alphanumeric/_ keys; safe_string excludes semicolon; signed decimal defaults q0,mod/prm/sz -1.
        Base64 UTF-8 or binary. Keys ac,zip,ft,tt,id,fid,pw,q,mod,prm,sz,n,st,pr,d.
  kitty_misc:
