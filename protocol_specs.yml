- id: xtchecksum-bit3-and-unicode
  status: resolved-by-explicit-captain-choice
  approved_by: Captain
  approved_on: '2026-11-24'
  decision_rule: explicit-captain-choice
  accepted_interpretation:
    wire: 'CSI Ps # y'
    bit3: Admit uninitialized cells as spaces, subject to trimming; bit2 also admits them.
    bit4: Use full codepoint mapping rather than DEC character mapping; suppress combining additions.
    combining: Combining additions contribute only with bit4 clear and untrimmed total selected.
  scope_limit: Only disputed flag semantics and their stated trim interaction; not whole checksum arithmetic, unsupported
    bit5, admission or DEC historical authenticity.
  reason: Xterm actual ptyx.h and screen.c contradict published prose. Ghostty explicitly models the actual implementation.
    Captain accepted this interoperable behavior, not a claim of independent algorithm consensus.
  implementation_policy: semantic-selection-only; disposition and priority not yet triaged
  superseded_pending_record:
    id: xtchecksum-bit3-and-unicode
    status: material-source-difference-awaiting-scope
    wire: 'CSI Ps # y'
    original_author_sources:
    - clause: xterm_controls.checksum-extension
      revision: dated official control-sequence reference, observed 2026-11-23
      meaning: Published xterm table says bit 3 omits uninitialized cells and bit 4 retains combining characters.
    xterm_implementation:
      revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
      source: ptyx.h:488-496; screen.c:3177-3264
      meaning: Pinned csDRAWN includes uninitialized cells; combining addition occurs when csBYTE is clear and can be lost
        by trimmed total.
    question: Verify relevant modern reference implementations and actual checksum behavior before choosing mask semantics.
    decision: null
    followup_evidence:
    - implementation: ghostty
      revision: 5813c9461d5af78b6307a1254d00b1bc190eaccd
      source: src/terminal/xt_checksum.zig:20-57,123-153
      observation: Explicitly follows xterm code rather than contradictory docs. Bit 3 makes unwritten cells eligible as
        spaces, still subject to trim; bit 4 selects full-codepoint mapping, excludes combining additions. Combining codepoints
        added only when bit 4 clear and no-trim sum selected. Implementation intentionally modeled on xterm; not independent
        algorithm origin.
    - implementation: xterm_snapshots
      revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
      source: ptyx.h:488-496; screen.c:3177-3195,3236-3264
      observation: Bit 3 permits undrawn cells as spaces, also admitted by bit 2. Trimmed result can omit spaces. Bit 4
        selects charData/full codepoint rather than DEC mapping; combining data only contributes to untrimmed total when
        bit 4 clear. Special values may be skipped.
