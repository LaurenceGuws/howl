      dec_profile: 'DEC VT420 printed pp.101-102: levels 1/2 designate ASCII G0 and ISO Latin-1 G1 and invoke into GL/GR;
        level 3 designates/invokes ASCII G0 into GL; VT400 only, announcer must be re-sent after reset/power/off/DECSCL.'
