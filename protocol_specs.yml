      wire: ESC ( [ I ... ] F
      rule: Designate identified single-byte 94-character graphic set as G0, superseding prior designation. Set identity is
        the registered final byte with any associated intermediates, not always one final character. If the code element is
        already invoked, new set becomes active immediately; otherwise it is invoked by corresponding shift. A 96-character
        set cannot be designated G0. A 94-set excludes the outer SPACE/DELETE positions; a 96-set uses the full six columns.
