      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5619-5639; screen.c:xtermCheckRect
      reply: DCS Pid ! ~ HHHH ST
      source_note: Pinned xterm uses window permission, computes a rectangular checksum and masks to 16 bits. Do not infer original arithmetic,
        page semantics or admissible checksum extensions from that code.
