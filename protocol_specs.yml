      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 191; xterm ctlseqs set/reset lines 920/1070
        selector: 7
        name: DECAWM
        set_wire: CSI ? 7 h
        reset_wire: CSI ? 7 l
        original_default: no autowrap in the original VT420 reference
        set_effect: At the right page border, subsequent graphic characters wrap to the next line, scrolling the region when appropriate.
        reset_effect: At the right page border, subsequent graphics replace the border cell rather than wrapping.
        source_specific_constraints: The DEC VT420 source explicitly says default no autowrap; do not silently substitute an independently
          configured modern emulator startup default. This is source history, not Howl runtime conformance.
