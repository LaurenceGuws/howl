        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6218-6249
      pending_reconciliation: docs-return-vs-xterm-default-charset
  cde_dtterm:
    title: dtterm(5) terminal escape sequences
    author: Common Desktop Environment / Digital UNIX vendor documentation
    authority: protocol-publisher-profile
    revision: Digital UNIX 3.2c manual, historical HTML reproduction
    url: https://www.typewritten.org/Manual/DEC/Digital_UNIX/3.2c/man5/dtterm.html
    snapshot_sha256: 087f57702b3e58d28d541185ae4dfd83f174d0e0efb41ce5ace9142964958bfb
    scope: Selected CDE dtterm title and window-operation meanings; inherited Sun shelltool window controls predate CDE. This
      is a pinned published profile, not a claim CDE originated every operation.
    clauses:
    - id: window-manipulation
      section: Received Escape Sequences / Window manipulation
      level: defined
      wire: CSI Ps [ ; Pm ; Pm ] t
      rule: 'CDE dtterm published window profile: 1 restore,2 minimize,3;x;y move in pixels,4;height;width resize window in
        pixels,5 raise,6 lower,7 refresh,8;height;width resize text in characters; 11 state,13 position,14 window pixels,18
        text characters,20 icon label,21 title reports. Earlier Sun shelltool origins for 1..8,11,13,14,18 are reported by xterm
        historical notes, not independently pinned here.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-91d57d4c0a
        source_line: 1616
        wire: CSI Ps ; Ps ; Ps t
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:8969-9309; ctlseqs 1616-1696,3687-3768
      replies:
        '11': CSI 1 t non-iconified or CSI 2 t iconified
        '13': CSI 3 ; x ; y t
        '14': CSI 4 ; height ; width t
        '18': CSI 8 ; height ; width t
        '20': OSC L label ST
        '21': OSC l title ST
      source_note: dtterm 14 reports window pixels; xterm default 14 reports text-area pixels and 14;2 window pixels. Treat
        as explicit profile distinction, not identical query dimensions. Native window authorization and units are host-owned.
      accepted_reconciliations:
      - xtwinops-14-window-vs-text-area
    - id: title-selector-0
      section: Received Escape Sequences / Set text parameters
      level: defined
      wire: OSC 0 ; Pt BEL
      rule: Set both icon name and window title to Pt under dtterm published profile. Xterm accepts BEL or ST; do not infer
        identical empty-title or encoding defaults.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: osc-selector-0
        source_line: 2025
        wire: OSC 0 ; Pt (BEL | ST)
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: misc.c:4140-4173
      source_note: Pinned xterm substitutes xterm for missing/empty title payload. User-facing title/host policy remains distinct
        from terminal text.
    - id: title-selector-1
      section: Received Escape Sequences / Set text parameters
      level: defined
      wire: OSC 1 ; Pt BEL
      rule: Set icon name to Pt under dtterm published profile. Xterm accepts BEL or ST; do not infer identical empty-title
        or encoding defaults.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: osc-selector-1
        source_line: 2026
        wire: OSC 1 ; Pt (BEL | ST)
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: misc.c:4140-4173
      source_note: Pinned xterm substitutes xterm for missing/empty title payload. User-facing title/host policy remains distinct
        from terminal text.
    - id: title-selector-2
      section: Received Escape Sequences / Set text parameters
      level: defined
      wire: OSC 2 ; Pt BEL
      rule: Set window title to Pt under dtterm published profile. Xterm accepts BEL or ST; do not infer identical empty-title
        or encoding defaults.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: osc-selector-2
        source_line: 2027
        wire: OSC 2 ; Pt (BEL | ST)
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: misc.c:4140-4173
      source_note: Pinned xterm substitutes xterm for missing/empty title payload. User-facing title/host policy remains distinct
        from terminal text.
    - id: restart-working-directory
      section: Received Escape Sequences / Set text parameters selector 3
      level: defined
      wire: OSC 3 ; Pt BEL
      rule: Set working directory for later session restart, not immediate shell chdir; the terminal attempts to restart there.
        This is CDE profile semantics, not xterm X property behavior or permission to access arbitrary host paths.
      pending_reconciliation: osc3-cde-directory-vs-xterm-xproperty
  tek_4015:
    title: 4015 and 4015-1 Computer Display Terminal Users Instruction Manual
    author: Tektronix
    authority: protocol-author
    revision: First printing August 1974; 070-1649-00
    url: https://bitsavers.trailing-edge.com/pdf/tektronix/401x/070-1649-00_4015_and_4015-1_Computer_Display_Terminal_Users_Instruction_Manual_Aug1974.pdf
    snapshot_sha256: 86b4628fc59885c4ac961dbeb0b443c9ffd699207ba64b5b2eb481e4adfdd219
    scope: Selected 4015/4015-1 Tek graphics control profiles, including Option 34. Not a complete 4014/4015 protocol or a
      claim that all hardware profiles match. Source text extraction verified; visual verification of relevant pages unavailable.
    clauses:
    - id: status-address-query
      section: Table 2-1 p.2-7; GIN Mode Summary pp.3-29/30
      level: defined
      wire: ESC ENQ
      rule: 'In alpha/graph mode, transmit status byte followed by four address bytes for alpha cursor lower-left or graph
        beam; return to prior mode after transmission. Crosshair displayed in GIN: transmit four address bytes without status
        and return to alpha. CR optional; EOT optional only after CR. Bypass suppresses echoed data. Original hardware status
        bit meanings and timing are profile-specific, not generic VT cursor report.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-bf0cdf83e7
        source_line: 3310
        wire: ESC ENQ
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:431-444,1268-1292
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      original_status_bits:
        '8': strap dependent
        '7': '0'
        '6': '1'
        '5': 0 available hardcopy unit
        '4': 1 graph mode
        '3': 0 graph mode
        '2': 1 margin 2; apply 512 X adjustment if needed
        '1': 0 auxiliary unit active
      source_note: Pinned xterm uses fixed octal 064 with margin 2 flag in non-GIN branch; GIN branch omits status. Four 5-bit
        address chunks plus optional CR/EOT; exact original status bit behavior not established.
    - id: page
      section: Table 2-1 p.2-7
      level: defined
      wire: ESC FF
      rule: Erase graphics display, select alpha mode, home cursor, choose margin 1 and clear bypass. Preserve selected character
        size unless other reset changes it. Not ECMA FF.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-24ece2028e
        source_line: 3312
        wire: ESC FF
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:553-558,1011-1040
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
    - id: apl-select
      section: Table 2-1 p.2-8
      level: defined
      wire: ESC SO
      rule: Select APL character set on 4015 when character-set switch permits program selection. This is Tek APL selection,
        not ANSI locking shift.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-06cd9b82d6
        source_line: 3314
        wire: ESC SO
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:580-584
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm explicitly ignores APL selection; original hardware behavior preserved.
    - id: ascii-select
      section: Table 2-1 p.2-8
      level: defined
      wire: ESC SI
      rule: Select ASCII character set on 4015 when character-set switch permits program selection. Distinct from ANSI locking
        shift.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-8d5915fa7a
        source_line: 3316
        wire: ESC SI
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:574-578
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm explicitly ignores ASCII selection; original hardware behavior preserved.
    - id: hardcopy
      section: Table 2-1 p.2-7
      level: defined
      wire: ESC ETB
      rule: Request physical display hard copy if attached and energized; clear bypass. No effect while crosshair displayed.
        Original operation is a device request, not a file-write command.
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:544-551,1964-2005
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm uses ALLOWLOGGING-gated copy of recorded Tek codes to timestamped file and turns off GIN if
        active. This is materially different from hardware hardcopy.
      pending_reconciliation: tek-hardcopy-vs-code-file
    - id: bypass
      section: Table 2-1 p.2-6; GIN Summary pp.3-29/30
      level: defined
      wire: ESC CAN
      rule: Enter bypass condition to inhibit printing echoed input/GIN response bytes. Cleared by documented BEL, BS, CR,
        ESC ETB, ESC FF, HT, LF, US, VT or vector execution; bypass is not ANSI cancellation.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-3824a5834a
        source_line: 3321
        wire: ESC CAN
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:565-568
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
    - id: gin-enter
      section: Table 2-1 p.2-8; GIN Summary pp.3-29/30
      level: defined
      wire: ESC SUB
      rule: Enter graphics input mode, show crosshair, leave graph mode and enable bypass. Crosshair address can be requested
        by ESC ENQ or keyboard character; optional CR/EOT suffix follows four address bytes. Original hardware requires settling
        time except documented serial/coordinate cases.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-c7468fd1fd
        source_line: 3323
        wire: ESC SUB
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:460-472,431-444
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      related_query: tek_4015.status-address-query
    - id: special-point-plot
      section: Option 34, Appendix F p.F-7
      level: defined
      wire: ESC FS
      rule: Select special point plot with Enhanced Graphics Module. Intensity byte precedes each point address and selects
        stored spot size for grayscale; intensity differs from normal point mode.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-dd3f49ca71
        source_line: 3325
        wire: ESC FS
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:453-458,660-667
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm selects special-point parser but explicitly ignores intensity byte; full original point-size
        behavior not established.
    - id: character-size
      section: Table 2-2 p.2-9
      level: defined
      wire: 'ESC 8 / ESC 9 / ESC : / ESC ;'
      rule: Select one of four character sizes. Original 4015 table lists 74x35,81x38,121x58,132x64 characters by lines. These
        are hardware profile capacities, not ANSI cell resizing.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-cd1aed3d58
        source_line: 3331
        wire: 'ESC :'
      - catalogue: xterm_ctlseqs
        entry_id: esc-769d1ab47b
        source_line: 3333
        wire: ESC ;
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:140-150,586-590
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm uses 133 columns for smallest size, unlike the checked 4015 manual table 132. 4014 and later
        hardware revision capacities not independently verified.
      pending_reconciliation: tek-small-character-capacity
    - id: beam-vector-select
      section: Tables 2-3 and F-3/F-4, pp.2-9/10,F-6
      level: defined
      wire: ESC Fbyte (0x60..0x77 selected values)
