        and wheel/other buttons, 2962-3033
      level: defined
      wire: CSI ? 1000 h / CSI ? 1000 l
      rule: Enable X11 xterm press and release reporting, including modifiers, no motion-only reports. Legacy CSI M CbCxCy uses
