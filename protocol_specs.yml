    - id: printer-extent-mode
      section: Chapter 11 / Printer Extent Mode (DECPEX), printed page 210
      level: defined
      wire: CSI ? 19 h / CSI ? 19 l
      rule: 'Selects the extent of the print-page output: full display page or current scrolling region only.'
      original_mode_semantics:
        name: DECPEX
        selector: 19
        source: Original DEC VT420 Programmer Reference Manual, page 210
        original_default: 'reset: print current scrolling region'
        set_wire: CSI ? 19 h
        set_effect: Print the complete page, not merely the scrolling region.
        reset_wire: CSI ? 19 l
