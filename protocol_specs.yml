      wire: ESC SP M
      rule: Announce ECMA-43 level 2 for subsequent information interchange (facility 13). Level 1 plus G2/G3 (one or both)
        and SS2/SS3 (one or both) with GL as single-shift area; initial designation only. This announces code structure, not
        DEC terminal operating level or a generic reset.
      also_documented:
