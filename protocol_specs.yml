        test: 'terminal: pinned Kitty DECSTBM rejects extra operands without changing margins'
        relation: wire-family
        legacy_records:
        - kitty.csi.decstbm
    - id: sca
      section: Select Character Attributes (DECSCA), page 35
      level: defined
      wire: CSI Ps " q
      rule: Selects whether subsequently written characters are protected against selective erasure.
      also_documented:
