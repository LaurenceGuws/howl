  kitty_keyboard:
    title: Comprehensive keyboard handling in terminals
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/keyboard-protocol.rst
    scope: Opt-in progressive keyboard reporting including bank-local stacks, encoding and event types
    clauses:
    - id: flags
      section: Progressive enhancement
      level: defined
      wire: CSI = flags [ ; mode ] u
      rule: 'Sets, adds or clears the five progressive enhancement flags according to mode: 1 (default) replaces the flags, 2 sets specified
        bits, 3 clears specified bits.'
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard stack has exact flags depth mutation and replies
        relation: protocol-family
        legacy_records:
        - iterm2.csi.kitty_set
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty keyboard CSI rejects signed i32 overflow without losing subsequent commands
        relation: protocol-family
        legacy_records:
        - kitty.csi.kitty_set
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: pinned Kitty keyboard CSI u rejects excess operands and pop zero
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard flags stay separate across alternate screen
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: bare CSI s selects DEC savepoint or default margins by DECLRMM'
        relation: protocol-family
        note: Narrow regression evidence at fefdce7; not whole-clause qualification.
    - id: query
      section: Progressive enhancement
      level: defined
      wire: CSI ? u
      rule: Replies with current keyboard enhancement flags using CSI ? flags u.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard stack has exact flags depth mutation and replies
        relation: wire-family
        legacy_records:
        - iterm2.csi.kitty_query
        - kitty.csi.kitty_query
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard query preserves full pending output on failure
        relation: protocol-family
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: bare CSI s selects DEC savepoint or default margins by DECLRMM'
        relation: protocol-family
        note: Narrow regression evidence at fefdce7; not whole-clause qualification.
    - id: stack
      section: Progressive enhancement
      level: defined
      wire: CSI > flags u / CSI < count u
      rule: Push omitted flags default0, pop omitted count default1; empty resets flags; full push evicts oldest. Separate primary/alternate
        stacks; bounded capacity.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: kitty keyboard stack has exact flags depth mutation and replies
        relation: wire-family
        legacy_records:
        - iterm2.csi.kitty_pop
