    - id: active-status-display
      section: Chapter 11 / DECSASD, printed pp.219-220
      level: defined
      wire: CSI Ps $ }
      rule: VT400 mode. Ps=0 default routes display data to main display only; Ps=1 routes to status line only. This selects write destination,
        not visibility or status text content.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d29e668ba9
        source_line: 1984
        wire: CSI Ps $ }
      xterm_reference:
