      source_note: Pinned code iterates up to OSC_NCOLORS, skips empty fields, resolves opposite colors under reverse video
        and compile-gates Tektronix/highlight roles. Reply uses four hex digits per channel. Invalid or unsupported roles, unavailable
        RGB and reverse-video interactions need separate qualification; this is not an assumed 10-role implementation obligation.
