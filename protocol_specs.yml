    - id: user-defined-keys
      section: Chapter 11 / DECUDK, printed pp.202-209, Tables 11-1/11-2
      level: defined
      wire: DCS Pc ; Pl [ ; Pm ] | Ky/St[;Ky/St...] ST
      rule: VT420 VT400/PC TERM only, 48 UDKs sharing 768 bytes. Pc=0/omitted clears all before loading; 1 clears/reloads selected keys
        in sequence with current free space. Pl=0/omitted locks after loading;1 leaves unlocked, cannot unlock already locked keys except
        SET-UP. Pm=0/2/omitted shifted,1 unshifted,3/4 alternate unshifted/shifted PC only. Key selector uses original tables; data consists
        of ASCII hex pairs encoding any 8-bit byte, semicolon between definitions. Invalid pair stops load, keeps earlier definitions
        and sends rest to screen. RIS clears all UDKs. Do not confuse this with arbitrary host input injection or modern key profiles.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-26ac144774
        source_line: 434
        wire: DCS Ps ; Ps | Pt ST
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:4392-4429,5362-5368; ptyx.h:3514-3521
      original_key_selectors:
