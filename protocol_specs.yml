  hp_2624b:
    title: 2624B Display Terminal Reference Manual
    author: Hewlett-Packard
    authority: protocol-author
    revision: September 1981; 02624-90008
    url: https://bitsavers.trailing-edge.com/pdf/hp/terminal/262x/2624/02624-90008_2624B_Display_Terminal_Reference_Manual_Sep1981.pdf
    snapshot_sha256: 55cd5733ceb70805a5a9fd0605f94791d87f413c7e1658220a77fd1e187c08a6
    scope: Selected memory-lock behavior; original display memory distinct from xterm scrolling region. Text extraction verified.
    clauses:
    - id: memory-lock
      section: Section III Memory Lock Mode, pp.3-3/4
      level: defined
      wire: ESC l
      rule: 'With cursor home, protect display memory against overflow: reject attempts to exceed available memory with error/beep.
        With cursor below top, lock rows above cursor while later lines scroll past; remains enabled until disabled, hard reset
        or power off.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-b77edc5658
        source_line: 410
        wire: ESC l
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:4753-4766
      source_note: Pinned xterm models lock/unlock as changing top scrolling margin to current row or zero, preserving bottom
        margin and flushing pending scroll; no original HP overflow protection established.
      accepted_reconciliations:
      - hp-memory-lock-overflow-protect
      disposition: source-only
      disposition_reason: Do not substitute margin change for original display-memory protection or select partial HP emulation.
    - id: memory-unlock
      section: Section III Memory Lock Mode, pp.3-3/4
      level: defined
      wire: ESC m
      rule: Disable original memory lock mode, removing overflow/display locking. Not an instruction to erase screen or change
        cursor position.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f9bab55706
        source_line: 413
        wire: ESC m
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:4753-4766
