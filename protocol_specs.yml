        - libvterm.esc.scs_g2
        - libvterm.esc.scs_g3
        - iterm2.esc.scs_g0
        - iterm2.esc.scs_g1
        - iterm2.esc.scs_g2
        - iterm2.esc.scs_g3
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: Kitty CP437 and VAX42 share existing charset lifetime'
        relation: protocol-family
        legacy_records:
        - kitty.esc.scs_g0
        - kitty.esc.scs_g1
      - file: howl-vt/src/charset.zig
        test: charset accepts every designation and rejects hostile values unchanged
        relation: protocol-family
    - id: secondary-device-attributes
      section: Chapter 12 / Secondary DA, printed pp.232-233
      level: defined
      wire: CSI > [ 0 ] c
      rule: Request terminal identification, firmware level and hardware options. VT420 reply CSI > 41 ; Pv ; Po c; firmware examples
        10 and 20, option 0 no options and 1 PC keyboard/interface. Do not infer a universal third parameter of zero from the reference
        table.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4fe5c0a5a6
        source_line: 810
        wire: CSI > Ps c
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4218-4273
      reply: CSI > Ptype ; Pv ; Po c
      later_profile: 'DEC VT520/525 July 1994 p.5-11: type 64 mono,65 color; option 0 standard VT keyboard,1 PC keyboard.'
      source_note: Pinned xterm chooses emulation type, patch number and options=0, also permits nonstandard VT100 type 0. Hardware values
        are profile data, not mandatory Howl identity.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm device identity and status query grammar is deliberately nonparity
        relation: wire-family
        legacy_records:
        - libvterm.csi.da2
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: device and status queries retain exact scalar transcripts and origin coordinates
        relation: wire-family
        legacy_records:
        - kitty.csi.da2
    - id: tertiary-device-attributes
      section: Chapter 12 / Tertiary DA, printed pp.233-234
      level: defined
      wire: CSI = [ 0 ] c
      rule: 'VT400-mode request for factory terminal unit identifier. Reply DCS ! | followed by four hexadecimal pairs (eight digits):
        first pair site 00..FF, last three pairs unit number unique within site. DEC VT520/525 p.5-12 retains format.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-538ff9fdc8
        source_line: 804
        wire: CSI = Ps c
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4275-4292
      reply: DCS ! | HHHHHHHH ST
      source_note: Pinned xterm returns eight zero digits, explicitly not a real manufacturing identifier. No target identity, privacy
        disclosure or generated serial selected.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm device identity and status query grammar is deliberately nonparity
        relation: wire-family
        legacy_records:
        - kitty.csi.da3
    - id: terminal-identification
      section: Chapter 12 / DECID, printed pp.234-235
      level: defined
      wire: ESC Z
      rule: Original DEC manual identifies legacy primary DA request, advises using DA instead and says VT400 ignores DECID, then states
        response is the primary DA response for all operating levels. Preserve source ambiguity. ANSI DECID is not ECMA SCI or VT52 identification.
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:4062-4097
      accepted_reconciliations:
      - esc-z-decid-vs-ecma48-sci
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f342577b57
        source_line: 193
        wire: ESC Z
        previous_review:
          classification: same-wire-semantic-conflict
          meaning: DEC terminal-identification request (DECID), obsolete DA/CSI c spelling in xterm
          competes_with: ecma48.sci
          decision: esc-z-decid-vs-ecma48-sci
          reason: ECMA-48 fifth edition SCI uses ESC Z to introduce a following character, whereas xterm uses ESC Z to request terminal
            identity. These cannot both be the same terminal action.
          scope_note: Do not equate ESC Z with the standard SCI or silently promote to FULL; independent current terminal reaction remains
            to be verified for applicability.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: pinned iTerm2 DECID is a no-op while Howl identifies itself'
        relation: wire-family
        legacy_records:
        - iterm2.esc.decid
