      level: defined
      wire: 0x9F | ESC _
      rule: APPLICATION PROGRAM COMMAND (APC); ECMA-48 standardized control function, C1 form (source page 33).
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-6d43c2b77b
        source_line: 208
        wire: ESC _
      original_c1_representation:
        source: ECMA-48 5th edition (June 1991), clause 8.3.2
        eight_bit: '0x9F'
        seven_bit: ESC _
        equivalence: Both forms encode the same original C1 control, not two separate Howl command requirements.
      original_string_semantics: Opening delimiter for application program use; command bytes 0x08..0x0d or 0x20..0x7e, closed
        by ST. Interpretation depends on application/privacy discipline.
      xterm_string_profile:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5281-5358,2323-2325; ctlseqs line 428
        behavior: Accepted string payload ignored, not a universal assertion that the protocol has no defined extension. Parser
          admission depends on ParseSOS; other implementations may define payloads.
