    - id: vertical-split-screen-mode
      section: Chapter 6 / Vertical Split Screen Mode (DECVSSM), printed pages 135-136
      level: defined
      wire: CSI ? 69 h / CSI ? 69 l
      rule: Mode 69 gates DECSLRM. On set it selects left/right margin capability, resets existing page-memory line attributes to single-width/single-height
        and blocks DECDWL/DECDHL; on reset it disables margin setting, restores left/right page-border margins and permits double-sized
        lines again.
      original_mode_semantics:
        name: DECVSSM
        selector: 69
        source: Original DEC VT420 Programmer Reference Manual, February 1992, Chapter 6 pages 135-136
        original_default: 'reset: DECSLRM cannot set left/right margins'
        set_wire: CSI ? 69 h
        set_effect: Enable DECSLRM; reset all line attributes in the current session page memory to single width and single height; ignore
          DECDWL and DECDHL while enabled.
        reset_wire: CSI ? 69 l
        reset_effect: Disable DECSLRM; restore horizontal margins to each page border; permit DECDWL/DECDHL again, without a new forced
          line-size reset.
        original_scope: All current-session page-memory lines, not merely visible rows; exact bounds and page arrangements belong to the
          original DEC page-memory model.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-69-h-line-959
        source_line: 959
        wire: CSI ? 69 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-69-l-line-1105
        source_line: 1105
        wire: CSI ? 69 l
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        original_name_in_source: srm_DECLRMM (ptyx.h:1210 labels it VT420 Vertical Split Screen Mode DECVSSM)
        code_locations:
        - charproc.c:7444-7482
        - charproc.c:7778-7783
        - charproc.c:8616-8623
        - doublechr.c:48-82
        - doublechr.c:144-173
        verified_behavior: For VT420-level emulation, mode set enables LEFT_RIGHT and calls xterm_ResetDouble; reset clears the mode and
          resets horizontal margins. The repaint_line double-size gate denies DECDWL and DECDHL while mode enabled.
        important_coverage_limit: xterm_ResetDouble loops row < screen->max_row, whereas ptyx.h defines MaxRows=max_row+1, so it appears
          to skip the last visible line. It also resets the visible screen rather than proving DEC all-page-memory coverage. This possible
          source implementation defect must not be normalized into the canonical DEC requirement or treated as FULL.
        modern_subset_observations: Ghostty, WezTerm and GNOME VTE mode-69 handlers explicitly gate margins/reset borders; this bounded
          check does not establish DEC line-size reset/suppression in those implementations.
      related_controls:
      - dec_vt420.left-right-margins
      - dec_vt420.column-mode
      implementation_assessment_scope: Original DEC command identity now reconciled with xterm; full Howl behavior is unassessed, no status
        or priority inferred.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: libvterm hidden DECSLRM lifetime differs from Howl active-only margin retention
        relation: wire-family
        legacy_records:
        - libvterm.mode.declrmm
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: cursor origin margins own exact aliases geometry wrap and resize'
        relation: wire-family
        legacy_records:
        - iterm2.mode.declrmm
    - id: autorepeat-mode
      section: Chapter 11 / Autorepeat Mode (DECARM), printed pages 190-191
      level: defined
      wire: CSI ? 8 h / CSI ? 8 l
      rule: Controls whether eligible keys held longer than 0.5 seconds generate repeated characters until release. The setting applies
        to input key repeat, not terminal text output or TUI scrollback.
      original_mode_semantics:
        name: DECARM
        selector: 8
        source: Original DEC VT420 Programmer Reference Manual, Chapter 11 pages 190-191
        original_default: 'set: repeat enabled'
        set_wire: CSI ? 8 h
        set_effect: Eligible held keys repeat after more than 0.5 seconds.
        reset_wire: CSI ? 8 l
        reset_effect: Disable autorepeat for eligible keys.
        excluded_key_examples: Original ANSI/short ANSI keyboards exclude F1-F5, Return, Shift, Control, Set-Up and other modifier/control
          keys; PC keyboards exclude Alt, AltGr, Caps Lock, Ctrl, Enter, Num Lock, Shift and other modifiers. Complete tables must be
          reread for FULL.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-8-h-line-921
        source_line: 921
        wire: CSI ? 8 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-8-l-line-1071
        source_line: 1071
        wire: CSI ? 8 l
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:7602-7607; misc.c:5500-5502
        implementation_divergence: Xterm explicitly ignores DECARM set/reset to avoid changing X11 autorepeat for the entire display;
          DECRQM reports mode permanently reset. This is an implementation limitation, not a different normative command definition.
      implementation_assessment_scope: Original source meaning recorded; platform-specific host keyboard autorepeat is outside unassessed
        VT parser conformance. No automatic implementation target.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECARM owns repeat encoding query save and reset lifetime
        relation: wire-family
        legacy_records:
        - iterm2.mode.decarm
        - kitty.mode.decarm
    - id: print-form-feed-mode
      section: Chapter 11 / Print Form Feed Mode (DECPFF), printed page 211
      level: defined
      wire: CSI ? 18 h / CSI ? 18 l
      rule: Controls whether an FF (0x0C) is appended at the end of printer-output functions. The print-cursor-line function is explicitly
        unaffected.
      original_mode_semantics:
