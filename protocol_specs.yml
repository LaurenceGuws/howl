        entry_id: esc-ae31dbf9e2
        source_line: 395
        wire: ESC 7
    - id: restore-cursor
      section: Cursor and Presentation State / DECRC
      level: defined
      wire: ESC 8
      rule: DECRC restores the previously saved cursor state.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-7a60c48e15
        source_line: 397
        wire: ESC 8
    - id: request-status-string
      section: Reports / Request Selection or Setting
      level: defined
      wire: DCS $ q Pt ST
      rule: DECRQSS queries selected rendition or margin state by control-function descriptor.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-2bfa63903e
        source_line: 474
        wire: DCS $ q Pt ST
      source_specific_descriptors:
        source: VT420 Programmer Reference Manual, Table 12-4 and pages 266-268; xterm ctlseqs lines 474-497
        original_gate: One control-function descriptor per request; intermediate and final bytes only, including for controls with additional
          numeric parameters.
        original_dec_descriptors:
        - +q
        - '*}'
        - $}
        - '*x'
        - m
        - +r
        - '"q'
        - $|
        - '"p'
        - s
        - t
        - '*|'
        - $~
        - r
        xterm_additional_examples:
        - SP q (DECSCUSR)
        - ) { (DECSTGLT)
        - ', | (DECAC)'
        - ', } (DECATC)'
        - '> Pm f (XTQFMTKEYS)'
        - '> Pm m (XTQMODKEYS)'
        - '> Pm t (XTSMTITLE)'
        source_note: The xterm selector set differs from original DEC Table 12-4. Merge the request-family identity, not the sets of valid
          descriptors or guaranteed responses.
    - id: reply-status-string
      section: Reports / Report Selection or Setting
      level: defined
      wire: DCS Ps $ r Pt ST
      rule: DECRPSS replies to a selection/setting query with a validity indicator and content.
    - id: request-mode
      section: Mode Reporting / Request Mode
      level: defined
      wire: CSI ? Pm $ p
      rule: DECRQM queries the state of a DEC private mode.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4d9e66b18d
        source_line: 1507
        wire: CSI ? Ps $ p
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual (Feb 1992), Chapter 12, printed page 258
        original_notation: CSI ? Pd $ p; Pd is the one DEC-private mode number to query.
        xterm_notation: CSI ? Ps $ p; Ps likewise selects one DEC-private mode number.
        reply: CSI ? Pd ; Ps $ y with Ps=0 unrecognized, 1 set, 2 reset, 3 permanently set, 4 permanently reset.
        source_limit: Exactly one queried mode, including when multiple modes have been set by DECSET/DECRST. No bulk query or change of
          terminal mode.
    - id: report-mode
      section: Mode Reporting / Report Mode
      level: defined
      wire: CSI ? Pm ; Ps $ y
      rule: DECRPM reports a private mode and its recognized set/reset/permanence state.
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 12, printed page 262
        original_notation: CSI ? Pd ; Ps $ y; Pd is the private mode, Ps its status.
        values:
          '0': not recognized
          '1': set
          '2': reset
          '3': permanently set
          '4': permanently reset
        response_cardinality: Exactly one mode state per report, independent of any other queried mode.
    - id: media-copy-dec-private-extended
      section: Chapter 11 / Keyboard, Printing, and Display Commands / Printing Functions, printed pages 212-214
      level: defined
      wire: CSI ? Ps i
      rule: Documents additional DEC-private Media Copy selectors 10,11,18,19 in the VT420, while retaining the overlapping autoprint, cursor-line
        and printer-to-host functions 1,4,5,8,9 from earlier DEC terminals.
      extends: dec_vt240.media-copy-dec-private
      parameters:
      - selector: 10
        effect: Print the composed main display, including content from both sessions if composed; not affected by printer extent mode DECPEX.
      - selector: 11
        effect: Print all pages in the current session page memory; printer form-feed mode DECPFF may append FF after each page.
      - selector: 18
        effect: Assign the printer to the active host session; terminal accepts printer commands only from that session.
      - selector: 19
        effect: Release the printer; terminal accepts printer commands from both sessions.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6dd886d3cc
        source_line: 1048
        wire: CSI ? Ps i
      scope_note: These are additional documented DEC selectors, not a competing xterm definition; the pinned xterm reference does not document
        DEC 18/19.
      xterm_documented_overlap:
      - 10
      - 11
    - id: device-status-reports-extended
      section: Chapter 12 / Device Status Reports, printed pages 236-242
      level: defined
      wire: CSI ? Ps [ ; Pid ] n
      rule: VT420 extends the DEC private DSR family with macro memory, data integrity and multiple-session queries, while preserving older
        printer and keyboard status requests. Reply fields and values are source-defined.
      extends: dec_vt3xx_text.dsr-dec-private
      parameters:
      - selector: 62
        name: DECMSR
        effect: Request available macro-definition storage, reported as available bytes divided by 16 and rounded down.
        response: CSI Pn * {, where Pn = floor(available macro-definition bytes / 16).
      - selector: 63
        name: DECCKSR
        request: CSI ? 63 ; Pid n
        effect: Request checksum of current text macro definitions; optional request label Pid is echoed.
        response: DCS Pid ! ~ xxxx ST (four hexadecimal checksum digits).
      - selector: 75
        name: Data integrity
        effect: Query and reset integrity flag since the preceding report.
        responses:
          '70': No communication errors since last report.
          '71': Communication error since last report.
          '73': Not reported since power-up or hard reset.
        response_wire: CSI ? Pstatus n
      - selector: 85
        name: Multi-session configuration
        effect: Query configuration and state of multiple host sessions.
        responses:
          80;Ps2: SSU multiple sessions enabled (Ps2 max sessions).
          81;Ps2: SSU sessions configured but pending (Ps2 max sessions).
          '83': Not configured for multiple sessions.
          '87': Separate physical line for each session.
        response_wire: CSI ? Pstatus [ ; Ps2 ] n
      reaffirmed_requests:
      - 6
      - 15
      - 25
      - 26
      response_extension:
        selector: 26
        response: CSI ? 27 ; Pdialect ; Pstatus ; Pkeyboard_type n in VT400 mode; Pkeyboard_type identifies the keyboard model.
        source: VT420 Chapter 12, printed page 238
      original_decxcpr: VT420 printed pages 236-237 independently repeat the DECXCPR response CSI Prow ; Pcol ; Ppage R without a private
        ? prefix.
      competing_reply_format: xterm_controls.decxcpr-xterm-reply
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      scope_note: The DEC printer and keyboard response sets include states omitted from xterm examples. Omission alone is not conflicting
        semantics.
      decision: dec-private-dsr-decxcpr-reply-shape
    - id: request-ansi-mode
      section: Chapter 12 / Request Mode (DECRQM), ANSI branch, printed page 257
      level: defined
      wire: CSI Pa $ p
      rule: Requests the state of exactly one ANSI mode Pa. Distinct from CSI ? Pd $ p for a DEC-private mode; the report is CSI Pa ; Ps
        $ y.
      source_parameters:
        request_count: Exactly one numeric ANSI mode per DECRQM request; no list.
        table: VT420 Table 12-2, printed page 259
        reply: dec_vt420.report-ansi-mode
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-a9bfad2075
        source_line: 1496
        wire: CSI Ps $ p
    - id: report-ansi-mode
      section: Chapter 12 / Report Mode (DECRPM), ANSI branch, printed pages 261-262
      level: defined
      wire: CSI Pa ; Ps $ y
      rule: Reports one ANSI mode Pa and its recognized, set, reset or permanence state Ps in response to DECRQM. The private reply form
        CSI ? Pd ; Ps $ y remains a separate wire.
      mode_values:
        '0': not recognized
        '1': set
        '2': reset
        '3': permanently set
        '4': permanently reset
      source_parameters:
        request: dec_vt420.request-ansi-mode
        report_count: One mode per report; do not invent multi-report packing.
    - id: numeric-keypad-mode
      section: Chapter 11 / Numeric Keypad Mode (DECNKM), printed pages 193-194
      level: defined
      wire: CSI ? 66 h / CSI ? 66 l
      rule: Sets application versus normal numeric-keypad input encoding. Same keypad state as DECKPAM (ESC =) / DECKPNM (ESC >), but a separate
        DEC-private mode number that can be queried through DECRQM.
      related_keyboard_commands:
      - dec_vt420.app-keypad
      - dec_vt420.request-mode
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-66-h-line-956
        source_line: 956
        wire: CSI ? 66 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-66-l-line-1102
        source_line: 1102
        wire: CSI ? 66 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 193; xterm ctlseqs set/reset lines 956/1102
        selector: 66
        name: DECNKM
        set_wire: CSI ? 66 h
        reset_wire: CSI ? 66 l
        original_default: numeric keypad characters
        set_effect: Numeric keypad sends application sequences.
        reset_effect: Numeric keypad sends normal keypad characters.
        source_specific_constraints: Distinct queryable DEC private mode encoding with the same keypad-state effect as ESC = and ESC >; provided
          mainly for DECRQM/DECRPM. Do not erase either valid command identity.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
  finalterm_shell:
    title: FinalTerm semantic prompt markers (OSC 133)
    author: FinalTerm; surviving documentation maintained by iTerm2
    authority: preserved-origin-documentation
    revision: original FinalTerm A/B/C/D, cited in iTerm2 3.6
    url: https://iterm2.com/3.6/documentation-escape-codes.html
    scope: Only original common OSC 133 semantic zones; iTerm2 is a preserving secondary documentation source
    clauses:
    - id: prompt-start
      section: Shell Integration/FinalTerm / FTCS_PROMPT
      level: defined
      wire: OSC 133 ; A ST
      rule: Shell begins displaying a prompt.
    - id: prompt-end
      section: Shell Integration/FinalTerm / FTCS_COMMAND_START
      level: defined
      wire: OSC 133 ; B ST
      rule: Shell finishes displaying a prompt; input follows.
    - id: command-executed
      section: Shell Integration/FinalTerm / FTCS_COMMAND_EXECUTED
      level: defined
      wire: OSC 133 ; C ST
      rule: Command execution begins and command output follows.
    - id: command-finished
      section: Shell Integration/FinalTerm / FTCS_COMMAND_FINISHED
      level: defined
      wire: OSC 133 ; D [ ; exit_status ] ST
      rule: The command finishes; a present numeric exit status describes success or failure.
  vscode_shell:
    title: VS Code shell integration protocol (OSC 633)
    author: Microsoft / Visual Studio Code
    authority: protocol-author
    revision: published documentation, observed 2026-11-23
    url: https://code.visualstudio.com/docs/terminal/shell-integration
    scope: VS Code-specific control family; not a generic replacement for FinalTerm OSC 133
    clauses:
    - id: prompt-start
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; A ST
      rule: Begin command prompt.
    - id: prompt-end
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; B ST
      rule: End command prompt.
    - id: command-executed
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; C ST
      rule: Mark execution start.
    - id: command-finished
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; D [; exitcode] ST
      rule: Report command completion and optional exit status.
    - id: command-text
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; E ; commandline [; nonce] ST
      rule: Report the interpreted command line, optionally authenticated by a nonce.
    - id: property
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; P ; Property=Value ST
      rule: Report recognized host properties such as current working directory and Windows shell mode.
  contour_sync:
    title: Synchronized output (DEC private mode 2026)
    author: Contour terminal / cross-terminal synchronized output
    authority: extension-publisher
    revision: Contour documented extension, observed 2026-11-23
    url: https://contour-terminal.org/vt-extensions/synchronized-output/
    scope: Cross-terminal private mode derived from the idea of iTerm2 synchronized output; timing and host policy can be bounded
    clauses:
    - id: begin
      section: Semantics
      level: defined
      wire: CSI ? 2026 h
      rule: 'Begin a synchronized output update: process terminal data while withholding intermediate presentation.'
    - id: end
      section: Semantics
      level: defined
      wire: CSI ? 2026 l
      rule: End synchronized update and make the final current screen available for presentation.
    - id: query
      section: Feature detection
      level: defined
      wire: CSI ? 2026 $ p
      rule: Report whether private mode 2026 is supported and its state.
  urxvt_notify:
    title: rxvt-unicode Perl extension OSC 777 namespace
    author: rxvt-unicode notify Perl extension
    authority: extension-publisher
    revision: rxvt-unicode community extension, observed 2026-11-23
    url: https://github.com/exg/rxvt-unicode/blob/main/src/urxvt.pm
    scope: The originating Perl-extension namespace is specified here; the notify subcommand is a later adoption convention, not a universal
      protocol.
    clauses:
    - id: perl-osc
      section: on_osc_seq_perl
      level: defined
      wire: OSC 777 ; extension-name ; payload ST
      rule: Dispatches an OSC command to an installed Perl extension under its declared extension name.
    - id: notify-convention
      section: Common notify Perl extension convention
      level: defined
      wire: OSC 777 ; notify ; title ; body ST
      rule: Uses the notify extension namespace to request a plain-text notification; this convention is distinct from the generic rxvt OSC
        777 hook.
  kitty_file_transfer:
    title: Kitty file transfer over the TTY (OSC 5113)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/file-transfer-protocol.rst
    scope: Complete published transfer action families, not a filesystem permission grant
    clauses:
    - id: envelope
      section: Encoding of transfer commands as escape codes
      level: defined
      wire: OSC 5113 ; key=value [ ; key=value ... ] ST
      rule: Encodes transfer commands and metadata with action and session identity.
    - id: send
      section: Sending files to the computer running the terminal emulator
      level: defined
      wire: OSC 5113 ; ac=send ; id=session ST
      rule: Requests authorization to send files to the terminal-host computer.
    - id: receive
      section: Receiving files from the computer running terminal emulator
      level: defined
      wire: OSC 5113 ; ac=receive ; id=session ST
      rule: Requests authorization to receive files from the terminal-host computer.
    - id: file
      section: File metadata
      level: defined
      wire: OSC 5113 ; ac=file ; fid=... ST
      rule: Describes a file including type, path, timestamps and permission metadata.
    - id: data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=data ; d=base64 ST
      rule: Transmits encoded data chunks for a declared file within a session.
    - id: end-data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=end_data ; fid=... ST
      rule: Marks the end of transferred data for a file.
    - id: status
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=status ; st=base64 ST
      rule: Reports transfer status or errors for a session.
    - id: finish
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=finish ST
      rule: Finishes the authorized transfer session.
    - id: cancel
      section: Canceling a session
      level: defined
      wire: OSC 5113 ; ac=cancel ST
      rule: Cancels a transfer session and retires its in-flight state.
    - id: compression
      section: Compression
      level: defined
      wire: OSC 5113 ; zip=zlib ST
      rule: Allows compressed transfer content under the documented bounds.
    - id: links
      section: Symbolic and hard links
      level: defined
      wire: OSC 5113 ; ft=symlink|link ST
      rule: Describes symbolic or hard link metadata instead of raw file contents.
    - id: delta
      section: Transmitting binary deltas
      level: defined
      wire: OSC 5113 ; tt=rsync ST
      rule: Uses signatures and deltas for content updates.
    - id: authorization
      section: Bypassing explicit user authorization
      level: defined
      wire: OSC 5113 ; pw=hash ST
      rule: Supports an explicitly configured pre-shared authorization method.
  kitty_misc:
    title: Kitty small terminal protocol extensions
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/misc-protocol.rst
    scope: Separate mini-extensions, not a redefinition of their shared xterm/DEC base commands
    clauses:
    - id: save-all-side-effect-free-modes
      section: Simple save/restore of all terminal modes
      level: defined
      wire: CSI ? s / CSI ? r
      rule: Without a mode list, extends XTSAVE/XTRESTORE to save or restore side-effect-free modes.
    - id: clear-bold-only
      section: Independent control of bold and faint SGR properties
      level: defined
      wire: CSI 221 m
      rule: Resets bold without clearing faint.
    - id: clear-faint-only
      section: Independent control of bold and faint SGR properties
      level: defined
      wire: CSI 222 m
      rule: Resets faint without clearing bold.
    - id: mouse-leave
      section: Reporting when the mouse leaves the window
      level: defined
      wire: SGR pixel mouse event with bit 8
      rule: Reports pointer exit from the window with the special SGR mouse event bit.
    - id: clear-to-scrollback
      section: An escape code to move the contents of the screen into the scrollback
      level: defined
      wire: CSI 22 J
      rule: Moves the visible screen into retained scrollback and clears it.
    - id: private-dcs
      section: kitty specific private escape codes
      level: defined
      wire: DCS @ kitty-... ST
      rule: Kitty-specific DCS command namespace for external kittens and remote control.
  linux_console:
    title: Linux virtual console control sequences (console_codes(4))
    author: Linux virtual console; documented by the Linux man-pages project
    authority: extension-publisher
    revision: Linux man-pages pinned source 637b0aa571b61d98c717e7ab7490df8a3d9e4841
    url: https://kernel.googlesource.com/pub/scm/docs/man-pages/man-pages/+/637b0aa571b61d98c717e7ab7490df8a3d9e4841/man/man4/console_codes.4
    scope: De facto Linux kernel virtual-console semantics, not a universal VT standard and not the graphical backend used by Howl.
    clauses:
    - id: sgr21
      section: console_codes(4), ECMA-48 Select Graphic Rendition / parameter 21
      level: defined
      wire: CSI 21 m
      rule: Set single underline in the Linux virtual console since Linux 4.17.
      historical_semantics: Before Linux 4.17 the same sequence selected normal intensity instead.
      competes_with: ecma48.sgr
      decision: sgr21-ecma48-vs-linux-console
  dec_vt100:
    title: DEC VT100 User Guide
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: EK-VT100-UG; Digital original guide, PDF transcription by Edwin Rhodes (2004)
    url: https://geoffg.net/Downloads/Terminal/VT100_User_Guide.pdf
    snapshot_sha256: 91f271c2eb0b0bf6f643de42422c8a2fb3efc910b086714414833940ce3de8ef
    scope: Selected VT100 TBC semantics in Chapter 3, not the entire DEC VT100 control repertoire.
    clauses:
    - id: tbc
      section: Chapter 3 / Valid ANSI Mode Control Sequences / TBC (PDF page 50)
      level: defined
      wire: CSI Ps g
      rule: Ps=0 clears the horizontal tab stop at the active position; Ps=3 clears all horizontal tab stops; all other parameter values
        are ignored.
      equivalent_to: xterm_controls.tbc-vt100-subset
      competes_with: ecma48.tbc
      decision: ecma48-tbc-vs-xterm-subset
  itu_t416:
    title: 'ITU-T Recommendation T.416 / ISO/IEC 8613-6: Character content architectures'
    author: International Telecommunication Union (ITU-T) / ISO-IEC
    authority: standard
    revision: ITU-T T.416 (03/1993); published as identical ISO/IEC 8613-6:1994 text
    url: https://www.itu.int/rec/dologin_pub.asp?id=T-REC-T.416-199303-I%21%21PDF-E&lang=e&type=items
    snapshot_sha256: 3337680cb61970a39d753237738aa824325101ee57ee9eca972729d11fe7d97a
    scope: SGR foreground/background colour selectors 38 and 48 as formalized for ODA in section 13.1.8, not all ODA document semantics.
    clauses:
    - id: sgr-colour-subparameters
      section: 13.1.8 / Table 4 and printed page 41
      level: defined
      wire: SGR 38 or 48 followed by a colour parameter substring (Pe:Pe...)
      rule: SGR 38 selects foreground and SGR 48 background colour. Colon-separated parameter elements select 0 (implementation-defined foreground
        only), 1 (transparent), 2 (direct RGB), 3 (direct CMY), 4 (direct CMYK), or 5 (indexed palette colour). Direct colours include a
        colour-space identifier and components; optional tolerance and tolerance-space elements may follow.
      extends: ecma48.sgr
      original_ecma48: ECMA-48 fifth edition (1991) reserved selectors 38 and 48 for future standardization with those intended colour purposes.
  dec_vt3xx_text:
    title: 'DEC VT330/VT340 Programmer Reference Manual, Volume 1: Text Programming'
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: Second edition, May 1988 (EK-VT3XX-TP-002)
    url: https://mirrors.meulie.net/bitsavers.org/pdf/dec/terminal/vt340/EK-VT3XX-TP-002_VT330_VT340_Text_Programming_198805.pdf
    snapshot_sha256: 518676ad1188d4f75d0780e25f0a8fda2bb4a1a591902c6d62e1b9fde8042978
    scope: Selected DEC-private DSR and graphics-printer mode numbers in Chapter 12, printed pages 201-205 and 220-221; full Volume 2 graphics
      printing semantics are not yet indexed.
    clauses:
    - id: dsr-dec-private
      section: Chapter 12 / Device Status Reports (DSR), printed pages 201-205
      level: defined
      wire: CSI ? Ps n
      rule: Requests DEC-private device status, with parameter selecting the report. The private CSI ? form is distinct from standard ECMA-48
        CSI Ps n; each request has a specified reply format and report values.
      related_standard: ecma48.dsr
      parameters:
      - selector: 6
        name: DECXCPR
        effect: Request extended cursor position including current page number.
        response: CSI Prow ; Pcol ; Ppage R (DEC source has no private ? prefix).
        competing_reply_format: xterm_controls.decxcpr-xterm-reply
        decision: dec-private-dsr-decxcpr-reply-shape
      - selector: 15
        name: Printer status
        effect: Query printer-port status.
        responses:
          '10': Printer ready.
          '11': Printer not ready.
          '13': No printer detected since power-up/reset.
          '18': Printer busy in other session.
          '19': Printer assigned to other session.
        response_wire: CSI ? Pstatus n
      - selector: 25
        name: UDK status
        effect: Query whether user-defined keys are locked.
        responses:
          '20': Unlocked.
          '21': Locked.
        response_wire: CSI ? Pstatus n
      - selector: 26
        name: Keyboard dialect/status
        effect: Query the keyboard dialect and readiness.
        response: CSI ? 27 ; Pdialect [ ; Pstatus ] n; status is present in VT300 operating mode; Pstatus is 0 ready, 3 absent, or 8 busy.
      - selector: 55
        name: Locator status
        effect: Query whether an attached locator is available.
        responses:
          '50': Locator ready.
          '53': No locator detected.
          '58': Locator busy in other session.
        response_wire: CSI ? Pstatus n
      - selector: 56
        name: Locator device ID
        effect: Query the type of attached locator.
        responses:
          '0': Unknown.
          '1': DEC mouse.
          '2': DEC tablet.
        response_wire: CSI ? 57 ; Ptype n
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      later_dec_documentation: dec_vt420.device-status-reports-extended
      source_note: Source defines CSI ? 6 n request but no private prefix in its DECXCPR response; this is not silently normalized to xterm.
    - id: graphics-print-dec-private-modes
      section: Chapter 12 / Table 12-3, DEC Private Modes for DECRQM, DECRPM, SM and RM, printed pages 220-221
      level: defined
      wire: CSI ? Pd h / CSI ? Pd l
      rule: DEC VT330/VT340 assigns private mode selectors 43-47 to graphics-printer controls. The same input bytes collide with unrelated
        xterm-specific meanings for 44-47. A mode-number label is not sufficient to select implementation behavior.
      parameters:
      - selector: 43
        symbol: DECGEPM
        originating_effect: graphics expanded print
      - selector: 44
        symbol: DECGPCM
        originating_effect: graphics print color
      - selector: 45
        symbol: DECGPCS
        originating_effect: graphics print color syntax
      - selector: 46
        symbol: DECGPBM
        originating_effect: graphics print background
      - selector: 47
        symbol: DECGRPM
        originating_effect: graphics rotated print
      source_limit: Volume 1 Table 12-3 identifies the DEC modes; their full print-format effects, approximate dimensions and printer-level
        sixel output grammar are now indexed from Volume 2 Chapter 16.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-43-h-line-941
        source_line: 941
        wire: CSI ? 43 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-43-l-line-1089
        source_line: 1089
        wire: CSI ? 43 l
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-44-h-line-944
        source_line: 944
        wire: CSI ? 44 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-44-l-line-1092
        source_line: 1092
        wire: CSI ? 44 l
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-45-h-line-947
        source_line: 947
        wire: CSI ? 45 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-45-l-line-1095
        source_line: 1095
        wire: CSI ? 45 l
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-46-h-line-951
        source_line: 951
        wire: CSI ? 46 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-47-h-line-954
        source_line: 954
        wire: CSI ? 47 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-47-l-line-1100
        source_line: 1100
        wire: CSI ? 47 l
      collisions:
      - dec-vt3xx-graphics-print-vs-xterm-mode-44
      - dec-vt3xx-graphics-print-vs-xterm-mode-45
      - dec-vt3xx-graphics-print-vs-xterm-mode-46
      - dec-vt3xx-graphics-print-vs-xterm-mode-47
      detailed_source: dec_vt3xx_graphics.graphics-print-modes
  dec_vt3xx_graphics:
    title: 'DEC VT330/VT340 Programmer Reference Manual, Volume 2: Graphics Programming'
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: Second edition, May 1988 (EK-VT3XX-GP-002)
    url: https://mirrors.meulie.net/bitsavers.org/pdf/dec/terminal/vt340/EK-VT3XX-GP-002_VT330_VT340_Graphics_Programming_198805.pdf
    snapshot_sha256: e4b2a69d1425db5e216d372cd080c3cff6dd216dc8acbb47f58b699fa2338669
    scope: Original graphics printing controls and sixel printer-level output contracts in Chapter 16, printed pages 255-261; not all Volume
      2 graphics semantics.
    clauses:
    - id: graphics-print-modes
      section: Chapter 16 / Selecting a Format for Printing, printed pages 255-257
      level: defined
      wire: CSI ? Pd h / CSI ? Pd l (Pd=43..47)
      rule: On DEC VT300, these selectors control graphics printing, not xterm margin bell, reverse-wraparound, logging or alternate-screen
        behavior. The terminal ignores these print-formatting functions when no printer is connected.
      reaffirms: dec_vt3xx_text.graphics-print-dec-private-modes
      parameters:
      - selector: 43
        symbol: DECGEPM
        set: Expanded image, approximately 300 x 200 mm (12 x 8 in), for 13-inch paper.
        reset: Compressed image, approximately 150 x 75 mm (6 x 3 in), for A4 or 8.5-inch paper.
        default: reset / compressed
      - selector: 44
        symbol: DECGPCM
        set: Color output (VT340 only).
        reset: Black-and-white output.
        default: reset / black and white
      - selector: 45
        symbol: DECGPCS
        set: RGB color coordinate system.
        reset: HLS color coordinate system.
        default: reset / HLS
        gate: Select only with VT340 color-print mode DECGPCM.
      - selector: 46
        symbol: DECGPBM
        set: Include the graphics background in printing.
        reset: Exclude the graphics background.
        default: reset / no background
        gate: Operates only when DECGPCM color-print mode is set.
      - selector: 47
        symbol: DECGRPM
        set: 90-degree rotated image, approximately 200 x 300 mm (8 x 12 in).
        reset: Compressed image, approximately 150 x 75 mm (6 x 3 in).
        default: reset / compressed
      size_note: Printed dimensions are approximate physical paper output sizes, never VT cell counts or exact image pixel quotas. Sixel
        output encoding depends on selected printer level; see graphics-printer-sixel-output.
      collisions:
      - dec-vt3xx-graphics-print-vs-xterm-mode-44
      - dec-vt3xx-graphics-print-vs-xterm-mode-45
      - dec-vt3xx-graphics-print-vs-xterm-mode-46
      - dec-vt3xx-graphics-print-vs-xterm-mode-47
      implementation_status: unassessed source semantics, not a selected Howl implementation requirement or proof of printer I/O
    - id: graphics-printer-sixel-output
      section: Chapter 16 / Sending Graphics and Sixel Graphics Levels, printed pages 258-261
      level: defined
      wire: CSI ? Ps i (hardcopy route) followed by printer-level sixel DCS
      rule: MC CSI ? 2 i routes subsequent ReGIS hardcopy to the host. CSI ? i or CSI ? 0 i routes it to printer. For a Media Copy request
        the terminal emits only sixel DCS (no preceding CR); pressing Local Print sends a preceding CR.
      printer_levels:
      - level: level-1
        format: 7-bit ESC P 1 q sixel-data ESC backslash
        device_aspect_ratio: 2 horizontal pixels to 1 vertical
        constraints: No set-raster-attributes, background-select, horizontal-grid-size or macro-parameter commands. Level-1 uses fixed print
          format and macro 1.
      - level: level-2
        format: 7-bit sixel DCS with macro, background, grid-size and raster-attribute parameters
        macro_parameter: '0'
        background_select: 1 = disabled, 2 = enabled
        grid_size_default: 6 for compressed, 9 for expanded or rotated
        pixel_aspect_ratio_default: numerator=1, denominator=1
        raster_extents: Pn6 and Pn7 are horizontal and vertical image pixel extents, not printed paper measurements.
      - level: LA210
        format: 'Special printer profile: macro 9 for expanded/rotated 1:1 aspect; level-1 form for compressed output'
        grid_size: 338 x 0.025 mm (13.5 x 0.001 in) for expanded/rotated
        compatibility: LA75 needs level-1 format for expanded or rotated output due to firmware differences.
      source_limit: Original printer-level grammar and physical sizing are documentary evidence. No target implementation or equivalence
        to VT text geometry is implied.
      related_original_media_copy: dec_vt240.media-copy-dec-private
discovery_catalogues:
  xterm_ctlseqs:
    title: XTerm Control Sequences (discovery only)
    publisher: Thomas E. Dickey / xterm
    role: secondary-reference-not-protocol-authority
    url: https://invisible-island.net/xterm/ctlseqs/ctlseqs.html
    local_snapshot: ~/personal/official_docs/xterm/ctlseqs.html.md
    snapshot_sha256: 8c62d6c9f72af9f53c4744526132fee39630f465fd8d431766929faf1454e47f
    warning: These are documented XTerm control inputs and responses, including older ECMA, DEC and ISO controls. This list is for finding
      protocol branches, not evidence of who originated a control, what Howl implements, or what is mandatory.
    sequences:
    - id: esc-514c28b6ff
      wire: ESC D
      section: C1 (8-Bit) Control Characters
      source_line: 161
      review:
        classification: historical-source-removed-not-an-ecma48-fifth-edition-clause
        source: ECMA-48 fifth edition Appendix F.8.2 explicitly removed INDEX (IND), formerly C1 0x84 / ESC D; pinned xterm ctlseqs line
          161 retains DEC-style IND.
        semantic_identity: DEC-compatible Index/IND, not an alternate spelling of ECMA-48 CCH (0x94).
        next_step: Trace the original DEC IND meaning before disposition; leave as separately sourced compatibility candidate and do not
          claim Howl conformance.
    - id: esc-f342577b57
      wire: ESC Z
      section: C1 (8-Bit) Control Characters
      source_line: 193
      symbol: DA
      review:
        classification: same-wire-semantic-conflict
        meaning: DEC terminal-identification request (DECID), obsolete DA/CSI c spelling in xterm
        competes_with: ecma48.sci
        decision: esc-z-decid-vs-ecma48-sci
        reason: ECMA-48 fifth edition SCI uses ESC Z to introduce a following character, whereas xterm uses ESC Z to request terminal identity.
          These cannot both be the same terminal action.
        scope_note: Do not equate ESC Z with the standard SCI or silently promote to FULL; independent current terminal reaction remains
          to be verified for applicability.
    - id: esc-6436a8e3dc
      wire: ESC SP F
      section: Controls beginning with ESC
      source_line: 282
      symbol: S7C1T
    - id: esc-41198bce8d
      wire: ESC SP G
      section: Controls beginning with ESC
      source_line: 287
      symbol: S8C1T
    - id: esc-5df28b937a
      wire: ESC SP L
      section: Controls beginning with ESC
      source_line: 292
    - id: esc-16e4711bcc
      wire: ESC SP M
      section: Controls beginning with ESC
      source_line: 294
    - id: esc-ecb85e0fd8
      wire: ESC SP N
      section: Controls beginning with ESC
      source_line: 296
    - id: esc-44ab86aa54
      wire: 'ESC # 3'
      section: Controls beginning with ESC
      source_line: 298
      symbol: DECDHL
    - id: esc-9225af7f15
      wire: 'ESC # 4'
      section: Controls beginning with ESC
      source_line: 300
      symbol: DECDHL
    - id: esc-f22011512d
      wire: 'ESC # 5'
      section: Controls beginning with ESC
      source_line: 302
