    - id: select-conformance-level
      section: Chapter 4 / Selecting an Operating Level (DECSCL), printed p.87
      level: defined
      wire: CSI Pl [ ; Pc ] " p
      rule: VT420 selects level 1 with Pl=61; Pl=62,63,64 select VT400-compatible levels (level 4 includes 2 and 3). For higher
        levels omitted Pc or 0/2 selects 8-bit transmission, 1 selects 7-bit; factory default is level 4 with 7-bit controls.
        Original manual explicitly requires hard reset (RIS) when changing operating level.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5081-5126,14314-14321
      source_note: Pinned xterm explicitly invokes ReallyReset(xw,False,False), a soft reset retaining saved lines. Its source
        comment cites VT220/DEC STD-070 soft reset versus VT300/420/520 hard reset; only the pinned VT420 manual and actual
        xterm branch were independently verified here. Pl=65 is a later profile, not a VT420 selector.
      accepted_reconciliations:
      - decscl-hard-vs-soft-reset
