      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: misc.c:3567-3597,3630-3714,4251-4268,6451; ptyx.h:1018-1036
      selectors:
      - selector: 10
        role: VT100 text foreground
        reset_selector: 110
      - selector: 11
        role: VT100 text background
        reset_selector: 111
      - selector: 12
        role: text cursor
