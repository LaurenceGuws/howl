      review:
        classification: distinct-mode-command-not-a-duplicate
        mode: Tektronix 4014 graphics mode (xterm)
        meaning: Normal Z axis, solid vectors
        overlapping_vt_command: ecma48.dmi
        reason: The same 7-bit spelling has a different meaning in Tektronix graphics mode than in the ECMA-48 control context; the active
          mode is part of the command identity.
        next_step: Retain as source discovery until originating Tektronix specification and Howl scope/priority are independently triaged.
          Do not merge or imply implementation support.
