  cde_dtterm:
    title: dtterm(5) terminal escape sequences
    author: Common Desktop Environment / Digital UNIX vendor documentation
    authority: protocol-publisher-profile
    revision: Digital UNIX 3.2c manual, historical HTML reproduction
    url: https://www.typewritten.org/Manual/DEC/Digital_UNIX/3.2c/man5/dtterm.html
    snapshot_sha256: 087f57702b3e58d28d541185ae4dfd83f174d0e0efb41ce5ace9142964958bfb
    scope: Selected CDE dtterm title and window-operation meanings; inherited Sun shelltool window controls predate CDE. This
      is a pinned published profile, not a claim CDE originated every operation.
    clauses:
    - id: window-manipulation
      section: Received Escape Sequences / Window manipulation
      level: defined
      wire: CSI Ps [ ; Pm ; Pm ] t
      rule: 'CDE dtterm published window profile: 1 restore,2 minimize,3;x;y move in pixels,4;height;width resize window in
        pixels,5 raise,6 lower,7 refresh,8;height;width resize text in characters; 11 state,13 position,14 window pixels,18
        text characters,20 icon label,21 title reports. Earlier Sun shelltool origins for 1..8,11,13,14,18 are reported by xterm
        historical notes, not independently pinned here.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-91d57d4c0a
        source_line: 1616
        wire: CSI Ps ; Ps ; Ps t
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:8969-9309; ctlseqs 1616-1696,3687-3768
      replies:
        '11': CSI 1 t non-iconified or CSI 2 t iconified
        '13': CSI 3 ; x ; y t
        '14': CSI 4 ; height ; width t
        '18': CSI 8 ; height ; width t
        '20': OSC L label ST
        '21': OSC l title ST
      source_note: dtterm 14 reports window pixels; xterm default 14 reports text-area pixels and 14;2 window pixels. Treat
        as explicit profile distinction, not identical query dimensions. Native window authorization and units are host-owned.
      accepted_reconciliations:
      - xtwinops-14-window-vs-text-area
