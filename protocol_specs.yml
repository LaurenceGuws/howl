    clauses:
    - id: enable
      section: Activation
      level: defined
      wire: CSI ? 2034 h / DCS > 2034 ; 1 b T1;T2;T3;T4 ST
      rule: Enable tracking; return four 16-bit authentication token values. Secure randomness recommended.
    - id: disable
      section: Activation
      level: defined
      wire: CSI ? 2034 l / CSI ? 2034 $ p
      rule: Disable discards tracking and invalidates token; mode query 0 unsupported,1 enabled,2 disabled.
    - id: query
      section: Query syntax
      level: defined
      wire: CSI > Ps ; Pn ; T1 ; T2 ; T3 ; T4 b
      rule: Ps1 last completed block,2 N completed blocks (N default1),3 current in-progress block. Authentication required.
