        source_line: 292
        wire: ESC SP L
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5063-5079,1310-1320
      dec_profile: 'DEC VT420 printed pp.101-102: levels 1/2 designate ASCII G0 and ISO Latin-1 G1 and invoke into GL/GR;
        level 3 designates/invokes ASCII G0 into GL; VT400 only, announcer must be re-sent after reset/power/off/DECSCL.'
      source_note: Pinned xterm sets ansi_level only when vtXX_level>=3. Full ECMA-43 conformance and DEC-specific designation
        side effects are not established by that assignment.
