    - id: scrolling-mode
      section: Chapter 4 p.89 (DECNRCM) or Chapter 11 pp.216-217 (DECSCNM/DECSCLM); VT100 Chapter 3 for modes 4/5
      level: defined
      wire: CSI ? 4 h / CSI ? 4 l
      rule: SET smooth scroll, RESET jump scroll. Original VT100 smooth maximum six lines/second; VT420 default smooth, with slow/fast
        display SET-UP choices, and jump as fast as data arrives. This selects display scrolling behavior; do not import physical scan
        timing into a modern compositor without scope selection.
