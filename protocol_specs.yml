    - id: read-only-width-encoding-reports
      section: DECSET read-only resource selector entries, lines 985-988; DECRQM/DECRPM
      level: defined
      wire: CSI ? Pd $ p
      rule: Read-only xterm mode report selectors 1020..1023 expose UTF-8 encoding, CJK width, emoji width and private-use width
        configuration. DECSET and DECRST do not change them. Query one mode per DECRQM; DECRPM reports its current boolean state.
        Do not invent permanently-set/reset status simply because the resource is read-only.
      selectors:
      - selector: 1020
        resource: utf8
        source_line: 985
        request: CSI ? 1020 $ p
        reply: CSI ? 1020 ; Ps $ y
        reply_values: 1 true, 2 false in the pinned compiled handler; 0 unrecognized where unavailable.
      - selector: 1021
        resource: cjkWidth
        source_line: 986
        request: CSI ? 1021 $ p
        reply: CSI ? 1021 ; Ps $ y
        reply_values: 1 true, 2 false in the pinned compiled handler; 0 unrecognized where unavailable.
      - selector: 1022
        resource: emojiWidth
        source_line: 987
        request: CSI ? 1022 $ p
        reply: CSI ? 1022 ; Ps $ y
        reply_values: 1 true, 2 false in the pinned compiled handler; 0 unrecognized where unavailable.
      - selector: 1023
        resource: privateWidth
        source_line: 988
        request: CSI ? 1023 $ p
        reply: CSI ? 1023 ; Ps $ y
        reply_values: 1 true, 2 false in the pinned compiled handler; 0 unrecognized where unavailable.
      related_commands:
      - dec_vt420.request-mode
      - dec_vt420.report-mode
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
