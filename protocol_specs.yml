        wire: CSI ! p
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6147-6150,14314-14372
      original_reset_states:
        DECTCEM: cursor enabled
        IRM: replace
        DECOM: absolute
        DECAWM: no autowrap
        DECNRCM: multinational
        KAM: unlocked
        DECNKM: numeric
        DECCKM: normal
        DECSTBM: top 1, bottom page length
        G0_G1_G2_G3_GL_GR: VT420 defaults
        SGR: normal rendition
        DECSCA: normal erasable
        DECSC: home with VT420 defaults
        DECAUPSS: SET-UP selected set
        DECSASD: main display (first 24 lines)
        DECKPM: send character codes
        DECSMKR: modifier keys default functions
      source_note: Pinned xterm invokes its soft reset path; it additionally calls ResetAnsiColorRequest and uses configured
        defaults for cursor/keypad. The original exact reset scope remains preserved, not claimed equivalent.
    - id: columns-per-page
      section: Chapter 6 / DECSCPP, printed pp.130-131
      level: defined
      wire: CSI Ps $ |
      rule: Omitted/0/80 selects 80 columns per page; 132 selects 132. Default 80. Sets every page width and matching font without
        clearing page memory or resetting scrolling regions (unlike DECCOLM). Cursor remains unless beyond new right edge, then
        clamps. Columns lost when shrinking 132 to 80 are destructive. Page geometry is not a host-pixel size.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-5bce18dca3
        source_line: 1892
        wire: CSI Ps $ |
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5712-5738
      source_note: Pinned xterm uses a resize request and cursor clamp. Multi-page memory and font consequences are not established.
    - id: lines-per-screen
      section: Chapter 11 / DECSNLS, printed p.218
      level: defined
      wire: CSI Pn * |
      rule: Pn=1..255 requests maximum display lines. Original VT420 supports 24,39,49 screen lines plus status line via three
        font heights; choose next higher supported value or highest if above maximum. Active session space and current page
        size further limit displayed lines; e.g. page 36 with display 39 leaves 3 blank lines. Do not reinterpret these as pixel
        dimensions or arbitrary page-resize quotas.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-43f1b260e7
        source_line: 1938
        wire: CSI Ps * |
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5740-5749
      source_note: Pinned xterm directly requests host resize for 1..255 under window policy; not original discrete font/viewport
        behavior.
    - id: request-displayed-extent
      section: Chapter 12 / DECRQDE and DECRPDE, printed pp.271-272
      level: defined
      wire: CSI " v
      rule: 'Requests how much of the current page is displayed in the active session window, excluding status line. Reply fields:
        displayed line count, displayed column count, leftmost page column, top page line, page number. Session windows may
        display only part of a page.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-dd97c5f289
        source_line: 1736
        wire: CSI " v
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5751-5766
      reply: CSI Ph ; Pw ; Pml ; Pmt ; Pmp " w
      source_note: Pinned xterm reports MaxRows,MaxCols,1,1,1; single-page subset, not a multipage display contract.
    - id: request-rectangle-checksum
      section: Chapter 12 / DECRQCRA and DECCKSR, printed pp.243-244
      level: defined
      wire: CSI Pid ; Pp ; Pt ; Pl ; Pb ; Pr * y
      rule: VT400-mode request labels checksum by Pid. Page Pp=0 or omitted means all pages and ignores rectangle operands;
        above available page count means last page. For a specified page, rectangle coordinates obey DECOM, top<=bottom and
        left<=right; defaults printed top=1,bottom=page length,right=page width (left default not explicitly listed in the checked
        text). Omitted rectangle reports whole selected page. Response exactly four uppercase hexadecimal digits; this section
        does not specify the complete checksum arithmetic.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d3b76a1dbb
        source_line: 1824
        wire: CSI Pi ; Pg ; Pt ; Pl ; Pb ; Pr * y
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5619-5639; screen.c:xtermCheckRect
      reply: DCS Pid ! ~ HHHH ST
      source_note: Pinned xterm uses window permission, computes a rectangular checksum and masks to 16 bits. Do not infer original
        arithmetic, page semantics or admissible checksum extensions from that code.
    - id: active-status-display
      section: Chapter 11 / DECSASD, printed pp.219-220
      level: defined
      wire: CSI Ps $ }
      rule: VT400 mode. Ps=0 default routes display data to main display only; Ps=1 routes to status line only. This selects
        write destination, not visibility or status text content.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-d29e668ba9
        source_line: 1984
        wire: CSI Ps $ }
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6015-6020
    - id: status-display-type
      section: Chapter 11 / DECSSDT, printed pp.220-221
      level: defined
      wire: CSI Ps $ ~
      rule: VT400 mode. Ps=0 no status line (parameter default; line becomes extra user-window line), 1 indicator (factory display
        default), 2 host-writable. Switching indicator to host-writable starts empty. Main/status share character sets, scroll
        mode, insert mode, tabs and autowrap; only column cursor operands act on status line; DECANM ignored there, DECSCL/DECSTR
        exit it, RIS erases and exits. SET-UP always shows indicator.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-0cc14c89d4
        source_line: 1992
        wire: CSI Ps $ ~
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6022-6027
      source_note: VT420 summary p.227 appears to print a different final character; detailed format p.220 and report query
        table identify $ ~. Preserve detailed form, do not normalize parameter default to factory state.
    - id: request-presentation-state
      section: Chapter 12 / DECRQPSR and reports, printed pp.248-255
      level: defined
      wire: CSI Ps $ w
      rule: VT400 mode. Ps=0 error ignored; 1 requests cursor information DECCIR; 2 requests tab-stop report DECTABSR. Report
        is distinct from restoring state.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f38f13fb1a
        source_line: 1753
        wire: CSI Ps $ w
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5768-5845
      replies:
        '1': DCS 1 $ u Pr ; Pc ; Pp ; Srend ; Satt ; Sflag ; Pgl ; Pgr ; Scss ; Sdesig ST
        '2': DCS 2 $ u column[/column...] ST
      original_cursor_report:
        position: 1-based row, column, display page
        bitfield_bytes: Bits 8=0,7=1,6 extension indicator; bit 5 reserved 0 in original VT420 tables. Base byte 0x40.
        Srend: bits 1 bold,2 underline,3 blink,4 reverse video
        Satt: bit 1 selective erase protection; bits 2..5 reserved
        Sflag: bits 1 origin,2 SS2 pending,3 SS3 pending,4 autowrap pending
        Pgl_Pgr: 0..3 select G0..G3
        Scss: bits 1..4 correspond G0..G3, zero=94 chars, one=96 chars
        Sdesig: concatenated intermediate/final designators in G0,G1,G2,G3 order, e.g. BB%5%5
      source_note: Pinned xterm limits tab report to NPARAM and current visible columns; cursor field generation is code-specific.
        Full report byte matrix, page count and restore interactions not proved.
    - id: restore-presentation-state
      section: Chapter 12 / DECRSPS, printed pp.255-257
      level: defined
      wire: DCS Ps $ t D...D ST
      rule: 'Restore one presentation report per request: Ps=0 ignored error,1 DECCIR payload,2 DECTABSR payload. Use exactly
        the original report data format (change u to t). Original DEC explicitly stops at invalid value and may leave partially
        restored state; do not assume whole-command atomicity.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-47fd6579ab
        source_line: 499
        wire: DCS Ps $ t Pt ST
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:5323-5343,4647-4748
      related_command: dec_vt420.request-presentation-state
      source_note: Pinned restore mutates fields sequentially; requires page 1, and tab restore clears existing stops before
        processing. These observations are not proof of complete hardware restore semantics.
    - id: assign-user-preferred-supplemental
      section: Chapter 5 / DECAUPSS, printed p.100; Chapter 12 / report p.273
      level: defined
      wire: DCS Ps ! u designator ST
      rule: 'Assign standby supplemental set; original VT420 default DEC Supplemental Graphic. Chapter 5 prints DCS 0 ! u %
        5 ST for DEC Supplemental and DCS 0 ! u A ST for ISO Latin-1; Chapter 12 prints DCS 1 ! u A ST for ISO Latin-1 report.
        Assignment is not designation/mapping: designate G1/G2/G3 and map GR before use. Preserve literal conflicting selector
        values.'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:4812-4864,5305-5322
      source_note: Pinned xterm table uses selector 1 with A for ISO Latin-1, selector 0 with A for an undocumented ASCII variant,
        and ignores assignment in UTF-8 mode. Other later hardware sets require their own original source.
      accepted_reconciliations:
      - decaupss-latin1-assignment-selector
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-1903109226
        source_line: 451
        wire: DCS Ps ! u Pt ST
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decaupss-latin1-assignment-selector
          reason: VT420 original assignment and report sections disagree on ISO Latin-1 selector; xterm distinguishes 0!uA and
            1!uA. Retain secondary entry for explicit scope reconciliation.
    - id: request-user-preferred-supplemental
      section: Chapter 12 / DECRQUPSS, printed p.273
      level: defined
      wire: CSI & u
      rule: VT400 mode query. Original report DCS 0 ! u % 5 ST for DEC Supplemental Graphic, DCS 1 ! u A ST for ISO Latin-1.
        Query only; report selector must not be silently rewritten to match Chapter 5 assignment example.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-996d289cc3
        source_line: 1727
        wire: CSI & u
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5847-5862
      related_command: dec_vt420.assign-user-preferred-supplemental
      accepted_reconciliations:
      - decaupss-latin1-assignment-selector
    - id: user-defined-keys
      section: Chapter 11 / DECUDK, printed pp.202-209, Tables 11-1/11-2
      level: defined
      wire: DCS Pc ; Pl [ ; Pm ] | Ky/St[;Ky/St...] ST
      rule: VT420 VT400/PC TERM only, 48 UDKs sharing 768 bytes. Pc=0/omitted clears all before loading; 1 clears/reloads selected
        keys in sequence with current free space. Pl=0/omitted locks after loading;1 leaves unlocked, cannot unlock already
        locked keys except SET-UP. Pm=0/2/omitted shifted,1 unshifted,3/4 alternate unshifted/shifted PC only. Key selector
        uses original tables; data consists of ASCII hex pairs encoding any 8-bit byte, semicolon between definitions. Invalid
        pair stops load, keeps earlier definitions and sends rest to screen. RIS clears all UDKs. Do not confuse this with arbitrary
        host input injection or modern key profiles.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-26ac144774
        source_line: 434
        wire: DCS Ps ; Ps | Pt ST
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:4392-4429,5362-5368; ptyx.h:3514-3521
      original_key_selectors:
        ANSI_F1_F20:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 17
        - 18
        - 19
        - 20
        - 21
        - 23
        - 24
        - 25
        - 26
        - 28
        - 29
        - 31
        - 32
        - 33
        - 34
        PC_F1_F12:
        - 11
        - 12
        - 13
        - 14
        - 15
        - 17
        - 18
        - 19
        - 20
        - 21
        - 23
        - 24
        PC_alternate_F3_F12:
        - 25
        - 26
        - 28
        - 29
        - 31
        - 32
        - 33
        - 34
        - 35
        - 36
        source: Tables 11-1/11-2; local ANSI F1-F5 restrictions remain separately specified.
      source_note: Pinned xterm two-parameter discovery documents a narrower form, and describes Pc=1 as Erase Below; actual
        code clears all only for Pc=0, then parses key/hex data, accepts nonempty definitions within MAX_UDK. It does not establish
        original 768-byte quota, lock or modifier semantics. These are original hardware requirements, not target choices.
    - id: character-set-designation-profile
      section: Chapter 5 / Selecting and Designating Character Sets, printed pp.91-95, Tables 5-2/5-3
      level: defined
      wire: ESC I1 [ I ... ] F
      rule: VT420 designates a hard set into G0..G3 independently of mapping into GL/GR. The only 96-character hard set is ISO
        Latin-1 supplemental. The 94-character designators in Table 5-3 include ASCII B, DEC supplemental %5, special graphics
        0, technical >, and user-preferred <. Initial G0/G1 ASCII; G2/G3 DEC Supplemental Graphic. NRC sets require national
        mode and the applicable worldwide hardware profile.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:3806-3839,4853-4878,6256-6299
      related_standard: ecma35 designate-g*-94 / designate-g*-96
      original_nrc_designators:
        A: UK
        5/C: Finnish
        R: French
        9/Q: French Canadian
        K: German
        Y: Italian
        '`': ISO Norwegian/Danish
        6/E: DEC Norwegian/Danish
        '%6': Portuguese
        Z: Spanish
        7/H: Swedish
        '=': Swiss
      original_96_designators:
        A: ISO Latin-1 supplemental
      source_note: The size prefix distinguishes 94-set A (UK) from 96-set A (Latin-1). Xterm documents additional profile-specific
        sets; they are not added to the VT420 table. Individual registered glyph maps require separate source verification.
    - id: secondary-device-attributes
      section: Chapter 12 / Secondary DA, printed pp.232-233
      level: defined
      wire: CSI > [ 0 ] c
      rule: Request terminal identification, firmware level and hardware options. VT420 reply CSI > 41 ; Pv ; Po c; firmware
        examples 10 and 20, option 0 no options and 1 PC keyboard/interface. Do not infer a universal third parameter of zero
        from the reference table.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4fe5c0a5a6
        source_line: 810
        wire: CSI > Ps c
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4218-4273
      reply: CSI > Ptype ; Pv ; Po c
      later_profile: 'DEC VT520/525 July 1994 p.5-11: type 64 mono,65 color; option 0 standard VT keyboard,1 PC keyboard.'
      source_note: Pinned xterm chooses emulation type, patch number and options=0, also permits nonstandard VT100 type 0. Hardware
        values are profile data, not mandatory Howl identity.
    - id: tertiary-device-attributes
      section: Chapter 12 / Tertiary DA, printed pp.233-234
      level: defined
      wire: CSI = [ 0 ] c
      rule: 'VT400-mode request for factory terminal unit identifier. Reply DCS ! | followed by four hexadecimal pairs (eight
        digits): first pair site 00..FF, last three pairs unit number unique within site. DEC VT520/525 p.5-12 retains format.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-538ff9fdc8
        source_line: 804
        wire: CSI = Ps c
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4275-4292
      reply: DCS ! | HHHHHHHH ST
      source_note: Pinned xterm returns eight zero digits, explicitly not a real manufacturing identifier. No target identity,
        privacy disclosure or generated serial selected.
    - id: terminal-identification
      section: Chapter 12 / DECID, printed pp.234-235
      level: defined
      wire: ESC Z
      rule: Original DEC manual identifies legacy primary DA request, advises using DA instead and says VT400 ignores DECID,
        then states response is the primary DA response for all operating levels. Preserve source ambiguity. ANSI DECID is not
        ECMA SCI or VT52 identification.
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:4062-4097
      accepted_reconciliations:
      - esc-z-decid-vs-ecma48-sci
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f342577b57
        source_line: 193
        wire: ESC Z
        previous_review:
          classification: same-wire-semantic-conflict
          meaning: DEC terminal-identification request (DECID), obsolete DA/CSI c spelling in xterm
          competes_with: ecma48.sci
          decision: esc-z-decid-vs-ecma48-sci
          reason: ECMA-48 fifth edition SCI uses ESC Z to introduce a following character, whereas xterm uses ESC Z to request
            terminal identity. These cannot both be the same terminal action.
          scope_note: Do not equate ESC Z with the standard SCI or silently promote to FULL; independent current terminal reaction
            remains to be verified for applicability.
  finalterm_shell:
    title: FinalTerm semantic prompt markers (OSC 133)
    author: FinalTerm; surviving documentation maintained by iTerm2
    authority: preserved-origin-documentation
    revision: original FinalTerm A/B/C/D, cited in iTerm2 3.6
    url: https://iterm2.com/3.6/documentation-escape-codes.html
    scope: Only original common OSC 133 semantic zones; iTerm2 is a preserving secondary documentation source
    clauses:
    - id: prompt-start
      section: Shell Integration/FinalTerm / FTCS_PROMPT
      level: defined
      wire: OSC 133 ; A ST
      rule: Shell begins displaying a prompt.
    - id: prompt-end
      section: Shell Integration/FinalTerm / FTCS_COMMAND_START
      level: defined
      wire: OSC 133 ; B ST
      rule: Shell finishes displaying a prompt; input follows.
    - id: command-executed
      section: Shell Integration/FinalTerm / FTCS_COMMAND_EXECUTED
      level: defined
      wire: OSC 133 ; C ST
      rule: Command execution begins and command output follows.
    - id: command-finished
      section: Shell Integration/FinalTerm / FTCS_COMMAND_FINISHED
      level: defined
      wire: OSC 133 ; D [ ; exit_status ] ST
      rule: The command finishes; a present numeric exit status describes success or failure.
  vscode_shell:
    title: VS Code shell integration protocol (OSC 633)
    author: Microsoft / Visual Studio Code
    authority: protocol-author
    revision: published documentation, observed 2026-11-23
    url: https://code.visualstudio.com/docs/terminal/shell-integration
    scope: VS Code-specific control family; not a generic replacement for FinalTerm OSC 133
    clauses:
    - id: prompt-start
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; A ST
      rule: Begin command prompt.
    - id: prompt-end
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; B ST
      rule: End command prompt.
    - id: command-executed
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; C ST
      rule: Mark execution start.
    - id: command-finished
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; D [; exitcode] ST
      rule: Report command completion and optional exit status.
    - id: command-text
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; E ; commandline [; nonce] ST
      rule: Report the interpreted command line, optionally authenticated by a nonce.
    - id: property
      section: Supported escape sequences / VS Code custom sequences
      level: defined
      wire: OSC 633 ; P ; Property=Value ST
      rule: Report recognized host properties such as current working directory and Windows shell mode.
  contour_sync:
    title: Synchronized output (DEC private mode 2026)
    author: Contour terminal / cross-terminal synchronized output
    authority: extension-publisher
    revision: Contour documented extension, observed 2026-11-23
    url: https://contour-terminal.org/vt-extensions/synchronized-output/
    scope: Cross-terminal private mode derived from the idea of iTerm2 synchronized output; timing and host policy can be bounded
    clauses:
    - id: begin
      section: Semantics
      level: defined
      wire: CSI ? 2026 h
      rule: 'Begin a synchronized output update: process terminal data while withholding intermediate presentation.'
    - id: end
      section: Semantics
      level: defined
      wire: CSI ? 2026 l
      rule: End synchronized update and make the final current screen available for presentation.
    - id: query
      section: Feature detection
      level: defined
      wire: CSI ? 2026 $ p
      rule: Report whether private mode 2026 is supported and its state.
  urxvt_notify:
    title: rxvt-unicode Perl extension OSC 777 namespace
    author: rxvt-unicode notify Perl extension
    authority: extension-publisher
    revision: rxvt-unicode community extension, observed 2026-11-23
    url: https://github.com/exg/rxvt-unicode/blob/main/src/urxvt.pm
    scope: The originating Perl-extension namespace is specified here; the notify subcommand is a later adoption convention, not a universal
      protocol.
    clauses:
    - id: perl-osc
      section: on_osc_seq_perl
      level: defined
      wire: OSC 777 ; extension-name ; payload ST
      rule: Dispatches an OSC command to an installed Perl extension under its declared extension name.
    - id: notify-convention
      section: Common notify Perl extension convention
      level: defined
      wire: OSC 777 ; notify ; title ; body ST
      rule: Uses the notify extension namespace to request a plain-text notification; this convention is distinct from the generic rxvt OSC
        777 hook.
  kitty_file_transfer:
    title: Kitty file transfer over the TTY (OSC 5113)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/file-transfer-protocol.rst
    scope: Complete published transfer action families, not a filesystem permission grant
    clauses:
    - id: envelope
      section: Encoding of transfer commands as escape codes
      level: defined
      wire: OSC 5113 ; key=value [ ; key=value ... ] ST
      rule: Encodes transfer commands and metadata with action and session identity.
    - id: send
      section: Sending files to the computer running the terminal emulator
      level: defined
      wire: OSC 5113 ; ac=send ; id=session ST
      rule: Requests authorization to send files to the terminal-host computer.
    - id: receive
      section: Receiving files from the computer running terminal emulator
      level: defined
      wire: OSC 5113 ; ac=receive ; id=session ST
      rule: Requests authorization to receive files from the terminal-host computer.
    - id: file
      section: File metadata
      level: defined
      wire: OSC 5113 ; ac=file ; fid=... ST
      rule: Describes a file including type, path, timestamps and permission metadata.
    - id: data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=data ; d=base64 ST
      rule: Transmits encoded data chunks for a declared file within a session.
    - id: end-data
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=end_data ; fid=... ST
      rule: Marks the end of transferred data for a file.
    - id: status
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=status ; st=base64 ST
      rule: Reports transfer status or errors for a session.
    - id: finish
      section: Overall design
      level: defined
      wire: OSC 5113 ; ac=finish ST
      rule: Finishes the authorized transfer session.
    - id: cancel
      section: Canceling a session
      level: defined
      wire: OSC 5113 ; ac=cancel ST
      rule: Cancels a transfer session and retires its in-flight state.
    - id: compression
      section: Compression
      level: defined
      wire: OSC 5113 ; zip=zlib ST
      rule: Allows compressed transfer content under the documented bounds.
    - id: links
      section: Symbolic and hard links
      level: defined
      wire: OSC 5113 ; ft=symlink|link ST
      rule: Describes symbolic or hard link metadata instead of raw file contents.
    - id: delta
      section: Transmitting binary deltas
      level: defined
      wire: OSC 5113 ; tt=rsync ST
      rule: Uses signatures and deltas for content updates.
    - id: authorization
      section: Bypassing explicit user authorization
      level: defined
      wire: OSC 5113 ; pw=hash ST
      rule: Supports an explicitly configured pre-shared authorization method.
  kitty_misc:
    title: Kitty small terminal protocol extensions
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/misc-protocol.rst
    scope: Separate mini-extensions, not a redefinition of their shared xterm/DEC base commands
    clauses:
    - id: save-all-side-effect-free-modes
      section: Simple save/restore of all terminal modes
      level: defined
      wire: CSI ? s / CSI ? r
      rule: Without a mode list, extends XTSAVE/XTRESTORE to save or restore side-effect-free modes.
    - id: clear-bold-only
      section: Independent control of bold and faint SGR properties
      level: defined
      wire: CSI 221 m
      rule: Resets bold without clearing faint.
    - id: clear-faint-only
      section: Independent control of bold and faint SGR properties
      level: defined
      wire: CSI 222 m
      rule: Resets faint without clearing bold.
    - id: mouse-leave
      section: Reporting when the mouse leaves the window
      level: defined
      wire: SGR pixel mouse event with bit 8
      rule: Reports pointer exit from the window with the special SGR mouse event bit.
    - id: clear-to-scrollback
      section: An escape code to move the contents of the screen into the scrollback
      level: defined
      wire: CSI 22 J
      rule: Moves the visible screen into retained scrollback and clears it.
    - id: private-dcs
      section: kitty specific private escape codes
      level: defined
      wire: DCS @ kitty-... ST
      rule: Kitty-specific DCS command namespace for external kittens and remote control.
  linux_console:
    title: Linux virtual console control sequences (console_codes(4))
    author: Linux virtual console; documented by the Linux man-pages project
    authority: extension-publisher
    revision: Linux man-pages pinned source 637b0aa571b61d98c717e7ab7490df8a3d9e4841
    url: https://kernel.googlesource.com/pub/scm/docs/man-pages/man-pages/+/637b0aa571b61d98c717e7ab7490df8a3d9e4841/man/man4/console_codes.4
    scope: De facto Linux kernel virtual-console semantics, not a universal VT standard and not the graphical backend used by Howl.
    clauses:
    - id: sgr21
      section: console_codes(4), ECMA-48 Select Graphic Rendition / parameter 21
      level: defined
      wire: CSI 21 m
      rule: Set single underline in the Linux virtual console since Linux 4.17.
      historical_semantics: Before Linux 4.17 the same sequence selected normal intensity instead.
      competes_with: ecma48.sgr
      decision: sgr21-ecma48-vs-linux-console
  dec_vt100:
    title: DEC VT100 User Guide
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: EK-VT100-UG; Digital original guide, PDF transcription by Edwin Rhodes (2004)
    url: https://geoffg.net/Downloads/Terminal/VT100_User_Guide.pdf
    snapshot_sha256: 91f271c2eb0b0bf6f643de42422c8a2fb3efc910b086714414833940ce3de8ef
    scope: Selected DEC VT100 Chapter 3 controls, ANSI/VT52 transition, line-size, keypad, VT52 emulation, serial parameter
      and LED semantics; not complete.
    clauses:
    - id: tbc
      section: Chapter 3 / Valid ANSI Mode Control Sequences / TBC (PDF page 50)
      level: defined
      wire: CSI Ps g
      rule: Ps=0 clears the horizontal tab stop at the active position; Ps=3 clears all horizontal tab stops; all other parameter values
        are ignored.
      equivalent_to: xterm_controls.tbc-vt100-subset
      competes_with: ecma48.tbc
      decision: ecma48-tbc-vs-xterm-subset
    - id: ansi-vt52-mode
      section: Chapter 3 / Valid ANSI Mode Control Sequences / DECANM (original VT100 User Guide, transcribed PDF page 41)
      level: defined
      wire: CSI ? 2 h / CSI ? 2 l
      rule: DECANM sets or resets the ANSI/VT52 control-code interpretation regime. Set selects ANSI-compatible sequences; reset enters VT52
        compatibility mode. In VT52 mode CSI controls cannot normally be used, so the separate ESC < exits back to ANSI.
      original_mode_semantics:
        name: DECANM
        selector: 2
        source: Original DEC VT100 User Guide, Chapter 3, DECANM / ANSI-VT52 Mode; reaffirmed by DEC VT330/VT340 Text Programming (May 1988)
          Appendix A and DEC VT420 Programmer Reference (Feb 1992) Appendix A
        default: ANSI mode under normal VT100 operation; reset is the explicit transition into VT52 mode.
        set_wire: CSI ? 2 h
        set_effect: Use ANSI-compatible escape and control sequences rather than VT52-only commands.
        reset_wire: CSI ? 2 l
        reset_effect: Enter VT52 compatibility mode, where ANSI private controls, C1 controls, Latin-1 supplemental and NRC sets are unavailable;
          G0 defaults to ASCII.
        mode_boundaries: In VT52 mode, the terminal uses VT52-specific escape sequences; an ordinary ANSI CSI ? 2 h cannot be assumed usable
          to leave VT52 mode. ESC < is the author-defined exit.
        related_vt52_exit: dec_vt100.vt52-return-to-ansi
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-2-h-line-914
        source_line: 914
        wire: CSI ? 2 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-2-l-line-1065
        source_line: 1065
        wire: CSI ? 2 l
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:7507-7551, xterm ctlseqs lines 914-915 and 1065
        behavior: xterm executes CSI ? 2 l by saving a subset of modes/charsets and entering VT52 parser mode. CSI ? 2 h is a no-op when
          already in ANSI, since it cannot be reached from VT52. The xterm textual line claiming USASCII G0-G3 designation should not be
          promoted over the concrete code without an explicit test.
        limits: Xterm mode transition may resize to 80 columns if enabled by host policy; its own comment says some DEC STD-070 VT52 transition
          mode restorations are undefined. Not proof of whole-hardware VT52 emulation.
      implementation_note: Original protocol identity only; neither complete VT52 parsing nor Host migration is automatically selected or
        FULL.
    - id: vt52-return-to-ansi
      section: Chapter 3 / Valid VT52 Mode Control Sequences / Enter ANSI Mode (original VT100 User Guide, transcribed PDF page 54)
      level: defined
      wire: ESC <
      rule: While in VT52 mode, ESC < leaves VT52 compatibility mode and resumes ANSI interpretation of subsequent control sequences. This
        is a distinct command from CSI ? 2 h/l.
      original_source_variants:
        VT100: Enter ANSI mode; subsequent escape/control sequences are interpreted according to ANSI X3.64-1977 and X3.41-1974.
        VT330_VT340: 'May 1988 Text Programming, Appendix A printed pages 257-258: returns to the mode active before entry to VT52.'
        VT420: 'February 1992 Programmer Reference, Appendix A printed pages 327-328: returns to the mode active before entry to VT52, which
          may be VT400 rather than merely VT100.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-457e1dc272
        source_line: 3388
        wire: ESC <
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5039-5059; xterm ctlseqs line 3388
        behavior: Exits VT52 and selects ANSI parser, explicitly invokes set_vtXX_level(screen,1), then restores selected saved flags and
          charsets. The xterm prose calls this Enter VT100 mode.
        material_limit: The later DEC VT300/VT420 author text says return to prior mode, not necessarily VT100 level 1. Reconcile this restoration-level
          difference before implementing a full VT420-compatible VT52 cycle.
      pending_reconciliation: vt52-exit-restored-conformance-level
    - id: double-height-line
      section: Chapter 3 / DECDHL (transcribed PDF page 42)
      level: defined
      wire: 'ESC # 3 / ESC # 4'
      rule: Select the top or bottom half of a double-height, double-width line containing the active position. Use paired adjacent lines
        and send identical character output to both to form full-height characters. Double width halves characters per line. On conversion
        from single width and height, characters right of the screen center are lost. The cursor retains its character position unless
        beyond the right margin, where it moves to that margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-44ab86aa54
        source_line: 298
        wire: 'ESC # 3'
      - catalogue: xterm_ctlseqs
        entry_id: esc-9225af7f15
        source_line: 300
        wire: 'ESC # 4'
      related_mode: dec_vt420.vertical-split-screen-mode
    - id: double-width-line
      section: Chapter 3 / DECDWL (transcribed PDF page 42)
      level: defined
      wire: 'ESC # 6'
      rule: Select double width and single height for the active line, halving characters per line. Retain cursor character position unless
        beyond the right margin, where it moves to that margin. On conversion from single width and height the original transcription
        states characters to the right of the screen are lost; the exact wording is retained rather than silently correcting it to center.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-127380e396
        source_line: 304
        wire: 'ESC # 6'
      related_mode: dec_vt420.vertical-split-screen-mode
    - id: single-width-line
      section: Chapter 3 / DECSWL (transcribed PDF page 46)
      level: defined
      wire: 'ESC # 5'
      rule: Select single width and single height for the active line, retaining the same cursor character position. This is the default
        for every new screen line.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-f22011512d
        source_line: 302
        wire: 'ESC # 5'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c CASE_DECDHL/DECSWL/DECDWL at lines 3782-3800; doublechr.c repaint_line and xterm_DECDHL/DECSWL/DECDWL at lines 48-145
        behavior: Distinct line attributes for top, bottom, single and double width, gated by OPT_DEC_CHRSET and left-right margin mode.
        limits: Common repaint path changes line attributes and clamps cursor; original character-loss and exact right-margin effects are
          not established by this inspection. Command identity only, not source-complete conformance.
    - id: index
      section: Chapter 3 / IND (transcribed PDF p.48)
      level: defined
      wire: ESC D
      rule: Move the active position downward one line without changing column. At bottom margin, scroll up. Independent of
        LNM (line feed/new line mode). ANSI-mode format effector documented by DEC VT100; ECMA-48 fifth edition removed INDEX.
        In VT52 mode ESC D instead moves left.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-514c28b6ff
        source_line: 161
        wire: ESC D
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5423-5427; VTPrsTbl.c:9653-9657
      source_note: Original VT100 document prints ESC D, while pinned xterm identifies it as the 7-bit equivalent of C1 IND.
        Raw C1 admission in this hardware profile is not inferred from xterm.
      historical_c1_equivalent: 0x84 (pinned xterm C1 table; not an asserted raw-input capability of VT100)
    - id: vt52-cursor-up
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC A
      rule: Move up one position, same column; clamp at top margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-1a52090ba5
        source_line: 3394
        wire: ESC A
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3913-3917
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-down
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC B
      rule: Move down one position, same column; clamp at bottom margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-b0bb2d201b
        source_line: 3396
        wire: ESC B
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3919-3923
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-right
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC C
      rule: Move right one position; clamp at right margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-76873eeca9
        source_line: 3398
        wire: ESC C
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9648-9652; charproc.c:3925-3929
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-cursor-left
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC D
      rule: Move left one position; clamp at left margin. In ANSI mode this wire is historical IND, not cursor-left.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3931-3935
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-graphics-enter
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC F
      rule: Use the special graphics character set. DEC notes VT100 special graphics differ from actual VT52 graphics. Not ANSI
        HP lower-left extension.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3775-3779
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-graphics-exit
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC G
      rule: Use standard ASCII character set.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-3290703b9a
        source_line: 3404
        wire: ESC G
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9653-9657; charproc.c:3768-3774
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-home
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC H
      rule: Move cursor to home position.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3937-3944
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-reverse-line-feed
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC I
      rule: Move up one position, same column; at top margin scroll down.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-6d8ca0843a
        source_line: 3408
        wire: ESC I
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:5468-5472
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-erase-display-end
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC J
      rule: Erase from active position to end of screen, inclusive; cursor unchanged.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-10f130db3f
        source_line: 3410
        wire: ESC J
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3986-3991
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-erase-line-end
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC K
      rule: Erase from active position to end of current line, inclusive; cursor unchanged.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-fb8c0ef87a
        source_line: 3412
        wire: ESC K
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9658-9662; charproc.c:3993-3997
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-direct-cursor-address
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC Y row-byte column-byte
      rule: Move to row and column. Each coordinate uses one ASCII byte, 1-based number plus octal 037 (decimal 31), equivalent
        to zero-based value plus 32; byte 0x20 denotes first row or column. Do not parse decimal CSI parameters.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-13153bf1ce
        source_line: 3414
        wire: ESC Y Ps Ps
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9678-9682; charproc.c:3171-3179,3720-3724
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: vt52-identify
      section: Chapter 3 / Valid VT52 Mode Control Sequences, transcribed PDF pp.52-54
      level: defined
      wire: ESC Z
      rule: Respond ESC / Z for VT100 emulating VT52. Distinct from ANSI DECID and ECMA SCI. Actual VT52 identification is a
        distinct hardware profile; do not infer its identifier from this VT100 guide.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: VTPrsTbl.c:9678-9682; charproc.c:4062-4089
      mode_context: VT52 only; does not resolve the ANSI meaning of identical escape bytes.
    - id: request-terminal-parameters
      section: Chapter 3 / DECREQTPARM and DECREPTPARM, transcribed PDF pp.44-45
      level: defined
      wire: CSI Ps x
      rule: Ps=0 or omitted requests terminal parameters and permits unsolicited reports on leaving SET-UP. Ps=1 requests parameters
        and permits reports only on request. At power-up/reset unsolicited reports inhibited. Report first parameter 2 (ordinary)
        or 3 (request-only). Original serial settings are not inferred from a modern PTY.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-1e399e435a
        source_line: 1779
        wire: CSI Ps x
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:4788-4807
      reply: CSI Psol ; Ppar ; Pnbits ; Pxspeed ; Prspeed ; Pclkmul ; Pflags x
      original_report_fields:
        sol:
        - 2
        - 3
        parity:
          '1': none
          '4': odd
          '5': even
        bits:
          '1': 8
          '2': 7
        speed_code_to_baud:
          '0': 50
          '8': 75
          '16': 110
          '24': 134.5
          '32': 150
          '40': 200
          '48': 300
          '56': 600
          '64': 1200
          '72': 1800
          '80': 2000
          '88': 2400
          '96': 3600
          '104': 4800
          '112': 9600
          '120': 19200
        clock_multiplier: 1 denotes bit-rate multiplier 16
        flags: 0..15 encode four STP-option SET-UP B block 5 switches
      source_note: Pinned xterm reports fixed CSI (Ps+2);1;1;128;128;1;0 x only if terminal_id<200; 128 represents 38.4k in
        this implementation, outside original VT100 speed table. No evidence that it implements unsolicited report state.
    - id: load-leds
      section: Chapter 3 / DECLL, transcribed PDF p.43
      level: defined
      wire: CSI Pm q
      rule: Default 0 clears all four programmable keyboard LEDs L1..L4; selectors 1..4 illuminate corresponding LED. Parameter
        list allowed. Physical hardware LEDs, not a generic cursor-style command.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-7973ed5976
        source_line: 1530
        wire: CSI Ps q
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5001-5027
      source_note: Pinned xterm documents and implements a different LED profile (1 NumLock,2 CapsLock,3 ScrollLock,21..23 extinguish);
        does not implement original L4. Preserve these as implementation-specific observations, not replacement of original
        selector meanings.
  itu_t416:
    title: 'ITU-T Recommendation T.416 / ISO/IEC 8613-6: Character content architectures'
    author: International Telecommunication Union (ITU-T) / ISO-IEC
    authority: standard
    revision: ITU-T T.416 (03/1993); published as identical ISO/IEC 8613-6:1994 text
    url: https://www.itu.int/rec/dologin_pub.asp?id=T-REC-T.416-199303-I%21%21PDF-E&lang=e&type=items
    snapshot_sha256: 3337680cb61970a39d753237738aa824325101ee57ee9eca972729d11fe7d97a
    scope: SGR foreground/background colour selectors 38 and 48 as formalized for ODA in section 13.1.8, not all ODA document semantics.
    clauses:
    - id: sgr-colour-subparameters
      section: 13.1.8 / Table 4 and printed page 41
      level: defined
      wire: SGR 38 or 48 followed by a colour parameter substring (Pe:Pe...)
      rule: SGR 38 selects foreground and SGR 48 background colour. Colon-separated parameter elements select 0 (implementation-defined foreground
        only), 1 (transparent), 2 (direct RGB), 3 (direct CMY), 4 (direct CMYK), or 5 (indexed palette colour). Direct colours include a
        colour-space identifier and components; optional tolerance and tolerance-space elements may follow.
      extends: ecma48.sgr
      original_ecma48: ECMA-48 fifth edition (1991) reserved selectors 38 and 48 for future standardization with those intended colour purposes.
  dec_vt3xx_text:
    title: 'DEC VT330/VT340 Programmer Reference Manual, Volume 1: Text Programming'
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: Second edition, May 1988 (EK-VT3XX-TP-002)
    url: https://mirrors.meulie.net/bitsavers.org/pdf/dec/terminal/vt340/EK-VT3XX-TP-002_VT330_VT340_Text_Programming_198805.pdf
    snapshot_sha256: 518676ad1188d4f75d0780e25f0a8fda2bb4a1a591902c6d62e1b9fde8042978
    scope: Selected DEC-private DSR and graphics-printer mode numbers in Chapter 12, printed pages 201-205 and 220-221; full Volume 2 graphics
      printing semantics are not yet indexed.
    clauses:
    - id: dsr-dec-private
      section: Chapter 12 / Device Status Reports (DSR), printed pages 201-205
      level: defined
      wire: CSI ? Ps n
      rule: Requests DEC-private device status, with parameter selecting the report. The private CSI ? form is distinct from standard ECMA-48
        CSI Ps n; each request has a specified reply format and report values.
      related_standard: ecma48.dsr
      parameters:
      - selector: 6
        name: DECXCPR
        effect: Request extended cursor position including current page number.
        response: CSI Prow ; Pcol ; Ppage R (DEC source has no private ? prefix).
        competing_reply_format: xterm_controls.decxcpr-xterm-reply
        decision: dec-private-dsr-decxcpr-reply-shape
      - selector: 15
        name: Printer status
        effect: Query printer-port status.
        responses:
          '10': Printer ready.
          '11': Printer not ready.
          '13': No printer detected since power-up/reset.
          '18': Printer busy in other session.
          '19': Printer assigned to other session.
        response_wire: CSI ? Pstatus n
      - selector: 25
        name: UDK status
        effect: Query whether user-defined keys are locked.
        responses:
          '20': Unlocked.
          '21': Locked.
        response_wire: CSI ? Pstatus n
      - selector: 26
        name: Keyboard dialect/status
        effect: Query the keyboard dialect and readiness.
        response: CSI ? 27 ; Pdialect [ ; Pstatus ] n; status is present in VT300 operating mode; Pstatus is 0 ready, 3 absent, or 8 busy.
      - selector: 55
        name: Locator status
        effect: Query whether an attached locator is available.
        responses:
          '50': Locator ready.
          '53': No locator detected.
          '58': Locator busy in other session.
        response_wire: CSI ? Pstatus n
      - selector: 56
        name: Locator device ID
        effect: Query the type of attached locator.
        responses:
          '0': Unknown.
          '1': DEC mouse.
          '2': DEC tablet.
        response_wire: CSI ? 57 ; Ptype n
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      later_dec_documentation: dec_vt420.device-status-reports-extended
      source_note: Source defines CSI ? 6 n request but no private prefix in its DECXCPR response; this is not silently normalized to xterm.
    - id: graphics-print-dec-private-modes
      section: Chapter 12 / Table 12-3, DEC Private Modes for DECRQM, DECRPM, SM and RM, printed pages 220-221
      level: defined
      wire: CSI ? Pd h / CSI ? Pd l
      rule: DEC VT330/VT340 assigns private mode selectors 43-47 to graphics-printer controls. The same input bytes collide
        with unrelated xterm-specific meanings for 44-47. A mode-number label is not sufficient to select implementation behavior.
      parameters:
      - selector: 43
        symbol: DECGEPM
        originating_effect: graphics expanded print
      - selector: 44
        symbol: DECGPCM
        originating_effect: graphics print color
      - selector: 45
        symbol: DECGPCS
        originating_effect: graphics print color syntax
