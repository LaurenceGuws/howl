      source_note: Pinned xterm two-parameter discovery documents a narrower form, and describes Pc=1 as Erase Below; actual code clears
        all only for Pc=0, then parses key/hex data, accepts nonempty definitions within MAX_UDK. It does not establish original 768-byte
        quota, lock or modifier semantics. These are original hardware requirements, not target choices.
    - id: character-set-designation-profile
      section: Chapter 5 / Selecting and Designating Character Sets, printed pp.91-95, Tables 5-2/5-3
      level: defined
      wire: ESC I1 [ I ... ] F
      rule: VT420 designates a hard set into G0..G3 independently of mapping into GL/GR. The only 96-character hard set is ISO Latin-1
        supplemental. The 94-character designators in Table 5-3 include ASCII B, DEC supplemental %5, special graphics 0, technical >,
        and user-preferred <. Initial G0/G1 ASCII; G2/G3 DEC Supplemental Graphic. NRC sets require national mode and the applicable worldwide
        hardware profile.
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:3806-3839,4853-4878,6256-6299
      related_standard: ecma35 designate-g*-94 / designate-g*-96
      original_nrc_designators:
        A: UK
        5/C: Finnish
        R: French
        9/Q: French Canadian
        K: German
        Y: Italian
        '`': ISO Norwegian/Danish
        6/E: DEC Norwegian/Danish
        '%6': Portuguese
        Z: Spanish
        7/H: Swedish
        '=': Swiss
      original_96_designators:
        A: ISO Latin-1 supplemental
      source_note: The size prefix distinguishes 94-set A (UK) from 96-set A (Latin-1). Xterm documents additional profile-specific sets;
        they are not added to the VT420 table. Individual registered glyph maps require separate source verification.
      test_locations:
      - file: howl-vt/test/unit/terminal_end_to_end_test.zig
        test: 'terminal: four charset slots share locking single-shift save and reset ownership'
        relation: protocol-family
        legacy_records:
