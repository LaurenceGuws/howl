    - id: numeric-keypad-mode
      section: Chapter 11 / Numeric Keypad Mode (DECNKM), printed pages 193-194
      level: defined
      wire: CSI ? 66 h / CSI ? 66 l
      rule: Sets application versus normal numeric-keypad input encoding. Same keypad state as DECKPAM (ESC =) / DECKPNM (ESC >), but
        a separate DEC-private mode number that can be queried through DECRQM.
      related_keyboard_commands:
      - dec_vt420.app-keypad
      - dec_vt420.request-mode
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-66-h-line-956
        source_line: 956
        wire: CSI ? 66 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-66-l-line-1102
        source_line: 1102
        wire: CSI ? 66 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 193; xterm ctlseqs set/reset lines 956/1102
        selector: 66
        name: DECNKM
        set_wire: CSI ? 66 h
        reset_wire: CSI ? 66 l
        original_default: numeric keypad characters
        set_effect: Numeric keypad sends application sequences.
        reset_effect: Numeric keypad sends normal keypad characters.
        source_specific_constraints: Distinct queryable DEC private mode encoding with the same keypad-state effect as ESC = and ESC >;
          provided mainly for DECRQM/DECRPM. Do not erase either valid command identity.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all
