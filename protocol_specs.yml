        source: charproc.c:6015-6020
    - id: status-display-type
      section: Chapter 11 / DECSSDT, printed pp.220-221
      level: defined
      wire: CSI Ps $ ~
      rule: VT400 mode. Ps=0 no status line (parameter default; line becomes extra user-window line), 1 indicator (factory display default),
        2 host-writable. Switching indicator to host-writable starts empty. Main/status share character sets, scroll mode, insert mode,
        tabs and autowrap; only column cursor operands act on status line; DECANM ignored there, DECSCL/DECSTR exit it, RIS erases and
        exits. SET-UP always shows indicator.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-0cc14c89d4
        source_line: 1992
        wire: CSI Ps $ ~
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:6022-6027
      source_note: VT420 summary p.227 appears to print a different final character; detailed format p.220 and report query table identify
        $ ~. Preserve detailed form, do not normalize parameter default to factory state.
    - id: request-presentation-state
      section: Chapter 12 / DECRQPSR and reports, printed pp.248-255
      level: defined
      wire: CSI Ps $ w
      rule: VT400 mode. Ps=0 error ignored; 1 requests cursor information DECCIR; 2 requests tab-stop report DECTABSR. Report is distinct
        from restoring state.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f38f13fb1a
        source_line: 1753
        wire: CSI Ps $ w
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: charproc.c:5768-5845
      replies:
        '1': DCS 1 $ u Pr ; Pc ; Pp ; Srend ; Satt ; Sflag ; Pgl ; Pgr ; Scss ; Sdesig ST
        '2': DCS 2 $ u column[/column...] ST
      original_cursor_report:
        position: 1-based row, column, display page
        bitfield_bytes: Bits 8=0,7=1,6 extension indicator; bit 5 reserved 0 in original VT420 tables. Base byte 0x40.
        Srend: bits 1 bold,2 underline,3 blink,4 reverse video
        Satt: bit 1 selective erase protection; bits 2..5 reserved
        Sflag: bits 1 origin,2 SS2 pending,3 SS3 pending,4 autowrap pending
        Pgl_Pgr: 0..3 select G0..G3
        Scss: bits 1..4 correspond G0..G3, zero=94 chars, one=96 chars
        Sdesig: concatenated intermediate/final designators in G0,G1,G2,G3 order, e.g. BB%5%5
      source_note: Pinned xterm limits tab report to NPARAM and current visible columns; cursor field generation is code-specific. Full
        report byte matrix, page count and restore interactions not proved.
    - id: restore-presentation-state
      section: Chapter 12 / DECRSPS, printed pp.255-257
      level: defined
      wire: DCS Ps $ t D...D ST
      rule: 'Restore one presentation report per request: Ps=0 ignored error,1 DECCIR payload,2 DECTABSR payload. Use exactly the original
        report data format (change u to t). Original DEC explicitly stops at invalid value and may leave partially restored state; do
        not assume whole-command atomicity.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-47fd6579ab
        source_line: 499
        wire: DCS Ps $ t Pt ST
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:5323-5343,4647-4748
      related_command: dec_vt420.request-presentation-state
      source_note: Pinned restore mutates fields sequentially; requires page 1, and tab restore clears existing stops before processing.
        These observations are not proof of complete hardware restore semantics.
      test_locations:
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRSPS restores bounded cursor rendition wrap origin and line drawing
        relation: wire-family
        legacy_records:
        - iterm2.dcs.decrsps_deccir
      - file: howl-vt/test/unit/terminal_modes_test.zig
        test: DECRSPS replaces active bounded tab stops transactionally
        relation: wire-family
        legacy_records:
        - iterm2.dcs.decrsps_dectabsr
    - id: assign-user-preferred-supplemental
      section: Chapter 5 / DECAUPSS, printed p.100; Chapter 12 / report p.273
      level: defined
      wire: DCS Ps ! u designator ST
      rule: 'Assign standby supplemental set; original VT420 default DEC Supplemental Graphic. Chapter 5 prints DCS 0 ! u % 5 ST for DEC
        Supplemental and DCS 0 ! u A ST for ISO Latin-1; Chapter 12 prints DCS 1 ! u A ST for ISO Latin-1 report. Assignment is not designation/mapping:
        designate G1/G2/G3 and map GR before use. Preserve literal conflicting selector values.'
      xterm_reference:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: misc.c:4812-4864,5305-5322
      source_note: Pinned xterm table uses selector 1 with A for ISO Latin-1, selector 0 with A for an undocumented ASCII variant, and
        ignores assignment in UTF-8 mode. Other later hardware sets require their own original source.
      accepted_reconciliations:
      - decaupss-latin1-assignment-selector
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: dcs-1903109226
        source_line: 451
        wire: DCS Ps ! u Pt ST
        previous_review:
          classification: source-confirmed-material-semantic-difference
          decision: decaupss-latin1-assignment-selector
          reason: VT420 original assignment and report sections disagree on ISO Latin-1 selector; xterm distinguishes 0!uA and 1!uA. Retain
            secondary entry for explicit scope reconciliation.
    - id: request-user-preferred-supplemental
      section: Chapter 12 / DECRQUPSS, printed p.273
      level: defined
      wire: CSI & u
      rule: VT400 mode query. Original report DCS 0 ! u % 5 ST for DEC Supplemental Graphic, DCS 1 ! u A ST for ISO Latin-1. Query only;
        report selector must not be silently rewritten to match Chapter 5 assignment example.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-996d289cc3
        source_line: 1727
        wire: CSI & u
