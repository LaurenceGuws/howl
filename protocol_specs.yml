  tek_4015:
    title: 4015 and 4015-1 Computer Display Terminal Users Instruction Manual
    author: Tektronix
    authority: protocol-author
    revision: First printing August 1974; 070-1649-00
    url: https://bitsavers.trailing-edge.com/pdf/tektronix/401x/070-1649-00_4015_and_4015-1_Computer_Display_Terminal_Users_Instruction_Manual_Aug1974.pdf
    snapshot_sha256: 86b4628fc59885c4ac961dbeb0b443c9ffd699207ba64b5b2eb481e4adfdd219
    scope: Selected 4015/4015-1 Tek graphics control profiles, including Option 34. Not a complete 4014/4015 protocol or a
      claim that all hardware profiles match. Source text extraction verified; visual verification of relevant pages unavailable.
    clauses:
    - id: status-address-query
      section: Table 2-1 p.2-7; GIN Mode Summary pp.3-29/30
      level: defined
      wire: ESC ENQ
      rule: 'In alpha/graph mode, transmit status byte followed by four address bytes for alpha cursor lower-left or graph beam;
        return to prior mode after transmission. Crosshair displayed in GIN: transmit four address bytes without status and
        return to alpha. CR optional; EOT optional only after CR. Bypass suppresses echoed data. Original hardware status bit
        meanings and timing are profile-specific, not generic VT cursor report.'
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-bf0cdf83e7
        source_line: 3310
        wire: ESC ENQ
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:431-444,1268-1292
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      original_status_bits:
        '8': strap dependent
        '7': '0'
        '6': '1'
        '5': 0 available hardcopy unit
        '4': 1 graph mode
        '3': 0 graph mode
        '2': 1 margin 2; apply 512 X adjustment if needed
        '1': 0 auxiliary unit active
      source_note: Pinned xterm uses fixed octal 064 with margin 2 flag in non-GIN branch; GIN branch omits status. Four 5-bit
        address chunks plus optional CR/EOT; exact original status bit behavior not established.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: page
      section: Table 2-1 p.2-7
      level: defined
      wire: ESC FF
      rule: Erase graphics display, select alpha mode, home cursor, choose margin 1 and clear bypass. Preserve selected character
        size unless other reset changes it. Not ECMA FF.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-24ece2028e
        source_line: 3312
        wire: ESC FF
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:553-558,1011-1040
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: apl-select
      section: Table 2-1 p.2-8
      level: defined
      wire: ESC SO
      rule: Select APL character set on 4015 when character-set switch permits program selection. This is Tek APL selection,
        not ANSI locking shift.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-06cd9b82d6
        source_line: 3314
        wire: ESC SO
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:580-584
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm explicitly ignores APL selection; original hardware behavior preserved.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: ascii-select
      section: Table 2-1 p.2-8
      level: defined
      wire: ESC SI
      rule: Select ASCII character set on 4015 when character-set switch permits program selection. Distinct from ANSI locking
        shift.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-8d5915fa7a
        source_line: 3316
        wire: ESC SI
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:574-578
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm explicitly ignores ASCII selection; original hardware behavior preserved.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: hardcopy
      section: Table 2-1 p.2-7
      level: defined
      wire: ESC ETB
      rule: Request physical display hard copy if attached and energized; clear bypass. No effect while crosshair displayed.
        Original operation is a device request, not a file-write command.
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:544-551,1964-2005
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm uses ALLOWLOGGING-gated copy of recorded Tek codes to timestamped file and turns off GIN if
        active. This is materially different from hardware hardcopy.
      accepted_reconciliations:
      - tek-hardcopy-vs-code-file
      disposition: source-only
      disposition_reason: Captain accepted legacy Tektronix profile as source-only, not a partial emulation or arbitrary file
        write.
    - id: bypass
      section: Table 2-1 p.2-6; GIN Summary pp.3-29/30
      level: defined
      wire: ESC CAN
      rule: Enter bypass condition to inhibit printing echoed input/GIN response bytes. Cleared by documented BEL, BS, CR, ESC
        ETB, ESC FF, HT, LF, US, VT or vector execution; bypass is not ANSI cancellation.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-3824a5834a
        source_line: 3321
        wire: ESC CAN
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:565-568
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: gin-enter
      section: Table 2-1 p.2-8; GIN Summary pp.3-29/30
      level: defined
      wire: ESC SUB
      rule: Enter graphics input mode, show crosshair, leave graph mode and enable bypass. Crosshair address can be requested
        by ESC ENQ or keyboard character; optional CR/EOT suffix follows four address bytes. Original hardware requires settling
        time except documented serial/coordinate cases.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-c7468fd1fd
        source_line: 3323
        wire: ESC SUB
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:460-472,431-444
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      related_query: tek_4015.status-address-query
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: special-point-plot
      section: Option 34, Appendix F p.F-7
      level: defined
      wire: ESC FS
      rule: Select special point plot with Enhanced Graphics Module. Intensity byte precedes each point address and selects
        stored spot size for grayscale; intensity differs from normal point mode.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-dd3f49ca71
        source_line: 3325
        wire: ESC FS
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:453-458,660-667
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm selects special-point parser but explicitly ignores intensity byte; full original point-size
        behavior not established.
      accepted_reconciliations:
      - dectek-exit-profile
      disposition: source-only
      disposition_reason: Legacy Tektronix-only profile retained as source evidence; no partial Tektronix emulation target selected.
    - id: character-size
      section: Table 2-2 p.2-9
      level: defined
      wire: 'ESC 8 / ESC 9 / ESC : / ESC ;'
      rule: Select one of four character sizes. Original 4015 table lists 74x35,81x38,121x58,132x64 characters by lines. These
        are hardware profile capacities, not ANSI cell resizing.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-cd1aed3d58
        source_line: 3331
        wire: 'ESC :'
      - catalogue: xterm_ctlseqs
        entry_id: esc-769d1ab47b
        source_line: 3333
        wire: ESC ;
      pinned_xterm_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: Tekproc.c:140-150,586-590
      mode_context: Tektronix graphics parser only; identical bytes in ANSI or VT52 mode have separate meaning.
      source_note: Pinned xterm uses 133 columns for smallest size, unlike the checked 4015 manual table 132. 4014 and later
        hardware revision capacities not independently verified.
      accepted_reconciliations:
      - tek-small-character-capacity
      disposition: source-only
      disposition_reason: Legacy Tektronix profile retained without targeting partial emulation.
    - id: beam-vector-select
      section: Tables 2-3 and F-3/F-4, pp.2-9/10,F-6
      level: defined
      wire: ESC Fbyte (0x60..0x77 selected values)
      rule: 'Basic hardware selects normal focus (0x60..0x67), defocus (0x68..0x6f) or write-through (0x70..0x77). Option 34
