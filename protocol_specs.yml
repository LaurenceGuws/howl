  kitty_remote_control:
    title: Kitty remote-control wire protocol
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/rc_protocol.rst
