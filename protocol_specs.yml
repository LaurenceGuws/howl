    - id: mouse-sgr
      section: Mouse Tracking / Extended coordinates
      level: defined
      wire: CSI ? 1006 h/l
      rule: 'Enable SGR mouse encoding: CSI < Cb ; Px ; Py M for press and motion, lowercase m for release. Decimal button value
        excludes the legacy +32 offset; modifier bits stay the same. Distinguishes the released button rather than ambiguous
        legacy release code. Highlight-tracking responses also use an SGR-like format. RESET disables this encoding.'
      source_semantics:
        selector: 1006
        section: Mouse Tracking / mutually exclusive tracking protocols and encoding schemes, lines 2900-3195 / SGR extended
          coordinates, 3149-3173
        authority: Pinned xterm extension publication; source code observations are separately qualified, not Howl conformance.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1006-h-line-975
        source_line: 975
        wire: CSI ? 1006 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-1006-l-line-1121
        source_line: 1121
        wire: CSI ? 1006 l
      pinned_source_observation:
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c:7825-7842; button.c:5428-5434,5540-5543,5616 onward
      encoding_state: Independent of tracking selection; coordinate formats are mutually exclusive. Pinned charproc.c:7825-7842
