        original_notation: CSI Pn apostrophe } (one numeric count; default Pn=1).
        xterm_notation: CSI Ps apostrophe } (same numeric count; default 1).
        region: Column edit acts within the scrolling margins from the cursor; no effect outside scrolling margins.
        effect: Shift columns right, adding blank columns without visual attributes.
    - id: protected-character
      section: Editing / Select Character Protection Attribute, p155
      level: defined
      wire: CSI Ps " q
      rule: DECSCA chooses protection on subsequently written characters for DEC selective erasure.
      also_documented:
