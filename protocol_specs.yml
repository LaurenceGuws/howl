      followup_evidence:
      - implementation: ghostty
        revision: 5813c9461d5af78b6307a1254d00b1bc190eaccd
        source: src/terminal/xt_checksum.zig:20-57,123-153
        observation: Explicitly follows xterm code rather than contradictory docs. Bit 3 makes unwritten cells eligible as spaces,
          still subject to trim; bit 4 selects full-codepoint mapping, excludes combining additions. Combining codepoints added
          only when bit 4 clear and no-trim sum selected. Implementation intentionally modeled on xterm; not independent algorithm
          origin.
      - implementation: xterm_snapshots
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        source: ptyx.h:488-496; screen.c:3177-3195,3236-3264
        observation: Bit 3 permits undrawn cells as spaces, also admitted by bit 2. Trimmed result can omit spaces. Bit 4 selects
          charData/full codepoint rather than DEC mapping; combining data only contributes to untrimmed total when bit 4 clear.
          Special values may be skipped.
