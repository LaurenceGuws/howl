  osc8:
    title: Hyperlinks in Terminal Emulators (OSC 8)
    author: Egmont Koblinger, VTE/iTerm2 collaboration
    authority: protocol-author
    revision: 2017 proposal, maintained clarification 2025-03-24
    url: https://gist.github.com/egmontkob/eb114294efbcd5adb1944c9f3cb5feda
    scope: OSC 8 grammar, cell association and URI policy; no implementation-specific length limits
    clauses:
    - id: open
      section: The escape sequence
      level: defined
      wire: OSC 8 ; params ; URI ST
      rule: Subsequently painted cells receive the declared hyperlink URI until the link is closed or replaced.
    - id: close
      section: The escape sequence
      level: defined
      wire: OSC 8 ; ; ST
      rule: An empty URI closes the current hyperlink association.
    - id: id
      section: The escape sequence
      level: defined
      wire: id=value
      rule: The optional id parameter distinguishes semantic hyperlink runs; unrecognized parameters are available for future extension.
    - id: uri
      section: The escape sequence
      level: defined
      wire: URI
      rule: The hyperlink target is URI-encoded; permitted schemes and launch action are host policy, not a protocol guarantee.
    - id: file-host
      section: file:// URIs
      level: defined
      wire: file://host/path
      rule: File links carry a hostname; a receiver must not silently treat a foreign-host file URI as a local file.
  rex_status:
    title: Rex Program Status Protocol (OSC 7501)
    author: Mitchell Hashimoto / Rex
    authority: protocol-author
    revision: 0.4, 2026-10-10
    url: https://www.superlogical.com/rex/docs/build/program-status
    scope: Complete numbered OSC 7501 protocol sections; host UI is intentionally unspecified
    clauses:
    - id: syntax
      section: Syntax
      level: defined
      wire: OSC 7501 ; key=value[:key=value...] ST
      rule: A report is colon-delimited lowercase key=value pairs using the specified value alphabet.
    - id: unknown-keys
      section: Syntax
      level: must
      wire: unknown=...
      rule: Ignore unknown keys so later revisions remain extensible; repeated known keys use their last value.
    - id: invalid-report
      section: Syntax
      level: must
      wire: invalid/base64/control-text
      rule: Discard a whole report if bounds, base64 decoding or decoded text control-character restrictions are violated.
    - id: record-update
      section: Records and ids
      level: defined
      wire: id=segment[/segment...]
      rule: One record per id, absent id addresses the root, and each accepted report replaces rather than merges that record.
    - id: id-rejection
      section: Records and ids
      level: defined
      wire: malformed id
      rule: Reject a report with an invalid id instead of falling back to the root record.
    - id: tree-clear
      section: Records and ids / States
      level: must
      wire: state=clear[:id=...]
      rule: Clear the addressed record and its descendants; clearing with no id removes all records.
    - id: states
      section: States
      level: defined
      wire: state=idle|working|done|blocked|error
      rule: The five states have distinct meanings; unknown or absent states invalidate the entire report.
    - id: lifecycle
      section: States
      level: must
      wire: process-exited / OSC 133 A
      rule: Drop working and blocked records on process exit or new shell prompt; preserve done and error records.
    - id: no-heartbeat
      section: States
      level: must
      wire: (no sequence)
      rule: Do not require periodic re-reporting just to keep existing records alive.
    - id: kind
      section: Keys
      level: defined
      wire: kind=permission|question|auth
      rule: Blocked records may describe which kind of user interaction is required; other states ignore kind.
    - id: progress
      section: Keys
      level: defined
      wire: progress=0..100
      rule: Working and blocked records may carry bounded percentage; absence means indeterminate progress.
    - id: inherited-app
      section: Keys
      level: must
      wire: app=name
      rule: Use the nearest ancestor app identity when a child record has no app of its own.
    - id: text
      section: Keys
      level: must
      wire: title=base64 / msg=base64
      rule: Validate decoded UTF-8 text and refuse embedded control characters; treat it as text rather than markup.
    - id: query
      section: Feature detection
      level: must
      wire: OSC 7501 ; ? ST
      rule: A supporting terminal replies with ? and may enumerate accepted states/kinds, without exposing stored records.
    - id: bounded-sequence
      section: Limits
      level: defined
      wire: complete OSC through ST
      rule: Maximum wire sequence is 4096 bytes; this is a ceiling, and lower bounds for individual report fields are specified.
    - id: record-capacity
      section: Limits
      level: must
      wire: status records
      rule: Support at least 64 and at most 256 records per terminal; when full evict the least recently updated record to admit a new one.
    - id: record-security
      section: Security
      level: must
      wire: OSC 7501 status values
      rule: Never interpret title or message as markup and never return any stored id, title or message in protocol replies.
    - id: presentation
      section: Motivation / In Rex
      level: defined
      wire: (host rendering)
      rule: The protocol reports facts; graphical presentation, notification style and tab adornments are not defined by the wire protocol.
  conemu_progress:
    title: ConEmu-specific OSC 9;4 progress report
    author: ConEmu
    authority: protocol-author
    revision: ConEmu published ANSI escape code table, observed 2026-11-23
    url: https://conemu.github.io/en/AnsiEscapeCodes.html#ConEmu_specific_OSC
    scope: Only originating ConEmu OSC 9;4, not every OSC 9 command or Windows Terminal UI
    clauses:
    - id: format
      section: ConEmu specific OSC
      level: defined
      wire: OSC 9 ; 4 ; state ; progress ST
      rule: Reports task progress state and an optional percentage to the terminal.
    - id: states
      section: ConEmu specific OSC
      level: defined
      wire: state 0..4
      rule: 0 clears, 1 sets a 0..100 percentage, 2 marks error, 3 indeterminate, 4 paused; error and paused permit omitted percentage.
  iterm2_osc1337:
    title: iTerm2 proprietary OSC 1337 commands
    author: iTerm2
    authority: protocol-author
    revision: iTerm2 documentation 3.6, observed 2026-11-23
    url: https://iterm2.com/3.6/documentation-escape-codes.html
    scope: Selected documented product-host commands, not a universal VT specification
    clauses:
    - id: set-user-var
      section: iTerm2 Extensions / SetUserVar
      level: defined
      wire: OSC 1337 ; SetUserVar=name=base64 ST
      rule: Defines a named host-session variable with a base64-encoded value for host substitution.
    - id: set-mark
      section: Set Mark
      level: defined
      wire: OSC 1337 ; SetMark ST
      rule: Records a host-side location mark for later navigation.
    - id: remote-host
      section: iTerm2 Extensions / RemoteHost
      level: defined
      wire: OSC 1337 ; RemoteHost=user@host ST
      rule: Reports the shell user and remote hostname to the host.
    - id: current-dir
      section: iTerm2 Extensions / CurrentDir
      level: defined
      wire: OSC 1337 ; CurrentDir=path ST
      rule: Reports the current shell working directory to the host.
    - id: clear-scrollback
      section: Clear Scrollback History
      level: defined
      wire: OSC 1337 ; ClearScrollback ST
      rule: Requests host-side scrollback history clearing.
    - id: set-profile
      section: Change profile
      level: defined
      wire: OSC 1337 ; SetProfile=name ST
      rule: Requests a host-owned named profile change; this does not define a generic terminal color operation.
    - id: notification
      section: Post a notification
      level: defined
      wire: OSC 9 ; message ST
      rule: Requests a simple host notification from the iTerm2-specific OSC 9 family; OSC 9;4 is separately indexed under its ConEmu origin.
    - id: cursor-guide
      section: Cursor Guide
      level: defined
      wire: OSC 1337 ; CursorGuide=... ST
      rule: Changes presentation of the host cursor guide.
    - id: steal-focus
      section: Steal Focus
      level: defined
      wire: OSC 1337 ; StealFocus ST
      rule: Requests that the host bring its window to the foreground.
    - id: copy-to-clipboard
      section: Copy to clipboard
      level: defined
      wire: OSC 1337 ; CopyToClipboard=name ST
      rule: Starts host-side clipboard capture under the declared destination.
    - id: end-copy
      section: Copy to clipboard
      level: defined
      wire: OSC 1337 ; EndCopy ST
      rule: Stops clipboard capture and commits the copied content.
    - id: set-colors
      section: Change the color palette
      level: defined
      wire: OSC 1337 ; SetColors=key=value ST
      rule: Sets a named iTerm2 session color or palette value.
    - id: tab-color
      section: Set window title and tab chrome background color
      level: defined
      wire: OSC 6 ; 1 ; bg ; channel ; brightness ; value ST
      rule: Sets a selected title/tab chrome background channel.
    - id: shell-integration-version
      section: ShellIntegrationVersion
      level: defined
      wire: OSC 1337 ; ShellIntegrationVersion=version;shell ST
      rule: Reports shell-integration script version and shell identity.
    - id: clear-captured-output
      section: ClearCapturedOutput
      level: defined
      wire: OSC 1337 ; ClearCapturedOutput ST
      rule: Clears the host captured command-output area.
    - id: badge-format
      section: Badge
      level: defined
      wire: OSC 1337 ; SetBadgeFormat=base64 ST
      rule: Defines the host badge format.
    - id: unicode-version
      section: Unicode Version
      level: defined
      wire: OSC 1337 ; UnicodeVersion=value ST
      rule: Selects the Unicode version used for terminal width calculations.
    - id: report-variable
      section: Report Variable
      level: defined
      wire: OSC 1337 ; ReportVariable=base64(variable-name) ST
      rule: Requests a named host-session variable using its base64-encoded name; response contains a base64-encoded value.
    - id: report-cell-size
      section: Report Cell Size
      level: defined
      wire: OSC 1337 ; ReportCellSize ST
      rule: Requests the current character cell pixel dimensions.
    - id: session-status
      section: Session Status
      level: defined
      wire: OSC 21337 ; indicator=color ; status=text [ ; status-color=color ] ST
      rule: Sets the host tab indicator and accompanying status subtitle.
    - id: inline-file
      section: File Transfer
      level: defined
      wire: 'OSC 1337 ; File=metadata : base64-data ST'
      rule: Transfers named inline image/file payload with iTerm2-specific metadata.
    - id: custom-buttons
      section: Buttons
      level: defined
      wire: OSC 1337 ; Button=... ST
      rule: Declares a host-owned custom control button.
  xterm_controls:
    title: XTerm Control Sequences (XTerm-origin extensions only)
    author: Thomas E. Dickey / xterm
    authority: extension-publisher
    revision: dated official control-sequence reference, observed 2026-11-23
    url: https://invisible-island.net/xterm/ctlseqs/ctlseqs.html
    scope: Selected documented xterm extensions; not an alternative ECMA-48 or DEC normative standard
    clauses:
    - id: bracketed-paste-mode
      section: Bracketed Paste Mode
      level: defined
      wire: CSI ? 2004 h / l
      rule: Enable or disable bracketed paste reporting for host-delivered paste.
    - id: bracketed-paste-delimiters
      section: Bracketed Paste Mode
      level: defined
      wire: CSI 200 ~ ... CSI 201 ~
      rule: When enabled, bracket the delivered paste bytes with start/end markers.
    - id: clipboard-osc52
      section: Operating System Commands
      level: defined
      wire: OSC 52 ; selection ; base64 ST
      rule: Requests copying or querying selected clipboard/selection data; authorization is host policy.
    - id: palette-osc4
      section: Operating System Commands
      level: defined
      wire: OSC 4 ; index ; color ST
      rule: Sets or queries indexed palette entries using the documented color grammar.
    - id: palette-reset
      section: Operating System Commands
      level: defined
      wire: OSC 104 [; index] ST
      rule: Restores indexed palette entries to their configured defaults.
    - id: dynamic-colors
      section: Operating System Commands
      level: defined
      wire: OSC 10 / OSC 11 / OSC 12
      rule: Sets or queries default foreground, background and cursor colors.
    - id: mouse-sgr
      section: Mouse Tracking / Extended coordinates
      level: defined
      wire: CSI ? 1006 h/l
      rule: Uses the SGR mouse event encoding while the corresponding tracking mode reports pointer actions.
    - id: focus
      section: FocusIn/FocusOut
      level: defined
      wire: CSI ? 1004 h/l
      rule: Enables or disables focus enter/leave events reported through the terminal.
    - id: xtqmodkeys
      section: Functions using CSI / Query key modifier options (XTQMODKEYS)
      level: defined
      wire: CSI ? Pp m
      rule: Query xterm key-modifier configuration by Pp; Pp=4 requests modifyOtherKeys. Return its current setting encoded as an XTMODKEYS
        reply, not a text-rendition mutation.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-4fe8991d89
        source_line: 1349
        wire: CSI ? Pp m
    - id: sd-caret-alias
      section: Functions using CSI / SD (historical caret spelling)
      level: defined
      wire: CSI Ps ^
      rule: Scroll down Ps lines (default 1); xterm accepts this legacy caret spelling as an alternative to CSI Ps T.
      semantic_alias_of: ecma48.sd
      competes_with: ecma48.simd
      decision: ecma48-simd-vs-xterm-sd-caret
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6f39fa13a7
        source_line: 751
        wire: CSI Ps ^
    - id: tbc-vt100-subset
      section: Functions using CSI / Tab Clear (TBC)
      level: defined
      wire: CSI Ps g
      rule: Ps=0 clears the horizontal tab stop at the current column; Ps=3 clears all horizontal tab stops. For VT100 compatibility, other
        values are ignored.
      equivalent_to: dec_vt100.tbc
      competes_with: ecma48.tbc
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-100de06422
        source_line: 871
        wire: CSI Ps g
      decision: ecma48-tbc-vs-xterm-subset
    - id: decxcpr-xterm-reply
      section: Functions using CSI / DEC-specific DSR (source line 1420); charproc.c CASE_DSR
      level: defined
      wire: CSI ? Prow ; Pcol [ ; Ppage ] R
      rule: Xterm responds to CSI ? 6 n with a private-prefixed cursor position. It includes page number 1 when emulating VT420 or eligible
        VT330-level operation; older levels report only row and column.
      source_request: CSI ? 6 n
      originating_dec_reference: dec_vt3xx_text.dsr-dec-private
      competes_with: DEC VT330/VT340 and VT420 source reply CSI Prow ; Pcol ; Ppage R (without ?).
      xterm_reference_documentation: The pinned ctlseqs text at line 1420 describes CSI ? row ; col R, without the optional page used by
        its implementation at later VT levels.
      xterm_implementation:
        source: https://github.com/xterm-x11/xterm-snapshots/blob/5afc76e089167da6d07c49334d0bf350377f6c0a/charproc.c
        revision: 5afc76e089167da6d07c49334d0bf350377f6c0a
        location: charproc.c, CASE_DSR / CASE_CPR, parameter 6
        observed_rule: Private ? prefix is always present; page=1 is appended for VT420 or qualifying VT330 modes.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-f2360e60be
        source_line: 1420
        wire: CSI ? Ps n
      decision: dec-private-dsr-decxcpr-reply-shape
  kitty_keyboard:
    title: Comprehensive keyboard handling in terminals
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/keyboard-protocol.rst
    scope: Opt-in progressive keyboard reporting including bank-local stacks, encoding and event types
    clauses:
    - id: flags
      section: Progressive enhancement
      level: defined
      wire: CSI flags ; mode u
      rule: Sets, adds or clears the five progressive enhancement flags according to the requested mode.
    - id: query
      section: Progressive enhancement
      level: defined
      wire: CSI ? u
      rule: Replies with current keyboard enhancement flags using CSI ? flags u.
    - id: stack
      section: Progressive enhancement
      level: defined
      wire: CSI > flags u / CSI < count u
      rule: Pushes or pops keyboard mode flags with bounded per-screen stacks, preserving independent primary/alternate modes.
    - id: disambiguate
      section: Disambiguate escape codes
      level: defined
      wire: flag 1
      rule: Distinguishes ambiguous legacy key sequences such as Escape from the start of a CSI sequence.
    - id: event-types
      section: Report event types
      level: defined
      wire: flag 2
      rule: Allows reporting key press, repeat and release event kinds.
    - id: alternate-keys
      section: Report alternate keys
      level: defined
      wire: flag 4
      rule: Includes alternate key values when an event is encoded as an escape sequence.
    - id: all-keys
      section: Report all keys as escape codes
      level: defined
      wire: flag 8
      rule: Encodes text-producing and modifier keys as events rather than plain text bytes.
    - id: associated-text
      section: Report associated text
      level: defined
      wire: flag 16
      rule: Includes Unicode text code points with encoded key events when the applicable enhancement is active.
    - id: legacy
      section: Legacy key event encoding
      level: defined
      wire: legacy text / CSI / SS3
      rule: Default compatibility mode emits traditional key sequences or UTF-8 text without enabling advanced event reporting.
  kitty_graphics:
    title: Kitty terminal graphics protocol
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/graphics-protocol.rst
    scope: Selected documented transport, image, placement, indexed color, animation and lifetime clauses
    clauses:
    - id: envelope
      section: The graphics escape code
      level: defined
      wire: APC G control ; payload ST
      rule: Graphics commands use APC G with comma-delimited control fields and an optional data payload.
    - id: rgb-rgba
      section: Transferring pixel data / RGB and RGBA data
      level: defined
      wire: a=t/T f=24|32 s=width v=height
      rule: Direct RGB/RGBA data uses exactly three or four sRGB bytes per pixel with explicit dimensions.
    - id: indexed-8
      section: Indexed color data
      level: defined
      wire: f=8
      rule: Each pixel retains one opaque 256-color palette index; image colors follow the current terminal palette.
    - id: indexed-16
      section: Indexed color data
      level: defined
      wire: f=16
      rule: Each pixel retains its palette index and an independent alpha byte; palette changes update RGB without changing alpha.
    - id: indexed-special
      section: Indexed color data
      level: defined
      wire: palette indices 248..255
      rule: Special indexed values select default, selection, cursor, URL-hover and fallback foreground/background colors as documented.
    - id: png
      section: PNG data
      level: defined
      wire: f=100
      rule: Accepts a PNG encoded image with dimensions determined from PNG data.
    - id: compressed
      section: Compression
      level: defined
      wire: o=z
      rule: Allows zlib-compressed transmitted image data subject to the declared uncompressed size.
    - id: mediums
      section: The transmission medium
      level: defined
      wire: t=d|f|t|s
      rule: Specifies direct and local-file/shared-memory transmission media with the applicable local/remote rules.
    - id: query
      section: Querying support and available transmission mediums
      level: defined
      wire: a=q / query payload
      rule: A capability query does not itself display or retain the image and returns a protocol reply.
    - id: put
      section: Display images on screen
      level: defined
      wire: a=p / a=T
      rule: Placements refer to previously transmitted image data with their own identity and geometry.
    - id: unicode
      section: Unicode placeholders
      level: defined
      wire: U=1 plus U+10EEEE cells
      rule: A virtual placement follows matching Unicode placeholder cell positions and moves with text.
    - id: relative
      section: Relative placements
      level: defined
      wire: P=parent-image Q=placement H/V=offsets
      rule: A placement may attach to a parent physical or Unicode placement with a bounded, cycle-free ancestry and lifetime.
    - id: delete
      section: Deleting images
      level: defined
      wire: a=d d=selector
      rule: Lowercase selectors retire placements; uppercase variants additionally reclaim unreferenced decoded image data.
    - id: replies
      section: Suppressing responses from the terminal
      level: defined
      wire: q=0|1|2
      rule: Selects normal responses or suppresses response categories as documented.
    - id: frame-load
      section: Animation / Transferring animation frame data
      level: defined
      wire: a=f
      rule: Transmits numbered animation-frame data subject to base/edit and timing rules.
    - id: animation
      section: Animation / Controlling animations
      level: defined
      wire: a=a
      rule: Controls animation state, loop count, current frame and frame durations.
    - id: composition
      section: Animation / Composing animation frames
      level: defined
      wire: a=c
      rule: Composes bounded regions from one animation frame to another.
    - id: no-indexed-animation
      section: Indexed color data
      level: defined
      wire: f=8|16 with a=f|a=c
      rule: Indexed images do not support animation-frame loading or frame composition.
    - id: quota
      section: Image persistence and storage quotas
      level: defined
      wire: retained image resources
      rule: Terminals may bound image retention and prefer reclaiming unplaced image data under storage pressure.
  kitty_clipboard:
    title: Kitty clipboard protocol (OSC 5522)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/clipboard.rst
    scope: Read/write, MIME, permission, paste events, detection and multiplexing
    clauses:
    - id: envelope
      section: Copying all data types to the clipboard
      level: defined
      wire: OSC 5522 ; metadata ; base64 ST
      rule: Transports clipboard requests and replies with MIME-aware metadata and standard base64 data.
    - id: read
      section: Reading data from the system clipboard
      level: defined
      wire: type=read
      rule: Requests selected MIME types or the available MIME list, with the terminal allowed to require user permission.
    - id: write
      section: Writing data to the system clipboard
      level: defined
      wire: type=write
      rule: Transfers MIME-labeled clipboard data through status and chunked content rules.
    - id: password
      section: Avoiding repeated permission prompts
      level: defined
      wire: pw=... name=...
      rule: A named permission token can avoid repeated prompts when the user has authorized its scope.
    - id: paste-events
      section: Allowing terminal applications to respond to paste events
      level: defined
      wire: CSI ? 5522 h/l
      rule: When enabled, the host reports paste-triggered MIME availability for application-directed retrieval.
    - id: detection
      section: Detecting support for this protocol
      level: defined
      wire: CSI ? 5522 $ p
      rule: Uses standard mode-query reporting to discover whether paste event mode is supported.
    - id: mux-id
      section: Support for terminal multiplexers
      level: defined
      wire: id=...
      rule: Response metadata preserves the sanitized request id so a multiplexer can route responses.
  kitty_color:
    title: Kitty color control and color stack
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/color-stack.rst
    scope: Original OSC color stack and OSC 21 named color controls
    clauses:
    - id: push
      section: Saving and restoring colors
      level: defined
      wire: OSC 30001 ST
      rule: Saves the current terminal dynamic colors and 256-entry ANSI palette to a bounded stack.
    - id: pop
      section: Saving and restoring colors
      level: defined
      wire: OSC 30101 ST
      rule: Restores a previously saved color state and its palette without confusing it with host defaults.
    - id: set
      section: Setting and querying colors
      level: defined
      wire: OSC 21 ; name=color ST
      rule: Sets named terminal colors using the published key/value and color encoding rules.
    - id: query
      section: Querying current color values
      level: defined
      wire: OSC 21 ; name=? ST
      rule: Reports currently resolved values for requested named colors, including unset-color semantics.
  kitty_notification:
    title: Kitty desktop notifications (OSC 99)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/desktop-notifications.rst
    scope: Notification commands and application callbacks; visual desktop policy is host-owned
    clauses:
    - id: envelope
      section: Desktop notifications
      level: defined
      wire: OSC 99 ; metadata ; payload ST
      rule: Transmits notification fields and optional payload chunks with an explicit metadata separator.
    - id: chunks
      section: Desktop notifications
      level: defined
      wire: i=notification-id d=0|1
      rule: Multiple chunks with one id form a pending notification; the completion flag commits it.
    - id: title-body
      section: Desktop notifications
      level: defined
      wire: p=title|body
      rule: Title/body payloads are plain safe UTF-8 or marked base64; markup is not assumed.
    - id: activation
      section: Being informed when user activates the notification
      level: defined
      wire: activation-report fields
      rule: A program can request host feedback when the user activates a notification.
    - id: close
      section: Updating or closing an existing notification
      level: defined
      wire: notification identity / close
      rule: An identified notification can be updated or explicitly retired using the prescribed metadata.
    - id: query
      section: Querying for support
      level: defined
      wire: OSC 99 feature query
      rule: Negotiates the subset of notification features the host offers.
  kitty_text_size:
    title: Kitty text sizing protocol (OSC 66)
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/text-sizing-protocol.rst
    scope: Sizing syntax, geometry, fractional scaling and editing interactions
    clauses:
    - id: envelope
      section: The escape code
      level: defined
      wire: OSC 66 ; metadata ; safe-UTF8-text ST
      rule: Accepts at most 4096 bytes of escape-safe UTF-8 text per command with bounded colon-separated sizing metadata.
    - id: scale
      section: How it works
      level: defined
      wire: s=1..7 w=0..7
      rule: Reserves an explicitly sized group of terminal cells and renders the supplied text at the requested scale and width.
    - id: fraction
      section: Fractional scaling
      level: defined
      wire: n numerator d denominator
      rule: Uses validated fractional scaling and alignment metadata, with nonzero denominator larger than numerator.
    - id: editing
      section: Wrapping and overwriting behavior
      level: defined
      wire: sized text cells
      rule: Writing, wrapping and erase/edit operations preserve the logical multi-cell text association.
    - id: detection
      section: Detecting if the terminal supports this protocol
      level: defined
      wire: text-size feature probe
      rule: Clients can discover whether OSC 66 sizing can be interpreted.
  kitty_pointer:
    title: Kitty mouse pointer shape control
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/pointer-shapes.rst
    scope: Set, push/pop, query and bounded stack rules for OSC 22 pointer shapes
    clauses:
    - id: set
      section: Setting the pointer shape
      level: defined
      wire: OSC 22 ; [=]shape ST
      rule: Requests the documented mouse pointer shape by name.
    - id: stack
      section: Pushing and popping shapes onto the stack
      level: defined
      wire: OSC 22 ; >names / < ST
      rule: Push/pop requested pointer shapes; implementations choose a bound but support at least 16 stack entries.
    - id: query
      section: Querying support
      level: defined
      wire: OSC 22 ; ?shape[,shape] ST
      rule: Reports current pointer shape or supported names using the documented response vocabulary.
  kitty_multi_cursor:
    title: Kitty multiple cursors protocol
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/multiple-cursors-protocol.rst
    scope: One protocol, not a list of the reference terminal cursor-renderer internals
    clauses:
    - id: syntax
      section: Quickstart
      level: defined
      wire: CSI > shape ; position ... SP q
      rule: Sets extra cursor shapes on declared cell points or rectangles.
    - id: clipping
      section: Quickstart
      level: must
      wire: out-of-range points and rectangles
      rule: Ignore out-of-screen cells and trailing incomplete coordinate groups, without moving other extra cursors.
    - id: detection
      section: Querying for support
      level: defined
      wire: multiple cursor support query
      rule: Reports whether the extra-cursor feature and relevant shapes are available.
    - id: clear
      section: Clearing previously set multi-cursors
      level: defined
      wire: extra cursor clear request
      rule: Removes extra cursor positions without altering the ordinary primary cursor.
    - id: color
      section: Changing the color of extra cursors
      level: defined
      wire: extra cursor color control
      rule: Allows optional extra cursor color and text-under-cursor color.
  kitty_unscroll:
    title: Kitty unscroll extension to SD
    author: Kovid Goyal / kitty
    authority: protocol-author
    revision: git a79f376b85fd95e3dfd0589877123996bacd4184
    url: https://github.com/kovidgoyal/kitty/blob/a79f376b85fd95e3dfd0589877123996bacd4184/docs/unscroll.rst
    scope: One source-authored modifier of ECMA-48 SD, not a new SD standard
    clauses:
    - id: unscroll
      section: Unscrolling the screen
      level: defined
      wire: CSI Pn + T
      rule: Scrolls down and fills newly exposed lines from retained scrollback where available instead of inserting blank lines.
    - id: fallback
      section: Unscrolling the screen
      level: defined
      wire: empty history / alternate screen
      rule: With no usable history, uses ordinary blank-line SD behavior; the unscroll capacity is at least one screen.
  dec_vt240:
    title: Digital VT240 Series Programmer Pocket Guide
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: 2nd edition, September 1984 (EK-VT240-HR-002)
    url: https://vt100.net/dec/ek-vt240-hr-002.pdf
    snapshot_sha256: 365a3195c3de2e4ceb323f0bf500321317ae4a94db2c1c251057a4933476a72b
    scope: Selected originating DEC private controls, not duplicate ECMA-48 functions
    clauses:
    - id: origin
      section: Terminal Modes / Origin Mode
      level: defined
      wire: CSI ? 6 h/l
      rule: Selects cursor addressing relative to the defined scrolling region or the display page.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-h-line-919
        source_line: 919
        wire: CSI ? 6 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-l-line-1069
        source_line: 1069
        wire: CSI ? 6 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 135; xterm ctlseqs set/reset lines 919/1069
        selector: 6
        name: DECOM
        set_wire: CSI ? 6 h
        reset_wire: CSI ? 6 l
        original_default: origin addressing relative to the whole page, not margins
        set_effect: Origin-relative cursor addressing is restricted to the scrolling margins.
        reset_effect: Addressing uses page origin, independent of scrolling margins.
        source_specific_constraints: The original defines home relative to margins when set and page when reset. Do not conflate the page
          coordinate system with VT scrollback.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: autowrap
      section: Terminal Modes / Auto Wrap
      level: defined
      wire: CSI ? 7 h/l
      rule: Controls automatic line wrapping at the right display margin.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-h-line-920
        source_line: 920
        wire: CSI ? 7 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-7-l-line-1070
        source_line: 1070
        wire: CSI ? 7 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 191; xterm ctlseqs set/reset lines 920/1070
        selector: 7
        name: DECAWM
        set_wire: CSI ? 7 h
        reset_wire: CSI ? 7 l
        original_default: no autowrap in the original VT420 reference
        set_effect: At the right page border, subsequent graphic characters wrap to the next line, scrolling the region when appropriate.
        reset_effect: At the right page border, subsequent graphics replace the border cell rather than wrapping.
        source_specific_constraints: The DEC VT420 source explicitly says default no autowrap; do not silently substitute an independently
          configured modern emulator startup default. This is source history, not Howl runtime conformance.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: stbm
      section: Set Top and Bottom Margins (DECSTBM), page 37
      level: defined
      wire: CSI Pt ; Pb r
      rule: Defines the vertical scrolling region with one-based top and bottom margins and documented defaults.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-542315e11b
        source_line: 1560
        wire: CSI Ps ; Ps r
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 6, printed page 134; xterm ctlseqs line 1560
        original_notation: 'CSI Pt ; Pb r: Pt top (default=1), Pb bottom (default=current lines per screen).'
        requirements: Pt must be less than Pb; region cannot exceed page; cursor homes to page row=1, column=1.
        xterm_wording: CSI Ps ; Ps r and default full window; this is the same top/bottom region command but does not license ignoring page
          constraints.
    - id: sca
      section: Select Character Attributes (DECSCA), page 35
      level: defined
      wire: CSI Ps " q
      rule: Selects whether subsequently written characters are protected against selective erasure.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-8e923aba42
        source_line: 1549
        wire: CSI Ps " q
      original_parameters:
        source: VT420 Programmer Reference Manual, page 155; xterm ctlseqs lines 1549-1554
        selectors: 0 (default) erasable, 1 protected, 2 erasable (same as 0)
        scope: Protection of subsequently written characters for DEC selective erase; does not change SGR visual attributes.
    - id: sel
      section: Erasing / Selective Erase in Line (DECSEL), page 37
      level: defined
      wire: CSI ? Ps K
      rule: Erases eligible unprotected characters within the selected part of the line.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-2e23147752
        source_line: 626
        wire: CSI ? Ps K
      original_parameters:
        source: VT420 Programmer Reference Manual, page 157; xterm ctlseqs lines 626-630
        selectors: 0 (default) cursor to right end; 1 line start to cursor; 2 whole line; protected characters remain untouched.
    - id: sed
      section: Erasing / Selective Erase in Display (DECSED), page 37
      level: defined
      wire: CSI ? Ps J
      rule: Erases eligible unprotected characters within the selected part of the display.
    - id: decaln
      section: Adjustments (DECALN), page 47
      level: defined
      wire: 'ESC # 8'
      rule: Displays the screen-alignment pattern for checking video cell geometry.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: esc-d654f4f54c
        source_line: 306
        wire: 'ESC # 8'
    - id: media-copy-dec-private
      section: Printing / Auto print, Print cursor line and ReGIS hardcopy routing, printed pages 38-39
      level: defined
      wire: CSI ? Ps i
      rule: DEC-private Media Copy controls printer autoprint, a cursor-line print request, ReGIS graphics hardcopy routing and printer-to-host
        transfer. These are private-parameter meanings distinct from unprefixed ECMA-48 Media Copy.
      related_standard: ecma48.mc
      parameters:
      - selector: 0
        also_default: true
        effect: Select the printer port for subsequent ReGIS graphics hardcopy, effective even when no printer is connected.
      - selector: 1
        effect: Print the display line containing the cursor, without moving the cursor.
      - selector: 2
        effect: Direct subsequent ReGIS graphics hardcopy to host port.
      - selector: 4
        effect: Disable autoprint mode.
      - selector: 5
        effect: 'Enable autoprint: print the display line when the cursor leaves it through LF, FF, VT or wrapping.'
      - selector: 8
        effect: Stop communication from printer port to host port.
      - selector: 9
        effect: Start communication from printer port to host port.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-6dd886d3cc
        source_line: 1048
        wire: CSI ? Ps i
      xterm_parameter_scope: The pinned xterm reference confirms 1,4,5 from the original DEC family and 10,11 from later DEC documentation.
        It does not list 0,2,8,9; absence is not proof of a no-op.
      later_dec_documentation: dec_vt420.media-copy-dec-private-extended
      xterm_documented_overlap:
      - 1
      - 4
      - 5
      xterm_selector_lines:
        '1': 1050
        '4': 1051
        '5': 1052
  dec_sixel:
    title: Digital VT330/VT340 Programmer Pocket Guide, sixel graphics
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: 2nd edition, May 1988 (EK-VT3XX-HR-002)
    url: https://vt100.net/dec/ek-vt3xx-hr-002.pdf
    scope: Section 2.14 sixel graphics only, not the entire VT340 graphics or ReGIS system
    clauses:
    - id: envelope
      section: 2.14 / Sixel Data Format, page 95
      level: defined
      wire: DCS P1 ; P2 ; P3 q sixels ST
      rule: Introduces a sixel data stream with defined macro, background, grid and terminator parameters.
    - id: six-dots
      section: 2.14 / Sixel Data Format, page 96
      level: defined
      wire: '? through ~'
      rule: Each data character encodes a vertical six-dot column; the character code minus 0x3f yields its six bit mask.
    - id: background
      section: 2.14 / Sixel Data Format, page 96
      level: defined
      wire: P2=0|1|2
      rule: Selects background painting for unset sixel bits versus preserving existing pixel colors.
    - id: repeat
      section: 2.14 / Sixel Control Functions, page 97
      level: defined
      wire: '! Pn sixel'
      rule: Repeats the following sixel data character by the specified count.
    - id: raster
      section: 2.14 / Raster Attributes, page 97
      level: defined
      wire: '" Pan ; Pad ; Ph ; Pv'
      rule: Sets pixel aspect ratio and nominal image extent ahead of sixel data, overriding the macro aspect ratio.
    - id: color
      section: 2.14 / Color Introducer, pages 97-98
      level: defined
      wire: '# Pc [; Pu ; Px ; Py ; Pz]'
      rule: Selects or defines a palette register using HLS or RGB coordinates.
  dec_vt420:
    title: VT420 Programmer Reference Manual (DEC private extensions)
    author: Digital Equipment Corporation
    authority: protocol-author
    revision: second edition, February 1992, EK-VT420-RM.002
    url: https://vt100.net/mirror/mds-199909/cd3/term/vt420rm2.pdf
    snapshot_sha256: 6edca845f10c8fc10be87f111d0ad95130d6aa15a09de578bbb8d5133511ecd2
    scope: Original DEC VT400 operations; existing ECMA-48 functions are not redefined here
    clauses:
    - id: column-mode
      section: Page Memory / Selecting 80 or 132 Columns, p130
      level: defined
      wire: CSI ? 3 h/l
      rule: DECCOLM switches between 80 and 132 terminal columns under the configured terminal mode.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-3-h-line-916
        source_line: 916
        wire: CSI ? 3 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-3-l-line-1066
        source_line: 1066
        wire: CSI ? 3 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 130-131; xterm ctlseqs set/reset lines 916/1066
        selector: 3
        name: DECCOLM
        set_wire: CSI ? 3 h
        reset_wire: CSI ? 3 l
        original_default: 80 columns
        set_effect: Choose 132 columns.
        reset_effect: Choose 80 columns.
        source_specific_constraints: On a change, original VT420 resets all scrolling margins, erases all page-memory data, disables DECVSSM
          and clears a host-writable status line. The DEC manual recommends DECSCPP instead for applications requiring content preservation.
          Current Howl host-geometry consequences are not inferred.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
    - id: left-right-margins
      section: Page Memory / Set Left and Right Margins, p133
      level: defined
      wire: CSI Pl ; Pr s
      rule: DECSLRM sets left and right scrolling-region margins.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-c4ca9bb4cf
        source_line: 1586
        wire: CSI Pl ; Pr s
      original_parameters:
        source: VT420 Programmer Reference Manual (Feb 1992), page 133
        gate: DECVSSM (CSI ? 69 h); xterm names this setting DECLRMM
        constraints: Pl defaults to 1; Pr defaults to current page width (80 or 132 in original). Pl must be less than Pr; region width at
          least 2 columns and at most the page width.
        effect: Sets horizontal scrolling margins and homes cursor to row 1, column 1 of the page.
        xterm_context: Source line 1586 admits DECSLRM only when DECLRMM mode is enabled; the implementation is not assumed source-complete.
    - id: top-bottom-margins
      section: Page Memory / Set Top and Bottom Margins, p134
      level: defined
      wire: CSI Pt ; Pb r
      rule: DECSTBM selects vertical scrolling margins.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-542315e11b
        source_line: 1560
        wire: CSI Ps ; Ps r
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 6, printed page 134; xterm ctlseqs line 1560
        original_notation: 'CSI Pt ; Pb r: Pt top (default=1), Pb bottom (default=current lines per screen).'
        requirements: Pt must be less than Pb; region cannot exceed page; cursor homes to page row=1, column=1.
        xterm_wording: CSI Ps ; Ps r and default full window; this is the same top/bottom region command but does not license ignoring page
          constraints.
      reaffirms: dec_vt240.stbm
    - id: origin-mode
      section: Page Memory / Origin Mode, p135
      level: defined
      wire: CSI ? 6 h/l
      rule: DECOM toggles origin-relative versus page-relative cursor addressing.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-h-line-919
        source_line: 919
        wire: CSI ? 6 h
      - catalogue: xterm_ctlseqs
        entry_id: private-mode-6-l-line-1069
        source_line: 1069
        wire: CSI ? 6 l
      original_mode_semantics:
        source: DEC VT420 Programmer Reference Manual (Feb 1992), printed page(s) 135; xterm ctlseqs set/reset lines 919/1069
        selector: 6
        name: DECOM
        set_wire: CSI ? 6 h
        reset_wire: CSI ? 6 l
        original_default: origin addressing relative to the whole page, not margins
        set_effect: Origin-relative cursor addressing is restricted to the scrolling margins.
        reset_effect: Addressing uses page origin, independent of scrolling margins.
        source_specific_constraints: The original defines home relative to margins when set and page when reset. Do not conflate the page
          coordinate system with VT scrollback.
        conformance_note: Original-author meaning and equivalent xterm command identity, not a claim that Howl already implements all defaults,
          side effects, sizing or response semantics.
      reaffirms: dec_vt240.origin
    - id: delete-column
      section: Editing / Delete Column, p149
      level: defined
      wire: CSI Pn ' ~
      rule: DECDC deletes one or more vertical columns and shifts later columns left.
      also_documented:
      - catalogue: xterm_ctlseqs
        entry_id: csi-c96fada8ba
        source_line: 1989
        wire: CSI Ps ' ~
      original_parameters:
        source: Original DEC VT420 Programmer Reference Manual, Chapter 8, printed page 149
        original_notation: CSI Pn apostrophe ~ (one numeric count; default Pn=1).
        xterm_notation: CSI Ps apostrophe ~ (same numeric count; default 1).
        region: Column edit acts within the scrolling margins from the cursor; no effect outside scrolling margins.
        effect: Shift columns left, adding blank columns without visual attributes at right margin.
    - id: insert-column
      section: Editing / Insert Column, p150
