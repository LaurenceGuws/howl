          windows_terminal.osc52.set:
            raw: "OSC 52 ; Pc ; base64 (BEL|ST)"
            effect: decode and pass clipboard text to the host
            relevance: host consequence
            source: terminal/parser/OutputStateMachineEngine.cpp
            symbol: OutputStateMachineEngine::_GetOscSetClipboard
            line: 1105
            conditions: >-
              The reference ignores Pc, requires valid base64 and declines
              malformed and extra fields; the output dispatch calls SetClipboard
              only for non-query data. Parsed text can include Unicode.
            howl:
              support: partial
              disposition: excluded
              rationale: "Pinned Windows Terminal accepts arbitrary Pc and decodes set data into its clipboard dispatch; Howl limits selectors, has strict base64 validation, and hands one bounded decoded value to the direct app."
              residual: "Howl validates bounded selectors and RFC4648 base64 before admitting a caller-owned OSC 52 set; pinned WT ignores Pc and has a different Base64 decoder. Host clipboard write policy remains application-owned."
              source: howl-vt/src/clipboard_grammar.zig
              symbol: parse
              proof:
                path: howl-vt/test/unit/terminal_osc_test.zig
                symbol: "Windows Terminal OSC 52 selectors and queries differ from bounded Howl clipboard policy"
          windows_terminal.osc52.query_ignored:
            raw: "OSC 52 ; Pc ; ? (BEL|ST)"
            effect: recognize a clipboard query without reading or replying
            relevance: host consequence
            source: terminal/parser/OutputStateMachineEngine.cpp
            symbol: OutputStateMachineEngine::ActionOscDispatch
            line: 825
            conditions: >-
              _GetOscSetClipboard recognizes the question mark but dispatch
              suppresses SetClipboard for queries and emits no read reply.
              Howl's existing explicit empty response is a separate policy.
            howl:
              support: partial
              disposition: excluded
              rationale: "The no-reply WT query contract conflicts with Howl’s explicit empty response; neither grants clipboard read permission."
              residual: "Pinned WT recognizes OSC 52 query but remains silent; Howl queues the query and its direct app responds with an explicitly empty OSC 52 payload, without reading clipboard data."
              source: howl-app/src/consequences.zig
              symbol: drain
              proof:
                path: howl-app/src/consequences.zig
                symbol: "terminal consequences own latest clipboard, attention and typed reply FIFO"
