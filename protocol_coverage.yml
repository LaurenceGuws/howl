schema: 2

howl_schema:
  support: [full, partial, missing, unassessed]
  disposition: [none, active, delegated, deferred, excluded]
  owner: [howl-vt, howl-host, howl-control, howl-render, howl-pty]
  defaults: {full_disposition: none, incomplete_disposition: active, owner: howl-vt}
  meaning:
    support: implemented behavior relative to the pinned reference
    disposition: treatment of the remaining residual obligation
    owner: concrete Howl module responsible for that residual

classifications:
  lifecycle_difference: &howl_lifecycle_difference >-
    Howl keeps one coherent terminal reset, savepoint, and screen-bank lifecycle; exact parity with the pinned
    reference's additional or conflicting lifecycle policy is outside the complete Howl family.
  cursor_policy_difference: &howl_cursor_policy_difference >-
    Howl keeps one coherent cursor, origin, margin, and logical-row policy; exact parity with a pinned reference's
    conflicting directional or margin policy is outside the complete Howl family.
  structural_policy_difference: &howl_structural_policy_difference >-
    Howl edits its bounded cell, row-geometry, continuation, history, and damage model exactly; reference-only
    multicell, selection, callback, or external-attribute consequences are outside the complete Howl family.
  rendition_policy_difference: &howl_rendition_policy_difference >-
    Howl retains one bounded cell-rendition model with exact group-local malformed-color handling; reference-only
    rendering configuration and conflicting whole-command rejection are outside the complete Howl family.
  rectangle_policy_difference: &howl_rectangle_policy_difference >-
    Howl mutates its bounded cell, protection, origin, and damage model exactly; reference-only multicell repair,
    external attributes, graphics, and conflicting erase or destination policy are outside the complete Howl family.
  color_policy_difference: &howl_color_policy_difference >-
    Howl retains bounded host-neutral palette and terminal-color facts with fixed exact replies; reference-specific
    parser breadth, reply formatting, logging, opacity, and presentation policy are outside the complete Howl family.
  protection_policy_difference: &howl_protection_policy_difference >-
    Howl retains ISO and DEC protection provenance per cell so ordinary and selective erase remain unambiguous;
    reference models that collapse provenance are outside the complete Howl family.
  report_identity_difference: &howl_report_identity_difference >-
    Howl emits one stable bounded terminal identity; reference-specific product names, versions, emulation levels,
    delegated identity, and optional capability advertisements are outside the complete Howl family.
  report_policy_difference: &howl_report_policy_difference >-
    Howl reports only its bounded owned terminal state and curated capability set; reference-specific host gates,
    additional state domains, mode sets, reply formatting, and permissive query grammar are outside the complete
    Howl family.
  input_policy_difference: &howl_input_policy_difference >-
    Howl encodes typed terminal input through one bounded mode-aware owner; reference-specific host admission, raw
    keyboard delivery, stack depth, permissive flags, logging, and conflicting no-op behavior are outside the
    complete Howl family.
  mode_policy_difference: &howl_mode_policy_difference >-
    Howl keeps one exact bounded ANSI/DEC mode set with explicit bank/global lifetime and transition-only mutation;
    reference-specific emulation gates, duplicate dirty callbacks, defaults, timeout policy, and conflicting mode
    breadth are outside the complete Howl family.
  charset_policy_difference: &howl_charset_policy_difference >-
    Howl keeps one bounded ISO-2022 model with four designated slots, explicit GL/GR invocation, and only the
    A/B/0/U/V tables it implements exactly; conflicting accepted designations or decoded-scalar remapping are outside
    the complete Howl family.
  line_geometry_policy_difference: &howl_line_geometry_policy_difference >-
    Howl retains DEC geometry as bounded physical-row metadata with logical half-width columns, exact scroll and copy
    association, and reset on resize; reference cell expansion, cursor scaling, or conflicting resize association is
    outside the complete Howl family.
  erase_policy_difference: &howl_erase_policy_difference >-
    Howl erases its bounded cells, ISO/DEC protection provenance, logical row widths, history, and minimum changed
    row spans exactly; reference-only multicell repair, selection, external attributes, and permissive parameters are
    outside the complete Howl family.
  repeat_policy_difference: &howl_repeat_policy_difference >-
    Howl repeats one bounded retained glyph through its ordinary write path; conflicting row-clamp, last-codepoint,
    multicell, and external-attribute policies are outside the complete Howl family.
  alignment_policy_difference: &howl_alignment_policy_difference >-
    Howl fills retained DEC logical row widths while preserving cursor, margins, and row geometry; conflicting cursor,
    margin, full-physical-row, and geometry-reset policies are outside the complete Howl family.
  clear_buffer_policy_difference: &howl_clear_buffer_policy_difference >-
    Howl clears the active grid, projected history, cursor, viewport, and selection while preserving independent
    resize-stable logical output; reference-only prompt, image, mark, highlight, find, and saved-cursor policy is
    outside the complete Howl family.
  cursor_compatibility_policy_difference: &howl_cursor_compatibility_policy_difference >-
    Howl keeps one VT-level-independent bounded cursor, savepoint, presentation, and tab-stop model; conflicting
    emulation gates, row crossing, command ambiguity, permissive parsing, unbounded retention, and multiple-cursor
    policy are outside the complete Howl family.
  metadata_policy_difference: &howl_metadata_policy_difference >-
    Howl retains exact bounded host-neutral title, icon, directory, remote-host, shell identity, and hyperlink facts;
    reference-specific trust, sanitization, decoding, structured-session, pool-reclamation, and presentation policy is
    outside the complete Howl family.
  shell_mark_policy_difference: &howl_shell_mark_policy_difference >-
    Howl retains monotonic bounded A/B/C/D shell facts and positional exit status without choosing scrollback UI;
    reference-specific mark kinds, nesting, prompt, line-attribute, command-output, and session policy is outside the
    complete Howl family.
  compatibility_transport_difference: &howl_compatibility_transport_difference >-
    Howl retains exact bounded ordered transport occurrences without entering a product-specific recursive tmux or
    SSH execution mode; those product integration runtimes are outside the complete Howl family.
  compatibility_diagnostic_difference: &howl_compatibility_diagnostic_difference >-
    Howl keeps compatibility strings bounded and host-neutral without emitting product logs or unsupported-command
    diagnostics; reference-specific logging and diagnostic presentation are outside the complete Howl family.
  erase_display_excluded: &howl_erase_display_excluded {support: partial, disposition: excluded,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.eraseDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  erase_line_excluded: &howl_erase_line_excluded {support: partial, disposition: excluded,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.eraseLine,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  kitty_erase_display_graphics: &howl_kitty_erase_display_graphics {support: partial, disposition: deferred,
    owner: howl-vt, milestone: graphics, residual: Matching Kitty graphics-plane display erasure remains.,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.eraseDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  kitty_erase_line_graphics: &howl_kitty_erase_line_graphics {support: partial, disposition: deferred,
    owner: howl-vt, milestone: graphics, residual: Matching Kitty graphics-plane line erasure remains.,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.eraseLine,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  repeat_excluded: &howl_repeat_excluded {support: partial, disposition: excluded,
    rationale: *howl_repeat_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.repeatPreceding,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: REP retains bounded glyph state and exact lifetime"}}
  alignment_excluded: &howl_alignment_excluded {support: partial, disposition: excluded,
    rationale: *howl_alignment_policy_difference, source: howl-vt/src/terminal.zig, symbol: Screen.alignmentDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DECALN owns exact retained grid and mutation truth"}}
  clear_buffer_excluded: &howl_clear_buffer_excluded {support: partial, disposition: excluded,
    rationale: *howl_clear_buffer_policy_difference, source: howl-vt/src/terminal.zig, symbol: Terminal.clearBuffer,
    proof: {path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "iTerm ClearScrollback clears only active screen state with exact repetition"}}
  libvterm_charset_excluded: &howl_libvterm_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Howl additionally accepts the U and V tables that libvterm rejects.,
    source: howl-vt/src/terminal.zig, symbol: configureCharset, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: four charset slots share locking single-shift save and reset ownership"}}
  iterm_charset_excluded: &howl_iterm_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: iTerm2 maps 0 to line drawing and all other finals to normal; Howl accepts A/B/0/U/V and rejects others.,
    source: howl-vt/src/terminal.zig, symbol: configureCharset, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: four charset slots share locking single-shift save and reset ownership"}}
  kitty_charset_excluded: &howl_kitty_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Kitty remaps decoded C1 scalars and U+00FF while Howl maps only GL and U+00A0 through U+00FE.,
    source: howl-vt/src/terminal.zig, symbol: TerminalStream.mapCodepoint, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: Kitty CP437 and VAX42 share existing charset lifetime"}}
  kitty_encoding_excluded: &howl_kitty_encoding_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Kitty remains UTF-8 while Howl implements explicit UTF-8 and ISO-8859-1 transport selection.,
    source: howl-vt/src/parser.zig, symbol: selectLatin1, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ISO-8859-1 and UTF-8 selection own exact decoding lifetime"}}
  libvterm_line_geometry_excluded: &howl_libvterm_line_geometry_excluded {support: partial,
    disposition: excluded, rationale: *howl_line_geometry_policy_difference,
    residual: Howl clamps cursor to logical width and resets geometry on resize while libvterm retains cursor/line-info.,
    source: howl-vt/src/terminal.zig, symbol: Screen.applyLineGeometry, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC line geometry owns width movement scroll resize reset and visual observation"}}
  iterm_line_geometry_excluded: &howl_iterm_line_geometry_excluded {support: partial, disposition: excluded,
    rationale: *howl_line_geometry_policy_difference,
    residual: iTerm2 expands or compacts physical cells and scales the cursor while Howl retains logical row metadata.,
    source: howl-vt/src/terminal.zig, symbol: Screen.applyLineGeometry, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC line geometry owns width movement scroll resize reset and visual observation"}}
  ansi_first_parameter_excluded: &howl_ansi_first_parameter_excluded {support: partial, disposition: excluded,
    rationale: *howl_mode_policy_difference,
    residual: The pinned reference applies only the first parameter while Howl applies every supported ANSI mode.,
    source: howl-vt/src/terminal.zig, symbol: Terminal.setAnsiModes, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ANSI insert and newline modes retain exact global lifetime"}}
  ansi_mode_breadth_excluded: &howl_ansi_mode_breadth_excluded {support: partial, disposition: excluded,
    rationale: *howl_mode_policy_difference,
    residual: Howl implements its curated ANSI mode set rather than every mode recognized by the pinned reference.,
    source: howl-vt/src/terminal.zig, symbol: Terminal.setAnsiModes, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ANSI insert and newline modes retain exact global lifetime"}}
  dec_mode_dispatch_excluded: &howl_dec_mode_dispatch_excluded {support: partial, disposition: excluded,
    rationale: *howl_mode_policy_difference,
    residual: Howl implements its reviewed bounded DEC mode set rather than every mode recognized by the reference.,
    source: howl-vt/src/terminal.zig, symbol: Terminal.setDecMode, proof: {
      path: howl-vt/test/unit/terminal_modes_test.zig,
      symbol: "individual DEC mode saves retain every implemented mode without saturation"}}
  ignored_color_policy: &howl_ignored_color_policy {support: partial, disposition: excluded,
    rationale: *howl_color_policy_difference, source: howl-vt/src/terminal.zig, symbol: oscProcess, proof: {
      path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "Kitty ignored OSC selectors remain bounded exact no-ops"}}
  ignored_osc_active: &kitty_ignored_osc_howl {support: partial, disposition: excluded,
    rationale: *howl_compatibility_diagnostic_difference,
    source: howl-vt/src/terminal.zig, symbol: oscProcess, proof: {
      path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "Kitty ignored OSC selectors remain bounded exact no-ops"}}
  missing_deferred_graphics: &howl_missing_deferred_graphics {
    support: missing, disposition: deferred, owner: howl-vt, milestone: graphics}
  missing_excluded_iterm: &howl_missing_excluded_iterm {
    support: missing, disposition: excluded,
    rationale: This iTerm product integration is outside the complete Howl family.}

grammar:
  ESC: "\\x1b"
  CSI: "ESC [ | \\x9b"
  OSC: "ESC ] | \\x9d"
  DCS: "ESC P | \\x90"
  APC: "ESC _ | \\x9f"
  PM: "ESC ^ | \\x9e"
  SOS: "ESC X | \\x98"
  ST: "ESC \\\\ | \\x9c"
  BEL: "\\x07"
  Ps: scalar parameter
  Pm: semicolon-separated parameters
  Pp: colon-separated subparameters
  Pt: text
  Pb: arbitrary bytes
  F: final byte

