schema: 4

howl_schema:
  support: [full, partial, missing, unassessed]
  disposition: [none, active, delegated, deferred, excluded, adjudicated]
  owner: [howl-vt, howl-pty, howl-app]
  defaults: {full_disposition: none, incomplete_disposition: active, owner: howl-vt}
  meaning:
    support: implemented behavior relative to the pinned reference
    disposition: treatment of the remaining residual obligation
    owner: concrete Howl module responsible for that residual
    adjudication: pinned wire collision resolved by the accepted protocol policy; not a full compatibility claim

collision_policy:
  default: implement_full
  criteria: [protocol_origin, exact_effects, current_usage, implementation_preference, protocol_recency]
  implementation_preference: [kitty, xterm, iterm2, ghostty]
  unresolved: refer_to_captain
  meaning: >-
    Prove a same-byte incompatible effect before declaring full parity impossible.
    Determine true protocol origin, compare effects and current consumers, use Captain's terminal
    priority order when relevant, and then prefer the newer protocol. A resolved collision remains
    indexed and test-protected; it never silently changes unrelated terminal semantics.

classifications:
  lifecycle_difference: &howl_lifecycle_difference >-
    Howl keeps one coherent terminal reset, savepoint, and screen-bank lifecycle; exact parity with the pinned
    reference's additional or conflicting lifecycle policy is outside the complete Howl family.
  cursor_policy_difference: &howl_cursor_policy_difference >-
    Howl keeps one coherent cursor, origin, margin, and logical-row policy; exact parity with a pinned reference's
    conflicting directional or margin policy is outside the complete Howl family.
  structural_policy_difference: &howl_structural_policy_difference >-
    Howl edits its bounded cell, row-geometry, continuation, history, and damage model exactly; reference-only
    multicell, selection, callback, or external-attribute consequences are outside the complete Howl family.
  rendition_policy_difference: &howl_rendition_policy_difference >-
    Howl retains one bounded cell-rendition model with group-local malformed-color handling; reference-only
    rendering configuration and conflicting invalid-color tail rejection are outside the complete Howl family.
  rectangle_policy_difference: &howl_rectangle_policy_difference >-
    Howl mutates its bounded cell, protection, origin, and damage model exactly; reference-only multicell repair,
    external attributes, graphics, and conflicting erase or destination policy are outside the complete Howl family.
  color_policy_difference: &howl_color_policy_difference >-
    Howl retains bounded host-neutral palette and terminal-color state with fixed exact replies; reference-specific
    parser breadth, reply formatting, logging, opacity, and presentation policy are outside the complete Howl family.
  protection_policy_difference: &howl_protection_policy_difference >-
    Howl retains ISO and DEC protection provenance per cell so ordinary and selective erase remain unambiguous;
    reference models that collapse provenance are outside the complete Howl family.
  report_identity_difference: &howl_report_identity_difference >-
    Howl emits one stable bounded terminal identity; reference-specific product names, versions, emulation levels,
    delegated identity, and optional capability advertisements are outside the complete Howl family.
  report_policy_difference: &howl_report_policy_difference >-
    Howl reports only its bounded owned terminal state and curated capability set; reference-specific host gates,
    additional state domains, mode sets, reply formatting, and permissive query grammar are outside the complete
    Howl family.
  input_policy_difference: &howl_input_policy_difference >-
    Howl encodes typed terminal input through one bounded mode-aware owner; reference-specific host admission, raw
    keyboard delivery, stack depth, permissive flags, logging, and conflicting no-op behavior are outside the
    complete Howl family.
  mode_policy_difference: &howl_mode_policy_difference >-
    Howl keeps one exact bounded ANSI/DEC mode set with explicit bank/global lifetime and transition-only mutation;
    reference-specific emulation gates, duplicate dirty callbacks, defaults, timeout policy, and conflicting mode
    breadth are outside the complete Howl family.
  charset_policy_difference: &howl_charset_policy_difference >-
    Howl keeps one bounded ISO-2022 model with four designated slots, explicit GL/GR invocation, and only the
    A/B/0/U/V tables it implements exactly; conflicting accepted designations or decoded-scalar remapping are outside
    the complete Howl family.
  line_geometry_policy_difference: &howl_line_geometry_policy_difference >-
    Howl retains DEC geometry as bounded physical-row metadata with logical half-width columns, exact scroll and copy
    association, and reset on resize; reference cell expansion, cursor scaling, or conflicting resize association is
    outside the complete Howl family.
  erase_policy_difference: &howl_erase_policy_difference >-
    Howl erases its bounded cells, ISO/DEC protection provenance, logical row widths, history, and minimum changed
    row spans exactly; reference-only multicell repair, selection, external attributes, and permissive parameters are
    outside the complete Howl family.
  repeat_policy_difference: &howl_repeat_policy_difference >-
    Howl repeats one bounded retained glyph through its ordinary write path; conflicting row-clamp, last-codepoint,
    multicell, and external-attribute policies are outside the complete Howl family.
  alignment_policy_difference: &howl_alignment_policy_difference >-
    Howl fills retained DEC logical row widths while preserving cursor, margins, and row geometry; conflicting cursor,
    margin, full-physical-row, and geometry-reset policies are outside the complete Howl family.
  clear_buffer_policy_difference: &howl_clear_buffer_policy_difference >-
    Howl clears the active grid, retained history, and cursor while preserving independent
    resize-stable logical output; reference-only prompt, image, mark, highlight, find, and saved-cursor policy is
    outside the complete Howl family.
  cursor_compatibility_policy_difference: &howl_cursor_compatibility_policy_difference >-
    Howl keeps one VT-level-independent bounded cursor, savepoint, presentation, and tab-stop model; conflicting
    emulation gates, row crossing, command ambiguity, permissive parsing, unbounded retention, and multiple-cursor
    policy are outside the complete Howl family.
  libvterm_global_tabs_difference: &howl_libvterm_global_tabs_difference >-
    Pinned libvterm state.c owns one VTermState tabstops array shared by the main and alternate screen,
    while Howl owns independent tab-stop arrays in its two Screens, matching pinned Kitty. Cursor movement,
    tab set and clear remain implemented within a bank, but a change on one bank is not visible on the other.
    Replacing this with terminal-global storage would break the already verified Kitty bank-local contract.
  iterm2_global_tabs_difference: &howl_iterm2_global_tabs_difference >-
    Pinned iTerm2 VT100ScreenMutableState retains one tabStops set while currentGrid changes between primary
    and alternate. Howl's bank-local tab stops instead match Kitty. The iTerm2 input path additionally emits
    a TAB_FILLER representation on blank spans; iTerm2 can preserve custom/offscreen stops outside current
    geometry, so blanket parity is not established by matching simple cursor movement.
  metadata_policy_difference: &howl_metadata_policy_difference >-
    Howl retains exact bounded host-neutral title, icon, directory, remote-host, shell identity, and hyperlink state;
    reference-specific trust, sanitization, decoding, structured-session, pool-reclamation, and presentation policy is
    outside the complete Howl family.
  shell_mark_policy_difference: &howl_shell_mark_policy_difference >-
    Howl retains monotonic bounded A/B/C/D shell state and positional exit status without choosing scrollback UI;
    reference-specific mark kinds, nesting, prompt, line-attribute, command-output, and session policy is outside the
    complete Howl family.
  compatibility_transport_difference: &howl_compatibility_transport_difference >-
    Howl retains exact bounded ordered transport occurrences without entering a product-specific recursive tmux or
    SSH execution mode; those product integration runtimes are outside the complete Howl family.
  compatibility_diagnostic_difference: &howl_compatibility_diagnostic_difference >-
    Howl keeps compatibility strings bounded and host-neutral without emitting product logs or unsupported-command
    diagnostics; reference-specific logging and diagnostic presentation are outside the complete Howl family.
  erase_display_excluded: &howl_erase_display_excluded {support: partial, disposition: excluded,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  erase_line_excluded: &howl_erase_line_excluded {support: partial, disposition: excluded,
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseLine,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  kitty_erase_display_graphics: &howl_kitty_erase_display_graphics {support: partial, disposition: deferred,
    owner: howl-vt, milestone: graphics,
    residual: "Howl erases ordinary ED 0/1/2 cell spans and overlapping physical placements, but ED 3 clears only scrollback rather than pinned Kitty visible display plus history, and ED 22 is intentionally unsupported. Exact Kitty selection, protected-cell and image-resource lifetime remain incomplete; single-operand admission does not resolve these separate differences.",
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  kitty_selective_erase_display_graphics: &howl_kitty_selective_erase_display_graphics {
    support: partial, disposition: deferred, owner: howl-vt, milestone: graphics,
    residual: "Howl's CSI ? 0/1 J retains independent physical placements while unprotected Unicode-placeholder projections disappear; CSI ? 2 J clears physical placements. The direct app now silently invalidates selections after actual selected-row mutations, using VT row identities across history. Pinned Kitty private erasure instead clears protected text while retaining formatting and removes nonvirtual cell-image references on placeholder-bearing rows; it also clears intersecting selections on admitted erasures even if text is unchanged. These byte-identical protection/formatting and selection differences remain unresolved.",
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC selective ED clears placeholder projection without erasing unrelated physical images"}}
  kitty_erase_line_graphics: &howl_kitty_erase_line_graphics {support: partial, disposition: deferred,
    owner: howl-vt, milestone: graphics,
    residual: "Howl erases ordinary EL 0/1/2 cells and overlapping physical placements and now rejects excessive operands, but unlike pinned Kitty it preserves an exact no-op for admitted erasure of already blank cells rather than invalidating intersecting selections. Multicell and stored-image lifetime still require verification.",
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseLine,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: erase families retain exact ranges protection geometry and mutation"}}
  kitty_selective_erase_line_graphics: &howl_kitty_selective_erase_line_graphics {
    support: partial, disposition: deferred, owner: howl-vt, milestone: graphics,
    residual: "Howl's CSI ? K preserves DEC-protected cells, resets erased-cell attributes and retains independent physical placements; virtual placeholders follow changed cells. The direct app now silently invalidates selected rows on actual mutation but preserves unrelated selections. Pinned Kitty clears the same protected text while preserving its formatting, removes nonvirtual cell-image references on placeholder-bearing lines, and clears intersecting selection on admitted erasure even without a cell change. Without an explicit compatibility-mode decision the protected-cell/formatting behavior is irreconcilable.",
    rationale: *howl_erase_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.eraseLine,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC private erasure preserves guarded text and resets erased cell attributes"}}
  repeat_excluded: &howl_repeat_excluded {support: partial, disposition: excluded,
    rationale: *howl_repeat_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.repeatPreceding,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: REP retains bounded glyph state and exact lifetime"}}
  alignment_excluded: &howl_alignment_excluded {support: partial, disposition: excluded,
    rationale: *howl_alignment_policy_difference, source: howl-vt/src/screen.zig, symbol: Screen.alignmentDisplay,
    proof: {path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DECALN owns exact retained grid and mutation truth"}}
  clear_buffer_excluded: &howl_clear_buffer_excluded {support: partial, disposition: excluded,
    rationale: *howl_clear_buffer_policy_difference, source: howl-vt/src/terminal.zig, symbol: Terminal.clearBuffer,
    proof: {path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "iTerm ClearScrollback clears only active screen state with exact repetition"}}
  libvterm_charset_excluded: &howl_libvterm_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Howl additionally accepts the U and V tables that libvterm rejects.,
    source: howl-vt/src/charset.zig, symbol: State.configureCharset, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: four charset slots share locking single-shift save and reset ownership"}}
  iterm_charset_excluded: &howl_iterm_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: iTerm2 maps 0 to line drawing and all other finals to normal; Howl accepts A/B/0/U/V and rejects others.,
    source: howl-vt/src/charset.zig, symbol: State.configureCharset, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: four charset slots share locking single-shift save and reset ownership"}}
  kitty_charset_excluded: &howl_kitty_charset_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Kitty remaps decoded C1 scalars and U+00FF while Howl maps only GL and U+00A0 through U+00FE.,
    source: howl-vt/src/terminal.zig, symbol: TerminalStream.mapCodepoint, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: Kitty CP437 and VAX42 share existing charset lifetime"}}
  kitty_encoding_excluded: &howl_kitty_encoding_excluded {support: partial, disposition: excluded,
    rationale: *howl_charset_policy_difference,
    residual: Kitty remains UTF-8 while Howl implements explicit UTF-8 and ISO-8859-1 transport selection.,
    source: howl-vt/src/parser.zig, symbol: Parser.selectLatin1, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ISO-8859-1 and UTF-8 selection own exact decoding lifetime"}}
  libvterm_line_geometry_excluded: &howl_libvterm_line_geometry_excluded {support: partial,
    disposition: excluded, rationale: *howl_line_geometry_policy_difference,
    residual: Howl clamps cursor to logical width and resets geometry on resize while libvterm retains cursor/line-info.,
    source: howl-vt/src/screen.zig, symbol: Screen.applyLineGeometry, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC line geometry owns width movement scroll resize reset and visual observation"}}
  iterm_line_geometry_excluded: &howl_iterm_line_geometry_excluded {support: partial, disposition: excluded,
    rationale: *howl_line_geometry_policy_difference,
    residual: iTerm2 expands or compacts physical cells and scales the cursor while Howl retains logical row metadata.,
    source: howl-vt/src/screen.zig, symbol: Screen.applyLineGeometry, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: DEC line geometry owns width movement scroll resize reset and visual observation"}}
  libvterm_cursor_origin_excluded: &howl_libvterm_cursor_origin_excluded {support: partial,
    disposition: excluded, rationale: *howl_cursor_policy_difference,
    residual: "Pinned libvterm bounds cursor movements to the full visible screen when DECOM is off, while Howl deliberately follows the active scrolling margins in the movement direction even without DECOM. Under DECOM both clamp into the active origin region; source-specific full behavior remains partial.",
    source: howl-vt/src/screen.zig, symbol: Screen.moveCursor, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: libvterm origin-only motion bounds differ from Howl directional margins"}}
  ansi_first_parameter_excluded: &howl_ansi_first_parameter_excluded {support: partial, disposition: excluded,
    rationale: *howl_mode_policy_difference,
    residual: The pinned reference applies only the first parameter while Howl applies every supported ANSI mode.,
    source: howl-vt/src/terminal.zig, symbol: Terminal.setAnsiModes, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ANSI insert and newline modes retain exact global lifetime"}}
  ansi_mode_breadth_excluded: &howl_ansi_mode_breadth_excluded {support: partial, disposition: excluded,
    rationale: *howl_mode_policy_difference,
    residual: "Pinned iTerm2 handles ANSI modes 4 and 12, setting sendReceiveMode to the inverse of mode 12; Howl additionally handles modes 2 and 20 and retains mode 12 without inversion.",
    source: howl-vt/src/terminal.zig, symbol: Terminal.setAnsiModes, proof: {
      path: howl-vt/test/unit/terminal_end_to_end_test.zig,
      symbol: "terminal: ANSI insert and newline modes retain exact global lifetime"}}
  ignored_color_full: &howl_ignored_color_full {support: full,
    source: howl-vt/src/terminal.zig, symbol: oscProcess, proof: {
      path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "Kitty ignored OSC selectors remain bounded exact no-ops"}}
  ignored_osc_full: &kitty_ignored_osc_full {support: full,
    source: howl-vt/src/terminal.zig, symbol: oscProcess, proof: {
      path: howl-vt/test/unit/terminal_osc_test.zig,
      symbol: "Kitty ignored OSC selectors remain bounded exact no-ops"}}
  missing_deferred_graphics: &howl_missing_deferred_graphics {
    support: missing, disposition: deferred, owner: howl-vt, milestone: graphics}
  missing_excluded_iterm: &howl_missing_excluded_iterm {
    support: missing, disposition: excluded,
    rationale: This iTerm product integration is outside the complete Howl family.}

grammar:
  ESC: "\\x1b"
  CSI: "ESC [ | \\x9b"
  OSC: "ESC ] | \\x9d"
  DCS: "ESC P | \\x90"
  APC: "ESC _ | \\x9f"
  PM: "ESC ^ | \\x9e"
  SOS: "ESC X | \\x98"
  ST: "ESC \\\\ | \\x9c"
  BEL: "\\x07"
  Ps: scalar parameter
  Pm: semicolon-separated parameters
  Pp: colon-separated subparameters
  Pt: text
  Pb: arbitrary bytes
  F: final byte

references:
  libvterm:
    revision: 934bc2fbf21800ac3458a499df8820ca5fb45fd3
    root: src
    groups:
      on_control:
        source: state.c
        line: 477
        census: {semantic_branches: 15}
        recognition: implemented
        records:
          libvterm.c0.bel: {raw: BEL, effect: ring bell, relevance: core,
            conditions: "Frozen libvterm parser.c treats BEL as a string terminator for OSC/DCS/APC/PM/SOS
              without dispatching an on_control bell callback. Howl retains BEL as string payload
              inside DCS/APC/PM/SOS and terminates only OSC. Ground BEL is equivalent in both.",
            howl: {support: partial, disposition: excluded,
              rationale: "The pinned libvterm string-state parser terminates DCS/APC/PM/SOS on BEL
                where Howl's explicit string owner waits for ST; that same input has different
                following-text and payload boundaries. Both deliberately avoid a bell consequence
                for the embedded byte, and ordinary BEL remains a correctly ordered consequence.",
              residual: "DCS/APC/PM/SOS BEL terminator and following-text recovery differ from pinned
                libvterm; choosing that permissive framing globally would change the established
                string-control contract. Audible/visual bell effects remain host-owned.",
            source: howl-vt/src/terminal.zig, symbol: TerminalStream.applyExecute, proof: {
              path: howl-vt/test/unit/parser/string_control_test.zig,
              symbol: "parser string controls: BEL terminates only OSC"}}}
          libvterm.c0.bs: {raw: "\\x08", effect: cursor left, relevance: core,
            conditions: "Pinned libvterm BS never reverse-wraps and retains unchanged-position phantom; Howl can reverse through a soft-wrapped row and cancels explicit pending wrap before motion.",
            howl: {support: partial, disposition: excluded,
              rationale: "Pinned libvterm parser and/or phantom-cursor policy differs from Howl's bounded string and explicit wrap owner.",
              source: howl-vt/src/screen.zig, symbol: Screen.backspace, proof: {
                path: howl-vt/test/unit/terminal_end_to_end_test.zig,
                symbol: "terminal: libvterm ground C0 phantom and raw NEL retain Howl's distinct admission"}}}
          libvterm.c0.ht: {raw: "\\x09", effect: next tab stop, relevance: core,
            conditions: "libvterm HT uses the same tabstop array on both screen banks; Howl HT uses
              the active bank's independent set, so primary custom stops are absent on alt.",
            howl: {support: partial, disposition: excluded,
            rationale: *howl_libvterm_global_tabs_difference,
            residual: "HT cursor movement agrees in ordinary single-bank cases; shared primary/alternate
              stop ownership does not.",
            source: howl-vt/src/terminal.zig, symbol: TerminalStream.applyExecute, proof: {
              path: howl-vt/test/unit/terminal_end_to_end_test.zig,
              symbol: "terminal: bank-local stops differ from pinned libvterm and iTerm2 global stop owners"}}}
          libvterm.c0.lf: {raw: "\\x0a", effect: line feed, relevance: core,
            conditions: "Ordinary LF and LNM work; pinned libvterm executes LF inside OSC/DCS and may retain unchanged-position phantom, while Howl maintains string boundaries and cancels pending wrap.",
            howl: {support: partial, disposition: excluded,
              rationale: "Pinned libvterm parser and/or phantom-cursor policy differs from Howl's bounded string and explicit wrap owner.",
              source: howl-vt/src/terminal.zig, symbol: applySemantic, proof: {
                path: howl-vt/test/unit/terminal_end_to_end_test.zig,
                symbol: "terminal: pinned libvterm string C0 policy remains independent of Howl OSC grammar"}}}
          libvterm.c0.vt: {raw: "\\x0b", effect: line feed, relevance: compatibility,
            conditions: "Pinned libvterm treats VT as LF, including inside OSC/DCS and with unchanged-position phantom; Howl shares its LF implementation but does not execute C0 while assembling strings.",
            howl: {support: partial, disposition: excluded,
              rationale: "Pinned libvterm parser and/or phantom-cursor policy differs from Howl's bounded string and explicit wrap owner.",
              source: howl-vt/src/terminal.zig, symbol: applySemantic, proof: {
                path: howl-vt/test/unit/terminal_end_to_end_test.zig,
                symbol: "terminal: pinned libvterm string C0 policy remains independent of Howl OSC grammar"}}}
          libvterm.c0.ff: {raw: "\\x0c", effect: line feed, relevance: compatibility,
            conditions: "Pinned libvterm treats FF as LF even inside OSC/DCS and retains unchanged-position phantom; Howl correctly maps ground FF to LF but holds string controls atomically.",
            howl: {support: partial, disposition: excluded,
              rationale: "Pinned libvterm parser and/or phantom-cursor policy differs from Howl's bounded string and explicit wrap owner.",
              source: howl-vt/src/terminal.zig, symbol: applySemantic, proof: {
                path: howl-vt/test/unit/terminal_end_to_end_test.zig,
                symbol: "terminal: pinned libvterm string C0 policy remains independent of Howl OSC grammar"}}}
          libvterm.c0.cr: {raw: "\\x0d", effect: carriage return, relevance: core,
            conditions: "Pinned libvterm executes CR in OSC/DCS and does not clear phantom when column zero is unchanged; Howl holds string boundaries and clears explicit pending wrap on CR.",
            howl: {support: partial, disposition: excluded,
              rationale: "Pinned libvterm parser and/or phantom-cursor policy differs from Howl's bounded string and explicit wrap owner.",
              source: howl-vt/src/terminal.zig, symbol: TerminalStream.applyExecute, proof: {
                path: howl-vt/test/unit/terminal_end_to_end_test.zig,
                symbol: "terminal: libvterm ground C0 phantom and raw NEL retain Howl's distinct admission"}}}
          libvterm.c0.so: {raw: "\\x0e", effect: select G1 into GL, relevance: charset,
            conditions: "Frozen libvterm updates GL without consuming pending SS2/SS3, and executes SO
              even during OSC/DCS payload assembly. Howl now retains pending single shift correctly,
              but its string parser intentionally ignores embedded SO.",
            howl: {support: partial, disposition: excluded,
            rationale: "Pinned libvterm parser.c passes C0 SO through on_control during OSC/DCS,
              changing subsequent GL text. Howl's bounded OSC/DCS parser retains strict payload
              ownership and does not execute that embedded byte as a charset control.",
            residual: "Ordinary SO with pending SS2 now matches pinned libvterm; string-embedded SO
              still differs and changing shared OSC/DCS parsing needs cross-reference review.",
            source: howl-vt/src/terminal.zig, symbol: TerminalStream.applyExecute, proof: {
              path: howl-vt/test/unit/terminal_end_to_end_test.zig,
              symbol: "terminal: libvterm string-embedded SO and SI remain a distinct C0 parser policy"}}}
          libvterm.c0.si: {raw: "\\x0f", effect: select G0 into GL, relevance: charset,
            conditions: "Frozen libvterm preserves a pending single shift through SI, and executes SI
              while accumulating OSC/DCS strings; Howl now preserves the one-shot shift, but
              does not invoke charset changes inside the string payload.",
            howl: {support: partial, disposition: excluded,
            rationale: "Pinned libvterm's C0-on-control grammar executes SI inside OSC/DCS, while
              Howl deliberately ignores the byte within those strings. The same input therefore
              leaves different active GL designations for following terminal text.",
            residual: "Ordinary SI and pending SS2/SS3 precedence now agree; the cross-reference
              string-embedded C0 control policy remains incompatible without a parser decision.",
            source: howl-vt/src/terminal.zig, symbol: TerminalStream.applyExecute, proof: {
              path: howl-vt/test/unit/terminal_end_to_end_test.zig,
              symbol: "terminal: libvterm string-embedded SO and SI remain a distinct C0 parser policy"}}}
          libvterm.c1.ind: {raw: "\\x84", effect: index, relevance: compatibility,
            conditions: "Pinned libvterm parser.c admits raw C1 IND only when UTF-8 mode is disabled,
              while its ESC D alias is always accepted. Howl accepts raw C1 in either text decoding mode.
              The earlier LNM incorrectly changed IND's column, fixed in ebca049.",
            howl: {support: partial, disposition: excluded,
              rationale: "Howl deliberately accepts raw C1 control bytes under UTF-8 alongside 7-bit
                ESC aliases; pinned libvterm routes them to text decoding until UTF-8 is disabled.
                Changing that shared parser policy would affect other terminal protocol families.",
              residual: "IND now preserves column independently of ANSI LNM and shares the existing
                bounded history/scroll owner, but raw 8-bit C1 admission in default UTF-8 still differs
                from the pinned libvterm control parser.",
            source: howl-vt/src/terminal.zig, symbol: controlProcess, proof: {
