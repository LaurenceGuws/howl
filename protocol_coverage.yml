    scope: >-
      Source-verified new semantic branches between the frozen Kitty base and
      the explicitly pinned 22 November 2026 upstream revision, NOT a complete
      re-audit of the base's 249 records. Existing commands retain historical
      IDs under the frozen Kitty reference. Changed semantics of existing
      commands (notably OSC 21 response-list/unknown-field policy) are versioned
      findings linked to their original IDs, never duplicate command identities.
      The previous 17 October delta pin f7a16a93191a1103665905398d807ca79dab74a2
      remains available in Git and frozen worker reports.
    groups:
      dispatch_osc_program_status:
        source: vt-parser.c
        symbol: dispatch_osc
        line: 693
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          The new OSC 7501 case dispatches to program_status_report. This is
          the same wire family independently observed in pinned Ghostty, not
          two separate Howl feature requirements. This group does not claim
          the complete OSC dispatcher of current Kitty.
        records:
          kitty_delta.osc.program_status:
            raw: "OSC 7501 ; ? | state=... (BEL|ST)"
            effect: query, update or clear bounded program-status records
            relevance: host consequence
            conditions: >-
              Newer Kitty a79f376 implements OSC 7501 revision 0.4, with
              query, five status states, blocked kinds, updates, clear and
              process-exited lifetime via a per-window host-owned status index.
              Howl now parses and exposes precisely the overlapping Ghostty
              wire grammar through the same program_status.zig module and
              opt-in typed consequence FIFO, without a second Kitty parser.
              Split BEL/ST queries preserve reply framing; malformed id/text
              reports are wholly discarded; concurrent status pressure, raw
              status memory cleanup, reset-generation tags and continued valid
              traffic have exact native positive/negative proofs. The real
              SDL app now opts in at worker construction, drains the shared FIFO
              on its existing PTY worker, and maintains a single fixed 32-record
              per-pane index. Highest-urgency state and progress are copied
              into an independent compact toast below the tab bar without
              mutating titles or leaking raw text. The source-validated app
              name is copied into the bounded host summary when present,
              never inferred from the shell command or tab title. The same
              paint surface hosts transient notices and OSC 9;4 progress.
              Real PTY and staged private KWin tests show working 42 percent,
              blocked on authentication, done and user acknowledgment, with a
              source-exact child-side feature query reply. An independent
              C embedding now opts in through the same VT owner without
              acquiring SDL or a second Kitty parser. Exact-head copied
              records expose typed state/kind/progress/reset and in-payload
              offsets for ID/app/title/msg; the C ABI retains all previous
              v2 struct sizes and tag values, as proven by C/C++ and Zig
              tests in Debug and ReleaseFast.
            howl:
              support: partial
              disposition: deferred
              milestone: program_status
              owner: howl-vt
              rationale: "One Ghostty/Kitty shared bounded protocol owner feeds a real opt-in SDL host index and a nonintrusive top-right status toast. Statuses remain per pane, tab chips retain only names, and native C embedding remains independently opt-in."
              residual: "Modern Kitty retains up to 256 rich status records per window, up to 263-byte IDs and 4096-byte controls with combined presentation. Howl's SDL index is 32 per pane, the VT FIFO eight pending events, IDs <=128 bytes and bodies <=2043 bytes. Native C remains opt-in and host-owned; SDL now shows one small floating status toast with validated app name and progress but not rich decoded title/message or Kitty's full 256-record UX. This remains partial parity."
              source: howl-vt/src/program_status.zig
              symbol: parse
              proof:
                path: howl-vt/test/unit/terminal_osc_test.zig
                symbol: "OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer"
      indexed_graphics_formats:
        source: graphics.c
        symbol: initialize_load_data
        line: 908
        census: {semantic_branches: 2}
        recognition: implemented
        conditions: >-
          Only the new image format values 8 and 16 within existing Kitty
          transmit/query actions are in scope. This is not a second census
          of all nine graphics actions or twelve delete selectors.
        records:
          kitty_delta.graphics.format_indexed8:
            raw: "APC G a=t|T|q,f=8,Pm ; Pb ST"
            effect: transmit or query opaque palette-indexed image pixels
            relevance: graphics
            conditions: >-
              Each pixel carries one palette index; displayed pixels respond
              to palette changes. The reference's parser supports direct and
              zlib-compressed payloads but rejects this format in animation
              and composition paths.
            howl:
              support: missing
              disposition: deferred
              milestone: graphics
              owner: howl-vt
              rationale: "Palette-index ownership and generation-aware image projection, direct and compressed resource bounds and renderer invalidation must precede f=8 admission."
              residual: "Pinned newer Kitty f=8 stores one palette index per pixel and tracks live palette changes; Howl rejects f=8 before allocating/placing image data while accepting 24/32/100."
              source: howl-vt/src/graphics.zig
              symbol: Plane.transmit
              proof:
                path: howl-vt/test/unit/terminal_end_to_end_test.zig
                symbol: "terminal: newer Kitty indexed formats remain explicit rejected admissions"
          kitty_delta.graphics.format_indexed16:
            raw: "APC G a=t|T|q,f=16,Pm ; Pb ST"
            effect: transmit or query palette-indexed pixels with alpha
            relevance: graphics
            conditions: >-
              Each pixel has an index plus an alpha byte; the rendered colour
              follows palette changes while alpha remains per-pixel. The
              reference excludes indexed animation and composition.
            howl:
              support: missing
              disposition: deferred
              milestone: graphics
              owner: howl-vt
              rationale: "Per-pixel alpha with palette-coupled frame/placement resources and compression/rollback proofs are missing; admitting f=16 as RGBA would be incorrect."
              residual: "Pinned newer Kitty f=16 stores palette index plus alpha and tracks live palette updates; Howl rejects f=16 before admitting data."
              source: howl-vt/src/graphics.zig
              symbol: Plane.transmit
              proof:
                path: howl-vt/test/unit/terminal_end_to_end_test.zig
                symbol: "terminal: newer Kitty indexed formats remain explicit rejected admissions"
      conemu_cwd_report:
        source: vt-parser.c
        symbol: dispatch_osc
        line: 603
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          The new OSC 9;9 selector dispatches the remaining plain or quoted
          path to screen.c:process_cwd_notification, instead of the regular
          OSC 9 host notification. Only nonempty absolute paths are admitted
          as working directories; Kitty stores a kitty-shell-cwd:// URI.
          This is a new branch inside the existing OSC 9 command, not a second
          census of the complete OSC dispatcher.
        records:
          kitty_delta.osc.conemu_cwd:
            raw: "OSC 9 ; 9 ; [quoted]absolute-path (BEL|ST)"
            effect: update reported current directory from ConEmu's plain-path spelling
            relevance: host metadata
            conditions: >-
              Source Kitty a79f376 kitty/vt-parser.c:603-614 and
              kitty/screen.c:3974-3991 accept the 9;9 subcommand and optional
              enclosing quotes, ignore nonabsolute paths, and retain the
              resulting working directory as a kitty-shell-cwd URI. Howl now
              dispatches the same valid path into its existing canonical
              working-directory state without a spurious OSC 9 notification,
              and preserves ordinary OSC 9/9;4 consequences. Split input,
              BEL/ST, quoted/unquoted paths, invalid values, reset and bounds
              have native proofs. A real Kitty 0.51.0 private KWin horse applied
              the quoted form and reported the correct directory to a new
              --cwd=last_reported child, including after an invalid update.
            howl:
              support: partial
              disposition: deferred
              owner: howl-vt
              milestone: working_directory
              rationale: >-
                The wire-visible ConEmu path is now accepted through one
                canonical bounded CWD owner. Keep its neutral path type rather
                than pretending to own Kitty's synthetic host URI or allowing
                an unbounded callback payload.
              residual: >-
                Howl stores an absolute path (kind path) with a 1024-byte
                retained metadata ceiling, whereas Kitty projects a
                kitty-shell-cwd:// URI and can retain longer host-owned paths.
                Full reference-specific host serialization and length policy
                remain unqualified; basic ConEmu CWD reporting is implemented.
              source: howl-vt/src/terminal.zig
              symbol: oscProcess
              proof:
                path: howl-vt/test/unit/terminal_osc_test.zig
                symbol: "newer Kitty ConEmu OSC 9;9 reports bounded canonical paths without notification"
      kitty_dcs_color_scheme:
        source: vt-parser.c
        symbol: parse_kitty_dcs
        line: 753
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          The new kitty-color-scheme| DCS prefix is parsed within Kitty's
          existing caller-directed DCS host-dispatch family. It is not a
          general terminal colour change, and does not automatically approve
          user-session colour operations in other terminal hosts.
        records:
          kitty_delta.dcs.remote_color_scheme:
            raw: "DCS @kitty-color-scheme|base64-json ST"
            effect: set host session color-scheme variants after an existing color-stack push
            relevance: host consequence
            conditions: >-
              Source Kitty a79f376 kitty/vt-parser.c:753 and
              kitty/window.py:1951-1963 decode base64 JSON, require a pushed
              color-stack depth, retain session light/dark/no-preference
              variants and ask the Kitty host to reapply selected colors.
              Howl recognizes other Kitty DCS payloads but not this new
              host-owned selector.
            howl:
              support: missing
              disposition: deferred
              owner: howl-app
              milestone: host_consequence
              rationale: >-
                A typed, bounded and consent-aware host consequence plus
                actual color-stack/session ownership is required; treating
                an untrusted DCS as an automatic global theme change is unsafe.
              residual: >-
                Howl drops this DCS selector with no session theme variant
                state or host refresh action; ordinary Kitty DCS handlers still work.
              source: howl-vt/src/terminal.zig
              symbol: kittyDcsPayload
              proof:
                path: howl-vt/test/unit/terminal_modes_test.zig
                symbol: "newer Kitty color scheme DCS remains unclaimed host policy"
      graphics_feature_queries:
        source: graphics.c
        symbol: grman_handle_command
        line: 2854
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          New 0.50+ Kitty graphics action a=q with e=ACTION queries the
          support of the indicated action and non-default fields, without
          image data or effects on an in-progress upload. The e parser
          belongs to parse-graphics-command.h:50/150; the feature report is
          generated by graphics.c:supported_keys_for_query.
        records:
          kitty_delta.graphics.feature_query:
            raw: "APC G a=q,i=ID,e=ACTION[,keys] ST"
            effect: report supported graphics actions and keys without loading image data
            relevance: graphics
            conditions: >-
              Kitty a79f376 graphics.c:1047-1179 and 2846-2858 require a
              nonzero image id for a feature query, echo supported non-default
              key/value pairs plus e=ACTION, and do not transmit data or
              disturb chunked uploads. docs/graphics-protocol.rst:548-593
              specifies this feature introduced with Kitty 0.50.0. Howl now
              accepts a=q,i=ID,e=t|T|p|d|f|a|c and advertises only proven
              subsets. t/T: direct/zlib/RGB/RGBA/PNG and bounded dimensions,
              advisory N=1; T/p: placement identity, crop/cell offsets, output
              geometry, no cursor move, Unicode, signed z. d: actual deletion
              selectors with only the p/x/y/z fields each uses. New frame
              loading f advertises direct/zlib/RGB/RGBA input, bounded dimensions,
              N=1, source offsets, frame selection/base, gap z, X=1 overwrite
              and Y RGBA background. Animation a advertises its actual 1..3
              run states, loop count, bounded current/edited frame indices and
              signed gaps. Composition c advertises bounded frame numbers,
              source/destination rectangles, documented w/h size and C=1
              overwrite. The implementation also corrected the actual a=c
              engine to honor documented w/h before the accepted legacy s/v
              fallback, proven red-to-green using source-backed pixel tests.
              Unsupported PNG frame uploads, 999-frame indices and oversize
              composition geometry are deliberately omitted. Frame/animation/
              compose feature probes remain read-only, preserve chunked uploads,
              and share the exact bounded reply/quiet/rollback owner. Private
              managed KWin Kitty 0.51.0 vs staged ReleaseFast Howl compared
              ten matching raw PTY queries: seven replies byte-identical,
              with three source-grounded capability differences for PNG frame
              upload, frame-count ceiling and oversized compose geometry.
              Current Kitty invalid deletion-selector rejection and query-only
              parent P/Q/H/V omission stay enforced; q=1/2 remain silent.
            howl:
              support: partial
              disposition: deferred
              owner: howl-vt
              milestone: graphics
              rationale: >-
                Advertised keys are grounded in the existing Plane transmit,
                placement, deletion, frame, animation and composition owners,
                with action-dependent values rather than generic key echoing.
                The new source-backed composition w/h execution test corrected
                a real previous mismatch, retaining s/v as a compatibility
                fallback only. Replies borrow the existing canonical parser,
                bounded stack writer and atomic reply queue; no new retained
                image/animation state or host presentation policy was added.
              residual: >-
                Still partial: unlike current Kitty, Howl does not advertise
                PNG frame loads, extra animation frame indices past its fixed
                frame quota, geometry above native image bounds, external media,
                indexed f=8/16 or parent-relative P/Q/H/V placements. The
                earlier deliberate cursor-cell delete excess-field difference
                also remains. Action e=q, host graphics presentation policy and
                some additional field combinations remain unqualified. Scope
                is truthful bounded feature negotiation, not full Kitty parity.
              source: howl-vt/src/graphics.zig
              symbol: formatFeatureQuery
              proof:
                path: howl-vt/test/unit/terminal_end_to_end_test.zig
                symbol: "terminal: Kitty frame animation and composition feature queries are action typed"
      transient_usage_hint:
        source: parse-graphics-command.h
        symbol: parse_graphics_code
        line: 47
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          The new N key belongs to the graphics control parser and is an
          advisory storage-eviction hint, not an outer graphics action.
        records:
          kitty_delta.graphics.usage_hint_transient:
            raw: "APC G a=t|T|f,N=1,Pm ; Pb ST"
            effect: prefer transient image eviction when memory is pressured
            relevance: graphics
            conditions: >-
              This revision accepts the N usage_hints field; root/frame data
              may be marked transient and preferred for storage eviction.
              The published protocol allows terminals to ignore this hint.
              Frozen Kitty rejected the N key; Howl already accepts it as
              bounded advisory no-op metadata.
            howl:
              support: full
              owner: howl-vt
              source: howl-vt/src/graphics.zig
              symbol: parseCommand
              proof:
                path: howl-vt/src/graphics.zig
                symbol: "Kitty usage hints are bounded advisory no-op metadata"

selective_overlaps:
  - id: overlap.csi_s
    raw: "CSI Pm s"
    references: [libvterm.csi.decslrm, iterm2.csi.save_or_margins, kitty.csi.save_cursor]
    conflict: parameterless ANSI save cursor versus mode-dependent DECSLRM
  - id: overlap.csi_t
    raw: "CSI Ps [ + ] T"
    references: [libvterm.csi.sd, iterm2.csi.sd, kitty.csi.sd, kitty.csi.scrollback_fill]
    conflict: standard scroll-down versus Kitty scrollback-fill extension
  - id: overlap.osc5
    raw: "OSC 5 ; Pt (BEL|ST)"
    references: [kitty.osc_ignore.special_colors_5]
    conflict: Kitty ignores xterm special colors while Howl implements that palette family
  - id: overlap.osc50
    raw: "OSC 50 ; Pt (BEL|ST)"
    references: [iterm2.osc.kvp_50, kitty.osc_ignore.font]
    conflict: xterm font selection versus iTerm key-value command
  - id: overlap.osc52
    raw: "OSC 52 ; Pc ; Pd (BEL|ST)"
    references: [libvterm.osc.clipboard, iterm2.osc.clipboard, kitty.osc.clipboard]
    conflict: clipboard query/set policy and Kitty 5522 extension differ despite shared transport
  - id: overlap.dcs_ps_p
    raw: "DCS Ps p Pb ST"
    references: [iterm2.dcs.tmux_hook, iterm2.dcs.ssh_hook]
    conflict: iTerm assigns private tmux and SSH parsers to parameter values 1000 and 2000
  - id: overlap.synchronized_output
    raw: "CSI ? 2026 h|l | DCS = 1|2 s ST"
    references: [iterm2.dcs.sync_begin, iterm2.dcs.sync_end, kitty.dcs.sync]
    conflict: DEC private mode and DCS transports coexist
  - id: overlap.csi_u
    raw: "CSI [leader] Pm u"
    references: [iterm2.csi.restore_cursor, iterm2.csi.kitty_set, iterm2.csi.kitty_push, iterm2.csi.kitty_pop,
      iterm2.csi.kitty_query, kitty.csi.restore_cursor, kitty.csi.kitty_set, kitty.csi.kitty_push, kitty.csi.kitty_pop,
      kitty.csi.kitty_query]
    conflict: plain restore cursor shares a final byte with leader-qualified Kitty keyboard controls
