        records:
          windows_terminal.osc9.task_progress:
            raw: "OSC 9 ; 4 ; state [;percent] (BEL|ST)"
            effect: report taskbar progress to the host
            relevance: host consequence
            conditions: >-
              The reference accepts states 0 through 4, clamps percentages
