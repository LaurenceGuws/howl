        source: terminal/adapter/adaptDispatch.cpp
        symbol: AdaptDispatch::DeviceAttributes
        line: 1435
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          Only the optional ClipboardWrite extension in primary DA1 is in
