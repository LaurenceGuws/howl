            howl:
              support: partial
              disposition: excluded
              rationale: "Howl fixed DA1 is caller-neutral and cannot assert host clipboard write permission; the WT conditional capability report is intentionally not reproduced."
              residual: "Pinned WT conditionally adds 52 to DA1 when ClipboardWrite is enabled; Howl advertises fixed VT220-class ?62;22c regardless of app clipboard policy."
              source: howl-vt/src/fixed_report.zig
