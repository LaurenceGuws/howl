      osc52_clipboard:
        source: terminal/parser/OutputStateMachineEngine.cpp
        symbol: OutputStateMachineEngine::ActionOscDispatch
        line: 821
        census: {semantic_branches: 2}
        recognition: implemented
        conditions: >-
