      osc9_progress:
        source: terminal/adapter/adaptDispatch.cpp
        symbol: AdaptDispatch::DoConEmuAction
        line: 3558
        census: {semantic_branches: 1}
        recognition: implemented
        conditions: >-
          Only OSC 9;4 taskbar progress is in scope. OSC 9;9 working-directory
