selective_overlaps:
  - id: overlap.csi_s
    raw: "CSI Pm s"
    references: [libvterm.csi.decslrm, iterm2.csi.save_or_margins, kitty.csi.save_cursor]
    conflict: parameterless ANSI save cursor versus mode-dependent DECSLRM
  - id: overlap.csi_t
    raw: "CSI Ps [ + ] T"
    references: [libvterm.csi.sd, iterm2.csi.sd, kitty.csi.sd, kitty.csi.scrollback_fill]
    conflict: standard scroll-down versus Kitty scrollback-fill extension
  - id: overlap.osc5
    raw: "OSC 5 ; Pt (BEL|ST)"
    references: [kitty.osc_ignore.special_colors_5]
    conflict: Kitty ignores xterm special colors while Howl implements that palette family
  - id: overlap.osc50
    raw: "OSC 50 ; Pt (BEL|ST)"
    references: [iterm2.osc.kvp_50, kitty.osc_ignore.font]
    conflict: xterm font selection versus iTerm key-value command
  - id: overlap.osc52
    raw: "OSC 52 ; Pc ; Pd (BEL|ST)"
    references: [libvterm.osc.clipboard, iterm2.osc.clipboard, kitty.osc.clipboard]
    conflict: clipboard query/set policy and Kitty 5522 extension differ despite shared transport
  - id: overlap.dcs_ps_p
    raw: "DCS Ps p Pb ST"
    references: [iterm2.dcs.tmux_hook, iterm2.dcs.ssh_hook]
    conflict: iTerm assigns private tmux and SSH parsers to parameter values 1000 and 2000
  - id: overlap.synchronized_output
    raw: "CSI ? 2026 h|l | DCS = 1|2 s ST"
    references: [iterm2.dcs.sync_begin, iterm2.dcs.sync_end, kitty.dcs.sync]
    conflict: DEC private mode and DCS transports coexist
  - id: overlap.csi_u
    raw: "CSI [leader] Pm u"
    references: [iterm2.csi.restore_cursor, iterm2.csi.kitty_set, iterm2.csi.kitty_push, iterm2.csi.kitty_pop,
      iterm2.csi.kitty_query, kitty.csi.restore_cursor, kitty.csi.kitty_set, kitty.csi.kitty_push, kitty.csi.kitty_pop,
      kitty.csi.kitty_query]
    conflict: plain restore cursor shares a final byte with leader-qualified Kitty keyboard controls
