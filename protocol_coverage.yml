  ghostty:
    revision: 5813c9461d5af78b6307a1254d00b1bc190eaccd
    root: src
    kind: scoped
    scope: >-
      Two reviewed OSC 7501 query/report outcomes only, not a census of
      every Ghostty OSC parser branch or optional host effect.
    groups:
      osc7501_status:
        source: terminal/stream_terminal.zig
        symbol: Handler.programStatus
        line: 984
        census: {semantic_branches: 2}
        recognition: implemented
        conditions: >-
          Scoped only to OSC 7501 query and status report. The parser admits
          valid commands, while a separately installed program_status effect
          decides whether a query is answered and whether reports are delivered.
        records:
          ghostty.osc7501.status_query:
            raw: "OSC 7501 ; ? (BEL|ST)"
            effect: report supported status states and kinds when a host callback exists
            relevance: host consequence
            conditions: >-
              Without a registered program_status effect, Ghostty deliberately
              emits no reply. With an effect it returns a fixed list of five
              states and three blocked interaction kinds in the original BEL/ST
              framing, without leaking status contents. Howl now recognizes only
              exact OSC 7501 and requires an explicit embedding host consumer
              before sending the capability reply. Howl's real SDL terminal
              worker now registers its 32-record bounded per-pane status index
              before admitting PTY input, preserving the underlying standalone
              VT default-silent policy. Named native tests prove split queries,
              exact BEL/ST, 64KiB atomic queue failure/retry, and actual app
              worker status delivery. One independent staged ReleaseFast Howl
              in private Fleet-managed KWin returned the source-identical
              capability bytes to its real child-side raw PTY query, then
              visibly showed working, blocked, done and acknowledgment states.
              The standalone native C artifact now has an additive v2
              hvt_set_program_status_consumer(0|1) entrypoint. Its default
              stays silent; an explicit C host opt-in returns the exact source
              capability reply without a GUI or status database. Real C and
              Zig native Debug/ReleaseFast tests prove the opt-in boundary.
            howl:
              support: partial
              disposition: deferred
              milestone: program_status
              owner: howl-vt
              rationale: "The shared VT grammar and typed FIFO remain host-neutral. Howl SDL explicitly opts in and now displays a single compact top-right toast for the focused pane, preserving tab titles and native C opt-in behavior."
              residual: "Standalone VT without an opted-in Zig or C consumer remains silent, matching Ghostty's optional host policy. The native C ABI can now opt in and receive typed status, but per-host record storage/UI remain caller-owned. The shared 2043-byte report limit is below the full 4096-byte source protocol and full external reset-clear behavior remains unqualified."
              source: howl-vt/src/terminal.zig
              symbol: oscProcess
              proof:
                path: howl-vt/test/unit/terminal_osc_test.zig
                symbol: "OSC 7501 opt-in status reports are typed FIFO and queries advertise only with a consumer"
          ghostty.osc7501.status_report:
            raw: "OSC 7501 ; state=...[:id=...][:msg=...] (BEL|ST)"
            effect: parse bounded program status and deliver it to an optional host effect
            relevance: host consequence
            source: terminal/osc/parsers/program_status.zig
            symbol: parse
            line: 309
            conditions: >-
              Pinned Ghostty validates one bounded id, states and optional
              kind, progress and base64 UTF-8 text before delivering an event
              to an explicitly installed host effect. Invalid id or encoded
              text discards the whole report; invalid optional names/values
              cannot overwrite a valid prior field. Howl now shares an
              allocation-free pure parser with newer Kitty, using the stricter
              Ghostty id cap of 128 bytes and a current 2043-byte body cap.
              A checked, owned eight-entry status FIFO retains exact per-event
              identities and reset-generation tags only when opted in, with
              lazy allocation, stale-head rejection, pressure and OOM cleanup
              proofs. Query, update, subtree clear, process-exited and malformed
              input have named real VT Debug and ReleaseFast tests. The SDL
              host now owns one fixed 32-ID index per terminal worker with
              urgent-state ordering, equal-priority change recency, unchanged
              report eviction recency, exact hierarchical clear, process-exit
              or shell prompt transient retirement, done/error user acknowledgment
              and reset-generation rejection of prior-life queued reports.
              Only bounded copied state, kind, percentage, count and the
              source-validated <=32-byte app name cross the worker snapshot;
              no raw encoded title/message or mutable VT pointer enters SDL.
              The old tab-chip status formatter was deleted. Instead, Howl
              now draws one compact right-aligned toast below the tab bar
              (or near the top edge if hidden), shared with transient notices
              and native OSC 9;4 progress. A real PTY child in private KWin
              produced a visibly animated "⣾ 32% - zig", then blocked-auth,
              done, user acknowledgment, and unnamed OSC 9;4 fallback.
              The overlay never consumes terminal rows or changes tab names.
              The additive native C v2 request kind 13 now carries explicit
              state/action/kind/progress, reset generation and validated
              offsets for ID, app name and encoded title/message in the
              same exact-head copied OSC payload. The native request union
              remains 32 bytes, the descriptor 56 bytes and earlier enum
              values are unchanged. Real C tests prove default silence,
              opt-in query, typed payload copy, shortage/stale identity
              rejection, clear/exit/reset lifetimes and disable behavior.
            howl:
              support: partial
              disposition: deferred
              milestone: program_status
              owner: howl-vt
              rationale: "One canonical VT grammar and opt-in typed event transport feed the app worker's bounded 32-record index. The graphical host now uses a single compact top-right toast shared with notices and OSC 9;4, not a tab-chip indicator or raw protocol UI ownership."
              residual: "The SDL host index holds 32 compact status/priority facts but not source-current rich title/msg content or a full status pane. The stable native C v2 request projection and explicit opt-in are now qualified, but a C embedder must maintain its own status/index/presentation and decode copied base64 titles/messages. Full 4096-byte source reports and Ghostty's external synthetic hard-reset clear callback remain unimplemented; reset generations allow caller-driven clearing."
              source: howl-vt/src/program_status.zig
              symbol: parse
              proof:
                path: howl-vt/test/unit/terminal_osc_test.zig
                symbol: "OSC 7501 bounded status FIFO preserves exact head under pressure"
