schema: 1
version: 0.1.7-dev

objective: >-
  Keep independent terminal semantics, process transport, local Instance, Text and
  Render packages. Server and remote client product ownership is now in howl-sessions;
  this snapshot proves the retained direct-local core without that product dependency.

accepted:
  vt: bounded caller-neutral terminal semantics, history, graphics, replies, input encoding, consequences, Unicode 17 occupancy, and grapheme ownership
  pty: caller-polled platform process-terminal ownership with Linux PTY and Windows ConPTY child-process lifecycle
  instance: opaque owner of one platform process-terminal transport and one VT with bounded ordered I/O, explicit resize, signals, child observation, and deterministic headless consequence handling
  text: tracked bounded native font metrics, fallback, shaping, source-cluster identity, glyph lookup, and natural alpha rasterization

invariants:
  - one local Instance has one authoritative PTY and VT
  - observers cannot mutate VT directly and cannot pace Instance progress
  - attaching an observer never changes canonical geometry
  - text shaping and rasterization expose no renderer, window, Instance, Session, Server, or client authority
  - renderer and platform code are not core dependencies
  - VT owns terminal animation state and Instance owns its monotonic wake schedule; clients/renderers own no parallel terminal animation clock
  - canonical graphics identity/resource generations cross an Instance interaction boundary; renderer/backend residency does not
  - projected history plus the visible screen are the complete future-reflow cell authority; evicted rows never return
  - exact bounds, errors, rollback, cleanup, and ownership remain explicit

active:
  - keep the basic native cursor path independently qualified: content reuse, clipped glyph recoloring, complete immutable publications and visible-pane pixel composition, with CPU and memory tradeoffs measured separately
  - qualify the smallest direct Zig SDL howl-app without Server, endpoint, transport or attachment/detach machinery
  - pressure the shortest native path through howl-host: one in-process Instance, direct canonical VT observation, text/render and Vulkan/Wayland with no transported client or Server route
  - keep the old Flutter native/Dart/iOS tree as explicitly inactive engineering evidence, outside check/test/release contracts

deferred:
  - reduce bounded ASCII/BG span bookkeeping overhead on styled VT writes and scrolling; compare VT-only cost and complete VT-to-frame cost while preserving plain-ASCII throughput, exact invalidation and observer independence
  - renderer backend selection and presentation polish

gates:
  - root checks/tests forward all retained Zig roots and the external core consumer contract, and pass
  - VT simulation, fuzz, and protocol validation pass
  - zig-audit ruleset-3 source audit, Howl project audit, formatting, and git diff checks pass
