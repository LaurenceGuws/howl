version:
  current: 0.1.3-dev
  status: supervised capability reset

objective: >-
  Retain only independently useful terminal capabilities with settled ownership; delete rejected package and runtime
  boundaries before rebuilding an executable path.

settled_capabilities:
  - name: vt
    acceptance: owns terminal semantics, state, dirty facts, input encoding, replies, and consequences
  - name: pty
    acceptance: owns exact Linux PTY transport and child-process lifecycle
  - name: control
    acceptance: optional ID-addressable PTY and VT composition with bounded operations and no rendering relation
  - name: render
    acceptance: backend-neutral terminal visual knowledge and plain values without runtime policy
  - name: executable
    acceptance: owns runtime and presentation resources without a settled noun, topology, or API

accepted_implementation:
  - VT protocol behavior and deterministic evidence remain the terminal-semantics baseline.
  - PTY Linux transport, transfer, process-lifecycle, cancellation, and cleanup behavior remain the transport baseline.
  - >-
    Render independently selects native text and generated terminal glyphs; either or both may be absent, and only
    native text selection links libc, FreeType, and HarfBuzz.

invariants:
  - every module allocation uses an explicit caller-provided allocator
  - bounds, errors, rollback, cleanup, and ownership are exact at each capability boundary
  - control contains no rendering relation
  - render contains no thread, publication lifecycle, GPU device, window, layout, or presentation policy
  - executable ownership does not settle its package noun, thread topology, backend, or public API
  - private development carries no downstream source or ABI compatibility obligation

reconstruction:
  status: active
  work:
    - classify and retain only earned terminal visual values and behavior
    - classify control identity, endpoint, codec, request, composition, and lifecycle evidence
    - remove rendering publication and dependencies from control
    - inventory executable evidence before approving its noun, topology, API, or source
    - remove stale workspace wiring after surviving child dependencies are settled
  excluded_until_approved:
    - compatibility aliases or adapters for deleted boundaries
    - render-owned runtime publication or synchronization
    - control-owned rendering values or publication
    - a concrete executable topology, GPU backend, or render API

gates:
  - permanent authorities and active planning YAML parse
  - every accepted allocation boundary exposes its caller-provided allocator
  - selected render capability graphs prove native and generated dependency exclusion
  - retained VT, PTY, control, and render behavior has exact focused proof
  - source audit and protocol catalogue validation pass for accepted source
  - rejected source is deleted or remains explicitly quarantined rather than certified
