version:
  current: 0.1.3-dev
  status: reconstructed dependency foundation and persistent Vulkan surface/chrome host review

objective: >-
  Preserve independently useful PTY, VT, and Render packages while establishing
  one direct first-party Wayland/Vulkan lifetime foundation.

settled_capabilities:
  - name: vt
    acceptance: caller-neutral terminal emulation, replies, input encoding, and ordered semantic consequences
  - name: pty
    acceptance: caller-polled Linux PTY and child-process lifecycle
  - name: render
    acceptance: reusable text plus backend-neutral terminal, image, and chrome projection
  - name: executable
    acceptance: >-
      compositor-configured generation-tagged three-slot DMA-BUF rings, per-slot
      DRM release timelines, directional Window/Render eventfds, compositor-paced
      commits, Renderer-owned tab/pane chrome facts, and reverse cleanup

accepted_implementation:
  - The tracked Zig pin drives every workspace and child command.
  - Window alone dispatches Wayland and presents completed copied slot facts.
  - Render alone mutates Vulkan and observes per-slot DRM release timelines.
  - Main constructs shared roots, joins both owners, and retires shared lifetime last.
  - Render progress is independent of Wayland frame callbacks.
  - The host selects Vulkan by the compositor DMA-BUF device identity and queries the exact format/modifier tuple.
  - The maintained Vulkan ABI derives from Vulkan-Headers v1.4.357.
  - Generated Wayland ABIs derive from Wayland-protocols 1.49 using wayland-scanner 1.25.0.
  - Every accepted family and Host manifest uses version 0.1.3-dev.

invariants:
  - bounds, errors, rollback, cleanup, and ownership are exact at each capability boundary
  - Render owns no runtime threads, Wayland objects, or presentation policy; Host Renderer owns its Vulkan objects
  - Window never acknowledges Render completion or gates GPU mutation
  - every exported descriptor has one owner and every ownership transfer is explicit
  - source audit and protocol catalogue validation pass without diagnostics

deferred:
  - PTY, VT, and terminal composition inside the host
  - keyboard, pointer, clipboard, terminal consequences, sessions, and multiplexing
  - performance work and production-sized surfaces

gates:
  - permanent authorities parse
  - root and child all-mode checks and tests pass
  - bounded Debug and ReleaseSafe live rings reach persistent generation-tagged commits; owner proofs cover retirement
  - source audit, protocol validation, formatting, and diff checks pass
