objective: consolidate the family, pay down VT source debt, and establish reusable native terminal ownership

capabilities:
  - name: single_repository_family
    acceptance: one version, package URL, dependency graph, build command surface, and atomic history

  - name: public_module_graph
    acceptance: the root package exports curated howl_vt, howl_text, howl_pty, and howl_control modules

  - name: development_orchestration
    acceptance: root-only checks, tests, simulations, fuzzing, benchmarks, dogfood, and hosts use build/dev.zig

  - name: direct_vt_source
    acceptance: terminal behavior and proof survive while production characters, hops, and public surface decrease

  - name: qagent_embedding
    acceptance: QAgent builds and dogfoods against the local curated Howl terminal owner

  - name: reusable_native_pty
    acceptance: >-
      one curated Linux module owns PTY creation, copied launch values, child process groups, exact partial transfers,
      resize, concurrent cancellation, native errors, and cleanup

  - name: reusable_terminal_control
    acceptance: >-
      one curated native owner composes PTY, VT, live input, replies, resize, semantic surfaces, wakes, and cleanup

  - name: local_terminal_control
    acceptance: >-
      Howl owns canonical terminal identity, optional same-user endpoint, shared mutation admission, bounded hostile-input-checked
      server and one-shot client for status, screen, logical output, input batches, resize, and process-group signal

  - name: focused_source_audit
    acceptance: one direct root-owned audit enforces settled patterns and exact reviewed uses

limitations:
  - name: source_layout
    description: final VT file boundaries follow the completed direct-source review

  - name: compatibility
    description: private development modules carry no downstream source or ABI promise

gates:
  - active YAML parses
  - root and module build graphs use Zig 0.16
  - all accepted VT tests, simulations, fuzzing, and benchmarks pass in four optimization modes
  - control, text, host, and QAgent embedding checks pass
  - source audit and git diff checks pass
