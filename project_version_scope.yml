schema: 1
version: 0.1.6-dev

objective: >-
  Establish one observer-independent canonical PTY/VT session and remove the
  renderer-shaped publication machinery that had entered VT and the product gate.

accepted:
  vt: bounded caller-neutral terminal semantics, history, graphics, replies, input encoding, consequences, Unicode 17 occupancy, and grapheme ownership
  pty: caller-polled Linux PTY and child-process lifecycle
  session: opaque owner of one PTY and one VT with bounded ordered I/O, explicit resize, signals, child observation, and deterministic headless consequence handling

invariants:
  - one node-local session has one authoritative PTY and VT
  - observers cannot mutate VT directly and cannot pace session progress
  - attaching an observer never changes canonical geometry
  - renderer and platform code are not core dependencies
  - exact bounds, errors, rollback, cleanup, and ownership remain explicit

active:
  - define the minimal Unix-socket session endpoint from Linux, Android, and headless embedder pressure
  - preserve SSH as remote transport rather than inventing Howl networking or authentication
  - design semantic attach/rebase without reintroducing a per-observer journal into VT

deferred:
  - graphical Linux client
  - Android client and app-private Unix userland
  - howl-text core package
  - iOS SSH client
  - renderer backend selection and presentation polish

gates:
  - root core checks and tests pass
  - VT simulation, fuzz, and protocol validation pass
  - source audit, formatting, and git diff checks pass
