version:
  current: 0.1.5-dev
  prior:
    version: 0.1.4-dev
    status: frozen
    release_branch: release/0.1.4-dev
    release_base: 7db8e1ab2bc7bb7b526d67a359744008360a317c
    capability: >-
      Session-domain ownership migration, bounded Host topology retry,
      physical cursor replay and trail presentation, synchronized-output
      correctness, startup cursor configuration retention, and explicit input
      rejection/pressure ownership.
    deferred_capability:
      - ordered keyboard protocol expansion and repeat policy
      - mouse and terminal mouse protocol routing
      - terminal identity and child-environment negotiation
      - input hot-path measurement and optimization

objective: >-
  Pay down accepted structural debt without adding terminal features:
  preserve independently useful PTY, VT, Render, Vulkan, Wayland, and Host
  behavior while removing redundant ownership, obsolete interfaces, silent
  error disposal, stale source-audit admissions, and dishonest authority.

settled_capabilities:
  - name: vt
    acceptance: caller-neutral terminal emulation, replies, input encoding, ordered semantic consequences, Unicode 17 occupancy, and bounded grapheme ownership
  - name: pty
    acceptance: caller-polled Linux PTY and child-process lifecycle
  - name: render
    acceptance: reusable text plus backend-neutral terminal, generated-glyph, cursor-free, image, and Chrome composition
  - name: executable
    acceptance: compositor-configured generation-tagged DMA-BUF rings, explicit synchronization, multi-pane terminal runtime, and Kitty-led physical cursor presentation

accepted_implementation:
  - The tracked Zig pin drives every workspace and child command.
  - Window alone dispatches Wayland and presents completed copied slot facts.
  - Renderer alone mutates Vulkan and observes per-slot DRM release timelines.
  - Terminal runtime exclusively owns every live PTY, VT, projection baseline, and terminal publication.
  - Cursor presentation is independent of terminal text publication and accepted frame replacement.
  - Every maintained package and Host manifest uses version 0.1.5-dev.

historical_manifests:
  - howl-vt/examples/0.1.4-dev/build.zig.zon remains a versioned example fixture and is not a maintained package manifest.

invariants:
  - Bounds, errors, rollback, cleanup, and ownership are exact at each capability boundary.
  - Render owns no runtime threads, Wayland objects, PTYs, or presentation policy.
  - Window never owns session, terminal, or Vulkan mutation.
  - Session-domain transitions acquire no Wayland or Vulkan dependency.
  - Every exported descriptor has one owner and every ownership transfer is explicit.
  - Source audit and protocol catalogue validation pass without diagnostics.

active:
  - Complete clean-range acceptance and closure of the 0.1.5-dev debt-payoff marathon.
  - Preserve cohesive files and current product behavior through the version-freeze gate.

deferred:
  - Ordered keyboard protocol expansion and repeat policy.
  - Mouse, pointer protocol, and terminal mouse routing expansion.
  - Terminal identity and child-environment negotiation.
  - Input hot-path measurement and optimization.
  - Detached, remote, or cooperative multiplexer sessions.
  - Public Host compatibility guarantees and packaging.
  - Configuration hot reload and scripting.
  - New experimental terminal protocols.
  - General terminal rendering hot-path optimization.
  - Maximum sixteen-pane Composer/Vulkan/atlas admission.

gates:
  - Tracked authorities parse without duplicate keys.
  - Root and affected child checks/tests pass in every required optimization mode.
  - Source audit, protocol validation, formatting, and git diff checks pass.
  - Each debt slice preserves existing product behavior and has bounded evidence.

schema: 1
