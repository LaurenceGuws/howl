marathon:
  name: source_shape
  status: active

objective: >-
  Make every substantial production owner readable and auditable before tracing or performance growth by exposing its
  top-to-bottom lifecycle, consolidating scattered capability paths, and deleting organization debt that earns no
  behavior.

references:
  directness: /home/home/personal/projects/dev_references/terminals/foot
  defensiveness: /home/home/personal/projects/dev_references/zig_maturity/tigerbeetle

rules:
  - Large coherent files are allowed; line count alone never forces a split.
  - Section comments name real ownership boundaries and never disguise unrelated code.
  - Reordering preserves behavior and keeps helpers near their owner or sole caller.
  - Tests are grouped by the behavior they prove; green tests do not legitimize accidental capability.
  - Scattered implementations are consolidated or recorded as concrete watch-list debt before feature work resumes.
  - Every cleanup checkpoint passes the complete existing verification surface.

categories:
  - id: owner_index
    status: accepted
    goal: >-
      Audit substantial production files, record their actual internal owners and lifecycle, and identify concrete
      scattered or duplicated capability paths before mechanical organization begins.
    gate: >-
      Every proposed section corresponds to current behavior, every structural offender names exact symbols or ranges,
      and no architecture is invented merely to make an outline symmetrical.
    result: >-
      Indexed the maintained VT, control, frame, render, window, and workspace owners from their live symbols and
      lifecycle. Removed ten unreachable private declarations that Zig lazy analysis did not instantiate. A fresh
      repository-wide symbol census found no remaining private declaration whose name occurs only at its definition in
      the indexed owners; no systemic offender remains concrete enough to justify a watch list at this checkpoint.

  - id: vt_shape
    status: queued
    goal: >-
      Make terminal and parser state-machine flow navigable while preserving one direct VT owner and exact protocol
      behavior.

  - id: control_frame_shape
    status: queued
    goal: >-
      Make PTY, control, publication, frame, and client ownership explicit without adding transport abstractions.

  - id: host_render_shape
    status: queued
    goal: >-
      Make workspace, window, renderer, text, cache, and presentation lifecycles navigable without creating a UI
      framework.

owner_index:
  - site: howl-vt/src/parser.zig:Parser
    owns: byte-state transition, bounded OSC/DCS/passthrough capture, UTF-8 decoding, and borrowed parser events
    lifecycle: init -> next/reset -> deinit
  - site: howl-vt/src/terminal.zig:Screen
    owns: cells, history/reflow, cursor, tabs, margins, rendition, selection, dirty spans, and logical viewport state
    lifecycle: init -> semantic mutation/resize -> publication acknowledgement -> deinit
  - site: howl-vt/src/terminal.zig:HostState
    owns: bounded host-neutral state facts and ordered consequence queues, generations, acknowledgement, and replies
    lifecycle: init -> retain/query/acknowledge/reset -> deinit
  - site: howl-vt/src/terminal.zig:Set
    owns: primary/alternate screen selection and geometry-coherent two-bank resize
    lifecycle: init -> bank switch/resize -> deinit
  - site: howl-vt/src/terminal.zig:Terminal
    owns: Parser, Set, HostState, stream capture, semantic dispatch, pending output, input encoding, and copied views
    lifecycle: init -> feed/input/resize/query/publication -> deinit
  - site: howl-pty/src/howl_pty.zig:Owned
    owns: one Linux PTY master/slave, child process group, wake descriptor, bounded transfer, signals, wait, and cleanup
    lifecycle: init -> start -> read/transfer/resize/control with concurrent cancel -> stop/deinit after callers return
  - site: howl-control/src/howl_control.zig:Terminal
    owns: one PTY child, one VT, admitted mutations, frame publication, wake generations, remote peer, and reader thread
    lifecycle: init/start -> admitted send/resize/signal/read -> cancel/join/unlink -> deinit
  - site: howl-control/src/client.zig:Client
    owns: one-shot bounded endpoint connections, private wire encoding/decoding, deadlines, and response allocations
    lifecycle: init -> one request/response operation at a time -> deinit
  - site: howl-frame/src/howl_frame.zig:Publisher
    owns: two immutable complete-frame slots, cumulative damage, generation validation, borrow/release, and resize storage
    lifecycle: init -> prepareResize/commitResize or publish -> borrow/release -> deinit
  - site: howl-text/src/howl_text.zig:FontSet
    owns: FreeType/HarfBuzz font faces, fallback selection, shaping runs, raster masks, metrics, and generated glyph rasterization
    lifecycle: init -> shape/rasterize caller-owned results -> deinit
  - site: howl-render/src/howl_render.zig:Renderer
    owns: one howl-text owner and bounded shared CPU glyph-mask cache used to prepare immutable borrowed frames
    lifecycle: init -> prepare panes/cache admissions -> deinit
  - site: howl-window/src/workspace.zig:Workspace
    owns: bounded tab/pane topology, stable pane identities, focus, split extents, names, and cell layout
    lifecycle: init -> transactional tab/pane/focus/resize mutations -> deinit
  - site: howl-window/src/renderer.zig:Render
    owns: render thread, bounded mailbox, EGL/GLES device, texture cache, pane backing, frame release, and completion wake
    lifecycle: start -> submit/coalesce -> thread draw/swap/release -> completed -> deinit
  - site: howl-window/src/window.zig:Loop
    owns: Wayland/xkb input, Workspace, pane terminals/wakes, labels/viewport policy, layout admission, and shutdown order
    lifecycle: init -> poll/dispatch/admit/reconcile -> stop renderer and terminals -> destroy platform state

completion:
  - every substantial production file has a deliberate top-to-bottom reading order
  - every retained section marker names a real coherent owner boundary
  - concrete scattered capability debt is resolved or explicitly blocked in the temporary watch list
  - all root checks, tests, simulation, fuzzing, benchmark, source audit, and protocol validation pass
