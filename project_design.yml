project:
  name: howl
  mission: an exceptionally small, correct, embeddable native Zig terminal family
  shape: one repository with curated modules and native development hosts

components:
  - name: vt
    role: host-neutral terminal parsing, state, input encoding, and consequences

  - name: text
    role: explicit font loading, shaping, and alpha-mask rasterization

  - name: pty
    role: Linux PTY creation, child process-group lifecycle, bounded transfer outcomes, resize, cancellation, and cleanup

  - name: control
    role: bounded PTY and terminal composition with native identity, local endpoint facts, and one-shot control client

  - name: frame
    role: bounded immutable terminal-local visual publications and renderer acknowledgement

  - name: host
    role: native Wayland window loop, layout, shared text/GLES rendering, and presentation policy

relationships:
  - vt owns terminal truth and accepts host facts through native Zig values
  - text owns terminal text preparation without owning terminal state or presentation
  - pty owns copied launch values and exact Linux process, descriptor, cancellation, and bounded I/O mechanics
  - control composes pty and vt and owns the bounded local byte-stream protocol used by native embedders
  - frame copies complete VT visual truth and cumulative cell damage without owning layout, text, platform, or GPU policy
  - host composes control, frame, and text while owning window, layout, GPU, and presentation lifecycles
  - qagent is the first real embedder and supplies integration pressure without Howl policy
  - >-
    protocol evidence is family-owned at the root; implemented support, residual disposition, and concrete code
    ownership remain independent facts

package:
  root_build: public module and artifact graph
  development_build: root-only workspace operations composed through build/dev.zig
  modules:
    - howl_vt
    - howl_text
    - howl_pty
    - howl_control
    - howl_frame
