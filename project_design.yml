project:
  name: howl
  mission: an exceptionally small, correct, embeddable native Zig terminal family
  shape: atomic monorepo of independently useful capabilities with a development-only root curator

capabilities:
  vt:
    role: terminal parsing, semantics, state, dirty facts, input encoding, replies, and terminal consequences
  pty:
    role: Linux PTY transport and child-process lifecycle
  control:
    role: optional ID-addressable composition of PTY and VT with bounded operations and interfaces
  render:
    role: backend-neutral terminal visual knowledge and plain rendering values without runtime policy
  executable:
    role: threads, publication storage, GPU resources, windowing, layout, sessions, tabs, panes, and presentation
    status: noun, topology, and API unsettled

ownership:
  allocation: every module allocation uses an explicit caller-provided allocator
  composition:
    - embedders may use VT and PTY independently
    - control has no rendering relation
    - render owns no threads, publication lifecycle, GPU device, window, layout, or presentation policy
    - executable ownership does not prescribe one topology or the only valid route through the family

workspace:
  purpose: Git, agent, and development ergonomics plus atomic history
  children: each surviving capability owns its package identity, direct dependencies, native facts, and proofs
  root: exports no product module or artifact
  evidence: protocol evidence is family-owned at the root
  embedder: QAgent is the first real embedder and supplies integration pressure without owning Howl policy

reconstruction:
  status: active supervised deletion intervention
  quarantined:
    - mixed render source that combines visual facts with runtime publication
    - control source and build wiring that depend on rendering publication
    - unselected render preparation source awaiting symbol-level classification
    - executable source whose surviving noun, topology, and API have not been accepted
    - workspace wiring that names deleted packages or rejected runtime machinery
