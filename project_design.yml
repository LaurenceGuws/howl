project:
  name: howl
  mission: small, correct native terminal machinery that can be embedded directly or composed into higher-level orchestration
  shape: one repository of small native modules with explicit local dependencies and semantic ownership

core:
  howl-vt:
    role: terminal parsing, semantic state, history, images, input encoding, replies, and protocol consequences
  howl-instance:
    role: optional batteries-included composition of one platform process-terminal owner (Linux PTY or Windows ConPTY), one canonical howl-vt terminal, ordered I/O lifetime, geometry, signals, and headless environment policy
    invariant: Instance is one concrete terminal occurrence, not a Session, Server, listener, daemon, or product identity; observers never own, pace, or block canonical progress
  howl-pty:
    role: platform process-terminal ownership covering Linux PTY or Windows ConPTY, child process/control lifetime, descriptors or handles, resize, signals, and cleanup
  howl-text:
    role: tracked native font metrics, fallback, shaping, source-cluster identity, glyph lookup, bounded natural alpha rasterization, and generated terminal-cell glyphs

composition:
  - howl-app is Local-only: one direct in-process Instance per pane, with no Server/Session, endpoint, transport or attachment/detach subsystem
  - howl-vt may be embedded directly without PTY, Instance, Session, or Server machinery
  - a local shell or terminal host may compose howl-pty plus howl-vt through howl-instance without knowing that Session or Server concepts exist
  - optional orchestration has the noun/process tree Server -> Sessions -> Instances
  - an Instance is not a Session; Session identity/lifetime belongs to orchestration above the terminal family
  - clients may interact with one Instance headlessly or graphically; client presentation does not become runtime ownership
  - every Instance owns exactly one canonical terminal geometry; Server and Session own no rows, columns, cell-pixel lattice, pane, split, or surface layout
  - a client may compose multiple Instances on one surface and derive each Instance geometry from that presentation layout; the composition remains client-owned
  - the maintained Flutter canary may own lightweight app navigation and explicit persisted Server endpoints; on Linux/Windows its Local route may also own one in-process Instance through howl-client's listener-free desktop owner, while Android/iOS remain client-only
  - Session is orchestration identity/labeling for an Instance lineage and lifecycle, not terminal state or presentation composition

experimental:
  - server-client
  - client-transport
  - server
  - howl-client
  - howl-cli
  - howl-render
  - howl-host
  - howl-vk
  - howl-wayland
  - howl-flutter
  - howl-web
  - howl-odin
  - howl-app

ownership:
  - terminal semantics belong to howl-vt and remain usable without any orchestration layer
  - one howl-instance owns exactly one authoritative platform process-terminal transport and VT when an embedder chooses the batteries-included local composition
  - Instance exposes no Session or Server identity and publishes no listener or executable
  - attached clients observe semantic state and submit serialized input or explicit control mutations; an in-process owner uses the same VT semantics without serializing its own state
  - a direct VT embedder owns process or byte-transport lifetime, scheduling, and monotonic service time outside howl-vt
  - attaching a client never changes canonical terminal geometry
  - slow, hidden, disconnected, or absent clients never throttle the PTY or VT
  - renderer and platform policy stay outside VT, PTY, and Instance
  - VT owns one semantic cursor and a canonical content identity which remains stable for cursor-only movement and output bracketing; missed observations cannot erase a content mutation
  - howl-app keeps content and cursor work separate: Render retains content commands plus cursor geometry, Instance publishes complete immutable frames with reusable slot prefixes, and Canvas retains visible-pane content pixels beneath the cursor overlay
  - cursor glyph lookup indexes clipped painted ink by physical row, including overhang; slot reuse requires the same content revision, presentation generation and command buffer, while growth or aborted preparation invalidates reuse
  - Canvas content targets are backend acceleration only, released for hidden panes and rebuilt after geometry, presentation or target-reset changes; canonical progress never depends on their lifetime
  - VT owns retained image/frame/animation semantics; Instance supplies monotonic service/wake scheduling when used, while a direct VT embedder supplies its own clock
  - Server/Session orchestration, when present, depends downward on Instances and must never become a prerequisite for local terminal composition

workspace:
  local_root_gate: all maintained Zig package check/test graphs, including nested Web roots and the external consumer proof
  distribution_root: forwards child-owned modules and artifacts without reconstructing their type identities
  toolchain: exact tracked Zig pin with self-hosted code generation and linking
  root: development curator only; exports no product module
