project:
  name: howl
  mission: small, correct native terminal sessions shared by humans and agents
  shape: one repository of small Zig modules with explicit local dependencies and semantic ownership

core:
  howl-vt:
    role: terminal parsing, semantic state, history, images, input encoding, replies, and protocol consequences
  howl-session:
    role: one canonical PTY, VT, ordered I/O lifetime, geometry, signals, and headless environment policy
    invariant: observers never own, pace, or block canonical session progress
  howl-pty:
    role: Linux PTY, child process group, descriptors, resize, signals, and cleanup
  howl-text:
    role: tracked native font metrics, fallback, shaping, source-cluster identity, glyph lookup, and bounded natural alpha rasterization

planned:
  clients: native Howl CLI plus maintained Flutter/native and WebAssembly/browser visual canaries that deliberately pressure the same canonical session through different transport/platform paths; iOS and web remain client-only with no PTY/userland ownership

experimental:
  - howl-client
  - howl-cli
  - howl-render
  - howl-vk
  - howl-wayland
  - howl-flutter
  - howl-web

ownership:
  - a session lives on the node, not in a client
  - one session owns exactly one authoritative PTY and VT
  - clients observe semantic state and submit serialized input or explicit control mutations
  - attaching a client never changes canonical terminal geometry
  - slow, hidden, disconnected, or absent clients never throttle the PTY or VT
  - renderer and platform policy stay outside VT and session
  - VT owns retained image/frame/animation semantics; Session owns monotonic service/wake scheduling; clients and renderers do not run terminal animation clocks
  - canonical graphics/resource identity crosses the Session boundary, while Canvas/backend residency stays presentation-local

workspace:
  local_root_gate: [howl-vt, howl-session, howl-pty, howl-text]
  toolchain: exact tracked Zig pin with self-hosted code generation and linking
  root: development curator only; exports no product module
