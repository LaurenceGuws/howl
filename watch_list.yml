intervention: terminal_seam_hygiene
scope:
  - howl-vt/src/terminal.zig
  - howl-headless/src/howl_headless.zig
  - howl-pty/src/howl_pty.zig
policy: Preserve behavior; delete or tighten debt without adding capability, generic seams, or file splits.

baseline:
  revision: f2e6929
  working_tree: clean_before_index
  validation:
    command: zig build check -Doptimize=<Debug|ReleaseSafe|ReleaseFast|ReleaseSmall>
    result: all_passed
  ignored_state:
    result: exact
    paths:
      - .zig-cache/
      - howl-headless/.zig-cache/
      - howl-host/zig-out/
      - howl-vt/zig-out/
    unexpected_sockets_or_nested_vendor_trees: 0

offenders:
  - id: howl-wake-clear-race
    status: resolved_pending_review
    severity: high
    class: weak_bound_error_cleanup_invariant
    sites:
      - file: howl-headless/src/howl_headless.zig
        symbols: [Terminal.notify, Terminal.consumeWake]
      - file: ../qagent/qtui/src/qtui.zig
        symbol: App.handle
    evidence: >-
      notify coalesces with a boolean exchange, while the consumer clears that boolean later with an
      unconditional store. A mutation between the exchange and store observes pending=true, emits no
      callback, and is then erased by the store; the event loop may sleep with dirty terminal state.
    correction: >-
      Give wake acknowledgement a race-free generation or recheck handshake owned by headless; keep
      QAgent and qtui as consumers, not alternate wake authorities.
    proof:
      - deterministically pause a consumer between observing and clearing a wake
      - mutate concurrently and prove a second wake or an observed newer generation

  - id: howl-resize-rollback-panics-on-external-failure
    status: resolved_pending_review
    severity: high
    class: weak_bound_error_cleanup_invariant
    sites:
      - file: howl-headless/src/howl_headless.zig
        symbol: Terminal.resize
    evidence: >-
      PTY resize succeeds before model resize. If model allocation then fails and the compensating PTY
      ioctl also fails, the owner panics even though both failures are external and the terminal can be
      placed into an exact failed/canceled state.
    correction: >-
      Preserve the model allocation error when rollback succeeds; otherwise stop terminal progress and
      return one exact split-geometry/rollback failure without continuing under contradictory dimensions.
    proof:
      - model resize allocation rollback leaves old geometry coherent
      - the private rollback-failure transition stops progress without process panic
      - Terminal.resize routes the compensating PTY failure directly into that transition

  - id: vt-history-allocation-loss-is-invisible
    status: resolved_pending_review
    severity: medium
    class: weak_bound_error_cleanup_invariant
    sites:
      - file: howl-vt/src/terminal.zig
        symbol: Screen.storeHistoryRow
    evidence: >-
      clone, capacity, and projected-history allocation failures all return from a void function. The
      viewport continues, but a history row disappears without a retained loss fact or FeedSummary fact;
      only a comment describes the loss.
    correction: >-
      Keep rendering live under pressure, but publish one bounded monotonic history-loss fact or another
      existing owner-visible fact. Do not turn recoverable scrollback loss into terminal death.
    proof:
      - each allocation site preserves paired history invariants
      - the caller can distinguish retained history from a dropped row

  - id: headless-reply-prefix-is-discarded
    status: resolved_pending_review
    severity: medium
    class: weak_bound_error_cleanup_invariant
    sites:
      - file: howl-headless/src/howl_headless.zig
        symbol: Terminal.consume
    evidence: >-
      howl-pty returns an exact incomplete terminal-reply transfer with transferred byte count and reason.
      consume maps only the reason into ReaderError and discards the accepted prefix, leaving status unable
      to distinguish zero-byte rejection from a partial reply already observed by the child.
    correction: >-
      Retain the smallest reader-failure evidence carrying transferred count only for reply-transfer
      failures; do not add a reply queue or retry policy.
    proof:
      - zero-prefix and strict-prefix reply failures remain distinguishable through headless status

implementation_order:
  - slice: race_and_lifecycle
    status: resolved_pending_review
    offenders: [howl-wake-clear-race, howl-resize-rollback-panics-on-external-failure]
    review_boundary: Cross-thread progress and externally fallible resize are exact without changing APIs broadly.
  - slice: bounded_loss_evidence
    status: resolved_pending_review
    offenders: [vt-history-allocation-loss-is-invisible, headless-reply-prefix-is-discarded]
    review_boundary: Existing bounded evidence surfaces report retained loss without stopping normal terminal progress.
