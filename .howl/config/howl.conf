# Repository-local development cursor configuration.
cursor.shape beam
cursor.color #73f990
cursor.unfocused_shape hollow
cursor.beam_thickness_points 1.5
cursor.underline_thickness_points 2.0
cursor.blink_interval system
cursor.stop_blinking_after_seconds 15.0
cursor.trail_delay_ms 1
cursor.trail_decay_seconds 0.1 0.4
cursor.trail_start_threshold_cells 0
cursor.trail_color cursor
