checkpoint:
  id: interactive_chrome
  status: review_ready
  objective: >-
    Turn the existing typed Wayland key and pointer facts into visible,
    transactional tab and pane actions on the Renderer thread, preserving the
    operator-selected chrome traversal behavior while keeping Wayland free of product
    policy and Render free of mutable application state.
  authorities:
    - dc6c00f^:howl-window/src/window.zig for historical action behavior and physical release capture
    - /home/home/personal/projects/dev_references/terminals/zellij
    - /home/home/personal/projects/dev_references/terminals/foot
    - /home/home/personal/projects/dev_references/zig_maturity/tigerbeetle
  positive_scope:
    - keep howl-wayland responsible only for typed keysyms, semantic modifier facts, physical key identity, keyboard-reset facts, and ordered pointer facts
    - publish one caller-neutral keyboard-reset occurrence when the keymap is replaced so the Host capture owner can clear stale physical keys
    - keep action matching, physical-key capture, topology mutation, and redraw policy in howl-host
    - execute each matched chord once on physical press and consume its captured release
    - clear captured keys on keyboard leave and keymap replacement
    - ignore repeated events for captured host chords; never repeat topology mutations
    - preserve the operator-selected default mappings:
        - Ctrl+Shift+T creates and activates a tab
        - Ctrl+Shift+Enter splits the focused pane horizontally
        - Ctrl+Shift+Backslash or Ctrl+Shift+Bar splits it vertically
        - Ctrl+Shift+W closes the focused pane
        - Ctrl+Shift+Q closes the active tab
        - Ctrl+Alt+Left/Right/Up/Down resizes the focused divider in that direction
        - Ctrl+Shift+Comma/Less and Ctrl+Shift+Period/Greater reorder the active tab left or right
        - Ctrl+Shift+Left/Right traverses the tab bar backward or forward
        - Ctrl+Shift+Up/Down remains unmatched for a later session rail
        - Shift+Alt+Left/Right/Up/Down focuses the nearest pane in that direction
        - bare Alt+Left/Right/Up/Down remains unmatched for caller defaults
    - accept Caps Lock and Num Lock alongside bindings while rejecting extra Shift, Control, Alt, Super, Hyper, or Meta where not specified
    - route primary pointer presses through Render hit testing so tab hits switch tabs and pane hits focus them; focusing a floating pane raises it
    - mutate a candidate topology first and retain the previous topology on capacity, geometry, identity, or action failure
    - after a successful action, rebuild chrome from the newest topology, redraw an available released slot, and publish a new completion without waiting for a Wayland frame callback
    - keep Window limited to protocol input publication and compositor-paced presentation of completed GPU revisions
    - preserve current ring replacement, same-generation slot reuse, release observation, and reverse retirement
  exclusions:
    - configuration parsing or reload
    - PTY, VT, terminal simulation, terminal input encoding, replies, or consequences
    - viewport and scrollback key mappings
    - selection gestures, clipboard, scrollbar dragging, floating-pane dragging, or pointer resize gestures
    - synthetic widgets, command buses, RPC, generic event systems, or compatibility aliases
    - Vulkan, Wayland, threads, presentation, or mutable application state inside howl-render
  transactions:
    - a recognized press is captured before mutation; capture saturation fails without topology mutation
    - failed topology actions preserve all tab, pane, focus, order, geometry, label, and identity bytes
    - stable identities are never reused and failed actions consume no identity
    - redraw publication occurs only after topology mutation and chrome projection both succeed
    - input draining preserves arrival order and never holds the shared Boundary lock while applying policy or mutating Vulkan
    - a captured release is consumed even if modifier state changed after the press
    - unmatched keys remain available for the later terminal owner without compatibility routing
  deterministic_proofs:
    - every accepted keysym and exact modifier combination maps to the intended action
    - lock modifiers are ignored and every extra non-lock modifier rejects the binding
    - press/repeated/release, duplicate press, keyboard leave, keymap replacement, and sixteen-key capture saturation
    - create, split both axes, close pane/tab, directional tab traversal/reorder, directional focus, and divider resize mutate exact retained facts
    - first/last directional tab traversal and reorder boundaries are deterministic
    - failed capacity, geometry, identity, capture, projection, and redraw admission preserve retained topology and output
    - tab and pane pointer hits, floating topmost hit, focus, raise, outside-surface, and non-primary-button behavior
    - hidden-tab state remains retained and newest chrome appears immediately after switching back
    - successful actions produce increasing GPU completion revisions without coupling Render progress to Window pacing
  regression_gates:
    - Wayland, Render, Host, and root checks/tests in all four optimize modes
    - source audit, protocol validation, YAML, formatting, and diff checks
    - operator manually exercises every accepted chord and primary pointer focus through visible chrome when the worker requests the gate
    - Debug and ReleaseSafe live rings preserve same-generation reuse, resize, and orderly retirement
  review_boundary:
    - leave implementation uncommitted
    - report exact mapping table, capture semantics, action failures, file/public-symbol delta, and remaining pointer/terminal gaps
    - request the operator's visual interaction gate only after deterministic owner proofs pass
    - provide one stable manual command and a concise exact interaction checklist for that gate
  evidence:
    manual_gate_correction:
      failure: second keyboard focus entry rejected a valid receive-side wl_array with alloc zero and nonzero size
      authority: Wayland 1.25 connection.c sets received array size, alloc zero, and data to the demarshalled payload
      correction: bounded unaligned byte copying validates size and key count without treating alloc as input capacity
      interaction_corrections:
        - keymap-derived real modifier masks suppress only aliased virtual Meta and Hyper facts while retaining genuinely distinct masks
        - focused pane frames retain all four overlay edges while unfocused tiled borders keep single-owner shared edges
        - compositor minimum-size protocol facts prevent impossible zero-area tiled surfaces
        - superseded resize construction aborts after the current slot instead of building a stale complete ring
        - configure geometry derives from a stable current-layout basis refreshed only by topology mutations, preventing cumulative rounding drift
        - boundary focus and already-focused pointer actions produce no candidate and therefore no GPU completion revision
        - a temporary bounded per-pane probe distinguished unmatched input, captured releases, actions, pointer focus, and GPU completion revisions, then was deleted after the operator gate
      focused_receipt:
        - Wayland, Render, and Host Debug check/test pass
        - source audit and diff check pass
      operator_receipt:
        - every observable key and pointer mapping passed
        - unmatched per-pane input, captured repeats and releases, action capture counts, pointer focus, no-op revisions, and changed GPU revisions passed through the temporary probe
        - focus leave and re-entry passed
        - focused two-by-two pane frames retained all four edges
        - continuous resize passed through generation 970 and revision 2892 without cumulative pane drift
        - compositor close retired the Vulkan surface cleanly
        - captured release after modifier change remains deterministic-only until a terminal consumer exists
    binding_contract:
      source: operator-corrected interactive_chrome visual contract
      facts:
        - HostAction is a finite closed enum
        - exact non-lock modifier matching chooses actions
        - Caps Lock and Num Lock do not suppress actions
        - one fixed 16-key capture retains physical keycodes
        - matched presses act once and captured releases never reach the terminal path
    current_boundaries:
      - howl-wayland input owns bounded ordered physical facts and coalesced snapshots without host policy
      - Window resolves keysyms and UTF-8 using its xkb state, then copies facts into Boundary
      - Renderer exclusively owns Topology and Vulkan mutation
      - howl-render chrome remains immutable-input, bounded-output, and backend-neutral

