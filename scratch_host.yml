checkpoint:
  id: render_chrome_ownership
  status: in_progress
  objective: >-
    Reconcile howl-host chrome_state/chrome_draw with howl-render so tabs,
    tiled and floating panes, labels, borders, scrollbars, and caller-owned
    selection are backend-neutral enduring contracts before input actions are
    connected.
  authorities:
    - /home/home/personal/projects/dev_references/terminals/zellij
    - /home/home/personal/projects/dev_references/terminals/foot
    - /home/home/personal/projects/dev_references/zig_maturity/tigerbeetle
  positive_scope:
    - index current howl-render chrome and Host chrome consumers before changing source
    - retain stable tab and pane identities, complete tiled coverage, focus, labels, borders, and scrollbars
    - earn bounded floating pane geometry, ordering, clipping, and hit testing from Zellij-familiar behavior
    - keep selection range and appearance caller-owned
    - make Host consume the backend-neutral contract without moving topology or action policy into howl-render
    - add one independent editor-like text/chrome reuse proof without a widget or application framework
    - preserve current Vulkan pixels, atlas behavior, ring generations, and presentation ownership
  exclusions:
    - keyboard or pointer action mapping
    - configuration parsing or reload
    - PTY, VT, terminal simulation, terminal input encoding, or consequences
    - Vulkan, Wayland, threads, presentation, or mutable application state inside howl-render
    - generic widgets, events, commands, backends, render graphs, or compatibility aliases
  transactions:
    - candidate geometry and output are fully validated before retained state or caller buffers change
    - stable identities are never reused and failed mutations consume no identity
    - clipping and alias failures leave output bytes unchanged
    - hidden tabs remain retained without forcing hidden geometry into visible composition
    - Host migration follows independent Render proofs and preserves the live surface at every step
  deterministic_proofs:
    - tiled and floating geometry, overlap order, focus, clipping, and hit testing
    - tab bar, labels, borders, scrollbars, selection, empty state, and hostile dimensions
    - primitive/text capacity and every relevant input/output alias class
    - independent non-terminal text/chrome consumer using only curated Render exports
    - no Vulkan, Wayland, thread, terminal mutation, or generic-widget dependency
  regression_gates:
    - Render, Host, and root checks/tests in all four optimize modes
    - source audit, protocol validation, YAML, formatting, and diff checks
    - Debug and ReleaseSafe live rings preserve pixels, reuse, resize, and orderly retirement
  review_boundary:
    - leave implementation uncommitted
    - report exact public-symbol, file, line, byte, and dependency-graph delta
    - report every Host-local chrome noun deleted, retained, or still awaiting interactive input
    - provide one stable manual command only after deterministic proofs pass
  evidence:
    zellij:
      paths:
        - /home/home/personal/projects/dev_references/terminals/zellij/zellij-server/src/tab/mod.rs
        - /home/home/personal/projects/dev_references/terminals/zellij/zellij-server/src/panes/tiled_panes/mod.rs
        - /home/home/personal/projects/dev_references/terminals/zellij/zellij-server/src/panes/floating_panes/mod.rs
      adopted_behavior:
        - tiled and floating are distinct pane composition roles
        - floating caller order determines topmost focus and hit behavior
        - hidden tabs retain pane state outside visible composition
      rejected_structure:
        - pane managers, layout engines, swap layouts, widgets, events, and application commands
    current_shape:
      render:
        - stable caller-issued TabId and PaneId
        - immutable tiled/floating order, selection, projection, and hit facts
        - no retained topology or application policy
      host:
        - bounded identity issuance and tab/pane retention
        - complete tiled coverage plus bounded floating overlap
        - transactional mutation, focus, and geometry policy
      reuse:
        - editor-like native shaping and chrome projection through the curated howl-render root
    receipts:
      - all eight Render capability graphs passed check/test in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
      - Host and root check/test passed in all four optimize modes
      - source audit, protocol validation, YAML load, pinned formatting, and diff checks passed
      - Debug and ReleaseSafe live rings preserved the 40-vertex, 60-index, six-draw, four-glyph plan
      - both live rings proved same-generation slot reuse, resize generation two, and clean compositor-close retirement
      - visual receipt /tmp/howl-render-chrome-ownership.png matches the accepted tab label and blank pane pixels

