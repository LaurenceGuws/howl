  - parity_and_freeze closes the marathon

terminal_contract_receipt:
  status: review_ready
  ownership:
    terminal_runtime_future:
      - one OS thread owns up to 64 logical terminal owners
      - each logical owner owns one howl-pty, one howl-vt.Terminal, and one howl-render terminal.Content
    renderer:
      - owns canvas.Composer, Vulkan mutation, retained backend residency, and surface batching
    window:
      - owns Wayland I/O and presentation only
  handoff:
    - one fixed-capacity copied pending slot per live PaneId
    - slot stores canonical canvas facts and copied pixels without Host visual vocabulary
    - atomic free, writing, ready, draining, and retired states transfer exclusive ownership
    - release publication and acquire drainage make copied bytes cross-thread safe
    - slot admission precedes terminal.Content.takeUpdate
    - occupied pane slots do not block servicing or publishing another pane
    - takeUpdate is not called for a pane unless its slot was atomically reserved
  exclusions:
    - PTY construction, polling, child lifecycle, keyboard encoding, replies, consequences, and runtime threads
    - Canvas, terminal.Content, Composer, howl-vk, or Render file splitting
    - RPC, callbacks, acknowledgement choreography, generic event buses, and unbounded queues
    - GUI launch or compositor automation
  findings:
    - Host terminal_handoff.PendingSlot copies only canonical Canvas uploads, removals, commands, and pixel bytes
    - each logical producer retains its own terminal projection baseline and image identities
    - two real VT instances feed distinct text and Kitty image transcripts through independent Content owners
  copied_slot_bound:
    uploads: 32
    removals: 32
    commands: 64
    pixel_bytes: 8192
    allocator_bytes_per_pane: 15104
    owner_bytes_per_pane: 15224
    owner_bytes_for_64_panes: 974336
    evidence: .zig/work/terminal-contract-receipt/receipt.yml
  lifetime_transition:
    - PendingSlot.publish claims free to writing before touching terminal.Content
    - PendingSlot and terminal.Content use the same resources, commands, and upload-byte limits
    - a mismatched limits authority fails before takeUpdate and restores the slot to free
    - takeUpdate failure restores the slot to free and Content rolls back its candidate transaction
    - after successful takeUpdate the bounds-matched copy is infallible and rewrites upload slices into slot-owned storage
    - writing to ready release publishes all copied bytes; ready to draining acquire grants Renderer exclusive access
    - producer VT storage and projection work may change without changing the occupied slot
    - Renderer calls PendingSlot.drain, which applies to one Composer SourceId and clears only after acceptance
    - Composer rejection republishes the immutable occupied slot for later exact drainage
    - retirement atomically discards a ready update before its Composer source is removed
  proofs:
    - two pane-local resource ID collisions remain distinct after Composer qualification
    - occupied-slot saturation preserves copied bytes and leaves another pane independently serviceable
    - an occupied publication attempt does not consume queued text and Kitty image replacement state
    - a two-thread release/acquire proof observes the exact immutable copied pixels
    - hidden updates preserve FrameRevision and byte-exact visible output
    - reveal advances once and contains the newest hidden producer commands
    - occupied-slot retirement discards pending bytes, rejects later drainage/publication, and new SourceId and PaneId values are strictly newer
    - empty backend residency reproduces identical uploads, removals, commands, pixels, and FrameRevision
    - allocation, mismatched-limit admission, terminal production, and Composer-drain failures preserve ownership and slot reuse
  validation:
    - Host and workspace check/test pass in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
    - source audit and protocol validation pass
    - YAML, pinned formatting, and diff checks pass
