schema: 1
sprint:
  id: session_domain_boundary
  marathon: host_input_integration
  status: active
  active_slice: first_transition_route
  objective: >-
    Route the first maintained session command through the accepted finite
    session boundary without widening Host input behavior.

accepted_slices:
  ownership_index:
    status: accepted
    evidence: .zig/work/host-input-integration/session-domain-boundary/ownership_index.yml
    conclusion: 53 ownership records with complete owner, event, and disposition coverage
  finite_session_contract:
    status: accepted
    evidence: .zig/work/host-input-integration/session-domain-boundary/finite_contract.yml
    receipt: .zig/work/host-input-integration/session-domain-boundary/layout_receipt.txt
    conclusion: 11-command/12-route finite contract with no unresolved authority decisions

accepted_contract:
  command_variants: 11
  maintained_adaptation_routes: 12
  route_note: switch_tab has one keyboard route and one pointer route
  domain_owner:
    accepted_state: SessionState
    pending_candidate: SessionCandidate, nested once in PendingSessionTransition
    revision: no separate domain topology revision until a causal consumer exists
    imports: no Render, Wayland, Vulkan, PTY, or terminal-render packages
  host_owner:
    transition: PendingSessionTransition mirrors current PendingTopology
    lifecycle: PreparedLifecycle and LifecycleRevision
    source: optional new PaneId/SourceId registration
    configure: optional SurfaceConfig from the Renderer configure path
    input_capture: Host-owned and excluded from domain payload totals
  memory:
    accepted_domain_state_bytes: 20384
    pending_domain_candidate_payload_bytes: 20384
    maximum_domain_owned_payload_bytes: 40768
    host_adapter_overhead_bytes: 168
    host_input_capture_bytes: 68
    maximum_steady_retained_bytes: 41004
    pending_session_transition_bytes: 20552
    migration_peak_modeled_bytes: 61388
    migration_peak_status: modeled legacy chrome_state.Topology term, not a product-type measurement
  acceptance_order:
    - commitAdmitted is the last fallible lifecycle step and queues consequences
    - assign accepted session topology infallibly
    - commit bootstrap state
    - commit prepared Window completion infallibly
    - commit replay state
    - Runtime consumes queued create/resize/close consequences later

scope:
  include:
    - tab and pane identity
    - pane-tree topology
    - active tab and focused pane
    - create, close, split, move, and focus transitions
    - lifecycle validity and revision ordering
    - Chrome facts and hit regions derived from accepted session state
    - every current keyboard or pointer path that directly mutates those facts
  exclude:
    - behavior changes
    - package extraction
    - keyboard encoding implementation
    - mouse protocol implementation
    - rendering or cursor changes

questions:
  - id: mutation_index
    status: answered
    answer: ownership_index.yml contains 53 ownership records with exact source citations
  - id: owner_classification
    status: answered
    answer: finite_contract.yml separates SessionState/SessionCandidate from PendingSessionTransition and existing physical owners
  - id: transaction_boundary
    status: answered
    answer: 11-command contract; first implementation route is SessionCommand.focus_direction only
  - id: extraction_order
    status: answered
    answer: focus_direction through input_actions.candidate, Renderer orchestration, and prepareTerminalTopology

required_contract:
  commands: exact closed set derived from current behavior; no speculative remote or agent commands
  state: fixed bounds, stable identities, lifecycle, focus, and owner-specific revisions; no separate domain topology revision
  errors: exact rejection at the owner that can still preserve prior accepted state
  rollback: candidate validation precedes every accepted mutation and consumes no identity on failure
  dependencies: no Wayland, Vulkan, PTY, or terminal-render dependency in the domain transition owner
  proof: source-local transition tests plus production-shaped Host adaptation tests

slices:
  - id: ownership_index
    status: accepted
    product_change: forbidden
    output: ignored queryable ownership map and finite source-shape recommendation
  - id: finite_session_contract
    status: accepted
    product_change: forbidden
    output: accepted command, state, bound, error, rollback, cleanup, and file-owner contract
  - id: first_transition_route
    status: active
    product_change: authorized_narrow_scope
    command: SessionCommand.focus_direction
    output: one smallest behavior-preserving transition routed through the accepted boundary
    scope: >-
      Implement only focus_direction adaptation, pure candidate preparation,
      existing lifecycle translation, and accepted transition wiring. Do not
      add bindings, commands, package boundaries, or unrelated input behavior.
    implementation: not_started
  - id: complete_transition_route
    status: pending
    product_change: blocked_on_prior_slice
    output: all current session mutations routed without direct Host policy duplication
  - id: independence_and_freeze
    status: pending
    product_change: proof_and_cleanup_only
    output: backend-independent transition proof and accepted sprint recorded in marathon_host.yml

playground:
  path: .zig/work/host-input-integration/session-domain-boundary
  ignored: true
  owns:
    - query YAML
    - source indexes
    - temporary JSONL if runtime causality must be measured
    - normalized receipts
  rule: No ignored artifact is cited as committed product authority after the sprint is retired.

acceptance_gate:
  - Current behavior is preserved; no GUI-visible feature is added or removed.
  - Every direct session mutation has exactly one disposition.
  - The proposed files are independently owned review units rather than catch-all Host helpers.
  - Public signatures, allocations, cleanup, zero-length behavior, capacities, and errors are finite before implementation.
  - The first implementation slice is small enough for one hostile review and one coherent commit.
