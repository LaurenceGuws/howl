scratch:
  marathon: host_platform_chrome
  status: ready_for_worker
  checkpoint: pane_composition
  purpose: current checkpoint findings, commands, corrections, receipts, and review boundary

accepted:
  interactive_chrome:
    commit: 5b8ac562ebed6479addd2bc7282fc18fac29a367
    boundary: Connect interactive host chrome
    outcome:
      - Window publishes caller-neutral Wayland input facts only
      - Renderer owns chord capture, Host chrome actions, topology mutation, Vulkan redraw, and completion publication
      - corrected operator mappings preserve bare Alt arrows and Ctrl Tab for terminal applications
      - primary pointer presses switch tabs or focus panes; floating focus raises the pane
      - no-op actions publish no GPU revision
    receipts:
      - operator visual and temporary per-pane probe gates passed
      - all package and workspace optimize-mode checks and tests passed
      - source audit, protocol validation, YAML, formatting, and diff checks passed

architecture_correction:
  decision: >-
    Terminal execution is not owned by Renderer and does not use one OS thread or
    one Zig fiber per terminal. One terminal runtime OS thread initially owns up to
    64 logical terminal owners and polls every PTY descriptor.
  logical_terminal_owner:
    owns:
      - one howl-pty instance
      - one howl-vt instance
      - one howl-render terminal projection baseline
      - one stable pane identity and never-reused incarnation
  renderer:
    receives: newest-complete immutable backend-neutral pane updates
    owns: retained pane visuals, surface-wide batching, Vulkan mutation, and GPU completion
  references:
    alacritty: >-
      FairMutex uses a reservation lock plus data lock to prevent immediate
      reacquisition starvation. Howl prefers exclusive VT ownership; the mechanism
      is evidence only if a small residual shared lock earns its existence.
    zellij: >-
      A serialized ScreenInstruction loop orders screen and chrome mutation while
      asynchronous terminal readers deliver PTY bytes. Howl adopts the ordering
      lesson without its unbounded channel graph or architecture.
    zig: >-
      Pinned std.Io.Evented uses Linux io_uring and stackful fibers, but currently
      reserves roughly 60 MiB per fiber. It is not selected for one-task-per-terminal
      execution without a separate measured proof.

checkpoint:
  id: pane_composition
  status: ready_for_worker
  objective: >-
    Replace the current single chrome draw source with bounded composition of
    multiple independent immutable pane updates, images, and Host chrome into one
    ordered Vulkan surface batch. This checkpoint prepares the consumer boundary;
    it does not create PTYs, VTs, terminal threads, or a permanent simulator API.
  ownership:
    producer_contract:
      - each update is self-contained and remains valid without borrowing producer state
      - stable PaneId, incarnation, and monotonic pane revision identify replacement
      - newest complete update replaces the retained update for exactly one live pane
    renderer:
      - validates identity, incarnation, revision, geometry, aliases, and capacities before mutation
      - retains the newest complete visual facts required for redraw and context reconstruction
      - composes visible tiled panes, floating panes, images, cursor, selection, and chrome in exact phase order
      - drops stale updates without changing retained state or GPU work
    host_topology:
      - remains the authority for live panes, active tab, visibility, focus, clipping, and floating order
      - rejects or retires updates whose identity no longer names the same live pane incarnation
  positive_scope:
    - derive the smallest immutable pane-update contract from existing howl-render terminal and image projections
    - preserve caller-owned terminal selection and image identity semantics
    - retain one newest-complete update for every live pane, including hidden tabs
    - compose only visible panes while hidden updates continue replacing retained state
    - batch all visible pane visuals and Host chrome into one Vulkan submission
    - preserve current independent GPU progress, frame pacing, slot reuse, resize generations, and reverse retirement
  exclusions:
    - PTY creation, descriptor polling, child lifecycle, and terminal runtime thread
    - howl-vt construction, feeds, replies, consequences, or input encoding
    - fake permanent terminal, simulator, event bus, command, RPC, or backend framework
    - one OS thread or Zig fiber per pane
    - Vulkan, Wayland, threads, or mutable application state inside howl-render
  transactions:
    - malformed, aliased, oversized, stale, or wrong-incarnation updates preserve all retained pane and GPU staging bytes
    - update replacement commits only after complete validation and owned-copy admission
    - hidden-pane replacement performs no draw but becomes visible on the next tab switch
    - pane close retires retained visual ownership only after the topology identity is no longer renderable
    - context reconstruction uses retained complete updates and does not borrow producer storage
  deterministic_proofs:
    - two tiled and overlapping floating pane updates compose in exact topology order
    - terminal text, decorations, cursor, pane-owned selection, images, borders, labels, and scrollbars preserve phase and clipping
    - stale revision, wrong incarnation, unknown pane, malformed geometry, aliases, and every capacity failure roll back byte-exactly
    - hidden updates coalesce to the newest complete state and appear immediately when revealed
    - close and identity churn cannot resurrect retained visuals
    - full recovery and Vulkan context reconstruction reproduce the same visible batch
  regression_gates:
    - Render, Host, and root check/test in all four optimize modes
    - source audit, protocol validation, YAML, formatting, SPIR-V validation, and diff checks
    - Debug and ReleaseSafe live rings preserve same-generation reuse, resize, and orderly retirement
    - request the operator to visually inspect the composed multi-pane surface after deterministic proofs pass
  review_boundary:
    - leave implementation uncommitted
    - report the exact pane-update contract, retained byte bounds, phase order, public-symbol delta, and rollback receipts
    - do not begin deterministic VT transcript or PTY integration work

next:
  - worker implements pane_composition and requests operator visual inspection
  - reviewer closes pane_composition
  - terminal_contract_receipt proves the producer boundary with multiple real VT instances
  - terminal_runtime adds one caller-driven PTY and VT runtime thread
  - parity_and_freeze closes the marathon
