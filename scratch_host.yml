terminal_visible_set:
  status: accepted
  commit: d5d1012
  operator_gate:
    status: passed_before_font-policy_research
    checklist: howl-host/temp_user_checklist.txt
    observed_failure:
      - modifier press reached terminal input as an unmatched XKB keysym
      - Host cast Shift_L 0xffe1 to Unicode U+FFE1 instead of preserving named physical identity
      - the shell could echo that fabricated scalar and native shaping returned MissingGlyph
      - ANSI bold and italic prompt cells also lacked exact Host FontMap configurations
    correction:
      - modifier keysyms map to VT named physical keys and encode no legacy bytes
      - one supplied Host font explicitly owns normal, bold, italic, and bold-italic tuples
      - terminal native shaping segments by exact covering face
      - a valid scalar absent from every configured face omits only that cell while preserving advance and adjacent glyphs
      - invalid Unicode and HarfBuzz glyph id zero remain exact failures
    deterministic_evidence:
      - exact Iosevka operator-font Host test passes
      - modifier press and release append no child-bound bytes
      - bold, italic, ordinary, and absent optional cells complete Content publication
      - Render proves missing-cell omission between two supported glyphs
    subsequent_operator_failure:
      - Neovim which-key produced 1279 Canvas commands and terminated at the Vulkan surface Capacity boundary
      - btop produced 1721 Canvas commands and terminated at the same boundary
      - the surface admitted 4096 quads but only 1024 ordered draw commands
    capacity_correction:
      - the ordered draw-command capacity now follows the 32768-command full-size single-tab path
      - Host, Composer, pooled handoff, and Vulkan use the same u32-index geometry bound
      - an executable howl-vk proof builds the full 32768-command solid frame and verifies exact vertex and index counts
    clean_close_correction:
      observed:
        - btop rendered 2540 commands without Render failure
        - Neovim rendered 1494 commands without Render failure
        - both normal closures were subsequently mislabeled as Window runtime failures
      cause: >-
        Boundary.requestStop used nullable failure storage to detect whether a
        first stop had occurred. A clean first stop stores null, so a later
        callback during retirement could overwrite it with a Window failure.
      correction:
        - the monotonic stop_requested fact now identifies the first request
        - only that first request establishes the nullable failure cause
        - later owner callbacks cannot relabel a clean compositor close
        - a deterministic boundary proof covers clean stop followed by both owner failure requests
    pointer_frame_correction:
      observed: moving the pointer over the surface stopped Window
      cause: >-
        wl_pointer.frame terminates a group of arbitrary pointer events, but
        Window treated every frame as an axis occurrence requiring the current
        pointer position. A normal frame after leave observed the intentionally
        cleared point and stopped Window.
      correction:
        - axis callbacks retain a separate causal axis position
        - an axis frame consumes that retained occurrence exactly once
        - a frame containing no axis occurrence is a valid no-op
        - pointer leave continues to clear the current routing position
      deterministic_evidence:
        - empty, one-axis, consumed, and repeated-empty frame states are proved
    focused_close_correction:
      observed:
        - pointer movement passed operator retest
        - tabs and splits opened
        - Ctrl+Shift+W stopped terminal runtime with UnknownPane
      cause: >-
        The prepared topology candidate queued close for the focused pane and
        a later focus-out input for that same PaneId. Runtime applies lifecycle
        before copied input, so exact unknown-owner rejection caught the stale
        focus occurrence after retirement.
      correction:
        - a focused owner absent from candidate topology receives no redundant focus-out
        - a surviving formerly focused owner still receives focus-out
        - the candidate fallback owner still receives focus-in
    resize_wait_correction:
      observed: >-
        During compositor resize generation 14, Window framed revision 162
        while Render reached revision 164 and failed with WindowRingTimeout.
      cause: >-
        Wrapper readiness was bounded by eight render-fd wake occurrences.
        Configure, input, and other legitimate traffic could exhaust that
        count immediately while Window was paced by an outstanding frame
        callback.
      correction:
        - wrapper readiness uses checked CLOCK_MONOTONIC now plus two seconds
        - unrelated wakes are drained without consuming the absolute time budget
        - timeout remains exact only after the deadline expires
    terminal_resource_correction:
      observed:
        - operator resize stress passed beyond 4000 surface generations
        - btop produced a 1657-command update which Composer retained after ResourceLimit
        - the prior accepted frame remained visible, presenting as a frozen TUI
      cause: >-
        The terminal sparse update bound was 128 resources, but Composer's
        candidate reconstruction also had only 128 slots. One Content may
        retain 512 glyphs, 128 masks, and 8 images, so a valid complete source
        could not be reconstructed even when its sparse delta fit.
      correction:
        - Composer candidate resources now admit 1024 complete source resources
        - the retained frame and Host/Vulkan copied residency banks admit 2048 resources
        - the executable equation proves one 648-resource terminal plus 512 Chrome resources fits
        - this is the current single-full-tab admission used for stable TUI operation; sixteen simultaneous maximum panes remain outside acceptance
      alternate_screen_exit:
        observed:
          - quitting btop after alternate-screen rendering stranded tab one behind tab two's retained composition
          - Neovim exit remained the clean control case
        cause: >-
          Content could retain 512 glyphs, 128 masks, and 8 images, but its
          ProducerUpdate mutation banks admitted only 128 uploads or removals.
          Alternate-screen exit could require complete retained-resource
          turnover, so extraction remained dirty and the visible-set
          transaction correctly preserved the prior tab rather than revealing
          a partial source.
        correction:
          - per-update resource mutation admission now equals the complete 648-resource terminal set
          - the Pool and Composer candidate boundaries already admit that exact update
          - a production-boundary proof retires more than 128 alternate-screen resources and applies the primary-screen update to Composer
        operator_retest:
          date: 2026-07-28
          result: btop exits cleanly without stranding the tab
    operator_breadth_retest:
      date: 2026-07-28
      functional:
        - rain
        - btop
        - Neovim
        - vttest
        - tabs
        - panes
      stability: somewhat stable
      unresolved:
        - CPU use is materially higher than the prior EGL implementation
        - resident memory is materially higher than the prior EGL implementation
      disposition: >-
        Functional breadth is operator-observed, but performance parity and
        complete stability are not accepted by this receipt.
    terminal_geometry_correction:
      observed:
        - btop progressed to 3960 commands and then retained an incomplete frame at the old 4096-command ceiling
        - continued visible-set retry later failed with InvalidCandidateRevision
      causes:
        - a full-size ordinary TUI exceeded the single u16 4096-quad stream
        - cancelled pool candidate revision N left visible request N eligible for illegal reuse
      correction:
        - terminal Content, pooled handoff, Composer, Host copies, and Vulkan now share a 32768-command bound
        - Vulkan indices are u32 and bounded geometry candidate arrays are allocated transactionally
        - incomplete visible-set extraction cancels its request so Renderer reissues a strictly newer revision
        - the pool reservation identity and candidate high-water invariants remain non-reusing
  ownership:
    renderer:
      - issues one nonzero monotonic candidate revision
      - retains candidate placement geometry without exposing it to terminal runtime
      - applies prepared source updates individually through Composer
      - claims and switches composition only after every required producer revision is accepted
    terminal_runtime:
      - classifies exact requested owners from dirty state, last publication geometry, last publication revision, and Boundary transfer facts
      - reserves every fresh extraction as one Pool group before takeUpdate
      - publishes the actual ProducerRevision learned from takeUpdate
    boundary:
      - owns one latest fixed request and Composer-accepted revisions
      - preserves ready publications across supersession and cancellation
      - blocks ordinary hidden-source reservation while reveal preparation is active
  transactions:
    - synchronized members allocate no block
    - current ready or draining publications are reused
    - dirty state behind a stale ready publication waits for Renderer drainage before group reservation
    - pool exhaustion and stale identity consume no Content
    - partial producer failure releases every still-reserved group block while already-published hidden updates remain valid
    - Composer rejection restores the exact block to ready and leaves prior composition current
    - Renderer claims a fully accepted request before setComposition and restores the claim on composition rejection
    - successful composition mutation commits the new visible membership and suppresses hidden ordinary publication
  focused_proofs:
    - a sixteen-member group with only fifteen free blocks returns NoCapacity and creates no active group
    - a later fifteen-member reservation proves the failed attempt consumed no free block
    - actual Content extraction publishes a nonzero revision, Composer acceptance makes the request ready, and reveal commits once
    - Composer rejection restores the prepared block and leaves the request pending until exact later acceptance
    - hidden terminal mutation remains dirty without a block and reveal publishes its newest later revision
    - a newer request makes the prior candidate stale without releasing unrelated ready publications
  exclusions:
    - dedicated PendingSlot parity deletion
    - terminal_pool_freeze and final pool optimization
    - sixteen-pane aggregate admission, atlas packing, and GPU budget widening
    - font resizing and performance benchmarking
    - GUI automation and synthetic compositor input
  validation:
    current: deterministic_review_gate_passed
    receipts:
      - Host check and test pass in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
      - workspace check and test pass in Debug, ReleaseSafe, ReleaseFast, and ReleaseSmall
      - source audit and protocol catalogue validation pass
      - duplicate-key YAML, pinned formatting, and diff checks pass

architecture_correction:
  decision: >-
    Terminal execution is not owned by Renderer and does not use one OS thread or
    one Zig fiber per terminal. One terminal runtime OS thread initially owns up to
    64 logical terminal owners and polls every PTY descriptor.
  logical_terminal_owner:
    owns:
      - one howl-pty instance
      - one howl-vt instance
      - one howl-render terminal projection baseline
      - one stable globally never-reused pane identity
  renderer:
    receives: newest-complete immutable backend-neutral pane updates
    owns: retained pane visuals, surface-wide batching, Vulkan mutation, and GPU completion
  references:
    alacritty: >-
      FairMutex uses a reservation lock plus data lock to prevent immediate
      reacquisition starvation. Howl prefers exclusive VT ownership; the mechanism
      is evidence only if a small residual shared lock earns its existence.
    zellij: >-
      A serialized ScreenInstruction loop orders screen and chrome mutation while
      asynchronous terminal readers deliver PTY bytes. Howl adopts the ordering
      lesson without its unbounded channel graph or architecture.
    zig: >-
      Pinned std.Io.Evented uses Linux io_uring and stackful fibers, but currently
      reserves roughly 60 MiB per fiber. It is not selected for one-task-per-terminal
      execution without a separate measured proof.

terminal_runtime_receipt:
  id: terminal_runtime
  status: accepted
  commit: ce7cfe296c0ff5b2bb76b9f701ac2f2876f0bf93
  objective: >-
    Run real shell terminals through one caller-driven terminal runtime OS
    thread that exclusively owns every PTY, VT, projection, image identity,
    terminal Content, and child-bound byte queue.
  maturity_rule:
    - Existing package contracts are audited starting points, not untouchable law.
    - Record an exact failing consumer, invariant, owner, and current symbol before correcting a package boundary.
    - Prefer the smallest owner-native deletion, typing, bound, or ownership correction over Host compatibility glue.
    - Continue independent runtime work while a material public-contract change awaits operator review.
  gui:
    status: initialization_authorized_and_passed
    rule: >-
      Operator authorized initialization-only Host launches. No Hyprland
      control, synthetic input, or screenshots are authorized.
    receipt: >-
      ReleaseSafe reached generation 2 and steady shell-backed Canvas revisions
      after the realistic-pane and resize-recovery corrections.
  settled_bounds:
    logical_terminals: 64
    read_bytes_per_turn: 65536
    read_syscalls_per_turn: 4
    write_bytes_per_turn: 65536
    write_syscalls_per_turn: 4
    child_write_queue_bytes: 65536
    input_occurrences_global: 256
    lifecycle_operations_global: 128
    lifecycle_operations_per_wake_turn: 8
    input_occurrences_per_wake_turn: 8
  pre_pool_commit_boundary:
    historical: true
    includes:
      - VT PreparedResize transaction
      - one terminal runtime thread with fixed owner table and real PTY polling
      - sparse atomic Render Content state and one shared Content.Work
      - one dedicated immutable PendingSlot allocation per admitted pane
      - causal Wayland pointer position and semantic-modifier facts
    excludes:
      - terminal_pool_freeze and final pool optimization
      - sixteen-pane surface admission and atlas-capacity widening
    accepted_after_boundary:
      - u32 Vulkan indices and the 32768-command full-size single-tab path
      - Composer and Host frame capacity required by ordinary full-size TUIs
    next_checkpoint: terminal_font_research
  memory_receipt:
    durable_census: .zig/work/terminal-runtime-memory/receipt.yml
    review_boundary:
      status: accepted_pre_pool_implementation_boundary
      implemented:
        - sparse Content.apply validates completely then copies only affected rows
        - production-boundary copy accounting and real two-PTY fairness receipts
        - takeUpdate-only Content.Work contract
      next_isolated_checkpoint:
        - approved fair global 16-block PendingSlot pool
      unresolved_surface_decisions:
        - sixteen-pane surface admission and final pool budget
    abi_sizes_bytes:
      logical_owner: 206832
      visual_projection_state: 692296
      pending_slot_owner: 120
      terminal_content_owner: 776
    excluded_variable_owners:
      - howl-vt screen, history, graphics and consequence allocations
      - howl-pty environment, argv and kernel descriptors
      - one thread-local FontMap and native FreeType faces shared only within the terminal runtime thread
      - HarfBuzz internal storage preallocated for 4096 glyphs per Content; the native library does not expose its byte count
    conclusion: >-
      The accepted pre-pool shape retains independent Content state per owner,
      one terminal-thread-exclusive Work, and one maximum dedicated PendingSlot
      per owner. The resulting 64-owner fixed subtotal remains too large for the
      final lifecycle policy; the approved global pool is deliberately not
      implemented in this commit.
    ownership_classes:
      per_terminal_retained:
        bytes: 2233160
        includes: logical owner, independent Content projection/image/glyph/mask candidates, complete Host visual state, identities, and ordered child writes
      terminal_thread_ephemeral:
        bytes: 9519120
        includes: takeUpdate derived draws, Canvas output, upload construction, shaping and raster only
      per_pane_pending_handoff:
        bytes: 4563064
        total_for_64: 292036096
      renderer_and_vulkan:
        consistent_composer: 89913224
        consistent_host_frame_copies: 91176960
        consistent_cpu_residency_banks: 152887424
        consistent_frame_builder: 93749248
        total_simultaneous_renderer_cpu: 427726856
        simultaneous_cpu_one_owner: 444042200
        simultaneous_cpu_sixteen_owners: 545985560
        simultaneous_cpu_sixty_four_owners: 872204312
        gpu_equation: fixed queried owners + queried atlases + queried staging + six times queried surface requirement <= 536870912
    correction: >-
      Content now has one projection bank; complete recovery preflight makes
      replacement infallible. Image and glyph/mask candidate banks remain
      Content-owned. Sparse apply validates the complete transaction before
      mutation and writes only affected rows. Implemented Content.Work is
      limited to takeUpdate shaping, raster, derived draws, upload construction,
      and borrowed output.
    executable_experiments:
      package: .zig/work/terminal-runtime-memory
      modes: [Debug, ReleaseSafe, ReleaseFast, ReleaseSmall]
      content_work: >-
        Two owners alternate one Work; owner state and local identities remain
        independent, failure preserves both, copied pending bytes survive Work
        reuse, and undersized Work is rejected before mutation. Production
        Render tests now prove the same boundary.
      copy_mechanics: >-
        Real terminal.Content boundary measurements prove clean apply copies zero,
        one 32-cell row copies 1665 bytes, full recovery copies 213120 bytes,
        and image-only apply copies no terminal cells. All measured operations
        allocate zero after initialization.
      pending_slot: >-
        Real publication copied 1224 empty bytes, 3404 ordinary-text bytes, and
        1368 image-bearing bytes. A capacity-shape fixture copies 4,535,872
        bytes across 648 upload slots, 648 removal slots, and 4,096 commands;
        this is not a claim that one producer update reaches all of those facts.
        Per-owner maximum allocation, a fair global maximum
        block pool, and unproven size classes are compared durably.
      scheduler: >-
        Two real PTYs exercised the production Runtime.pollOnce path for
        sustained rounds with one slot occupied for 48 rounds. The quiet owner
        drained 12 updates while noisy publication was blocked; each drain was
        attempted immediately after pollOnce, the RoundRobin proof separately
        establishes one turn per owner, and the cursor advanced through the
        rounds. Noisy publication resumed after freeing its slot.
      capacity: >-
        Checked actual-type formulas expose the one-pane 4096/1024 command and
        1024/128 resource mismatch, the complete sixteen-pane chain, CPU banks,
        compares one u32 stream with explicitly based u16 batches, replaces the
        64x64 receipt extrapolation with the queried six-surface equation, and
        keeps format-specific atlas packing unresolved.
    alternatives:
      shared_content_work:
        status: rejected_complete_candidate_copy_shape
      row_granular_retention_plus_ephemeral_work:
        status: implemented
        per_terminal_retained_bytes: 2233160
        per_pane_pending_bytes: 4563064
        one_shared_work_bytes: 9519120
        sixteen_owner_total: 118258704
        sixty_four_owner_total: 444477456
        contract: >-
          Content keeps independently owned projection/image/glyph/mask
          retained and candidate entries. apply and recover retain their
          signatures. One terminal-thread-exclusive Work is used only for
          takeUpdate shaping, raster, derived draws, uploads, and borrowed
          output.
        public_api:
          added: [Content.Work, Content.Work.init, Content.Work.deinit]
          changed: [Content.takeUpdate]
          unchanged: [Content.apply, Content.recover]
          status: implemented_under_operator_authorization
      sparse_undo_journal:
        status: viable_not_recommended
        reason: lower permanent storage but materially more complex cross-domain rollback
      pending_storage:
        per_owner_maximum:
          bytes_for_64: 292036096
        global_maximum_block_pool:
          exact_16_blocks_and_64_descriptors: 106042528
          reveal_policy: >-
            The ignored approved design classifies members from Host-owned
            publication, Composer acceptance, dirty, geometry, and block facts.
            Stale ready or draining blocks release before one all-or-none
            visible-set reservation. No pool or VisibleSetRequest exists in
            tracked product source yet.
          status: implemented_storage_only_unintegrated
        size_classes:
          status: unearned
          blocker: text glyph uploads can consume the full upload-byte bound and takeUpdate is consumptive
      vulkan_geometry:
        u32:
          index_bytes: 1622016
          added_bytes_over_u16: 811008
          index_bind_calls: 1
          public_change: Plan and FrameBuilder index element type
        explicit_u16_batches:
          candidate_batches_for_67584_quads: 5
          index_bytes: 811008
          index_bind_calls: 5
          public_change: one Batch noun plus bounded Plan batch slice
        status: accepted_u32_single_tab_path
        decision: >-
          u32 indices are approved for the current full-size single-tab TUI
          target. Based-u16 batching is retained only as a rejected alternative
          and is not part of this checkpoint.
      fixed_per_pane:
        status: unearned_without_one_aggregate_budget
      complete_chain_widening:
        status: exact_count_and_byte_shape_but_packability_unproven
      aggregate_lifecycle_admission:
        status: exact_transaction_shape_but_packability_reservation_unproven
  scheduling:
    - one wake descriptor plus one borrowed PTY master descriptor per live owner
    - stable round-robin cursor advances once per poll or pending-service round
    - each ready owner receives only the fixed read, write, consequence, projection, and lifecycle budget
    - pending visual publication never prevents PTY reads, reply collection, writes, or another owner turn
  consequences:
    policy: >-
      Each observed head is handled by exact identity. Clipboard queries receive
      an empty caller-neutral reply, screen-cell queries receive current terminal
      geometry, unowned container state/position/title queries are explicitly
      declined without fabricated bytes, and color-preference queries receive
      dark. Reply or decline consumes the matching head transactionally;
      non-query families use the explicit unsupported policy and are consumed.
      No query can indefinitely retain the VT head or gate PTY reads.
    variants:
      clipboard: query_replied_empty; non_query_explicit_unsupported_consumed
      notification: explicit_unsupported_consumed_after_identity_classification
      pointer_shape: explicit_unsupported_consumed_after_identity_classification
      file_transfer: explicit_unsupported_consumed_after_identity_classification
      drag_drop: explicit_unsupported_consumed_after_identity_classification
      container: screen_cells_replied; unowned_state_position_title_declined_without_bytes; action_explicit_unsupported_consumed
      color_preference_query: replied_dark
      bell: explicit_unsupported_consumed_after_identity_classification
      legacy_control: explicit_unsupported_consumed_after_identity_classification
      media_copy: explicit_unsupported_consumed_after_identity_classification
      dcs: explicit_unsupported_consumed_after_identity_classification
      string_control: explicit_unsupported_consumed_after_identity_classification
    correction_status:
      consequence_progress: implemented_and_proven
      close_drain_retry: implemented_and_proven
      one_pane_admission: bounded_to_composer_candidate
      remaining_blocker: >-
        Larger terminal Content and sixteen-pane Composer/Vulkan admission remain
        separate future design work; current terminal panes reject geometry above
        the conservative admitted cell bound before PTY/VT construction.
      init_receipt: >-
        Authorized ReleaseSafe initialization reached generation 2, constructed
        the real shell owner, recovered its configured geometry, and continued
        publishing terminal Canvas revisions. No automated input or compositor
        tooling was used.
      lifecycle_transaction: >-
        Boundary.prepareLifecycle reserves exact lifecycle/input queue counts
        and any new owner index. Competing input and lifecycle producers account
        for those reservations. Shutdown is a separate monotonic fact: it
        requires no ring capacity, cancels queued lifecycle/input facts, wakes
        the runtime, and makes prepared commit return Stopping. Shared completion
        preparation reserves exact queue capacity without waking Window.
        Renderer commits lifecycle and topology first, then exposes the reserved
        completion as the final infallible step.
  progress:
    - howl-host now directly depends on howl-pty.
    - one terminal.zig owner contains bounded write retention, exact VT reply transfer, stable round-robin scheduling, PTY/VT/Content construction, and reverse cleanup.
    - two real PTYs share one poll set under a noisy producer without starving quiet output.
    - a fixed 64-owner Runtime admits unique PaneId values, polls borrowed master descriptors, observes children, and retires owners.
    - source audit required no new admission.
    - Terminal.PreparedResize now owns complete primary and alternate candidates, a complete candidate reply buffer containing the exact in-band report, and single-use commit/discard lifetime.
    - direct Terminal.resize is prepare plus immediate commit; the independent 0.1.4-dev consumer exercises the typed prepared owner.
    - Logical.resize prepares VT, applies PTY kernel geometry, then commits VT infallibly.
    - the complete allocation sweep exposed and corrected a private Screen output-line clone rollback defect before it could enter the public transaction.
    - logical owners now retain complete projection baselines, image identities, terminal Content, and one accepted atomic PendingSlot; occupied slots do not stop PTY turns.
    - real empty-shell initialization exposed a private Render defect where terminal Content rejected VT's valid initial empty image generation zero.
    - terminal Content now admits only that exact uninitialized empty image fact; nonempty and post-initialization zero generations remain stale.
    - one production-shaped terminal thread now polls its directional wake plus every borrowed PTY master, constructs a real shell owner, and publishes through the copied slot to a Composer source.
    - terminal-to-Renderer and Renderer-to-terminal eventfds carry ready-slot and freed-slot facts without presentation acknowledgement.
    - bounded lifecycle and input turns re-arm the terminal eventfd when accepted work remains.
    - the production poll path applies the same stable round-robin order proved by the direct runtime tests.
