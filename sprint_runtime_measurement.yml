slices:
  - id: child_exit_lifecycle
    status: accepted
    observed_gap: >-
      PTY reaps the child and Terminal retains Logical.child_exit, but no
      terminal-completion fact reaches Renderer; the pane and final Host
      therefore remain live after the child exits.
    accepted_policy:
      - every drained child exit closes exactly its owning pane
      - other panes and tabs remain live
      - the final pane exit completes Renderer normally and process-root shutdown remains reverse ordered
      - normal and signal exits remain distinguishable
      - trailing PTY output is not discarded
      - duplicate, stale, and retired identities cannot close a replacement pane
    implementation_boundary:
      - Terminal owns child observation, PTY EOF, and one exact completion publication
      - terminal_handoff owns bounded copied completion transport and stale-safe identity validation
      - Renderer owns transactional pane closure and final-Host completion policy
      - SessionState continues to require at least one retained pane; final process completion is not fabricated as a domain mutation
    allowed_product_paths:
      - howl-host/src/terminal.zig
      - howl-host/src/terminal_handoff.zig
      - howl-host/src/renderer.zig
    gate:
      - exact normal-exit and signal-exit transport proofs
      - EOF and trailing-output ordering proof
      - multipane closure and stale-identity rollback proof
      - final-pane normal shutdown proof through the production owner path
    implementation:
      status: review_accepted
      product_paths:
        - howl-host/src/terminal.zig
        - howl-host/src/terminal_handoff.zig
        - howl-host/src/renderer.zig
      retained_completion_bytes: 3072
      operator_gate: passed; accepted Neovim cast completed and Howl exited naturally
  - id: external_measurement_runner
    status: accepted
    outcome: one warmup and five bounded Howl CPU, memory, and contextual GPU receipts
    evidence:
      raw_jsonl: .zig/work/runtime-hot-path/measurement-baseline/measurement-20260806-094109/measurement_raw.jsonl
      raw_sha256: 72eb6e8a975b94c103de1f8d24ef2939b0cd0d8cb3a8bf856de3575e9509d601
