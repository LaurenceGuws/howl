      summary_sha256: f8daa491935b5e8c707208119d07db2a8a48e84ddb1fe3902b4acd5a92d437c7
  - id: rain_fixture
    status: deferred_to_later_workload
    outcome: one exact sustained large-font output fixture
  - id: sprint_acceptance
    status: accepted
    outcome: reviewed fixtures, natural process completion, and reproducible baseline receipts

exclusions:
  - no timeout, pkill, synthetic sleep, or forced-window-close measurement endpoint
  - no command-only exit hack that bypasses ordinary pane lifecycle
  - no product performance instrumentation in child_exit_lifecycle
  - no performance correction before baseline acceptance

validation:
  - strict duplicate-key YAML parsing
  - affected Host and workspace checks/tests in all four optimization modes
  - source audit, protocol validation, formatting, and git diff checks
