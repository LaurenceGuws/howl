schema: 1
marathon:
  name: debt_payoff
  version: 0.1.5-dev
  status: active
  approval: operator_approved
  branch_policy:
    integration: main
    prior_release_snapshot: release/0.1.4-dev
    sprint_pattern: feature/debt_payoff/<sprint>
  active_sprint: null
  objective: >-
    Pay down structural debt in small reviewable slices while preserving the
    frozen 0.1.4-dev product boundary. No new terminal capability is in scope.

delivered_boundary:
  version: 0.1.4-dev
  status: frozen
  closing_commits:
    - 7d31e3b
    - 0f5d4c8
    - d055a36
    - 5eee688
    - 7db8e1a
  deferred_capability:
    - ordered keyboard protocol expansion
    - compositor-provided repeat policy
    - mouse and terminal mouse protocol routing
    - terminal identity and child-environment negotiation
    - input hot-path measurement and optimization

debt_candidates:
  - id: stdlib_boundary
    status: accepted
    scope: remove redundant host_c ownership where pinned Zig stdlib is sufficient
    outcome: >-
      Pinned Zig Linux/POSIX ownership replaces the complete redundant
      fourteen-symbol host_c boundary while preserving eventfd, descriptor,
      polling, and mapped-lifetime semantics; renderer_c remains the sole
      required Host Translate-C boundary.
    implementation_commits: [9afc414, 3c7b9f2, 20ee97d, 5ef1bf2]
  - id: ownership_names
    status: accepted
    scope: rename dishonest umbrella ownership without splitting cohesive state
    outcome: >-
      Exact discovery and atomic rename contracts replaced shared.zig with
      window_render_boundary.zig and chrome_state.zig with
      session_chrome_adapter.zig while preserving cohesive files and complete
      55- and 19-symbol public surfaces.
    implementation_commits: [cb87e1b, 165211e]
  - id: mixed_ownership_audit
    status: accepted
    scope: audit large files and preserve fewer cohesive files where that is the clearer owner shape
    outcome: >-
      Exact retained-state, mutation, lifecycle, failure, importer, and proof
      evidence classifies fourteen large files as cohesive owners with
      mechanical subdomains and two as intentional ABI/parser boundaries. No
      mixed owner or structural intervention is proven; Renderer module-comment
      vocabulary debt is routed to error_and_authority_hygiene.
  - id: generated_c_boundary
    scope: audit generated-C boundaries and build wiring
  - id: error_and_authority_hygiene
    scope: audit silent error disposal, stale source-audit admissions, comments, and tracked authority
  - id: obsolete_interfaces
    scope: remove obsolete interfaces and fossil compatibility code

exclusions:
  - no mouse, repeat, keyboard protocol expansion, terminal identity, or new feature work
  - no broad file splitting or package extraction
  - no GUI-only diagnosis as a substitute for deterministic proof

validation:
  - strict duplicate-key YAML parsing
  - source audit and protocol validation
  - all maintained package checks/tests in every required optimization mode
  - formatting and git diff checks
