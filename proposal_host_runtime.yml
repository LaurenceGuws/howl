proposal:
  id: host_runtime
  status: proposed
  base_commit: 217ec14
  purpose: >-
    Rebuild Howl in five direct files with Main owning lifetimes, Render mutating runtime and GPU state, and Window
    reading completed GPU state at Window pace.

source:
  root: howl-host/src
  files:
    - main.zig
    - window.zig
    - render.zig
    - terminal.zig
    - test.zig
  rules:
    - no other production file
    - no import from src_current, src_latest, or src_deleted
    - no compatibility alias or rejected signature

ownership:
  main:
    file: main.zig
    owns:
      - application lifetime
      - Window lifetime
      - GPU lifetime
      - Render thread lifetime
      - Terminal state lifetime
      - construction order
      - shutdown and reverse destruction order
      - first exact failure
    rules:
      - GPU storage exists before Render or Window receives a borrow
      - Main joins Render before destroying GPU
      - Main destroys Window only after Render releases its mutable GPU borrow

  window:
    file: window.zig
    owns:
      - Wayland connection
      - Wayland window
      - Wayland dispatch
      - copied Window state
      - ordered physical input
      - its local last-read GPU revision
    borrows:
      gpu: read_only
    reads_gpu:
      when: GPU revision differs from Window local last-read revision
      pace: Window
      result: newest complete state already published inside GPU
    rules:
      - Window never creates GPU
      - Window never mutates GPU
      - Window never destroys GPU
      - Window never waits for Render to perform an operation
      - Window never sees Terminal, TabId, PaneId, Control, VT, pane focus, or pane geometry

  render:
    file: render.zig
    owns:
      - Render thread execution
      - interpretation of copied Window state and ordered physical input
      - Terminal mutation
      - Control progress admission
      - retained terminal visuals
      - runtime policy and consequences
      - GPU mutation
    borrows:
      gpu: mutable
      terminal: mutable
    rules:
      - Render is the only GPU writer
      - Render is the only Terminal writer
      - Render publishes only complete GPU state
      - Render continues terminal and GPU progress without waiting for Window reads
      - Render releases both mutable borrows before thread completion

  terminal:
    file: terminal.zig
    lifetime_owner: Main
    mutation_owner: Render
    owns:
      - ordered named tabs
      - active tab
      - concrete tiled pane rectangles
      - pane focus
      - stable nonzero TabId and PaneId
      - one real Control terminal per PaneId
      - one retained visual per PaneId
      - pane availability
      - Control endpoint lifetime
      - topology and lifecycle invariants
    bounds:
      tabs: 16
      visible_panes_per_tab: 16
      live_panes: 64
      tab_name_bytes: 128
      grid_cols: 512
      grid_rows: 256
      minimum_pane_cols: 2
      minimum_pane_rows: 1

  test:
    file: test.zig
    owns:
      - complete five-file proof root

gpu:
  definition_file: render.zig
  lifetime_owner: Main
  mutable_borrower: Render
  read_only_borrower: Window
  state:
    working:
      access: Render only
      meaning: state currently being changed
    complete:
      access:
        writer: Render
        reader: Window
      meaning: newest state safe for Window to read
    revision:
      type: nonzero u64
      writer: Render
      reader: Window
      meaning: identity of complete state
    wake:
      writer: Render
      reader: Window
      meaning: complete state may be newer
    stopped:
      writer: Render
      reader: Window
  publication:
    - Render finishes all changes to working state
    - Render makes the complete state readable
    - Render advances revision
    - Render wakes Window only when a wake is not already pending
    - Window reads complete state at Window pace
    - Window records the revision only in Window-owned local state
  exclusions:
    - no GPU ownership transfer
    - no Window mutation or acknowledgement inside GPU
    - no copied frame
    - no cells, panes, draw commands, textures, or damage list sent to Window
    - no Render pacing dependency on Window

threads:
  main_and_window:
    owns:
      - Main
      - Window
    actions:
      - dispatch Wayland
      - update copied Window state
      - append ordered physical input
      - wake Render
      - read complete GPU state when dirty at Window pace

  render:
    owns:
      - Render execution
    mutates:
      - Terminal
      - GPU
    actions:
      - take newest copied Window state
      - drain ordered physical input
      - consume Control progress
      - mutate Terminal
      - mutate GPU
      - publish complete GPU state
      - wake Window

  control:
    owned_by: each real Control terminal inside Terminal
    actions:
      - read PTY progress
      - serve the local endpoint
      - wake Render directly
    exclusions:
      - never wake Window

communication:
  window_to_render:
    lifetime_owner: Main
    writer: Window
    reader: Render
    state:
      latest:
        - Window width
        - Window height
        - Window scale
        - pointer position within Window
      ordered:
        - keyboard enter
        - keyboard leave
        - modifier change
        - key press
        - key release
        - key repeat
        - pointer enter
        - pointer leave
        - pointer button transition
        - pointer wheel frame
        - close
      pending:
        type: bool
      wake:
        type: nonblocking descriptor
    rules:
      - latest state may coalesce
      - ordered input never collapses, reorders, or overwrites
      - a full ordered-input buffer rejects exactly
      - clearing pending cannot lose a simultaneous producer update

  render_to_window:
    object: GPU
    lifetime_owner: Main
    writer: Render
    reader: Window
    state:
      - complete GPU state
      - revision
      - wake
      - stopped
    rules:
      - Window reads GPU directly through its read-only borrow
      - Window reads only complete published state
      - Window changes only its own last-read revision
      - repeated Render publications may coalesce to the newest revision

  control_to_render:
    writer: Control
    reader: Render
    state:
      - cumulative Control wake generation
      - one shared nonblocking Render wake
    rules:
      - Render scans at most 64 live terminals
      - PaneId is globally never reused
      - retirement removes PaneId before Control destruction
      - stale wake counts contain no routable identity

terminal_lifecycle:
  construction:
    - derive candidate PaneId and rectangle without publication
    - construct one real Control terminal and endpoint
    - allocate retained visual
    - admit initial visual before acknowledging its dirty token
    - publish topology only after complete construction
    - failure destroys the candidate in reverse and does not consume PaneId

  progress:
    - Control wakes Render directly
    - Render consumes cumulative progress
    - synchronized output while running remains dirty and unacknowledged
    - Render acknowledges only after retained visual admission
    - hidden terminals continue retained progress without requiring Window reads

  resize:
    - solve all candidate rectangles
    - allocate all replacement retained visuals
    - resize affected Control terminals
    - admit all replacement visuals
    - publish only after complete success
    - failure restores Control geometry in reverse and preserves prior Terminal and GPU state
    - failed Control rollback is fatal and exact

  close:
    - solve survivor rectangles and pane focus
    - admit survivor changes
    - remove PaneId from wake routing
    - publish topology
    - destroy endpoint, Control terminal, retained visual, and pane allocation in reverse order

  exit:
    - admit final visual
    - mark pane unavailable
    - retain PaneId, rectangle, and final visual until deliberate close

shutdown:
  order:
    - Main stops new Window publication
    - Main wakes Render
    - Render rejects new work
    - Render retires Terminal panes in reverse order
    - Render publishes final complete GPU state and stopped
    - Render wakes Window
    - Render releases mutable Terminal and GPU borrows
    - Main joins Render
    - Main destroys GPU
    - Main destroys Window
  invariant: no blocked owner waits for a wake that can no longer occur

source_bars:
  - direct and small
  - no command list, RPC, request, reply, generic adapter, or erased callback
  - no framework for state, events, trees, layout, widgets, or messages
  - no anytype, anyopaque, anyerror, or allowlist mutation without separate exact operator authorization
  - no production mock, test backend, or test construction mode
  - no discarded result without exact local justification
  - exact errors, bounds, ownership, cleanup, and return values

proof:
  ownership:
    - Main alone creates and destroys GPU
    - Render is the only GPU writer
    - Window cannot mutate GPU
    - Main joins Render before GPU destruction
  communication:
    - simultaneous pending clear and Window publication cannot lose a wake
    - ordered physical input cannot collapse
    - repeated latest Window state coalesces
    - repeated complete GPU publications coalesce
    - Window reads only complete GPU state
    - Render progress does not wait for Window
    - shutdown wakes every blocked owner
  lifecycle:
    - real Control construction rollback
    - topology rejection rollback
    - stale wake after retirement
    - hidden progress
    - synchronized withholding
    - retained admission before acknowledgement
    - resize rollback and fatal rollback truth
    - exit retention
    - endpoint lifetime
    - 64-live and 16-visible bounds
    - reverse shutdown
  gates:
    - current check and test
    - unchanged latest check and test
    - full workspace test
    - Zig formatting
    - YAML parsing
    - git diff whitespace validation
    - source-audit blocker reported without allowlist mutation

checkpoint:
  id: terminal_pane_lifecycle
  excludes:
    - renderer composition across multiple visible panes
    - tab bar and pane borders
    - final interaction mappings
    - scrollbars
    - compatibility work
    - commit
