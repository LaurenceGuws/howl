schema: 1
sprint:
  id: physical_terminal_renderer
  marathon: runtime_hot_paths
  version: 0.1.6-dev
  status: acceptance_review_ready
  base: 109a4f5102a28a81b117f79d572fae12a224f1de
  active_slice: sprint_acceptance_review
  objective: >-
    Render blank and printable-ASCII terminal cells and one static cursor in
    the existing Renderer-owned Vulkan frame while preserving Runtime, FIFO,
    VT, Canvas composition, one submission, and latest-only publication.

accepted_evidence:
  boundary_census:
    path: .zig/work/runtime-hot-path/physical-terminal-renderer/current_boundary_census.yml
    hash_prefix: 1cd688d
  finite_contract:
    path: .zig/work/runtime-hot-path/physical-terminal-renderer/finite_contract.yml
    hash_prefix: 47cb8d2
  layout_receipt_source:
    path: .zig/work/runtime-hot-path/physical-terminal-renderer/layout_receipt.zig
    hash_prefix: 2cca2b3
  layout_receipt:
    path: .zig/work/runtime-hot-path/physical-terminal-renderer/layout_receipt.txt
    hash_prefix: 73e7df0

ownership:
  terminal_runtime: unchanged PTY, VT, input, replies, consequences, child exit, and journal publication
  visual_fifo: unchanged global ordered deep-copy FIFO
  renderer_grid: one prepare per pane after the complete FIFO drain
  host_adapter: >-
    howl-host/src/terminal_gpu.zig owns exact cell lowering, physical font
    epochs, aggregate admission, shared staging partitioning, and one bounded
    borrowed TerminalBatch of at most 64 pane descriptors.
  pane: >-
    TerminalPaneVisual qualifies pane, source, lifecycle, font, Grid, Store,
    and physical pane resources as one owner across create, resize, alternate
    grid, retirement, and GPU completion.
  font_gpu: >-
    One exact terminal_fonts.Ref epoch owns one atlas, accepted and candidate
    residency, staging, and first-use upload candidate shared by its panes. A
    blank-only first batch records UNDEFINED to SHADER_READ_ONLY; accepted
    atlas layout changes only after observed GPU completion, while later
    no-upload batches record no redundant transition.
  frame: >-
    Renderer records generic and terminal transfers, terminal panes below
    Chrome, one render pass, one queue submission, exact completion, and one
    latest-ready publication.

bounds:
  pane_descriptors: 64
  pane_cells: 65536
  pane_rows: 128
  aggregate_cells: 4194304
  aggregate_rows: 8192
  batch_descriptor_bytes: 6664
  shared_instance_staging_bytes: 67108864
  shared_row_staging_bytes: 32768
  glyph_slots_per_font_epoch: 380

candidate_disposition:
  pre_submit_failure:
    - discard distinct FontGpu candidates once in reverse preparation order
    - discard pane Stores in reverse preparation order
    - discard Grids in reverse preparation order
    - discard generic residency and surface candidates
  success:
    - observe GPU completion
    - complete distinct FontGpu candidates once
    - complete Stores in batch order
    - complete Grids
    - complete generic candidates
    - publish one latest-ready frame
  post_submit_failure: >-
    Preserve the exact submitted slot, acquire point, batch, Store, Grid, and
    generic candidates as fatal shutdown ownership; never discard or retry.

proofs:
  T001: Host Renderer global FIFO order, one prepare per pane, and one batch
  T002: Host Renderer final-equality cancellation without physical work
  T003: Host adapter exact printable-ASCII slot, colors, index, and sparse copy
  T004: Host adapter exact distinct regular, bold, italic, and bold-italic physical raster bytes plus shader dim and decoration geometry
  T005: Host adapter block, underline, bar, and hidden static cursor integration
  T006: Howl-VK row rotation plus exposed-row fill without moved-cell payload
  T007: Host Renderer resize and alternate-grid replacements
  T008: Host Renderer reverse multi-pane candidate discard with accepted-state equality
  T009: Host Renderer one combined multi-pane and Chrome execution receipt
  T010: Host Renderer exact fatal post-submit candidate ownership
  T011: Host Renderer stale and retired identity rejection before mutation
  T012: Host Renderer old and new font epoch coexistence across resize barrier
  T013: Host Renderer generic-only submission with zero terminal candidates
  T014: Host Renderer terminal-only difference with one submission and publication
  T015: Howl-VK tracked terminal SPIR-V member offsets, stage accesses, and exact PushConstants range
  T016: Howl-VK pure two-by-two CPU oracle for physical terminal vertex/NDC, row-map, atlas, and packed-instance lowering
  T017: Howl-VK PaneResources retains exact descriptor-set, pane-buffer, range, and matching FontGpu sampler/view/atlas identities and rejects later mismatch
  T018: Howl-VK production scissor admission proves one already-physical pane grid fits its attachment clip with sub-cell remainders
  T019: Host Renderer production-consumed frame recorder proves terminal recording precedes generic Canvas/Chrome once in one pass
  T020: Static construction and call-graph closure proves generic Canvas Context/resources cannot enter terminal binding or recorder APIs
  T021: Host production chain proves Session logical placement, exact physical-edge conversion, physical FontSet grid admission, Draw geometry, shader NDC inputs, atlas metrics, and shared-boundary equality
  T022: Howl-VK production recorder proves absolute aggregate row staging with nonzero pane offset and pre-command transactional rejection

proofs_closed_before_operator:
  descriptor_ranges: >-
    T017 retains the exact descriptor set, instance buffer, row buffer,
    VkWriteDescriptorSet ranges, and terminal sampler, view, and atlas identity
    in PaneResources. The binding tuple supplied to Store.recordDraw must match
    every retained value; mismatch is rejected without descriptor rewrite or
    accepted-state mutation.
  coordinate_and_scissor_scaling: >-
    T018 begins after conversion and proves only physical grid/scissor fit.
    T021 calls terminal_gpu.physicalRect for the 100x80 logical to 160x128
    physical boundary, including content origin 24 and adjacent shared edges,
    then carries the resulting physical geometry through grid and Draw owners.
  terminal_below_chrome_draw_order: >-
    T019 is consumed at the actual begin-pass, terminal, generic, and end-pass
    calls; it rejects generic-before-terminal and duplicate draw stages.
  resource_separation: >-
    T020 is static ownership closure, not runtime opaque-handle inequality:
    terminal descriptor construction takes only Resources, PaneResources, and
    FontGpu, generic Context never enters terminal APIs, and Renderer calls
    the two private owners separately in terminal-before-generic order.

receipts:
  abi_declarations: 527
  abi_layout_bytes: 13060
  layouts:
    FontGpu: 160
    PaneResources: 128
    PaneResources_alignment: 8
    PendingTopology: 66056
    Resources: 80
    Draw: 68
    DrawTarget: 8
    TerminalSurface: 16
    PhysicalRect: 16
    GridGeometry: 24
    PushConstants: 88
    TerminalBatch: 6664
  canvas_work_terminal_surface_delta_bytes: 16
  descriptor_binding_identity_bytes_per_pane: 64
  maximum_pane_resource_control_bytes: 8192
  pending_topology_descriptor_identity_delta_bytes: 4096
  shader_reproducibility: >-
    howl-vk/tools/verify_terminal_shader_interface.sh recompiles both shaders,
    compares their tracked SPIR-V byte for byte, validates both modules, and
    independently checks Push member names, offsets, stage accesses, and range.
  negative_census: tools/verify_physical_terminal_renderer.sh

hostile_review_corrections:
  atlas_initialization:
    - production and proof recording share one FontCommandRecorder path
    - blank first batch records one direct readable-layout transition
    - pre-submit discard preserves undefined accepted layout
    - missing recorded physical commands retain fatal candidate ownership
  style_raster:
    - bold adds at most one bounded coverage pixel using max-alpha composition
    - italic applies a deterministic right shear bounded to two pixels
    - exact tile bounds clip placement and prevent neighboring atlas writes
    - dim remains a shader color operation; underline and strike remain geometry
  cursor_cleanup:
    - CursorPublication storage and APIs are absent from terminal_handoff
    - Renderer owns no cursor drain helper or cursor presentation policy
    - startup configuration retains only the terminal font path
    - static cursor state exists only in Grid and backend Store/shader ownership

exclusions:
  - no terminal Canvas ProducerUpdate
  - no per-pane or per-FIFO-item frame, submission, publication, or wake
  - no terminal image projection above VT
  - no animation, blink scheduling, cursor trail, ligature, shaping, selection, or hyperlink owner
  - no compatibility alias, framework, capacity widening, or restored superseded cursor replay

validation:
  static:
    howl_vk_four_mode_check_test: passed
    howl_render_four_mode_check_test: passed
    howl_host_four_mode_check_test: passed
    workspace_four_mode_check_test: passed
    shader_reproducibility: passed
    abi_and_layout_receipts: passed
    T001_through_T014: passed
    T015_through_T022_physical_recording_coordinates_and_row_transfer: passed
    negative_census: passed
    source_audit: passed
    hostile_review_corrections: passed
  operator:
    status: accepted
    visual_gate: minimal one-pane shell appearance restored
    T022_runtime_evidence: >-
      Reviewed Capture 3 contained 34 contiguous records, completed without a
      logging failure, and carried absolute staged-row origin 67,108,864 into
      the exact VkBufferCopy source before GPU completion and frame publication.
    child_exit_limitation: >-
      The operator typed exit in the hosted shell, but child observation, PTY
      EOF, and terminal completion consumption were outside the temporary
      schema and are not claimed as capture proof.
    gpu_pixel_claim: none; visual correctness is the operator gate
