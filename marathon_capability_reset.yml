marathon:
  name: capability_reset
  status: implemented_pending_review
  mode: supervised deletion intervention
  active_sprint: null
  active_scratch: null

objective: >-
  Delete unearned packages, runtime abstractions, vocabulary, and build ceremony until the surviving Howl capabilities
  match the explicitly accepted model. Rebuild nothing from intuition and preserve no rejected source shape through
  renames, aliases, adapters, placeholders, or compatibility modules.

working_rules:
  - A compiling executable is not a milestone for this intervention.
  - Deletion precedes reconstruction.
  - Existing source is evidence, not authority.
  - Every unsettled ownership or vocabulary decision blocks that case only and returns to the operator for discussion.
  - Mature terminal concepts are derived from references and protocol evidence; they are not invented by the team.
  - No autonomous architecture changes, broad rewrites, commits, or compatibility work are authorized.
  - Tests proving accepted behavior may survive; tests proving only rejected architecture do not.

settled_ownership:
  allocation: every module allocation uses an explicit caller-provided allocator
  vt: owns terminal parsing, semantics, state, input encoding, replies, and terminal consequences
  pty: owns Linux PTY transport and child-process lifecycle
  control: optionally composes PTY and VT into ID-addressable terminal instances with bounded interfaces
  render: owns backend-neutral terminal visual knowledge and plain rendering values without runtime policy
  executable: >-
    howl-host owns one Wayland window, one Control terminal, retained visuals, one render thread, EGL/GLES, input,
    and presentation

workflow:
  marathon: owns this complete intervention and its final gate
  sprint: owns one coherent capability or ownership milestone and its ordered slices
  slice: owns one reviewable deletion, decision, implementation, or proof checkpoint
  scratchpad: owns only current-slice working state and is reset for the next slice or deleted when none is active
  promotion:
    - accepted slice facts and commits move from the scratchpad into the sprint
    - accepted sprint facts and commits move from the sprint into this marathon

survivors:
  - capability: howl-vt
    contract: independently embeddable terminal emulator capability

  - capability: howl-pty
    contract: independently embeddable native PTY capability

  - capability: howl-control
    contract: >-
      optional composition of PTY and VT into ID-addressable terminal instances with bounded operations and
      interfaces; embedders may always compose PTY and VT themselves

  - capability: howl-render
    contract: >-
      comptime-selectable rendering code and POJO vocabulary for perfect text, terminal grids, effects, and styling;
      retained as one deliberately broad rendering bucket until evidence proves smaller ownership boundaries

  - capability: first_party_executable
    contract: >-
      concrete single-terminal embedder that owns one Wayland window, retained visuals, one render thread, EGL/GLES,
      input, terminal consequences, endpoint entry, and ordered cleanup
    noun: howl-host

confirmed_deletions:
  - offender: consumer-vt
    reason: permanent fake downstream package created to retain a temporary package-isolation proof

  - offender: standalone howl-frame package
    reason: unearned package boundary inside the accepted rendering capability

  - offender: render-owned runtime publication
    includes:
      - Publisher
      - Borrow
      - PreparedResize
      - publication slots and mutexes
      - runtime generations and acknowledgement policy
    reason: executable scheduling and publication policy cannot survive inside backend-neutral rendering knowledge

  - offender: standalone howl-text package
    reason: text is a comptime-selectable part of the accepted rendering capability

  - offender: probe subsystem
    includes:
      - probe build option
      - enabled and disabled probe modules
      - probe scenario
      - probe imports and dependency wiring
      - probe build aliases and generated records
    reason: unauthorized replacement vocabulary and runtime architecture; future tracing retains the noun trace

  - offender: rejected compatibility shapes
    includes:
      - aliases for removed package names
      - no-op replacement modules
      - adapters preserving rejected APIs
      - renamed copies of rejected abstractions

  - offender: stale workspace claims
    reason: root build aliases and permanent documents described packages and instrumentation that were deleted

investigations:
  - id: vt_host_vocabulary
    status: completed
    question: >-
      After deleting HostState, Terminal.host, applyHostEvent, and related invented embedder vocabulary, which concrete
      VT concepts are required by the referenced protocol behavior?
    evidence:
      - libvterm public state, parser, callback, output, and consumption contracts
      - Foot terminal state and emitted-action contracts
      - Kitty parser and screen contracts
      - Ghostty terminal and public embedding contracts
      - Howl protocol catalogue records for each affected sequence
    gate: >-
      Present source paths, symbols, protocol cases, lifetime, bounds, producer, and consumption semantics before each
      replacement decision; do not propose a speculative aggregate noun.
    result: >-
      VT retains concrete bounded terminal consequences and semantic state; Control exposes copied or borrowed facts
      without rendering policy, and howl-host consumes only title and bell presentation in the current cut.

  - id: render_inventory
    status: completed
    question: >-
      Which existing text, frame, grid, style, effect, damage, cache, and generated-glyph code expresses accepted
      rendering behavior, and which code encodes rejected runtime or package architecture?
    gate: Classify concrete symbols before moving or rebuilding them; file location does not establish ownership.
    evidence:
      - text and generated capability selection accepted at commit a5adeee
      - former frame source inventory identified visual values mixed with rejected publication runtime
      - old unselected renderer cache and draw-preparation code still requires independent classification

  - id: control_inventory
    status: completed
    question: >-
      Which existing PTY/VT composition, terminal-ID, embedded, client, remote-control, and CLI behaviors implement the
      accepted control capability, and which symbols leak rendering or executable policy?
    gate: Control retains no rendering, text, GPU, window, pane, tab, session, or thread architecture.

  - id: executable_inventory
    status: completed
    question: >-
      Which current runtime, thread, window, GPU, session, tab, pane, and presentation code belongs to the first-party
      executable after rejected module boundaries and instrumentation are removed?
    gate: Accepted as howl-host after the surviving single-terminal responsibilities and direct source were proven.

discussion_gates:
  - id: durable_authority_alignment
    trigger: before the first render source implementation slice
    status: accepted
    decision: >-
      Remove or quarantine permanent design, rules, source-map, and version-scope claims that certify standalone text
      or frame packages, control-owned rendering publication, render-owned runtime policy, deleted probe vocabulary,
      or the previous executable topology.

  - id: vt_render_boundary
    trigger: terminal visual values are classified and the transformation owner can be decided from concrete types
    status: accepted
    decision: >-
      Approve the transformation owner, input and output types, dependency direction, allocation and lifetime contract,
      and whether a public transformation API is earned.

  - id: vt_outputs
    trigger: reference evidence for one current host-prefixed VT responsibility is ready
    status: accepted
    decision: approve the exact concept and API before implementation
    result: Concrete consequences remain separately typed, bounded, and catalogue-owned without one aggregate actor.

  - id: render_selection
    trigger: concrete surviving render capabilities and dependency costs are indexed
    status: accepted
    decision: >-
      Native text and generated terminal glyphs are independently selectable; either or both may be absent, and a
      disabled capability exposes no placeholder API.
    result: >-
      howl-render now owns curated text and generated namespaces, deterministic font assets, and four independently
      proven child build graphs selected by -Dnative_text and -Dgenerated_glyphs; only native selection links libc,
      FreeType, and HarfBuzz.

  - id: executable_noun
    trigger: surviving executable responsibilities are concrete
    status: accepted
    decision: approve its public noun and package identity
    result: howl-host is the concrete first-party executable; it does not constrain independent embedders

  - id: build_graph
    trigger: surviving packages and their direct dependencies are settled
    status: accepted
    decision: approve child and workspace build surfaces; do not optimize for compiling deleted or unsettled code

sprints:
  - id: render_capability_reset
    status: accepted
    accepted_slices:
      - id: selectable_text_and_generated
        commit: a5adeee
      - id: bootstrap_durable_workflow
        commit: bcbf050
      - id: align_durable_authorities
        commit: 4a10c7b
      - id: classify_terminal_visual_values
        commit: 0ea9f52
      - id: settle_vt_render_boundary
        commit: 4a95571
      - id: vt_visual_view_contract
        commit: f9be93f
      - id: render_delta_projection
        commit: 269a8c1
      - id: classify_remaining_render_code
        commit: 37f59ff
      - id: delete_rejected_renderer_source
        commit: 93cb1c6
      - id: settle_run_text_boundary
        commit: 53de279
      - id: rebuild_run_text_preparation
        commit: 48592c6
      - id: remove_render_runtime_and_control_coupling
        commit: 2d169c8
    result: >-
      Accepted render projection and text preparation remain runtime-free; rejected frame and renderer sources are
      deleted.

  - id: control_capability_reset
    status: accepted
    entry_gate: render owns no runtime publication and the durable authorities describe the settled ownership model

  - id: executable_runtime_rebuild
    status: implemented_pending_review
    entry_gate: render and control expose only accepted capabilities and the executable noun has been settled

  - id: basic_byte_to_pixels
    status: implemented_pending_review
    entry_gate: executable runtime ownership and the backend-neutral render boundary are accepted

  - id: final_compile_and_ownership_audit
    status: implemented_pending_review
    entry_gate: one basic PTY-to-pixels path exists without compatibility scaffolding

completion:
  - every tracked package corresponds to an explicitly accepted independently useful capability
  - every surviving public noun and dependency has operator approval or reference-derived domain evidence
  - rejected packages, probe code, compatibility shapes, stale build aliases, and stale permanent claims are deleted
  - VT contains no invented embedder actor; each surviving use of host vocabulary has separate evidence and approval
  - control contains only accepted PTY/VT composition, identity, and interface behavior
  - render contains only selectable rendering knowledge and POJO vocabulary, with no runtime-thread or concrete GPU owner
  - the executable contains runtime ownership without defining the only valid route through Howl capabilities
  - deferred presentation and multiplexing capabilities remain outside this accepted single-terminal foundation
