sprint:
  id: render_capability_reset
  marathon: marathon_capability_reset.yml
  status: active
  current_slice: remove_render_runtime_and_control_coupling
  scratchpad: scratch_render_capability_reset.md

objective: >-
  Leave howl-render as one comptime-selectable capability containing only backend-neutral terminal visual knowledge,
  plain rendering values, and independently selectable text and generated-glyph code. Delete runtime publication,
  package residue, and rejected ownership without moving them into control or preserving compatibility surfaces.

entry_facts:
  - commit a5adeee accepted independently selectable native text and generated-glyph capabilities
  - former frame source mixes useful visual values with rejected runtime publication and acknowledgement policy
  - control still depends on the rejected frame publication surface
  - permanent project authorities still certify standalone text/frame packages and the rejected runtime topology

invariants:
  - every module allocation uses an explicit caller-provided allocator
  - render owns terminal visual meaning but no thread, lock, queue, publication lifecycle, GPU device, window, or layout
  - VT owns terminal semantic state and dirty facts
  - control owns no rendering, text, frame publication, GPU, window, pane, tab, session, or thread policy
  - executable runtime policy is not reconstructed until its concrete owner and noun are approved
  - deleted architecture is not retained through aliases, adapters, placeholders, fake modules, or no-op implementations

exclusions:
  - performance optimization and rain targets
  - protocol expansion and graphics
  - executable thread or publication implementation
  - concrete GPU backend design
  - multiplexing, chrome, selection, and scrollback feature work
  - stable API or ABI work

exit_gate:
  - durable authorities no longer certify rejected frame, text, control-publication, probe, or executable-topology claims
  - howl-render exposes only selected rendering capabilities and plain backend-neutral values
  - howl-render owns no runtime publication, synchronization, borrowing, acknowledgement, or executable scheduling policy
  - control contains no render or frame dependency
  - every retained allocation receives an explicit caller-provided allocator and has exact cleanup
  - accepted visual behavior and proofs survive without preserving rejected APIs
  - remaining executable rebuild work is indexed rather than guessed into this sprint

slices:
  - id: selectable_text_and_generated
    status: accepted
    commit: a5adeee
    outcome: >-
      Native text and generated terminal glyphs are independently selectable; disabled capabilities expose no
      placeholder API or native dependency.

  - id: bootstrap_durable_workflow
    status: accepted
    commit: bcbf050
    purpose: >-
      Establish the marathon, sprint, slice, and scratchpad lifetimes; index this sprint and its first substantive
      authority-alignment slice without changing product implementation.
    files:
      - AGENTS.md
      - marathon_capability_reset.yml
      - sprint_render_capability_reset.yml
      - scratch_render_capability_reset.md
    validation:
      - planning YAML parses
      - every active path resolves
      - the diff contains workflow and planning changes only
      - no render API, executable topology, or control interface shape is inferred

  - id: align_durable_authorities
    status: accepted
    commit: 4a10c7b
    outcome: >-
      Permanent authorities now state only settled capability ownership, retain enduring protocol and embedder facts,
      and explicitly quarantine rejected source without certifying its architecture.
    purpose: >-
      Make project_design.yml, project_rules.yml, project_source_map.yml, and project_version_scope.yml describe only
      the settled ownership model and explicitly quarantined reconstruction work before source implementation resumes.
    validation:
      - all YAML parses
      - no permanent authority certifies standalone howl-text or howl-frame packages
      - no permanent authority assigns render publication to control or runtime policy to render
      - no permanent authority retains deleted probe vocabulary
    forbidden_shortcuts:
      - describing unsettled executable topology as accepted design
      - renaming rejected concepts instead of deleting their claims
      - turning current file locations into architectural authority

  - id: classify_terminal_visual_values
    status: accepted
    commit: 0ea9f52
    outcome: >-
      Every symbol and proof in the former frame source is classified; visual semantics are separated from rejected
      executable publication policy, and the exact VT/render API remains deliberately unsettled.
    purpose: >-
      Classify every symbol in howl-render/src/howl_frame.zig as retained visual meaning, rejected runtime policy,
      executable evidence, or removable proof before changing implementation.
    discussion_gate: vt_render_boundary

  - id: settle_vt_render_boundary
    status: accepted
    commit: 4a95571
    outcome: >-
      Accepted a stateless sparse visual projection: VT lends cumulative visual dirty truth under mutation
      exclusion, render writes backend-neutral patches into caller buffers, and the executable admits storage before
      acknowledging the exact VT dirty token.
    purpose: >-
      Derive and approve the smallest public render boundary that consumes VT semantic truth and produces
      backend-neutral visual work without owning executable publication or GPU policy.
    validation:
      - reference evidence covers dependency, lifetime, damage, storage, and backend command boundaries
      - render's public role hides terminal visual semantics from GPU-aware embedders
      - borrowed VT data never crosses its mutation lifetime
      - allocation and cleanup are explicit
      - executable publication and coalescing remain outside render
    forbidden_shortcuts:
      - copying a reference architecture wholesale
      - making the executable interpret terminal visual semantics
      - hiding runtime policy in a render-owned object
      - selecting an API merely to compile quarantined consumers

  - id: vt_visual_view_contract
    status: accepted
    commit: f9be93f
    outcome: >-
      VT now exposes an allocation-free visual view, viewport-resolved cumulative dirty rows, VT-resolved selection
      spans, non-wrapping exact acknowledgement, and consequence-only state snapshots without compatibility aliases.
    purpose: >-
      Replace VT's overloaded visual publication surface with a borrowed visual-only view, cumulative dirty evidence,
      and exact acknowledgement token; prove sparse mutation, full discontinuity, and declined acknowledgement.
    validation:
      - VT visual dirty state is cumulative until the exact token is acknowledged
      - cursor overlay changes are not encoded as VT cell dirty spans
      - row geometry and selection appearance dirty the exact required cells or rows
      - resize and source-wide presentation discontinuities require full reconstruction
      - all borrowed facts remain valid only under caller-enforced terminal mutation exclusion

  - id: render_delta_projection
    status: accepted
    commit: 269a8c1
    outcome: >-
      Render now projects borrowed VT observations into allocation-free caller-owned full or sparse patches; terminal,
      native text, and generated glyph namespaces are independently selectable, and dormant multicell claims are
      rejected until VT owns a real mutation contract.
    purpose: >-
      Implement the accepted stateless terminal visual projection, caller-provided buffers, exact capacity failures,
      sparse/full row patches, cursor overlay damage, and direct howl-render dependency on howl-vt.

  - id: classify_remaining_render_code
    status: accepted
    commit: 37f59ff
    outcome: >-
      Every remaining line and declaration in the two legacy render files is classified; neither file nor public API
      survives, while run-aware text semantics earn a fresh boundary discussion and cache transactions remain
      executable evidence only.
    purpose: >-
      Classify the old renderer's text, cache, grid, effect, damage, and draw-preparation code independently of its
      current file and runtime consumers.

  - id: delete_rejected_renderer_source
    status: accepted
    commit: 93cb1c6
    outcome: >-
      Deleted the entire unselected mixed renderer and its stale durable claims without aliases, replacement APIs,
      cache reconstruction, or changes to accepted text, generated-glyph, and terminal projection capabilities.
    purpose: >-
      Delete the unselected mixed renderer, its dead proofs, and stale build/source-map residue without rebuilding text
      preparation, cache policy, executable scheduling, or compatibility APIs.

  - id: settle_run_text_boundary
    status: accepted
    commit: 53de279
    outcome: >-
      Accepted one-run-at-a-time terminal text preparation with exact source coverage, allocation only for native
      positioned glyphs, inline generated glyphs, allocation-free blank runs, and a bounded render-owned font map
      whose native glyph identity remains collision-safe within its explicit lifetime.
    purpose: >-
      Settle the smallest contiguous visual-run input and heterogeneous native/generated output lifetime before any
      run-aware text preparation is implemented.

  - id: rebuild_run_text_preparation
    status: accepted
    commit: 48592c6
    outcome: >-
      Render now prepares one exact native, generated, or no-glyph terminal run under the selected compile-time graph;
      native font ownership, glyph identity, source coverage, allocation, cleanup, and raster selection are explicit,
      while unresolved baseline and DEC geometry remain render facts rather than executable policy.
    purpose: >-
      Rebuild only accepted run-aware text behavior under the approved caller-buffer or allocator-owned lifetime,
      without cache, pane, generation, frame, or GPU policy.

  - id: remove_render_runtime_and_control_coupling
    status: active
    purpose: >-
      Delete publication slots, locks, borrowing, acknowledgement, runtime generations, and control frame coupling;
      do not reconstruct executable policy during this sprint.

  - id: render_sprint_audit
    status: pending
    purpose: >-
      Verify source shape, allocation, ownership, cleanup, tests, build selection, stale paths, and sprint exit gates;
      promote accepted outcomes to the marathon, update every active path, and delete this sprint and its scratchpad.
