schema: 1
sprint:
  id: stdlib_boundary
  marathon: debt_payoff
  version: 0.1.5-dev
  branch: feature/debt_payoff/stdlib_boundary
  status: active
  objective: >-
    Remove the redundant Host translate-C boundary only where pinned Zig stdlib
    interfaces preserve exact Linux behavior, ownership, errors, and cleanup.

scope:
  owned:
    - howl-host/build.zig host-native.h translation and host_c module wiring
    - howl-host/src/shared.zig eventfd, descriptor IO, errno, and poll use
    - howl-host/src/terminal_handoff.zig eventfd and descriptor IO use
    - howl-host/src/window.zig mmap, munmap, poll, and errno use
    - howl-host/src/renderer.zig poll and errno use
  excluded:
    - renderer_c and DRM/native ABI ownership
    - product behavior, input capability, performance policy, and file splitting

invariants:
  - Eventfds remain nonblocking and close-on-exec with identical directional ownership.
  - Wake writes and drains retain exact EINTR and EAGAIN treatment.
  - Poll wake, timeout, and interruption behavior remains unchanged.
  - Every mapping retains exact read-only/private flags, failure handling, and unmapping lifetime.
  - No ambient Zig API substitutes for the repository pin.

slices:
  - id: stdlib_inventory
    status: accepted
    product_change: none
    output: complete use-to-pinned-stdlib mapping with exact semantic differences
    evidence: .zig/work/debt-payoff/stdlib-boundary/stdlib_inventory.yml
    accepted_facts:
      - Fourteen individually indexed host_c symbols cover every maintained use.
      - errno is already Zig-stdlib-owned adaptation context, not a host_c symbol.
      - renderer_c remains an excluded native boundary.
  - id: eventfd_and_descriptor_io
    status: accepted
    output: shared and terminal handoff use pinned stdlib Linux/POSIX ownership
    accepted_facts:
      - Both wake owners use checked raw eventfd creation with exact nonblocking close-on-exec flags.
      - Typed reads and owner-controlled writes preserve EINTR, EAGAIN, saturation, and fatal failure behavior.
      - Second-create and later Pool allocation failures close exact descriptor ownership in reverse order.
  - id: poll_and_errno
    status: accepted
    output: Renderer and Window polling use pinned stdlib facts
    accepted_facts:
      - Renderer absolute deadlines regain control after EINTR and recompute remaining monotonic time.
      - Renderer non-deadline waits retain typed internal retry where owner timing is unchanged.
      - Window raw polling returns EINTR to its dispatch/flush loop without consuming poisoned readiness.
      - Window display and Boundary readiness remain independently classified before protocol-error observation.
      - Direct Host fixtures use pinned pollfd and POLL.IN facts.
  - id: mapping_lifetime
    status: accepted
    output: Window mappings use pinned stdlib mmap and munmap contracts
    accepted_facts:
      - Keyboard keymap bytes remain callback-local and unmap before callback return.
      - DMA-BUF feedback retains one typed aligned mapped slice with exact descriptor ownership.
      - Feedback-table replacement maps the candidate before retiring the accepted mapping in unmap-then-close order.
      - Invalid facts and mapping failure close only the incoming descriptor and preserve accepted ownership.
      - The retained feedback ownership group remains 24 bytes at alignment 8.
  - id: build_boundary_removal
    status: active
    output: host_c translation and imports removed after all consumers migrate

acceptance:
  - Exact source inventory and behavioral comparison are reviewed before implementation.
  - Each implementation slice has owner-local rollback and failure proofs.
  - Host and workspace check/test pass in every optimization mode.
  - Source audit, protocol validation, formatting, and git diff checks pass.
  - No host_c symbol or generated host-native header remains.
