marathon:
  name: host_platform_chrome
  status: active
  approval: operator_approved
  implementation_authorized: true
  active_scratch: scratch_host.yml
  objective: >-
    Build small reusable Wayland and Vulkan Zig packages, mature backend-neutral
    Render text and multiplexing chrome, and prove a first-party Vulkan host whose
    real-terminal integration uses one bounded terminal runtime to own many PTY,
    VT, and terminal-projection lifetimes without coupling them to Wayland or Vulkan.

