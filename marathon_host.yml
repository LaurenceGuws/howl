final_acceptance:
  terminal_integration_shape:
    - create one logical PTY, VT, and projection owner per terminal pane
    - poll all borrowed PTY descriptors from one terminal runtime OS thread
    - feed bytes and publish immutable backend-neutral pane updates
    - route unmatched focused input to the terminal runtime by globally non-reused PaneId
    - keep Window, Renderer, and terminal runtime mutation ownership disjoint
    - resize from pane geometry
    - drain replies and ordered consequences
    - retire each pane in reverse ownership order
  prohibited_redesign:
    - Wayland package
    - Vulkan package
    - Window/Render thread boundary
    - DMA-BUF ring
    - Render text, terminal projection, image projection, or chrome contracts
  completion: >-
    The marathon closes only when real-terminal integration is mechanically narrow,
    Vulkan chrome is competitive with the accepted EGL behavior, every package is
    independently useful, and all tracked planning/scratch debt is retired.
