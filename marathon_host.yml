schema: 1
marathon:
  name: host_input_integration
  version: 0.1.4-dev
  status: planned
  approval: operator_approved
  active_sprint: scratch_host.yml
  playground: .zig/work/host-input-integration
  objective: >-
    Separate session-domain decisions from first-party Host integration, then
    make Wayland keyboard and pointer input complete, ordered, bounded, and
    correct under the xterm-kitty development compatibility profile.

outcome:
  - Existing tab, pane, focus, and lifecycle behavior is preserved behind one typed session-command and transition boundary.
  - Wayland/XKB key press, repeat, release, modifier, focus, and cancellation facts have explicit ownership and ordering.
  - Host consumes only explicitly mapped actions; every unconsumed event follows the active terminal keyboard protocol into the focused PTY.
  - Mouse motion, buttons, axes, modifiers, capture, hit testing, and terminal reporting are complete and transactionally routed.
  - The input hot path is allocation-free after construction and has measured bounded work and latency.

references:
  foot: /home/home/personal/projects/dev_references/terminals/foot
  kitty: /home/home/personal/projects/dev_references/terminals/kitty
  tigerbeetle: /home/home/personal/projects/dev_references/zig_maturity/tigerbeetle
  zig: /home/home/personal/projects/dev_references/zig_maturity/zig

invariants:
  - Window owns Wayland objects and publishes caller-neutral physical input facts only.
  - Session topology, identity, focus, and lifecycle decisions have no Wayland or Vulkan dependency.
  - Host mappings consume only exact declared bindings; there is no allowlist of events permitted to reach the PTY.
  - VT owns negotiated terminal keyboard and mouse protocol state plus pure bounded encoding.
  - PTY owns ordered bytes and child lifecycle, never Host shortcut or session policy.
  - Press, repeat, release, modifier, focus-loss, and cancellation facts remain causally ordered.
  - Legacy compatibility is isolated at the encoder boundary and does not define the physical input architecture.
  - Candidate failure preserves accepted session state, held-key state, queues, and PTY bytes.
  - No runtime trace, compatibility hook, or diagnostic logger enters committed product source.

bounds_to_measure_before_implementation:
  - live physical keys
  - ordered key occurrences
  - ordered pointer button and axis occurrences
  - shortcut bindings
  - encoded bytes per input event
  - retained session commands and candidate transitions
  - per-wake input work

compatibility_profile:
  development_child_environment:
    TERM: xterm-kitty
    TERM_PROGRAM: Howl
    TERM_PROGRAM_VERSION: 0.1.4-dev
    COLORTERM: truecolor
  policy: >-
    The private development Host advertises the modern compatibility target so
    real TUIs exercise it. Missing support is a typed development defect, not a
    reason for silent downgrade.
  remote_fallback: xterm-256color remains an explicit degraded operator choice; no SSH wrapper is in scope.

sprints:
  - id: session_domain_boundary
    status: next
    acceptance: Existing tab, pane, focus, topology, and lifecycle behavior routes through a finite backend-independent command and transition owner.
  - id: development_terminal_identity
    status: pending
    acceptance: New local children receive the exact development compatibility environment with deterministic child-boundary proof.
  - id: physical_keyboard_state
    status: pending
    acceptance: Ordered press/release/modifier/focus facts and compositor-provided repeat policy are retained without stuck or cross-key state.
  - id: keyboard_routing_and_encoding
    status: pending
    acceptance: Exact Host bindings consume first; all remaining events encode through negotiated legacy or extended terminal keyboard modes.
  - id: pointer_and_mouse_protocols
    status: pending
    acceptance: Chrome hit testing and terminal mouse reporting share one explicit routing boundary with exact capture and release semantics.
  - id: modern_tui_hostile_receipts
    status: pending
    acceptance: Repository fixtures exercise maintained TUIs under xterm-kitty and retain normalized queryable conclusions.
  - id: input_hot_path_reassessment
    status: pending
    acceptance: Measured latency, work, allocation, queue, and wake behavior satisfy the accepted finite contract.
  - id: version_freeze
    status: pending
    acceptance: Authorities, source map, protocol census, tests, receipts, and operator gates agree with the complete 0.1.4-dev boundary.

excluded:
  - detached or remote sessions
  - tmux compatibility
  - public Host compatibility guarantees
  - configuration hot reload
  - new experimental terminal protocols
  - cursor animation polish or blink work
  - unrelated rendering performance work
  - generic event bus, UI framework, or callback abstraction

evidence:
  query_authority: tracked sprint and ignored YAML under .zig/work/host-input-integration
  runtime_capture: bounded typed JSONL through tools/json_logger.zig when executable behavior is under review
  query_tool: Nushell
  retention: normalized conclusions move into tracked authorities; raw captures remain temporary and ignored

final_gate:
  - Every sprint is accepted with exact commits and no unresolved authority question.
  - Maintained package and workspace checks/tests pass in all required optimization modes.
  - Source audit, protocol validation, YAML duplicate-key validation, formatting, and git diff checks pass.
  - Operator keyboard, repeat, chord, mouse, and modern-TUI gates pass.
  - The disposable ignored playground and tracked active sprint are retired.
