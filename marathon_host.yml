    commit_boundary: Admit bounded Vulkan terminal surfaces
    proof:
      - physical packing and queried allocation requirements
      - replacement, eviction recovery, resize, and failure rollback
      - total admitted ownership remains below 512 MiB
  - id: sixteen_pane_integration
    status: planned
    outcome: >-
      Connect visible-set reservation through Composer and Vulkan so an admitted
      sixteen-pane tab commits atomically while hidden tabs retain newest state.
    commit_boundary: Integrate admitted terminal pane sets
    proof:
      - transactional topology create, reveal, resize, close, and supersession
      - hidden progress and newest-state reveal
